<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Attendance Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div id="app" class="max-w-md mx-auto p-4 pt-10">
        
        <div id="loginView" class="hidden animate-in fade-in zoom-in duration-300">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 mx-auto">
                    <i data-lucide="building-2" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 text-center mb-1">HR Portal Login</h1>
                <p class="text-slate-500 text-sm text-center mb-8">Sign in with your Company HR credentials</p>
                
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Email Address</label>
                        <input type="email" id="emailInput" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Password</label>
                        <input type="password" id="passwordInput" required class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition-colors mt-2 flex items-center justify-center gap-2">
                        <span>Sign In Securely</span>
                    </button>
                </form>
                <div id="loginError" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-xs font-bold rounded-lg border border-red-100 text-center"></div>
            </div>
        </div>

        <div id="scannerView" class="hidden animate-in fade-in duration-300">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6 flex justify-between items-start">
                <div>
                    <h1 class="text-xl font-black text-indigo-700 flex items-center gap-2">
                        <i data-lucide="scan-line"></i> Attendance Scanner
                    </h1>
                    <p class="text-slate-500 font-bold text-xs mt-1" id="hrInfo">Loading profile...</p>
                    <p class="text-indigo-600 font-bold text-[10px] mt-1 bg-indigo-50 px-2 py-1 rounded inline-block border border-indigo-100" id="hrModeInfo">Checking Settings...</p>
                    <p class="text-emerald-600 font-bold text-[10px] mt-1 flex items-center gap-1" id="locInfo"><i data-lucide="map-pin" class="w-3 h-3"></i> Location Active</p>
                </div>
                <button id="logoutBtn" class="p-2 bg-slate-100 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors" title="Logout">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden">
                <div id="reader" class="w-full rounded-2xl overflow-hidden bg-black min-h-[300px]"></div>
                
                <div id="statusAlert" class="hidden mt-4 p-4 rounded-xl text-sm font-bold flex items-center gap-2">
                    <i id="statusIcon" data-lucide="info"></i>
                    <span id="statusText"></span>
                </div>
            </div>
        </div>

        <div id="confirmModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
                <div class="bg-indigo-600 p-5 text-white flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-full"><i data-lucide="check-circle"></i></div>
                    <div>
                        <h3 class="font-black text-lg leading-tight">Verify Attendance</h3>
                        <p class="text-indigo-100 text-xs font-medium">Please confirm before recording</p>
                    </div>
                </div>
                
                <div class="p-6 flex-1 space-y-4">
                    <div class="text-center pb-4 border-b border-slate-100">
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Trainee</p>
                        <p class="text-xl font-black text-slate-800" id="modTraineeName">Jane Doe</p>
                        <div class="inline-block mt-2 px-3 py-1 rounded-md text-xs font-black" id="modActionType">IN</div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4"></i> Company</span>
                            <span id="modCompanyMatch" class="font-black flex items-center gap-1"></span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> Date Valid</span>
                            <span id="modDateMatch" class="font-black flex items-center gap-1"></span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-slate-500 font-bold flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4"></i> Recording Loc.</span>
                            <span id="modLocMatch" class="font-black flex items-center gap-1"></span>
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
                    <button id="btnCancelScan" class="flex-1 py-3 text-slate-500 font-bold hover:bg-slate-200 rounded-xl transition-colors text-sm">Cancel Scan</button>
                    <button id="btnConfirmScan" class="flex-1 py-3 bg-indigo-600 text-white font-bold hover:bg-indigo-700 rounded-xl transition-colors text-sm shadow-md">Record Logs</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U",
            authDomain: "dualtech-ojt-portal.firebaseapp.com",
            projectId: "dualtech-ojt-portal",
            storageBucket: "dualtech-ojt-portal.firebasestorage.app",
            messagingSenderId: "255242185978",
            appId: "1:255242185978:web:2f07c554fad2e3a78ead43"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const APP_DOC_ID = "dualtech-ojt-portal"; 

        let hrContext = null;
        let isProcessing = false;
        let html5QrcodeScanner = null;
        let pendingScanData = null;

        const elLoginView = document.getElementById('loginView');
        const elScannerView = document.getElementById('scannerView');
        const elConfirmModal = document.getElementById('confirmModal');
        
        lucide.createIcons();

        // ==========================================
        // UTILITIES
        // ==========================================
        function showStatus(message, type) {
            const alertBox = document.getElementById('statusAlert');
            const alertText = document.getElementById('statusText');
            alertBox.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700');
            if (type === 'success') alertBox.classList.add('bg-green-100', 'text-green-700');
            else if (type === 'error') alertBox.classList.add('bg-red-100', 'text-red-700');
            else alertBox.classList.add('bg-blue-100', 'text-blue-700');
            alertText.innerText = message;
            setTimeout(() => { alertBox.classList.add('hidden'); }, 3500);
        }

        // ==========================================
        // AUTHENTICATION
        // ==========================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        
                        if (data.role !== 'COMPANY_HR' && data.role !== 'Company HR') {
                            await signOut(auth);
                            showLoginError("Access Denied. Account is not authorized as Company HR.");
                            return;
                        }

                        hrContext = {
                            uid: user.uid,
                            hrName: data.name || "HR Admin",
                            company: data.company || "Unknown Company",
                            location: null,
                            scanMode: 'Individual Mobile Phone' // Default
                        };

                        document.getElementById('hrInfo').innerText = `${hrContext.hrName} • ${hrContext.company}`;
                        
                        // Check Company Settings from Adminsystem
                        const settingsRef = doc(db, 'artifacts', APP_DOC_ID, 'public', 'data', 'company_settings', hrContext.company);
                        const settingsSnap = await getDoc(settingsRef);
                        
                        if (settingsSnap.exists() && settingsSnap.data().type) {
                            hrContext.scanMode = settingsSnap.data().type;
                        }
                        
                        document.getElementById('hrModeInfo').innerText = `Scanner Mode: ${hrContext.scanMode}`;
                        
                        if (hrContext.scanMode === 'Individual Mobile Phone') {
                            alert("Notice: Your company is configured for 'Individual Mobile Phone' attendance. The scanner is not required for your trainees.");
                        }

                        elLoginView.classList.add('hidden');
                        elScannerView.classList.remove('hidden');

                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                hrContext.location = { lat: position.coords.latitude, lng: position.coords.longitude };
                                document.getElementById('locInfo').innerHTML = `<i data-lucide="map-pin" class="w-3 h-3"></i> Location Secured`;
                                lucide.createIcons();
                                initScanner();
                            }, 
                            (error) => {
                                document.getElementById('locInfo').innerHTML = `<i data-lucide="alert-triangle" class="w-3 h-3 text-amber-500"></i> Location Required`;
                                document.getElementById('locInfo').classList.replace('text-emerald-600', 'text-amber-600');
                                lucide.createIcons();
                                initScanner(); 
                            },
                            { enableHighAccuracy: true }
                        );

                    } else {
                        await signOut(auth);
                        showLoginError("Account profile not found in database.");
                    }
                } catch (error) {
                    await signOut(auth);
                    showLoginError("Database error during verification.");
                }
            } else {
                hrContext = null;
                elScannerView.classList.add('hidden');
                elLoginView.classList.remove('hidden');
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.clear().catch(e => console.error(e));
                }
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Authenticating...';
            btn.disabled = true;
            document.getElementById('loginError').classList.add('hidden');
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (error) { showLoginError(error.message.replace('Firebase: ', '')); }
            btn.innerHTML = 'Sign In Securely';
            btn.disabled = false;
            lucide.createIcons();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); });

        function showLoginError(msg) {
            const errBox = document.getElementById('loginError');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
        }

        // ==========================================
        // SCANNER LOGIC
        // ==========================================
        function initScanner() {
            if (html5QrcodeScanner) return; 
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            
            try {
                if(html5QrcodeScanner.getState() === 2) { html5QrcodeScanner.pause(); }

                const data = JSON.parse(decodedText);
                const today = new Date().toLocaleDateString('en-CA'); 

                // 1. Company Match Check
                if (data.company !== hrContext.company) {
                    throw new Error(`Mismatch: Trainee is assigned to ${data.company || 'Unknown'}.`);
                }

                let locStatusHtml = '';
                let dateStatusHtml = '';

                // 2. Logic Branch based on Admin's HR Setting
                if (hrContext.scanMode === 'Basic QR Code') {
                    if (!data.isBasicQR) throw new Error("Invalid: Scanner expects a Basic QR Code. Trainee presented an Advanced QR.");
                    
                    showStatus("Checking database for Trainee's attendance today...", "info");
                    
                    // Look into DB to see if Trainee has an open clock IN today
                    const logsRef = collection(db, 'artifacts', APP_DOC_ID, 'users', data.traineeId, 'attendanceLogs'); 
                    const q = query(logsRef, where('dateString', '==', today), where('type', '==', 'IN'));
                    const snap = await getDocs(q);
                    
                    // If there's an IN log without a timeOut, they need to clock OUT.
                    const openLog = snap.docs.find(d => !d.data().timeOut);
                    const determinedType = openLog ? 'OUT' : 'IN';

                    pendingScanData = {
                        traineeId: data.traineeId,
                        name: data.name,
                        company: data.company,
                        type: determinedType,
                        dateString: today,
                        timestamp: Date.now()
                    };

                    // EXPLICITLY use HR's location, ignoring any trainee location data
                    locStatusHtml = hrContext.location ? '<span class="text-emerald-500">HR Loc Recorded</span>' : '<span class="text-red-500">No HR GPS</span>';
                    dateStatusHtml = `<span class="text-slate-500">N/A (Basic QR)</span>`;

                } 
                else if (hrContext.scanMode === 'Advanced QR Code') {
                    if (data.isBasicQR) throw new Error("Invalid: Scanner expects an Advanced QR. Trainee presented a Basic QR.");
                    if (data.dateString !== today) throw new Error("QR Code is expired or invalid for today.");
                    
                    pendingScanData = data;
                    
                    // EXPLICITLY use HR's location, ignoring any trainee location data for the check
                    locStatusHtml = hrContext.location ? '<span class="text-emerald-500">HR Loc Recorded</span>' : '<span class="text-red-500">No HR GPS</span>';
                    dateStatusHtml = `<span class="text-emerald-500">Valid (Today)</span>`;
                }
                else {
                    throw new Error("Scanner is not the primary attendance method for this company.");
                }

                // --- MODAL UI UPDATE ---
                // Hide any temporary checking messages
                document.getElementById('statusAlert').classList.add('hidden');

                document.getElementById('modTraineeName').innerText = pendingScanData.name || 'Unknown Trainee';
                
                const actBadge = document.getElementById('modActionType');
                actBadge.innerText = pendingScanData.type === 'IN' ? 'CLOCK IN' : 'CLOCK OUT';
                actBadge.className = `inline-block mt-2 px-3 py-1 rounded-md text-xs font-black text-white ${pendingScanData.type === 'IN' ? 'bg-green-500' : 'bg-blue-500'}`;

                document.getElementById('modCompanyMatch').innerHTML = '<span class="text-emerald-500">Yes Match</span>';
                document.getElementById('modDateMatch').innerHTML = dateStatusHtml;
                document.getElementById('modLocMatch').innerHTML = locStatusHtml;

                elConfirmModal.classList.remove('hidden');

            } catch (err) {
                console.error("Scan Error:", err);
                showStatus(err.message || "Invalid QR Code format.", "error");
                setTimeout(() => {
                    isProcessing = false;
                    if(html5QrcodeScanner.getState() === 3) html5QrcodeScanner.resume();
                }, 3000);
            }
        }

        function onScanFailure(error) { /* Ignore */ }

        // ==========================================
        // CONFIRMATION MODAL & RECORD SAVING
        // ==========================================
        document.getElementById('btnCancelScan').addEventListener('click', () => {
            elConfirmModal.classList.add('hidden');
            pendingScanData = null;
            isProcessing = false;
            if(html5QrcodeScanner && html5QrcodeScanner.getState() === 3) { html5QrcodeScanner.resume(); }
        });

        document.getElementById('btnConfirmScan').addEventListener('click', async () => {
            const btn = document.getElementById('btnConfirmScan');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4 inline"></i> Saving...';
            lucide.createIcons();

            try {
                const logsRef = collection(db, 'artifacts', APP_DOC_ID, 'users', pendingScanData.traineeId, 'attendanceLogs'); 
                
                // IMPORTANT: This object strictly forces the database to save the HR's location
                const payloadDetails = {
                    statusRemark: hrContext.scanMode === 'Basic QR Code' ? "Verified by HR (Basic QR)" : "Verified by HR (Advanced QR)",
                    type: pendingScanData.type,
                    deviceUsed: "HR Scanner Terminal",
                    location: hrContext.location || { lat: 0, lng: 0 } 
                };

                if (pendingScanData.type === 'IN') {
                    await addDoc(logsRef, {
                        dateString: pendingScanData.dateString,
                        timestamp: Date.now(),
                        type: 'IN',
                        hrVerifierName: hrContext.hrName,
                        method: hrContext.scanMode === 'Basic QR Code' ? "BASIC_QR_SCAN" : "ADVANCED_QR_SCAN",
                        timeIn: serverTimestamp(),
                        clockInDetails: payloadDetails
                    });
                } else {
                    const q = query(logsRef, where('dateString', '==', pendingScanData.dateString), where('type', '==', 'IN'));
                    const snap = await getDocs(q);
                    const openLog = snap.docs.find(d => !d.data().timeOut);
                    
                    if (openLog) {
                        await updateDoc(openLog.ref, {
                            timeOut: serverTimestamp(),
                            clockOutDetails: payloadDetails
                        });
                    }

                    await addDoc(logsRef, {
                        dateString: pendingScanData.dateString,
                        timestamp: Date.now(),
                        type: 'OUT',
                        hrVerifierName: hrContext.hrName,
                        method: hrContext.scanMode === 'Basic QR Code' ? "BASIC_QR_SCAN" : "ADVANCED_QR_SCAN",
                        timeOut: serverTimestamp(),
                        clockOutDetails: payloadDetails
                    });
                }

                elConfirmModal.classList.add('hidden');
                showStatus(`Successfully recorded ${pendingScanData.type} for ${pendingScanData.name}!`, "success");

            } catch (err) {
                console.error("Save Error:", err);
                showStatus("Error saving to database. Check connection.", "error");
            }

            btn.disabled = false;
            btn.innerText = 'Record Logs';
            pendingScanData = null;
            isProcessing = false;

            if(html5QrcodeScanner && html5QrcodeScanner.getState() === 3) {
                html5QrcodeScanner.resume();
            }
        });

    </script>
</body>
</html>
