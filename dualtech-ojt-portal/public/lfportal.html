    const {

    } = Lucide;

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U",
      authDomain: "dualtech-ojt-portal.firebaseapp.com",
      projectId: "dualtech-ojt-portal",
      storageBucket: "dualtech-ojt-portal.firebasestorage.app",
      messagingSenderId: "255242185978",
      appId: "1:255242185978:web:2f07c554fad2e3a78ead43",
    };
    const app = initializeApp(firebaseConfig);
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider(
        "6LeGUowtAAAAALQKvlwQ1T7UtdbAqcL47wPVBxff",
      ),
      isTokenAutoRefreshEnabled: true,
    });
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.collection = collection;
    window.query = query;
    window.where = where;

    window.onSnapshot = onSnapshot;
    window.addDoc = addDoc;

    const functions = getFunctions(app);
    const APP_ID = "dualtech-ojt-portal";

    // --- Google Apps Script Webhook ---
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxl_hDEqFZ7mTuBvLsPwfs2l3nCHH2UonqaDGdrbKlJ-rg13F02WsjROINdf-3nHyjtTA/exec";

    function RegistrationForm({ onBack, showMessage }) {
      const [formData, setFormData] = useState({
        lastName: "",
        firstName: "",
        middleName: "",
        suffix: "",
        initials: "",
        contactNo: "",
        email: "",
        password: "",
        address: "",
        altEmail: "",
        fbMessenger: "",
        agreePrivacy: false,
      });
      const [loading, setLoading] = useState(false);
      const [showPrivacy, setShowPrivacy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.email.endsWith("@dualtech.edu.ph")) {
          showMessage("Must use a @dualtech.edu.ph email address", "error");
          return;
        }
        if (!formData.agreePrivacy) {
          showMessage("You must agree to the privacy policy", "error");
          return;
        }

        setLoading(true);
        window.isRegisteringFlow = true;
        try {
          // 1. Create Auth Account
          let user;
          try {
            const userCredential = await createUserWithEmailAndPassword(
              auth,
              formData.email,
              formData.password,
            );
            user = userCredential.user;
          } catch (err) {
            if (err.code === "auth/email-already-in-use") {
              try {
                const userCredential = await signInWithEmailAndPassword(
                  auth,
                  formData.email,
                  formData.password,
                );
                user = userCredential.user;

                // Check if they were deleted
                const docRef = doc(db, "bstpUsers", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().status !== "Deleted") {
                  await signOut(auth);
                  throw new Error(
                    "This email is already registered and active. Please login instead.",
                  );
                }
              } catch (signInErr) {
                if (signInErr.message.includes("registered and active"))
                  throw signInErr;
                throw new Error(
                  "This email is already registered. If re-registering, use your original password.",
                );
              }
            } else {
              throw err;
            }
          }

          const fullName =
            `${formData.lastName}, ${formData.firstName} ${formData.middleName} ${formData.suffix}`.trim();

          // 2. Write to bstpUsers with status Pending
          const newDocRef = doc(db, "bstpUsers", user.uid);
          await setDoc(newDocRef, {
            name: fullName,
            email: formData.email,
            role: "Learning Facilitator",
            status: "Pending",
            lastName: formData.lastName,
            firstName: formData.firstName,
            middleName: formData.middleName,
            suffix: formData.suffix,
            initials: formData.initials,
            contactNo: formData.contactNo,
            address: formData.address,
            altEmail: formData.altEmail,
            fbMessenger: formData.fbMessenger,
            createdAt: new Date().toISOString(),
          });

          // 3. Fetch Admin Emails
          let targetAdminEmails = [];
          try {
            const adminQuery = query(
              collection(db, "admins"),
              where("allowedPortals", "array-contains", "bstp_admin_portal"),
            );
            const adminSnap = await getDocs(adminQuery);
            targetAdminEmails = adminSnap.docs
              .map((d) => d.data().email)
              .filter(Boolean);

            if (targetAdminEmails.length === 0) {
              alert(
                "DEBUG: The query succeeded but found 0 admins with bstp_admin_portal permission. Check your adminsystem.html to ensure an admin is added with this portal checked.",
              );
            }
          } catch (err) {
            console.error("Failed to fetch admins", err);
            alert(
              "DEBUG: Permission Denied when reading admins. The Firestore rule is either missing, incorrect, or hasn't propagated yet. Error: " +
              err.message,
            );
          }

          // 4. Send Email Notification via Apps Script
          try {
            if (APPS_SCRIPT_URL !== "YOUR_APPS_SCRIPT_URL_HERE") {
              // Fire and forget, do not await to prevent blocking
              fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                  type: "lfRegistration",
                  name: fullName,
                  email: formData.email,
                  contact: formData.contactNo,
                  targetEmails: targetAdminEmails.concat([formData.email]),
                }),
                headers: { "Content-Type": "text/plain;charset=utf-8" },
              }).catch((err) => console.error("Failed to send email", err));
            }
          } catch (err) {
            console.error("Failed to send email block", err);
          }

          // 5. Sign out immediately so they wait for approval
          await signOut(auth);
          showMessage(
            "Registration successful! Please wait for admin approval. An email has been sent to you.",
            "success",
          );
          onBack();
        } catch (error) {
          showMessage("Registration failed: " + error.message, "error");
        } finally {
          window.isRegisteringFlow = false;
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl w-full bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300 my-auto h-fit">
          <div className="bg-blue-600 p-8 text-white text-center relative">
            <button
              onClick={onBack}
              className="absolute left-6 top-8 text-blue-200 hover:text-white font-bold text-sm"
            >
              ← Back to Login
            </button>
            <Shield size={48} className="mx-auto mb-4 opacity-90" />
            <h2 className="text-3xl font-black mb-2">LF Registration</h2>
            <p className="text-blue-100 font-medium">
              Register to manage BSTP trainees.
            </p>
          </div>
          <form onSubmit={handleSubmit} className="p-8 space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Last Name *
                </label>
                <input
                  required
                  type="text"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.lastName}
                  onChange={(e) =>
                    setFormData({ ...formData, lastName: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  First Name *
                </label>
                <input
                  required
                  type="text"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.firstName}
                  onChange={(e) =>
                    setFormData({ ...formData, firstName: e.target.value })
                  }
                />
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Middle Name
                </label>
                <input
                  type="text"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.middleName}
                  onChange={(e) =>
                    setFormData({ ...formData, middleName: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Suffix
                </label>
                <input
                  type="text"
                  placeholder="e.g. Jr"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.suffix}
                  onChange={(e) =>
                    setFormData({ ...formData, suffix: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Initials *
                </label>
                <input
                  required
                  type="text"
                  placeholder="e.g. RJRA"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 uppercase"
                  value={formData.initials}
                  onChange={(e) =>
                    setFormData({
                      ...formData,
                      initials: e.target.value.toUpperCase(),
                    })
                  }
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-slate-100 dark:border-slate-700">
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Dualtech Email *
                </label>
                <input
                  required
                  type="email"
                  placeholder="@dualtech.edu.ph"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.email}
                  onChange={(e) =>
                    setFormData({ ...formData, email: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Password *
                </label>
                <input
                  required
                  type="password"
                  minLength={6}
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.password}
                  onChange={(e) =>
                    setFormData({ ...formData, password: e.target.value })
                  }
                />
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                Complete Address *
              </label>
              <input
                required
                type="text"
                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                value={formData.address}
                onChange={(e) =>
                  setFormData({ ...formData, address: e.target.value })
                }
              />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Contact No. *
                </label>
                <input
                  required
                  type="text"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.contactNo}
                  onChange={(e) =>
                    setFormData({ ...formData, contactNo: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  Alt Email
                </label>
                <input
                  type="email"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.altEmail}
                  onChange={(e) =>
                    setFormData({ ...formData, altEmail: e.target.value })
                  }
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">
                  FB Messenger
                </label>
                <input
                  type="text"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900"
                  value={formData.fbMessenger}
                  onChange={(e) =>
                    setFormData({ ...formData, fbMessenger: e.target.value })
                  }
                />
              </div>
            </div>

            <div className="pt-6 border-t border-slate-100 dark:border-slate-700 flex flex-col gap-2">
              <label className="flex items-start gap-3 cursor-pointer">
                <input
                  type="checkbox"
                  className="mt-1 w-5 h-5"
                  required
                  checked={formData.agreePrivacy}
                  onChange={(e) =>
                    setFormData({
                      ...formData,
                      agreePrivacy: e.target.checked,
                    })
                  }
                />
                <span className="text-sm text-slate-600 dark:text-slate-400">
                  I agree to the{" "}
                  <span
                    onClick={(e) => {
                      e.preventDefault();
                      setShowPrivacy(true);
                    }}
                    className="text-blue-600 dark:text-blue-400 font-bold hover:underline"
                  >
                    Privacy Agreement
                  </span>{" "}
                  clause regarding data protection and confidentiality.
                </span>
              </label>

              <button
                disabled={loading}
                type="submit"
                className="w-full mt-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-black py-4 rounded-xl flex justify-center items-center gap-2 shadow-lg hover:shadow-xl transition-all"
              >
                {loading ? (
                  <Loader2 className="animate-spin" />
                ) : (
                  <UserPlus />
                )}
                Register as LF
              </button>
            </div>
          </form>

          {showPrivacy && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-lg shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col max-h-[80vh]">
                <div className="p-6 border-b border-slate-100 dark:border-slate-700">
                  <h3 className="text-xl font-bold text-slate-800 dark:text-white">
                    Privacy Agreement
                  </h3>
                </div>
                <div className="p-6 overflow-y-auto text-sm text-slate-600 dark:text-slate-400 space-y-4">
                  <p>
                    By registering as a Learning Facilitator in the Dualtech
                    BSTP Admin Portal, you agree to the following terms
                    regarding data privacy and confidentiality:
                  </p>
                  <ul className="list-disc pl-5 space-y-2">
                    <li>
                      You acknowledge that you will have access to sensitive
                      personal information of trainees.
                    </li>
                    <li>
                      You agree to use this information strictly for advisory,
                      attendance, and evaluation purposes only.
                    </li>
                    <li>
                      You must not disclose, share, or distribute any trainee
                      information to unauthorized third parties.
                    </li>
                    <li>
                      Your account and actions within the portal are monitored
                      and logged.
                    </li>
                    <li>
                      Any violation of these terms may result in account
                      termination and disciplinary actions according to
                      Dualtech Center policies.
                    </li>
                  </ul>
                </div>
                <div className="p-6 border-t border-slate-100 dark:border-slate-700">
                  <button
                    onClick={() => setShowPrivacy(false)}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors"
                  >
                    I Understand
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function DisputesTab({ lfData, showMessage }) {
      const [viewMode, setViewMode] = React.useState("pending"); // "pending" | "history"
      const [activeSubTab, setActiveSubTab] = React.useState("clock");

      const [allClockDisputes, setAllClockDisputes] = React.useState([]);
      const [allAwolDisputes, setAllAwolDisputes] = React.useState([]);
      const [allSkillsetDisputes, setAllSkillsetDisputes] = React.useState([]);

      const [loadingClock, setLoadingClock] = React.useState(true);
      const [loadingAwol, setLoadingAwol] = React.useState(true);
      const [loadingSkillset, setLoadingSkillset] = React.useState(true);

      React.useEffect(() => {
        if (!lfData?.initials) return;

        // Fetch ALL clock disputes for the adviser
        const qClock = query(
          collection(db, "artifacts", "dualtech-ojt-portal", "public", "data", "bstpAttendance"),
          where("adviserInitials", "==", lfData.initials)
        );

        const unsubClock = onSnapshot(qClock, (snap) => {
          const records = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          setAllClockDisputes(records);
          setLoadingClock(false);
        }, (err) => { console.error("Error fetching clock disputes:", err); setLoadingClock(false); });

        // Fetch ALL awol disputes
        const qAwol = query(
          collection(db, "artifacts", "dualtech-ojt-portal", "public", "data", "bstpDisputes"),
          where("adviserInitials", "==", lfData.initials)
        );

        const unsubAwol = onSnapshot(qAwol, (snap) => {
          const records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setAllAwolDisputes(records);
          setLoadingAwol(false);
        }, (err) => { console.error("Error fetching awol disputes:", err); setLoadingAwol(false); });

        // Fetch ALL skillset disputes
        const qSkillset = query(
          collection(db, "artifacts", "dualtech-ojt-portal", "public", "data", "bstpDisputes"),
          where("skillsetLfInitials", "==", lfData.initials)
        );

        const unsubSkillset = onSnapshot(qSkillset, (snap) => {
          const records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setAllSkillsetDisputes(records);
          setLoadingSkillset(false);
        }, (err) => { console.error("Error fetching skillset disputes:", err); setLoadingSkillset(false); });

        return () => { unsubClock(); unsubAwol(); unsubSkillset(); };
      }, [lfData]);

      const clockDisputes = allClockDisputes.filter(d => d.status === "pending");
      const clockHistory = allClockDisputes.filter(d => d.status !== "pending");

      const awolDisputes = allAwolDisputes.filter(d => d.status === "Pending");
      const awolHistory = allAwolDisputes.filter(d => d.status !== "Pending");

      const skillsetDisputes = allSkillsetDisputes.filter(d => d.skillsetStatus === "Pending");
      const skillsetHistory = allSkillsetDisputes.filter(d => d.skillsetStatus !== "Pending" && d.skillsetStatus !== undefined);

      const handleClockAction = async (id, action, studentNo) => {
        if (!window.confirm(`Are you sure you want to ${action} this clock record?`)) return;
        try {
          const newStatus = action === "approve" ? "active" : "rejected";
          await updateDoc(doc(db, "artifacts", "dualtech-ojt-portal", "public", "data", "bstpAttendance", id), {
            status: newStatus,
          });

          await addDoc(collection(db, "artifacts", "dualtech-ojt-portal", "public", "data", "notifications"), {
            targetStudentId: studentNo,
            title: `Clock Dispute ${action === "approve" ? "Approved" : "Rejected"}`,
