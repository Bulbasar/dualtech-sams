    }

    function ManageClassTab({ lfData, showMessage }) {
      const [isScanning, setIsScanning] = useState(false);
      const [roomId, setRoomId] = useState(null);
      const [roomName, setRoomName] = useState("");
      const [roomSkillset, setRoomSkillset] = useState("");
      const [roomCapacity, setRoomCapacity] = useState(0);

      const [pendingTrainees, setPendingTrainees] = useState([]);
      const [approvedTrainees, setApprovedTrainees] = useState([]);
      const [loading, setLoading] = useState(false);

      const [sortConfig, setSortConfig] = useState({
        key: "timestamp",
        direction: "desc",
      });
      const [selectedIds, setSelectedIds] = useState(new Set());

      // Modal state for override remarks
      const [overrideModal, setOverrideModal] = useState({
        show: false,
        trainee: null,
        newRemarks: "",
      });
      const [promptModal, setPromptModal] = useState({
        show: false,
        qrRoom: null,
      });
      const [historyModal, setHistoryModal] = useState({ show: false });
      const [classHistory, setClassHistory] = useState([]);
      const scannerRef = useRef(null);

      // 1. Session Persistence
      useEffect(() => {
        const saved = localStorage.getItem("lfClassHistory");
        if (saved) {
          try {
            setClassHistory(JSON.parse(saved));
          } catch (e) { }
        }
        const savedSession = localStorage.getItem("lfActiveRoom");
        if (savedSession) {
          try {
            const parsed = JSON.parse(savedSession);
            if (parsed.roomId && parsed.timestamp) {
              // Expire session after 12 hours
              if (
                new Date() - new Date(parsed.timestamp) <
                12 * 60 * 60 * 1000
              ) {
                setRoomId(parsed.roomId);
                setRoomName(parsed.roomName);
                setRoomSkillset(parsed.roomSkillset || "");
                fetchClassRoster(parsed.roomId);
              } else {
                localStorage.removeItem("lfActiveRoom");
              }
            }
          } catch (e) {
            localStorage.removeItem("lfActiveRoom");
          }
        }
      }, []);

      function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = (lat1 * Math.PI) / 180;
        const φ2 = (lat2 * Math.PI) / 180;
        const Δφ = ((lat2 - lat1) * Math.PI) / 180;
        const Δλ = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
          Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      const getLiveLocation = () => {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported."));
          } else {
            navigator.geolocation.getCurrentPosition(
              (pos) =>
                resolve({
                  lat: pos.coords.latitude,
                  lng: pos.coords.longitude,
                }),
              (err) => reject(err),
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
            );
          }
        });
      };

      useEffect(() => {
        if (isScanning && !scannerRef.current) {
          try {
            const scanner = new Html5QrcodeScanner(
              "reader",
              { fps: 10, qrbox: 250 },
              false,
            );
            scannerRef.current = scanner;

            scanner.render(
              async (decodedText) => {
                scanner.clear();
                setIsScanning(false);
                try {
                  const qrRoom = JSON.parse(decodedText);
                  if (!qrRoom.roomId) {
                    return showMessage(
                      "Invalid Room QR Code format.",
                      "error",
                    );
                  }

                  setLoading(true);
                  showMessage("Acquiring location...", "info");

                  let livePos;
                  try {
                    livePos = await getLiveLocation();
                  } catch (e) {
                    setLoading(false);
                    return showMessage(
                      "Could not acquire location. Please allow location access.",
                      "error",
                    );
                  }

                  const dist = haversine(
                    livePos.lat,
                    livePos.lng,
                    qrRoom.lat,
                    qrRoom.lng,
                  );
                  const radius = qrRoom.radiusMeters || 100;

                  if (dist > radius) {
                    setLoading(false);
                    return showMessage(
                      `Too far from room (${Math.round(dist)}m). Must be within ${radius}m.`,
                      "error",
                    );
                  }

                  const qSkill = query(
                    collection(
                      db,
                      "artifacts",
                      "dualtech-ojt-portal",
                      "public",
                      "data",
                      "bstpSkillsets",
                    ),
                    where("name", "==", qrRoom.skillset || ""),
                  );
                  const snapSkill = await getDocs(qSkill);
                  if (snapSkill.empty) {
                    setLoading(false);
                    return showMessage(
                      `Skillset '${qrRoom.skillset}' not found in database.`,
                      "error",
                    );
                  }

                  const skillData = snapSkill.docs[0].data();
                  const assignedLFs = skillData.assignedLFs || [];

                  const lfName = lfData.name || "";
                  let initials = lfData.initials;
                  if (!initials) {
                    const parts = lfName.split(" ").filter(Boolean);
                    initials = parts
                      .map((p) => p.charAt(0).toUpperCase())
                      .join("");
                  }
                  if (!initials) initials = "LF";
                  const formattedName = `${initials} (${lfName})`;

                  if (!assignedLFs.includes(formattedName)) {
                    setLoading(false);
                    return showMessage(
                      `You are not authorized for '${qrRoom.skillset}'.`,
                      "error",
                    );
                  }

                  setLoading(false);
                  setPromptModal({ show: true, qrRoom: qrRoom });
                } catch (e) {
                  setLoading(false);
                  console.error("Scan Error Details:", e);
                  showMessage(
                    "Scan Error: " + (e.message || "Unknown error"),
                    "error",
                  );
                }
              },
              (err) => {
                // ignore continuous errors
              },
            );
          } catch (e) {
            console.error("Scanner error", e);
          }
        }

        return () => {
          if (scannerRef.current) {
            try {
              scannerRef.current.clear();
            } catch (e) { }
            scannerRef.current = null;
          }
        };
      }, [isScanning]);

      useEffect(() => {
        const handleRefresh = () => {
          if (roomId) fetchClassRoster(roomId);
        };
        window.addEventListener("lfportal_refresh", handleRefresh);
        return () => window.removeEventListener("lfportal_refresh", handleRefresh);
      }, [roomId]);

      async function fetchClassRoster(rId) {
        setLoading(true);
        setSelectedIds(new Set());
        try {
          const todayStr = new Date().toLocaleDateString("en-CA", {
            timeZone: "Asia/Manila",
          });

          // Fetch room capacity
          try {
            const venueDoc = await getDoc(
              doc(
                db,
                "artifacts",
                "dualtech-ojt-portal",
                "public",
                "data",
                "bstpVenues",
                rId,
              ),
            );
            if (venueDoc.exists()) {
              setRoomCapacity(venueDoc.data().capacity || 0);
            } else {
              setRoomCapacity(0);
            }
          } catch (e) {
            console.error("Error fetching room capacity:", e);
          }

          // Fetch by both roomId and venueId to be absolutely safe
          const q1 = query(
            collection(
              db,
              "artifacts",
              "dualtech-ojt-portal",
              "public",
              "data",
              "bstpAttendance",
            ),
            where("roomId", "==", rId),
          );
          const q2 = query(
            collection(
              db,
              "artifacts",
              "dualtech-ojt-portal",
              "public",
              "data",
              "bstpAttendance",
            ),
            where("venueId", "==", rId),
          );

          const [snap1, snap2] = await Promise.all([
            getDocs(q1),
            getDocs(q2),
          ]);
          const uniqueDocs = new Map();

          snap1.forEach((d) => uniqueDocs.set(d.id, d));
          snap2.forEach((d) => uniqueDocs.set(d.id, d));

          const pend = [];
          const appr = [];
          const outSet = new Set();

          for (const [id, docSnap] of uniqueDocs.entries()) {
            const data = docSnap.data();
            const dStr = new Date(data.timestamp).toLocaleDateString(
              "en-CA",
              { timeZone: "Asia/Manila" },
            );
            if (dStr === todayStr) {
              if (data.type === "SKILLSET_IN") {
                if (data.status === "pending") pend.push({ id: id, ...data });
                if (data.status === "approved")
                  appr.push({ id: id, ...data });
              } else if (data.type === "SKILLSET_OUT") {
                outSet.add(
                  data.studentNo || data.profileId || data.userEmail,
                );
              }
            }
          }

          const enrichWithProfiles = async (arr) => {
            return await Promise.all(
              arr.map(async (t) => {
                t.studentId = t.studentNo || "N/A";
                t.section = "N/A";
                t.profileName = t.name || t.userEmail;
                t.isLate = (t.remarks || "").toLowerCase().includes("late");

                let pRefId = t.profileId || t.studentNo || t.studentId;
                if (pRefId && pRefId !== "N/A") {
                  try {
                    const pDocRef = doc(
                      db,
                      "artifacts",
                      "dualtech-ojt-portal",
                      "public",
                      "data",
                      "profiles",
                      String(pRefId),
                    );
                    const pSnap = await getDoc(pDocRef);
                    if (pSnap.exists()) {
                      const pData = pSnap.data();
                      t.profileName =
                        pData.name ||
                        `${pData.firstName || pData.given || ""} ${pData.lastName || pData.family || ""}`.trim() ||
                        t.profileName;
                      t.section = pData.section || pData.Section || "N/A";
                      t.studentId =
                        pData.studentId || pData.studentNo || t.studentId;
                    }
                  } catch (e) {
                    console.error("Error fetching profile", e);
                  }
                }
                t.hasOut =
                  outSet.has(t.studentNo) ||
                  outSet.has(t.profileId) ||
                  outSet.has(t.userEmail) ||
                  outSet.has(t.studentId);
                return t;
              }),
            );
          };

          setPendingTrainees(await enrichWithProfiles(pend));
          setApprovedTrainees(await enrichWithProfiles(appr));
        } catch (e) {
          console.error("fetch roster error", e);
          showMessage("Error fetching roster: " + e.message, "error");
        }
        setLoading(false);
      }

      const handleLeaveRoom = () => {
        if (
          window.confirm("Are you sure you want to leave this room session?")
        ) {
          setRoomId(null);
          setRoomName("");
          setRoomSkillset("");
          setPendingTrainees([]);
          setApprovedTrainees([]);
          localStorage.removeItem("lfActiveRoom");
        }
      };

      const toggleSelect = (id) => {
        const newSet = new Set(selectedIds);
        if (newSet.has(id)) newSet.delete(id);
        else newSet.add(id);
        setSelectedIds(newSet);
      };

      const toggleSelectAll = () => {
        if (
          selectedIds.size === pendingTrainees.length &&
          pendingTrainees.length > 0
        ) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(pendingTrainees.map((t) => t.id)));
        }
      };

      async function verifySelected() {
        if (selectedIds.size === 0) return;

        if (roomCapacity > 0) {
          if (approvedTrainees.length + selectedIds.size > roomCapacity) {
            if (
              !window.confirm(
                `Warning: Verifying these ${selectedIds.size} trainee(s) will exceed the room capacity of ${roomCapacity} (Currently verified: ${approvedTrainees.length}). Do you want to proceed anyway?`,
              )
            ) {
              return;
            }
          }
        }

        setLoading(true);
        try {
          for (const id of selectedIds) {
            await updateDoc(
              doc(
                db,
                "artifacts",
                "dualtech-ojt-portal",
                "public",
                "data",
                "bstpAttendance",
                id,
              ),
              {
                status: "approved",
                verifiedBy: lfData.email,
                verifiedAt: new Date().toISOString(),
              },
            );

            const trainee = pendingTrainees.find((p) => p.id === id);
            if (trainee && trainee.studentId) {
              await addDoc(
                collection(
                  db,
                  "artifacts",
                  "dualtech-ojt-portal",
                  "public",
                  "data",
                  "notifications",
                ),
                {
                  targetStudentId: trainee.studentId,
                  title: "Skillset Verified",
                  message: `Your check-in for ${roomName} has been verified by ${lfData.name}.`,
                  timestamp: new Date().toISOString(),
                  read: false,
                  type: "SKILLSET_VERIFIED",
                },
              );
            }
          }
          showMessage(`Verified ${selectedIds.size} trainees!`);
          if (roomId) fetchClassRoster(roomId);
        } catch (e) {
          showMessage("Error verifying trainees: " + e.message, "error");
        }
        setLoading(false);
      }

      async function skillsetOutTrainee(trainee) {
        if (
          !window.confirm(
            `Are you sure you want to skillset out ${trainee.profileName}?`,
          )
        )
          return;
        setLoading(true);
        try {
          await addDoc(
            collection(
              db,
              "artifacts",
              "dualtech-ojt-portal",
              "public",
              "data",
              "bstpAttendance",
            ),
            {
              type: "SKILLSET_OUT",
              studentNo: trainee.studentId || trainee.studentNo || "",
              userEmail: trainee.userEmail || "",
              profileId: trainee.profileId || "",
              roomId: trainee.roomId || roomId,
              venueId: trainee.venueId || trainee.roomId || roomId,
              skillset: trainee.skillset || roomSkillset,
              status: "approved",
              verifiedBy: lfData.email,
              timestamp: new Date().toISOString(),
              remarks: "Skillset out by LF",
            },
          );
          showMessage(`Skillset out successful for ${trainee.profileName}.`);
          if (roomId) fetchClassRoster(roomId);
        } catch (e) {
          showMessage("Error logging skillset out: " + e.message, "error");
        }
        setLoading(false);
      }

      async function submitOverrideRemarks() {
        if (!overrideModal.trainee) return;
        setLoading(true);
        try {
          await updateDoc(
            doc(
              db,
              "artifacts",
              "dualtech-ojt-portal",
              "public",
              "data",
              "bstpAttendance",
              overrideModal.trainee.id,
            ),
            {
              remarks: overrideModal.newRemarks,
            },
          );
          showMessage("Remarks overridden successfully.");
          setOverrideModal({ show: false, trainee: null, newRemarks: "" });
          if (roomId) fetchClassRoster(roomId);
        } catch (e) {
          showMessage("Error saving remarks: " + e.message, "error");
        }
        setLoading(false);
      }

      const requestSort = (key) => {
        let direction = "asc";
        if (sortConfig.key === key && sortConfig.direction === "asc")
          direction = "desc";
        setSortConfig({ key, direction });
      };

      const getSortedData = (data) => {
        return [...data].sort((a, b) => {
          let valA = a[sortConfig.key] || "";
          let valB = b[sortConfig.key] || "";
          if (typeof valA === "string") valA = valA.toLowerCase();
          if (typeof valB === "string") valB = valB.toLowerCase();

          if (
            sortConfig.key === "computedRegDate" ||
            sortConfig.key === "computedPresent" ||
            sortConfig.key === "computedAbsences" ||
            sortConfig.key === "computedLate"
          ) {
            const numA = parseInt(a[sortConfig.key]) || 0;
            const numB = parseInt(b[sortConfig.key]) || 0;
            if (numA < numB) return sortConfig.direction === "asc" ? -1 : 1;
            if (numA > numB) return sortConfig.direction === "asc" ? 1 : -1;
            return 0;
          }

          if (sortConfig.key === "isRegistered") {
            const valA = a.isRegistered ? 1 : 0;
            const valB = b.isRegistered ? 1 : 0;
            if (valA < valB) return sortConfig.direction === "asc" ? -1 : 1;
            if (valA > valB) return sortConfig.direction === "asc" ? 1 : -1;
            return 0;
          }

          if (valA < valB) return sortConfig.direction === "asc" ? -1 : 1;
          if (valA > valB) return sortConfig.direction === "asc" ? 1 : -1;
          return 0;
        });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <QrCode className="text-blue-500" /> Manage Class
              </h2>
              <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">
                {roomId
                  ? `Currently managing session for ${roomName}`
                  : "Scan a room QR code to verify checked-in trainees."}
              </p>
            </div>

            {!roomId ? (
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={async () => {
                    setHistoryModal({ show: true });
                    try {
                      const q = query(
                        collection(
                          db,
                          "artifacts",
                          "dualtech-ojt-portal",
                          "public",
                          "data",
                          "bstpAttendance",
                        ),
                        where("verifiedBy", "==", lfData.email),
                      );
                      const snap = await getDocs(q);
                      const dbHistMap = new Map();
                      snap.forEach((d) => {
                        const data = d.data();
                        if (data.roomId && data.roomName) {
                          const ts = new Date(data.timestamp).getTime();
                          if (
                            !dbHistMap.has(data.roomId) ||
                            dbHistMap.get(data.roomId).timestamp < ts
                          ) {
                            dbHistMap.set(data.roomId, {
                              roomId: data.roomId,
                              roomName: data.roomName,
                              roomSkillset:
                                data.skillset || data.roomSkillset || "",
                              timestamp: ts,
                            });
                          }
                        }
                      });
                      const dbArr = Array.from(dbHistMap.values()).map(
                        (a) => ({
                          ...a,
                          timestamp: new Date(a.timestamp).toISOString(),
                        }),
                      );

                      // Merge with local storage
                      const existingHist = JSON.parse(
                        localStorage.getItem("lfClassHistory") || "[]",
                      );
                      const mergedMap = new Map();
                      existingHist.forEach((h) => mergedMap.set(h.roomId, h));
                      dbArr.forEach((h) => {
                        if (
                          !mergedMap.has(h.roomId) ||
                          new Date(h.timestamp) >
                          new Date(mergedMap.get(h.roomId).timestamp)
                        ) {
                          mergedMap.set(h.roomId, h);
                        }
                      });

                      const updatedHist = Array.from(mergedMap.values())
                        .sort(
                          (a, b) =>
                            new Date(b.timestamp) - new Date(a.timestamp),
                        )
                        .slice(0, 50);
                      setClassHistory(updatedHist);
                      localStorage.setItem(
                        "lfClassHistory",
                        JSON.stringify(updatedHist),
                      );
                    } catch (e) {
                      console.error("Error fetching DB history:", e);
                    }
                  }}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-6 rounded-xl flex items-center gap-2 transition-colors dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200"
                >
                  <History size={18} /> History
                </button>
                <button
                  onClick={() => setIsScanning(!isScanning)}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl flex items-center gap-2 transition-colors"
                >
                  <QrCode size={18} />{" "}
                  {isScanning ? "Cancel Scan" : "Scan Room QR Code"}
                </button>
              </div>
            ) : (
              <button
                onClick={handleLeaveRoom}
                className="bg-rose-100 text-rose-600 hover:bg-rose-200 dark:bg-rose-900/30 dark:text-rose-400 font-bold py-2 px-6 rounded-xl flex items-center gap-2 transition-colors"
              >
                <LogOut size={18} /> Leave Room
              </button>
            )}

    function RequestsTab({ lfData, showMessage }) {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [actionRemarks, setActionRemarks] = useState({});

      const fetchRequests = async () => {
        try {
          setLoading(true);
          const q = query(
            collection(db, "artifacts", APP_ID, "public", "data", "bstpAbsences"),
            where("adviser", "==", lfData.initials)
          );
          const snap = await getDocs(q);
          const reqs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          reqs.sort((a, b) => b.timestamp - a.timestamp);
          setRequests(reqs);
        } catch (error) {
          console.error("Error fetching requests:", error);
          showMessage("Error fetching absence requests", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchRequests();
        const handleRefresh = () => fetchRequests();
        window.addEventListener("lfportal_refresh", handleRefresh);
        return () => window.removeEventListener("lfportal_refresh", handleRefresh);
      }, [lfData.initials]);

      const handleAction = async (reqId, isApproved) => {
        try {
          const reqDoc = doc(db, "artifacts", APP_ID, "public", "data", "bstpAbsences", reqId);
          const status = isApproved ? "Approved" : "Denied";
          const remarks = actionRemarks[reqId] || "";

          await updateDoc(reqDoc, {
            status: status,
            remarks: remarks,
            updatedAt: serverTimestamp(),
            icStatus: status, // for compatibility
            icRemarks: remarks
          });

          showMessage(`Request successfully ${status.toLowerCase()}`, "success");
          fetchRequests();
        } catch (error) {
          console.error("Error updating request:", error);
          showMessage("Error updating request", "error");
        }
      };

      if (loading) {
        return (
          <div className="flex justify-center items-center h-64">
            <Loader2 className="animate-spin text-blue-500" size={32} />
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 className="text-2xl font-black text-slate-800 dark:text-slate-100 flex items-center gap-3">
                <FileText className="text-blue-500" size={28} />
                Absence Requests
              </h1>
              <p className="text-slate-500 dark:text-slate-400 font-medium">
                Review and manage absence requests from your trainees
              </p>
            </div>
          </div>

          <div className="space-y-4">
            {requests.map(req => {
              const isPending = req.status === "Pending Adviser Approval" || (!req.status || req.status.toLowerCase().includes('pending'));
              const isCanceled = req.isCanceled || req.status?.toLowerCase().includes('canceled');

              let statusColor = 'bg-amber-100 text-amber-700';
              if (req.status?.toLowerCase() === 'approved') statusColor = 'bg-blue-100 text-blue-700';
              else if (req.status?.toLowerCase().includes('denied') || req.status?.toLowerCase().includes('rejected')) statusColor = 'bg-rose-100 text-rose-700';
              else if (isCanceled) statusColor = 'bg-slate-200 text-slate-600';

              return (
                <div key={req.id} className={`bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border ${isCanceled ? 'opacity-60 border-slate-200' : 'border-slate-200 dark:border-slate-700'}`}>
                  <div className="flex flex-col md:flex-row justify-between gap-4">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-2">
                        <span className={`px-2.5 py-1 text-xs font-black uppercase rounded-lg ${statusColor}`}>
                          {req.status || "Pending"}
                        </span>
                        <span className="text-sm font-bold text-slate-500">{new Date(req.timestamp?.toDate() || Date.now()).toLocaleDateString()}</span>
                      </div>
                      <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100">
                        {req.name} <span className="text-sm font-normal text-slate-500">({req.studentNo})</span>
                      </h3>
                      <div className="mt-2 text-sm text-slate-600 dark:text-slate-300">
                        <p><strong>Type:</strong> {req.type}</p>
                        <p><strong>Category:</strong> {req.category}</p>
                        <p><strong>Date(s):</strong> {req.dates}</p>
                      </div>
                      <div className="mt-3 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                        <p className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Reason/Narrative:</p>
                        <p className="text-sm text-slate-600 dark:text-slate-400 italic">"{req.narrative}"</p>
                      </div>
                      {req.proofUrl && (
                        <div className="mt-3">
                          <a href={req.proofUrl} target="_blank" rel="noopener noreferrer" className="text-sm text-blue-600 font-bold hover:underline flex items-center gap-1">
                            <FileText size={16} /> View Attachment
                          </a>
                        </div>
                      )}
                      {req.remarks && (
                        <div className="mt-3 text-sm">
                          <strong>Your Remarks:</strong> {req.remarks}
                        </div>
                      )}
                    </div>

                    {isPending && !isCanceled && (
                      <div className="flex flex-col gap-2 w-full md:w-64 shrink-0 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-700 pt-4 md:pt-0 md:pl-4">
                        <textarea
                          className="w-full text-sm p-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg outline-none focus:border-blue-500 resize-none h-20"
                          placeholder="Add remarks (optional)..."
                          value={actionRemarks[req.id] || ""}
                          onChange={(e) => setActionRemarks({ ...actionRemarks, [req.id]: e.target.value })}
                        ></textarea>
                        <div className="flex gap-2">
                          <button
                            onClick={() => handleAction(req.id, true)}
                            className="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded-lg text-sm transition-colors"
                          >
                            Approve
                          </button>
                          <button
                            onClick={() => handleAction(req.id, false)}
                            className="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 rounded-lg text-sm transition-colors"
                          >
                            Deny
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {requests.length === 0 && (
              <div className="text-center py-10 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                <p className="text-slate-500 font-medium">No absence requests found.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

        function LFHistoryModal({ onClose, lfData, user, showMessage, db, getDocs, query, where, collection, APP_ID }) {
        const [activeView, setActiveView] = React.useState('daily');
        const [expandedRows, setExpandedRows] = React.useState({});
        const [historyData, setHistoryData] = React.useState([]);
        const [loading, setLoading] = React.useState(true);

        React.useEffect(() => {
            const fetchHistory = async () => {
                if (!lfData || !user) return;
                setLoading(true);
                try {
                    // Fetch LF Clock In/Out Logs
                    const attRef = collection(db, "artifacts", APP_ID, "public", "data", "lfAttendance");
                    const qAtt = query(attRef, where("lfEmail", "==", user.email));
                    const attSnap = await getDocs(qAtt);
                    const clockLogs = [];
                    const skillsetLogs = [];

                    attSnap.forEach(doc => {
                        const d = doc.data();
                        if (d.timestamp) {
                            if (d.type === 'CLASS_START') {
                                skillsetLogs.push({
                                    type: d.type,
                                    skillset: d.skillset,
                                    date: d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)
                                });
                            } else {
                                clockLogs.push({
                                    type: d.type || 'IN',
                                    date: d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)
                                });
                            }
                        }
                    });

                    // Fetch Skillset verification logs for this LF
                    const bstpAttRef = collection(db, "artifacts", APP_ID, "public", "data", "bstpAttendance");
                    const qBstp = query(bstpAttRef, where("skillsetLf", "==", lfData.initials));
                    const bstpSnap = await getDocs(qBstp);
                    
                    bstpSnap.forEach(doc => {
                        const d = doc.data();
                        if ((d.type === 'SKILLSET_IN' || d.type === 'SKILLSET_OUT') && d.timestamp) {
                            skillsetLogs.push({
                                type: d.type,
                                studentNo: d.studentNo,
                                skillset: d.skillset || d.roomSkillset || 'Unknown',
                                date: d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)
                            });
                        }
                    });

                    // Aggregate Data by Day
                    const dailyMap = {}; 
                    
                    clockLogs.forEach(log => {
                        const dStr = log.date.toLocaleDateString();
                        if (!dailyMap[dStr]) dailyMap[dStr] = { dateStr: dStr, dateObj: log.date, clockIns: [], clockOuts: [], skillsets: new Set(), trainees: new Set(), skillsetTimes: {}, skillsetMap: {} };
                        if (log.type === 'IN') dailyMap[dStr].clockIns.push(log.date);
                        else dailyMap[dStr].clockOuts.push(log.date);
                    });

                    skillsetLogs.forEach(log => {
                        const dStr = log.date.toLocaleDateString();
                        if (!dailyMap[dStr]) dailyMap[dStr] = { dateStr: dStr, dateObj: log.date, clockIns: [], clockOuts: [], skillsets: new Set(), trainees: new Set(), skillsetTimes: {}, skillsetMap: {} };
                        dailyMap[dStr].skillsets.add(log.skillset);
                        
                        if (log.studentNo) {
                            dailyMap[dStr].trainees.add(log.studentNo);
                        }
                        
                        if (!dailyMap[dStr].skillsetMap[log.skillset]) {
                            dailyMap[dStr].skillsetMap[log.skillset] = { timeIn: null, timeOut: null, trainees: new Set() };
                        }
                        const sMap = dailyMap[dStr].skillsetMap[log.skillset];

                        if (log.studentNo) {
                            sMap.trainees.add(log.studentNo);
                        }

                        if (log.type === 'CLASS_START') {
                            if (!sMap.timeIn || log.date < sMap.timeIn) sMap.timeIn = log.date;
                            if (!dailyMap[dStr].skillsetTimes[log.skillset] || log.date < dailyMap[dStr].skillsetTimes[log.skillset]) {
                                dailyMap[dStr].skillsetTimes[log.skillset] = log.date;
                            }
                        } else if (log.type === 'SKILLSET_IN') {
                            if (!sMap.timeIn || log.date < sMap.timeIn) sMap.timeIn = log.date;
                            if (!dailyMap[dStr].skillsetTimes[log.skillset] || log.date < dailyMap[dStr].skillsetTimes[log.skillset]) {
                                dailyMap[dStr].skillsetTimes[log.skillset] = log.date;
                            }
                        } else if (log.type === 'SKILLSET_OUT') {
                            if (!sMap.timeOut || log.date > sMap.timeOut) sMap.timeOut = log.date;
                        }
                    });

                    const getIsoWeek = (d) => {
                        const date = new Date(d.getTime());
                        date.setHours(0, 0, 0, 0);
                        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
                        const week1 = new Date(date.getFullYear(), 0, 4);
                        return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                    };

                    const processed = Object.values(dailyMap).map(day => {
                        day.clockIns.sort((a,b) => a-b);
                        day.clockOuts.sort((a,b) => b-a); 
                        
                        const firstIn = day.clockIns.length > 0 ? day.clockIns[0] : null;
                        const lastOut = day.clockOuts.length > 0 ? day.clockOuts[0] : null;
                        
                        let totalHours = 0;
                        if (firstIn && lastOut && lastOut > firstIn) {
                            totalHours = (lastOut - firstIn) / (1000 * 60 * 60);
                        }

                        return {
                            ...day,
                            firstIn,
                            lastOut,
                            totalHours,
                            isCompleted: firstIn !== null && lastOut !== null,
                            skillsetArr: Array.from(day.skillsets),
                            skillsetDetails: Array.from(day.skillsets).map(s => {
                                const st = day.skillsetTimes[s];
                                return st ? `${s} (${st.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})` : s;
                            }),
                            traineeCount: day.trainees.size,
                            weekStr: `${day.dateObj.getFullYear()}-W${getIsoWeek(day.dateObj).toString().padStart(2, '0')}`,
                            monthStr: `${day.dateObj.getFullYear()}-${(day.dateObj.getMonth()+1).toString().padStart(2, '0')}`
                        };
                    });
                    
                    processed.sort((a,b) => b.dateObj - a.dateObj);
                    setHistoryData(processed);

                } catch (e) {
                    console.error("Error fetching LF history", e);
                    showMessage("Failed to load history data", "error");
                } finally {
                    setLoading(false);
                }
            };
            fetchHistory();
        }, [lfData, user]);

        const aggregatedData = React.useMemo(() => {
            if (activeView === 'daily') return historyData;
            
            const groupMap = {};
            historyData.forEach(day => {
                const key = activeView === 'weekly' ? day.weekStr : day.monthStr;
                if (!groupMap[key]) {
                    groupMap[key] = { label: key, daysCompleted: 0, skillsets: new Set(), trainees: 0, sortDate: day.dateObj };
                }
                if (day.isCompleted) groupMap[key].daysCompleted++;
                day.skillsetArr.forEach(s => groupMap[key].skillsets.add(s));
                groupMap[key].trainees += day.traineeCount;
            });
            
            return Object.values(groupMap).sort((a,b) => b.sortDate - a.sortDate);
        }, [historyData, activeView]);

        const handleExport = () => {
            let csv = "";
            if (activeView === 'daily') {
                csv = "Date,Clock In,Clock Out,Total Hours,Skillsets Handled,Verified Trainees\n";
                aggregatedData.forEach(row => {
                    csv += `"${row.dateStr}","${row.firstIn ? row.firstIn.toLocaleTimeString() : 'N/A'}","${row.lastOut ? row.lastOut.toLocaleTimeString() : 'N/A'}","${row.totalHours.toFixed(2)}","${row.skillsetDetails.join(', ')}","${row.traineeCount}"\n`;
                });
            } else {
                csv = "Period,Days Completed,Skillsets Handled,Verified Trainees\n";
                aggregatedData.forEach(row => {
                    csv += `"${row.label}","${row.daysCompleted}","${Array.from(row.skillsets).join(', ')}","${row.trainees}"\n`;
                });
            }

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `lf_history_${activeView}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        return (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-4xl flex flex-col max-h-[90vh] border border-slate-200 dark:border-slate-700">
                    <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50 rounded-t-2xl">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <Lucide.History className="text-blue-500" /> My Activity History
                            </h2>
                            <p className="text-sm text-slate-500 mt-1">Clock in/out logs and skillset verifications.</p>
                        </div>
                        <button onClick={onClose} className="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-500">
                            <Lucide.X size={20} />
                        </button>
                    </div>
                    
                    <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                        <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                            <div className="flex bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
                                {['daily', 'weekly', 'monthly'].map(v => (
                                    <button 
                                        key={v}
                                        onClick={() => setActiveView(v)}
                                        className={`px-4 py-1.5 text-sm font-bold rounded-md transition-colors capitalize ${activeView === v ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'}`}
                                    >
                                        {v}
                                    </button>
                                ))}
                            </div>
                            <button 
                                onClick={handleExport}
                                disabled={loading || aggregatedData.length === 0}
                                className="flex items-center gap-2 px-4 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 dark:hover:bg-emerald-900/50 rounded-lg font-bold text-sm transition-colors disabled:opacity-50"
                            >
                                <Lucide.Download size={16} /> Export to CSV
                            </button>
                        </div>

                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-20 text-blue-500">
                                <Lucide.Loader2 size={32} className="animate-spin mb-4" />
                                <p className="font-medium text-slate-500">Loading history data...</p>
                            </div>
                        ) : aggregatedData.length === 0 ? (
                            <div className="text-center py-20 text-slate-500">
                                <Lucide.Inbox size={48} className="mx-auto mb-4 opacity-20" />
                                <p>No history records found.</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                                <table className="w-full text-left border-collapse whitespace-nowrap">
                                    <thead>
                                        <tr className="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700">
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">{activeView === 'daily' ? 'Date' : 'Period'}</th>
                                            {activeView === 'daily' ? (
                                                <>
                                                    <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Clock In</th>
                                                    <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Clock Out</th>
                                                    <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Total Hours</th>
                                                </>
                                            ) : (
                                                <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Days Completed</th>
                                            )}
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Skillsets Handled</th>
                                            <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Verified Trainees</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {aggregatedData.map((row, idx) => (
                                            <React.Fragment key={idx}>
                                                <tr 
                                                    className={`hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors ${activeView === 'daily' ? 'cursor-pointer' : ''}`}
                                                    onClick={() => {
                                                        if (activeView === 'daily') {
                                                            setExpandedRows(prev => ({...prev, [idx]: !prev[idx]}));
                                                        }
                                                    }}
                                                >
                                                    <td className="p-4 font-bold text-slate-800 dark:text-slate-200">
                                                        <div className="flex items-center gap-2">
                                                            {activeView === 'daily' && (
                                                                <span className="text-slate-400">
                                                                    {expandedRows[idx] ? <Lucide.ChevronDown size={16}/> : <Lucide.ChevronRight size={16}/>}
                                                                </span>
                                                            )}
                                                            {activeView === 'daily' ? row.dateStr : row.label}
                                                        </div>
                                                    </td>
                                                    {activeView === 'daily' ? (
                                                        <>
                                                            <td className="p-4 font-mono text-sm text-emerald-600">{row.firstIn ? row.firstIn.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : <span className="text-slate-400">N/A</span>}</td>
                                                            <td className="p-4 font-mono text-sm text-blue-600">{row.lastOut ? row.lastOut.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : <span className="text-slate-400">N/A</span>}</td>
                                                            <td className="p-4 font-mono text-sm">{row.totalHours > 0 ? `${row.totalHours.toFixed(1)}h` : '-'}</td>
                                                        </>
                                                    ) : (
                                                        <td className="p-4 font-bold text-blue-600">{row.daysCompleted}</td>
                                                    )}
                                                    <td className="p-4">
                                                        <div className="flex flex-wrap gap-1 max-w-xs whitespace-normal">
                                                            {(activeView === 'daily' ? row.skillsetDetails : Array.from(row.skillsets)).map(s => (
                                                                <span key={s} className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs rounded-full border border-slate-200 dark:border-slate-700">{s}</span>
                                                            ))}
                                                        </div>
                                                    </td>
                                                    <td className="p-4 font-bold text-slate-700 dark:text-slate-300">
                                                        {activeView === 'daily' ? row.traineeCount : row.trainees}
                                                    </td>
                                                </tr>
                                                {activeView === 'daily' && expandedRows[idx] && (
                                                    <tr className="bg-slate-50/50 dark:bg-slate-800/30">
                                                        <td colSpan="6" className="p-4 border-t border-slate-100 dark:border-slate-800">
                                                            <div className="pl-6 border-l-2 border-blue-500 ml-2">
                                                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Skillsets Breakdown</h4>
                                                                <div className="space-y-3">
                                                                    {Object.entries(row.skillsetMap || {}).map(([skillset, details]) => (
                                                                        <div key={skillset} className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6 text-sm">
                                                                            <span className="font-bold text-slate-700 dark:text-slate-300 min-w-[150px]">{skillset}</span>
                                                                            <div className="flex gap-4 text-slate-600 dark:text-slate-400">
                                                                                <span><strong className="text-emerald-600">In:</strong> {details.timeIn ? details.timeIn.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A'}</span>
                                                                                <span><strong className="text-blue-600">Out:</strong> {details.timeOut ? details.timeOut.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A'}</span>
                                                                                <span><strong className="text-purple-600">Trainees:</strong> {details.trainees.size}</span>
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                    {Object.keys(row.skillsetMap || {}).length === 0 && (
                                                                        <p className="text-sm text-slate-500 italic">No skillset details available for this date.</p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

function App() {
      const [user, setUser] = useState(null);
      const [lfData, setLfData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isRegistering, setIsRegistering] = useState(false);

      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loginLoading, setLoginLoading] = useState(false);
      const [showPassword, setShowPassword] = useState(false);
      const [resetLoading, setResetLoading] = useState(false);
      const [darkMode, setDarkMode] = useState(false);

      // Geofence States

      const [showNotifications, setShowNotifications] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [showMessages, setShowMessages] = useState(false);
      const [totalUnread, setTotalUnread] = useState(0);
      const [notifications, setNotifications] = useState([]);

      useEffect(() => {
        if (!lfData?.id) return;
        const q = query(collection(db, "chat_conversations"), where("participants", "array-contains", lfData.id));
        const unsub = onSnapshot(q, (snap) => {
          let total = 0;
          snap.forEach(d => {
            total += (d.data().unreadCount?.[lfData.id] || 0);
          });
          setTotalUnread(total);
        });
        return () => unsub();
      }, [lfData?.id]);


      useEffect(() => {
        if (user && lfData) {
          const q = query(
            collection(db, "bstpNotifications"),
            orderBy("timestamp", "desc"),
            limit(50),
          );
          const unsub = onSnapshot(q, (snap) => {
            const notifs = [];
            const dismissed = JSON.parse(
              localStorage.getItem("dismissed_notifications") || "[]",
            );
            snap.forEach((d) => {
              if (dismissed.includes(d.id)) return;
              const data = d.data();
              if (
                data.targetInitials &&
                data.targetInitials !== lfData.initials
              )
                return;

              // Do not show notifications meant for admins to LF users
              if (data.targetGroup === "BSTP Admin") {
                return;
              }
              let timeStr = "Just now";
              if (data.timestamp) {
                const date = data.timestamp?.toDate
                  ? data.timestamp.toDate()
                  : new Date(data.timestamp);
                timeStr = date.toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                });
              }
              notifs.push({ id: d.id, ...data, time: timeStr });
            });
            setNotifications(notifs);
          });
          return () => unsub();
        }
      }, [user, lfData]);

      const dismissNotification = (id) => {
        const dismissed = JSON.parse(
          localStorage.getItem("dismissed_notifications") || "[]",
        );
        if (!dismissed.includes(id)) {
          dismissed.push(id);
          localStorage.setItem(
            "dismissed_notifications",
            JSON.stringify(dismissed),
          );
        }
        setNotifications((prev) => prev.filter((n) => n.id !== id));
      };

      const [isClockedIn, setIsClockedIn] = useState(
        localStorage.getItem("lfClockedIn") === "true",
      );
      const [clockInTime, setClockInTime] = useState(() => {
        const storedTime = localStorage.getItem("lfClockInTime");
        return storedTime ? new Date(storedTime) : null;
      });

      const sendNotification = async (title, message, targetGroup = "BSTP Admin") => {
        try {
          await addDoc(collection(db, "bstpNotifications"), {
            title,
            message,
            timestamp: serverTimestamp(),
            sender: user.email,
            targetGroup: targetGroup,
            lfName: lfData
              ? `${lfData.firstName} ${lfData.lastName}`
              : user.email,
          });
        } catch (e) {
          console.error("Failed to send notification", e);
        }
      };

      const handleClockOut = async () => {
        setIsClockedIn(false);
        setClockInTime(null);
        localStorage.removeItem("lfClockedIn");
        localStorage.removeItem("lfClockInTime");
        showMessage("Clocked out successfully.", "success");
        sendNotification(
          "LF Clocked Out",
          `${lfData.firstName} ${lfData.lastName} has clocked out.`,
        );
        try {
          const attRef = collection(db, "artifacts", APP_ID, "public", "data", "lfAttendance");
          await addDoc(attRef, {
            lfId: user.uid,
            lfEmail: user.email,
            lfName: lfData?.name || "Unknown",
            timestamp: new Date(),
            type: "OUT"
          });
        } catch (e) {
          console.error("Failed to record clock out", e);
        }
      };
      const [showClockInModal, setShowClockInModal] = useState(false);
      const [showLoginPromptModal, setShowLoginPromptModal] = useState(false);
      const [schoolLocation, setSchoolLocation] = useState(null);
      const [clockingIn, setClockingIn] = useState(false);

      useEffect(() => {
        if (lfData && !isClockedIn && sessionStorage.getItem("lf_justLoggedIn") === "true") {
          sessionStorage.removeItem("lf_justLoggedIn");
          setTimeout(() => {
            setShowLoginPromptModal(true);
          }, 500);
        }
      }, [lfData, isClockedIn]);

      useEffect(() => {
        const fetchSchoolLocation = async () => {
          try {
            const docRef = doc(
              db,
              "artifacts",
              APP_ID,
              "public",
              "data",
              "settings",
              "schoolLocation",
            );
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
              setSchoolLocation(docSnap.data());
            }
          } catch (e) {
            console.error("Error fetching school location:", e);
          }
        };
        fetchSchoolLocation();
      }, []);

      // Helper to calculate distance
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3; // Earth radius in meters
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // Distance in meters
      };

      const handleClockIn = () => {
        if (!navigator.geolocation) {
          showMessage(
            "Geolocation is not supported by your browser.",
            "error",
          );
          return;
        }

        if (!schoolLocation) {
          showMessage(
            "School geofence data not loaded. Please try again.",
            "error",
          );
          return;
        }

        setClockingIn(true);
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;
            const dist = calculateDistance(
              userLat,
              userLon,
              schoolLocation.latitude,
              schoolLocation.longitude,
            );

            if (dist <= schoolLocation.radiusMeters) {
              setIsClockedIn(true);
              const now = new Date();
              setClockInTime(now);
              localStorage.setItem("lfClockedIn", "true");
              localStorage.setItem("lfClockInTime", now.toISOString());
              sendNotification(
                "LF Clocked In",
                `${lfData.firstName} ${lfData.lastName} has clocked in at Dualtech Campus.`,
              );
              setShowClockInModal(false);
              showMessage(
                "Clock In successful! You are within the campus.",
                "success",
              );

              try {
                const attRef = collection(
                  db,
                  "artifacts",
                  APP_ID,
                  "public",
                  "data",
                  "lfAttendance",
                );
                await addDoc(attRef, {
                  lfId: user.uid,
                  lfEmail: user.email,
                  lfName: lfData?.name || "Unknown",
                  timestamp: new Date(),
                  lat: userLat,
                  lng: userLon,
                  distanceMeters: dist,
                  type: "IN"
                });
              } catch (e) {
                console.error("Failed to record attendance", e);
              }
            } else {
              showMessage(
                `You are outside the Dualtech Campus geofence (Distance: ${Math.round(dist)}m). Clock in failed.`,
                "error",
              );
            }
            setClockingIn(false);
          },
          (err) => {
            showMessage(
              "Failed to get location. You must allow location access to clock in.",
              "error",
            );
            setClockingIn(false);
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 },
        );
      };

      // Toast logic
      const [toast, setToast] = useState(null);
      const showMessage = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const unsub = onAuthStateChanged(auth, async (u) => {
          if (u) {
            if (window.isRegisteringFlow) return;
            try {
              const docRef = doc(db, "bstpUsers", u.uid);
              const docSnap = await getDoc(docRef);

              if (
                docSnap.exists() &&
                docSnap.data().role === "Learning Facilitator"
              ) {
                const data = docSnap.data();
                if (data.status === "Pending") {
                  // Prevent pending login
                  await signOut(auth);
                  showMessage(
                    "Access Denied: Your account is pending approval by the BSTP Admin. Please try again later.",
                    "error",
                  );
                  setUser(null);
                  setLfData(null);
                } else if (data.status === "Deleted") {
                  await signOut(auth);
                  showMessage(
                    "Access Denied: Your account has been deleted.",
                    "error",
                  );
                  setUser(null);
                  setLfData(null);
                } else {
                  setUser(u);
                  setLfData({ id: docSnap.id, ...data });
                }
              } else {
                await signOut(auth);
                showMessage(
                  "Access Denied: You are not a registered Learning Facilitator.",
                  "error",
                );
              }
            } catch (err) {
              console.error(err);
              await signOut(auth);
              showMessage("Error verifying account status.", "error");
            }
          } else {
            setUser(null);
            setLfData(null);
          }
          setLoading(false);
        });
        return () => unsub();
      }, []);

      const handleResetPassword = async () => {
        if (!email) {
          showMessage("Please enter your email address first.", "error");
          return;
        }
        setResetLoading(true);
        try {
          await sendPasswordResetEmail(auth, email);
          showMessage("Password reset email sent! Check your inbox.", "success");
        } catch (err) {
          showMessage("Failed to send reset email: " + err.message, "error");
        } finally {
          setResetLoading(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginLoading(true);
        try {
          await signInWithEmailAndPassword(auth, email, password);
          sessionStorage.setItem("lf_justLoggedIn", "true");
        } catch (err) {
          showMessage("Login failed: " + err.message, "error");
        }
        setLoginLoading(false);
      };

      const handleLogout = async () => {
        await signOut(auth);
        setEmail("");
        setPassword("");
      };

      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        document.documentElement.classList.toggle("dark");
      };

      if (loading) {
        return (
          <div className="h-screen w-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
            <Loader2 className="animate-spin text-blue-500" size={48} />
          </div>
        );
      }

      if (user && lfData) {
        return (
          <>
            <Dashboard
              user={user}
              lfData={lfData}
              showMessage={showMessage}
              onLogout={handleLogout}
              isClockedIn={isClockedIn}
              showClockInModal={showClockInModal}
              schoolLocation={schoolLocation}
              clockingIn={clockingIn}
              handleClockIn={handleClockIn}
              setShowClockInModal={setShowClockInModal}
              clockInTime={clockInTime}
              handleClockOut={handleClockOut}
              showNotifications={showNotifications}
              setShowNotifications={setShowNotifications}
              notifications={notifications}
              dismissNotification={dismissNotification}
              sendNotification={sendNotification}
              setShowHistoryModal={setShowHistoryModal}
            />
            {showHistoryModal && (
              <LFHistoryModal
                onClose={() => setShowHistoryModal(false)}
                lfData={lfData}
                user={user}
                showMessage={showMessage}
                db={db}
                getDocs={getDocs}
                query={query}
                where={where}
                collection={collection}
                APP_ID={APP_ID}
              />
            )}
            {toast && (
              <div
                className={`fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 font-bold z-[150] animate-bounce-short ${toast.type === "error" ? "bg-red-600 text-white" : "bg-emerald-500 text-white"}`}
              >
                {toast.type === "error" ? (
                  <AlertTriangle size={20} />
                ) : (
                  <CheckCircle2 size={20} />
                )}
                {toast.msg}
              </div>
            )}
            
            {showLoginPromptModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 w-full max-w-md shadow-2xl border border-slate-200 dark:border-slate-700 text-center animate-in zoom-in-95">
                  <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <History size={32} />
                  </div>
                  <h3 className="text-2xl font-black text-slate-800 dark:text-slate-100 mb-2">
                    Login Successful!
                  </h3>
                  <p className="text-slate-600 dark:text-slate-400 mb-8 font-medium">
                    Do you want to clock in immediately for your shift?
                  </p>
                  <div className="flex flex-col gap-3">
                    <button
                      onClick={() => {
                        setShowLoginPromptModal(false);
                        setShowClockInModal(true);
                      }}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md"
                    >
                      Yes, Clock In Now
                    </button>
                    <button
                      onClick={() => setShowLoginPromptModal(false)}
                      className="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-bold py-3.5 rounded-xl transition-colors"
                    >
                      Maybe Later
                    </button>
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      return (
        <div className="h-full w-full flex justify-center py-10 bg-slate-50 dark:bg-slate-900 px-4 relative overflow-y-auto">
          {isRegistering ? (
            <RegistrationForm
              onBack={() => setIsRegistering(false)}
              showMessage={showMessage}
            />
          ) : (
            <div className="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300 my-auto h-fit">
              <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-10 text-white text-center relative overflow-hidden">
                <div className="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                <div className="absolute -bottom-10 -left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                <img src="/dualtech-logo.png" alt="Dualtech Logo" className="w-20 mx-auto mb-4 drop-shadow-md hover:scale-105 transition-transform duration-300" />
                <h2 className="text-3xl font-black mb-2 tracking-tight">LF Portal</h2>
                <p className="text-blue-100 font-medium">
                  Learning Facilitator Access
                </p>
              </div>

              <form onSubmit={handleLogin} className="p-8 space-y-6">
                <div className="space-y-4">
                  <div className="relative">
                    <Mail
                      className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                      size={20}
                    />
                    <input
                      required
                      type="email"
                      placeholder="Email Address"
                      className="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                    />
                  </div>
                  <div className="relative">
                    <Lock
                      className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                      size={20}
                    />
                    <input
                      required
                      type={showPassword ? "text" : "password"}
                      placeholder="Password"
                      className="w-full pl-12 pr-12 py-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"
                    >
                      {showPassword ? <EyeOff size={20} /> : <Eye size={20} />}
                    </button>
                  </div>
                  <div className="flex justify-end mt-2">
                    <button
                      type="button"
                      onClick={handleResetPassword}
                      disabled={resetLoading}
                      className="text-sm font-bold text-blue-600 dark:text-blue-400 hover:underline disabled:opacity-50 flex items-center gap-1 transition-all"
                    >
                      {resetLoading ? <Loader2 size={12} className="animate-spin" /> : null} Forgot Password?
                    </button>
                  </div>
                </div>
                <button
                  disabled={loginLoading}
                  type="submit"
                  className="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-black py-4 rounded-xl flex justify-center items-center gap-2 shadow-lg transition-all disabled:opacity-50"
                >
                  {loginLoading ? (
                    <Loader2 className="animate-spin" />
                  ) : (
                    "Log In"
                  )}
                </button>
                <div className="text-center mt-6 pt-6 border-t border-slate-100 dark:border-slate-700">
                  <p className="text-sm text-slate-500 dark:text-slate-400 mb-3">
                    Don't have an account?
                  </p>
                  <button
                    type="button"
                    onClick={() => setIsRegistering(true)}
                    className="text-blue-600 dark:text-blue-400 font-bold hover:underline flex items-center gap-2 justify-center w-full"
                  >
                    <UserPlus size={18} /> Register as Learning Facilitator
                  </button>
                </div>
              </form>
            </div>
          )}

          {toast && (
            <div
              className={`fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 font-bold z-50 animate-bounce-short ${toast.type === "error" ? "bg-red-600 text-white" : "bg-emerald-500 text-white"}`}
            >
              {toast.type === "error" ? (
                <AlertTriangle size={20} />
              ) : (
                <CheckCircle2 size={20} />
              )}
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
