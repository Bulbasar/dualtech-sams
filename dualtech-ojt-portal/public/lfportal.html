                            <button onClick={() => handleRevertSkillsetAction(d)} className="px-3 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-1 mx-auto">
                              <Undo2 size={14} /> Revert
                            </button>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }


    
    
    function StatusColumn({ title, color, items, groupBy }) {
        const grouped = items.reduce((acc, item) => {
            if (!acc[item.groupKey]) acc[item.groupKey] = [];
            acc[item.groupKey].push(item);
            return acc;
        }, {});

        const colorMap = {
            blue: 'bg-blue-100 text-blue-800 border-blue-200 dark:bg-blue-900/30 dark:text-blue-300 dark:border-blue-800',
            emerald: 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-800',
            slate: 'bg-slate-100 text-slate-800 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700'
        };
        const dotColorMap = {
            blue: 'bg-blue-500', emerald: 'bg-emerald-500', slate: 'bg-slate-400'
        };

        return (
            <div className="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 border border-slate-200 dark:border-slate-800 h-[600px] flex flex-col">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-200 dark:border-slate-700">
                    <h3 className="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                        <div className={`w-2 h-2 rounded-full ${dotColorMap[color]}`}></div>
                        {title}
                    </h3>
                    <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${colorMap[color]} border`}>
                        {items.length}
                    </span>
                </div>
                
                <div className="overflow-y-auto pr-2 space-y-4 flex-1 custom-scrollbar">
                    {Object.entries(grouped).length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 pb-10">
                            <Lucide.Inbox size={32} className="mb-2 opacity-20" />
                            <p className="text-sm">No trainees in this status</p>
                        </div>
                    ) : (
                        Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([groupName, groupItems]) => (
                            <div key={groupName} className="space-y-2">
                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider sticky top-0 bg-slate-50 dark:bg-slate-800/50 py-1 z-10">{groupName}</h4>
                                {groupItems.map(t => (
                                    <div key={t.studentNo} className="bg-white dark:bg-slate-900 p-3 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="font-bold text-sm text-slate-800 dark:text-slate-200">{t.lastName}, {t.firstName}</p>
                                                <p className="text-xs text-slate-500">{t.studentNo}</p>
                                            </div>
                                            {t.log && (
                                                <div className="text-right">
                                                    <div className={`text-xs font-bold ${t.isLate ? 'text-red-500' : 'text-emerald-500'}`}>
                                                        IN: {new Date(t.log.timeIn).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                                        {t.isLate && <span className="ml-1 text-[10px] bg-red-100 text-red-700 px-1 rounded">LATE</span>}
                                                    </div>
                                                    {t.log.timeOut && (
                                                        <div className={`text-xs font-bold mt-0.5 ${t.isUndertime ? 'text-orange-500' : 'text-blue-500'}`}>
                                                            OUT: {new Date(t.log.timeOut).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                                            {t.isUndertime && <span className="ml-1 text-[10px] bg-orange-100 text-orange-700 px-1 rounded">UT</span>}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))
                    )}
                </div>
            </div>
        );
    }

    function OverviewTab({ lfData, showMessage }) {
        const { PieChart, Pie, Cell, Tooltip: RechartsTooltip, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Legend, ComposedChart, Line } = Recharts;

        const [attendanceData, setAttendanceData] = React.useState({});
        const [shifts, setShifts] = React.useState([]);
        const [isFetching, setIsFetching] = React.useState(false);
        const [lastUpdated, setLastUpdated] = React.useState(null);
        const [groupBy, setGroupBy] = React.useState('shift'); // 'shift' or 'section'
        const [activeTrainees, setActiveTrainees] = React.useState([]);

        const [overviewData, setOverviewData] = React.useState({
            all: { active: 0, preBstp: 0, postBstp: 0, other: 0, total: 0 },
            my: { active: 0, preBstp: 0, postBstp: 0, other: 0, total: 0 }
        });

        // Helper to determine week parity
        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        };

        const fetchTraineesAndAttendance = async () => {
            setIsFetching(true);
            try {
                // Fetch shifts
                const shiftsRef = collection(db, "artifacts", APP_ID, "public", "data", "shifts");
                const shiftsSnap = await getDocs(shiftsRef);
                const fetchedShifts = [];
                shiftsSnap.forEach(doc => fetchedShifts.push({ id: doc.id, ...doc.data() }));
                setShifts(fetchedShifts);

                // Fetch trainees assigned to logged-in user
                const traineesRef = collection(db, "artifacts", APP_ID, "public", "data", "trainees");
                const qTrainees = query(traineesRef, where("Level", "==", "BSTP"));
                const traineeSnap = await getDocs(qTrainees);
                const fetchedTrainees = [];

                let allActive = 0, allPre = 0, allPost = 0, allOther = 0;
                let allActiveReg = 0, allPreReg = 0, allPostReg = 0, allOtherReg = 0;
                let myActive = 0, myPre = 0, myPost = 0, myOther = 0;
                let myActiveReg = 0, myPreReg = 0, myPostReg = 0, myOtherReg = 0;

                traineeSnap.forEach(doc => {
                    const data = doc.data();
                    const statusRaw = String(data.status || data.Status || data.currentbstpStatus || '').toLowerCase().trim();
                    let status = "Other";
                    if (statusRaw === "active") status = "Active";
                    else if (statusRaw === "pre-bstp") status = "Pre-BSTP";
                    else if (statusRaw === "post-bstp") status = "Post-BSTP";

                    const isReg = !!data.isRegistered;
                    
                    const adviser = (data.adviser || data.Adviser || '').toLowerCase().trim();
                    const isMy = lfData.initials && adviser.includes(lfData.initials.toLowerCase().trim());
                    
                    if (status === "Active") {
                        allActive++;
                        if (isReg) allActiveReg++;
                        if (isMy) { myActive++; if (isReg) myActiveReg++; }
                    } else if (status === "Pre-BSTP") {
                        allPre++;
                        if (isReg) allPreReg++;
                        if (isMy) { myPre++; if (isReg) myPreReg++; }
                    } else if (status === "Post-BSTP") {
                        allPost++;
                        if (isReg) allPostReg++;
                        if (isMy) { myPost++; if (isReg) myPostReg++; }
                    } else {
                        allOther++;
                        if (isReg) allOtherReg++;
                        if (isMy) { myOther++; if (isReg) myOtherReg++; }
                    }

                    if (statusRaw !== 'loa' && data.isRegistered && isMy) {
                        fetchedTrainees.push(data);
                    }
                });

                setOverviewData({
                    all: {
                        active: allActive, activeReg: allActiveReg,
                        preBstp: allPre, preBstpReg: allPreReg,
                        postBstp: allPost, postBstpReg: allPostReg,
                        other: allOther, otherReg: allOtherReg,
                        total: allActive + allPre + allPost + allOther
                    },
                    my: {
                        active: myActive, activeReg: myActiveReg,
                        preBstp: myPre, preBstpReg: myPreReg,
                        postBstp: myPost, postBstpReg: myPostReg,
                        other: myOther, otherReg: myOtherReg,
                        total: myActive + myPre + myPost + myOther
                    }
                });
                setActiveTrainees(fetchedTrainees);

                // Fetch Attendance
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const todayIsoStart = today.toISOString();

                const qAtt = query(
                    collection(db, 'artifacts', APP_ID, 'public', 'data', 'bstpAttendance'),
                    where('timestamp', '>=', todayIsoStart)
                );
                
                const snap = await getDocs(qAtt);
                
                // Map logs by studentNo
                const logsByStudent = {};
                snap.forEach(doc => {
                    const d = doc.data();
                    if (!d.studentNo) return;
                    
                    if (!logsByStudent[d.studentNo]) {
                        logsByStudent[d.studentNo] = { inRecs: [], outRecs: [] };
                    }
                    
                    if (d.type === 'IN') {
                        logsByStudent[d.studentNo].inRecs.push(d);
                    } else if (d.type === 'OUT') {
                        logsByStudent[d.studentNo].outRecs.push(d);
                    }
                });
                
                setAttendanceData(logsByStudent);
                setLastUpdated(new Date());
                showMessage("Overview data refreshed successfully!");

            } catch (e) {
                console.error(e);
                showMessage("Error fetching data", "error");
            } finally {
                setIsFetching(false);
            }
        };

        // Auto-fetch on mount
        React.useEffect(() => {
            fetchTraineesAndAttendance();
        }, []);

        // Derived Statistics
        const stats = React.useMemo(() => {
            const groups = {
                'Currently Clocked In': [],
                'Completed Shift': [],
                'No Clock Ins': []
            };
            
            activeTrainees.forEach(t => {
                const studentNo = t.studentNo || t.studentId || t.idNumber || t.id_number || t.id;
                const stuLogs = attendanceData[studentNo];
                
                let groupKey = 'Unknown';
                if (groupBy === 'shift') groupKey = (t.shift || t.bstpshiftName || 'No Shift');
                else if (groupBy === 'adviser') groupKey = (t.adviser || 'No Adviser');
                else if (groupBy === 'section') groupKey = (t.section || t.Section || 'No Section');
                else if (groupBy === 'status') groupKey = (t.currentbstpStatus || t.Status || t.status || 'No Status');
                
                let status = 'No Clock Ins';
                let isLate = false;
                let isUndertime = false;
                let logToDisplay = null;

                if (stuLogs && stuLogs.inRecs.length > 0) {
                    // Sort by latest IN
                    stuLogs.inRecs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                    const latestIn = stuLogs.inRecs[0];
                    logToDisplay = { timeIn: latestIn.timestamp };
                    
                    let latestOut = null;
                    if (stuLogs.outRecs.length > 0) {
                        status = 'Completed Shift';
                        stuLogs.outRecs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                        latestOut = stuLogs.outRecs[0];
                        logToDisplay.timeOut = latestOut.timestamp;
                    } else {
                        status = 'Currently Clocked In';
                    }
                    
                    // Calculate if Late based on Shift
                    let targetShiftId = t.bstpshiftId;
                    if (!targetShiftId && t.shift && shifts.length > 0) {
                        const found = shifts.find(s => s.name === t.shift);
                        if (found) targetShiftId = found.id;
                    }
                    if (targetShiftId && shifts.length > 0) {
                        const shift = shifts.find(s => s.id === targetShiftId);
                        if (shift) {
                            const weekNum = getWeekNumber(new Date(latestIn.timestamp));
                            const isEvenWeek = weekNum % 2 === 0;
                            const startTimeStr = isEvenWeek ? shift.evenWeekStartTime : shift.oddWeekStartTime;
                            const endTimeStr = isEvenWeek ? shift.evenWeekEndTime : shift.oddWeekEndTime;
                            
                            if (startTimeStr) {
                                const [shiftHH, shiftMM] = startTimeStr.split(':').map(Number);
                                const inDate = new Date(latestIn.timestamp);
                                const shiftMins = (shiftHH * 60) + shiftMM;
                                const inMins = (inDate.getHours() * 60) + inDate.getMinutes();
                                if (inMins > shiftMins) isLate = true;
                            }
                            
                            if (endTimeStr && latestOut) {
                                const [shiftHH, shiftMM] = endTimeStr.split(':').map(Number);
                                const outDate = new Date(latestOut.timestamp);
                                const shiftMins = (shiftHH * 60) + shiftMM;
                                const outMins = (outDate.getHours() * 60) + outDate.getMinutes();
                                if (outMins < shiftMins) isUndertime = true;
                            }
                        }
                    }
                }

                const item = { ...t, log: logToDisplay, isLate, isUndertime, groupKey };
                groups[status].push(item);
            });

            return groups;
        }, [activeTrainees, attendanceData, groupBy, shifts]);

        // Chart Data Preparation
        const pieData = [
            { name: 'Clocked In', value: stats['Currently Clocked In'].length, color: '#3b82f6' },
            { name: 'Completed', value: stats['Completed Shift'].length, color: '#10b981' },
            { name: 'No Clock In', value: stats['No Clock Ins'].length, color: '#94a3b8' }
        ];

        const barDataMap = {};
        activeTrainees.forEach(t => {
            let groupKey = 'Unknown';
            if (groupBy === 'shift') groupKey = (t.shift || t.bstpshiftName || 'No Shift');
            else if (groupBy === 'adviser') groupKey = (t.adviser || 'No Adviser');
            else if (groupBy === 'section') groupKey = (t.section || t.Section || 'No Section');
            else if (groupBy === 'status') groupKey = (t.currentbstpStatus || t.Status || t.status || 'No Status');
            if (!barDataMap[groupKey]) {
                barDataMap[groupKey] = { name: groupKey, OnTime: 0, Late: 0, NoClockIn: 0, Total: 0 };
            }
            barDataMap[groupKey].Total++;
        });

        [...stats['Currently Clocked In'], ...stats['Completed Shift']].forEach(item => {
            if (item.isLate) barDataMap[item.groupKey].Late++;
            else barDataMap[item.groupKey].OnTime++;
        });
        
        stats['No Clock Ins'].forEach(item => {
            barDataMap[item.groupKey].NoClockIn++;
        });

        const barData = Object.values(barDataMap).map(d => {
            return {
                ...d,
                Rate: d.Total > 0 ? parseFloat(((d.OnTime / d.Total) * 100).toFixed(1)) : 0
            };
        });

        const renderBar = (data) => {
            if (data.total === 0) return <div className="text-slate-500 italic py-2">No data available</div>;

            const pActive = (data.active / data.total) * 100;
            const pPre = (data.preBstp / data.total) * 100;
            const pPost = (data.postBstp / data.total) * 100;
            const pOther = (data.other / data.total) * 100;

            const fmtPct = (pct) => pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);

            const activeRegPct = data.active > 0 ? fmtPct((data.activeReg / data.active) * 100) : 0;
            const preRegPct = data.preBstp > 0 ? fmtPct((data.preBstpReg / data.preBstp) * 100) : 0;
            const postRegPct = data.postBstp > 0 ? fmtPct((data.postBstpReg / data.postBstp) * 100) : 0;
            const otherRegPct = data.other > 0 ? fmtPct((data.otherReg / data.other) * 100) : 0;

            return (
                <div className="w-full mt-4">
                    <div className="flex w-full h-8 rounded-full overflow-hidden mb-3 shadow-inner bg-slate-100 dark:bg-slate-700">
                        {pActive > 0 && <div style={{ width: `${pActive}%` }} className="bg-blue-500 transition-all duration-500 flex items-center justify-center text-xs font-bold text-white overflow-hidden whitespace-nowrap" title={`Active: ${data.active} (Total: ${fmtPct(pActive)}%, Reg: ${activeRegPct}%)`}>{pActive > 5 ? `${data.active} (${fmtPct(pActive)}%)` : ''}</div>}
                        {pPre > 0 && <div style={{ width: `${pPre}%` }} className="bg-amber-500 transition-all duration-500 flex items-center justify-center text-xs font-bold text-white overflow-hidden whitespace-nowrap" title={`Pre-BSTP: ${data.preBstp} (Total: ${fmtPct(pPre)}%, Reg: ${preRegPct}%)`}>{pPre > 5 ? `${data.preBstp} (${fmtPct(pPre)}%)` : ''}</div>}
                        {pPost > 0 && <div style={{ width: `${pPost}%` }} className="bg-emerald-500 transition-all duration-500 flex items-center justify-center text-xs font-bold text-white overflow-hidden whitespace-nowrap" title={`Post-BSTP: ${data.postBstp} (Total: ${fmtPct(pPost)}%, Reg: ${postRegPct}%)`}>{pPost > 5 ? `${data.postBstp} (${fmtPct(pPost)}%)` : ''}</div>}
                        {pOther > 0 && <div style={{ width: `${pOther}%` }} className="bg-slate-400 transition-all duration-500 flex items-center justify-center text-xs font-bold text-white overflow-hidden whitespace-nowrap" title={`Other: ${data.other} (Total: ${fmtPct(pOther)}%, Reg: ${otherRegPct}%)`}>{pOther > 5 ? `${data.other} (${fmtPct(pOther)}%)` : ''}</div>}
                    </div>
                    <div className="flex flex-wrap gap-4 text-sm mt-4">
                        {pActive > 0 && <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-blue-500"></div><span className="font-medium text-slate-700 dark:text-slate-300">Active: {fmtPct(pActive)}% (Total: {data.active}, Reg: {activeRegPct}%)</span></div>}
                        {pPre > 0 && <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-amber-500"></div><span className="font-medium text-slate-700 dark:text-slate-300">Pre-BSTP: {fmtPct(pPre)}% (Total: {data.preBstp}, Reg: {preRegPct}%)</span></div>}
                        {pPost > 0 && <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-emerald-500"></div><span className="font-medium text-slate-700 dark:text-slate-300">Post-BSTP: {fmtPct(pPost)}% (Total: {data.postBstp}, Reg: {postRegPct}%)</span></div>}
                        {pOther > 0 && <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-slate-400"></div><span className="font-medium text-slate-700 dark:text-slate-300">Other: {fmtPct(pOther)}% (Total: {data.other}, Reg: {otherRegPct}%)</span></div>}
                    </div>
                </div>
            );
        };

        return (
            <div className="max-w-7xl mx-auto space-y-6">
                
                {/* Stats Summary Cards */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                        <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-2 flex items-center justify-between">
                            System Overview
                            {isFetching && <Lucide.Loader2 size={16} className="animate-spin text-blue-500" />}
                        </h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mb-2">Unified overview of all {overviewData.all.total} BSTP trainees across the system.</p>
                        {renderBar(overviewData.all)}
                    </div>
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                        <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-2 flex items-center justify-between">
                            My Trainees Overview
                            {isFetching && <Lucide.Loader2 size={16} className="animate-spin text-blue-500" />}
                        </h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mb-2">Overview of {overviewData.my.total} trainees assigned to your advisory class ({lfData.initials}).</p>
                        {renderBar(overviewData.my)}
                    </div>
                </div>

                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <div>
                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 flex items-center gap-2">
                            <Lucide.Users className="text-blue-500" /> My Trainees Attendance Overview
                        </h2>
                        <p className="text-sm text-slate-500 mt-1">
                            Monitoring {activeTrainees.length} registered active trainees. 
                            {lastUpdated && <span className="ml-2 inline-flex items-center gap-1"><Lucide.Clock size={12}/> Last updated: {lastUpdated.toLocaleTimeString()}</span>}
                        </p>
                    </div>
                    <div className="flex items-center gap-3 w-full sm:w-auto">
                        <select 
                            value={groupBy} 
                            onChange={e => setGroupBy(e.target.value)}
                            className="bg-slate-100 dark:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-300 rounded-lg px-3 py-2 border-none focus:ring-2 focus:ring-blue-500 outline-none"
                        >
                            <option value="shift">Group by Shift</option>
                            <option value="section">Group by Section</option>
                            <option value="status">Group by Status</option>
                        </select>
                        <button 
                            onClick={fetchTraineesAndAttendance}
                            disabled={isFetching}
                            className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors flex items-center gap-2 whitespace-nowrap shadow-sm"
                        >
                            <Lucide.RefreshCw size={16} className={isFetching ? "animate-spin" : ""} /> Refresh
                        </button>
                    </div>
                </div>

                {Recharts && (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col items-center">
                            <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Overall Status</h3>
                            <div className="w-full h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={pieData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                            {pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                        </Pie>
                                        <RechartsTooltip />
                                        <Legend />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
                            <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Attendance by {groupBy.charAt(0).toUpperCase() + groupBy.slice(1)}</h3>
                            <div className="w-full h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={barData} margin={{ top: 20, right: 30, left: 0, bottom: 5 }}>
                                        <CartesianGrid strokeDasharray="3 3" opacity={0.2} />
                                        <XAxis dataKey="name" tick={{fontSize: 12}} />
                                        <YAxis yAxisId="left" tick={{fontSize: 12}} allowDecimals={false} />
                                        <YAxis yAxisId="right" orientation="right" tick={{fontSize: 12}} domain={[0, 100]} />
                                        <RechartsTooltip cursor={{fill: 'transparent'}} />
                                        <Legend />
                                        <Bar yAxisId="left" dataKey="OnTime" name="Clocked In On Time" stackId="a" fill="#10b981" radius={[0, 0, 4, 4]} />
                                        <Bar yAxisId="left" dataKey="Late" name="Late" stackId="a" fill="#ef4444" radius={[0, 0, 0, 0]} />
                                        <Bar yAxisId="left" dataKey="NoClockIn" name="No Clock In" stackId="a" fill="#94a3b8" radius={[4, 4, 0, 0]} />
                                        <Line yAxisId="right" type="monotone" dataKey="Rate" name="Attendance Rate %" stroke="#3b82f6" strokeWidth={3} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                )}
                
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <StatusColumn title="Currently Clocked In" color="blue" items={stats['Currently Clocked In']} groupBy={groupBy} />
                    <StatusColumn title="Completed Shift" color="emerald" items={stats['Completed Shift']} groupBy={groupBy} />
                    <StatusColumn title="No Clock Ins" color="slate" items={stats['No Clock Ins']} groupBy={groupBy} />
                </div>
            </div>
        );
    }

    function AdvisoryClassTab({ lfData, showMessage }) {
      const formatLogTime = (ts) => {
        if (!ts) return "-";
        try {
          const d = ts?.toDate ? ts.toDate() : new Date(ts);
          if (isNaN(d.getTime())) return String(ts);
          return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        } catch (e) {
          return "-";
        }
      };

      const formatLogDate = (dStr) => {
        if (!dStr) return "-";
        try {
          const parts = String(dStr).split("T")[0].split("-");
          if (parts.length === 3) {
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", weekday: "short" });
          }
          return dStr;
        } catch (e) {
          return dStr;
        }
      };

      const [trainees, setTrainees] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingMessage, setLoadingMessage] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all"); // 'all', 'active', 'inactive'
      const [regFilter, setRegFilter] = useState("all"); // 'all', 'registered', 'unregistered'
      const [absenceFilter, setAbsenceFilter] = useState("all"); // 'all', 'gt5'
      const [attendanceDetailTab, setAttendanceDetailTab] = useState(null); // 'present' | 'absences' | 'late' | null
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [selectedProfile, setSelectedProfile] = useState(null);
      const [profileLoading, setProfileLoading] = useState(false);
      const [copiedField, setCopiedField] = useState(null);
      const [sortConfig, setSortConfig] = useState({
        key: "idNumber",
        direction: "asc",
      });

      useEffect(() => {
        // Automatically purge any stale advisory caches so live data is always shown
        try {
          Object.keys(localStorage).forEach((k) => {
            if (k.startsWith("lfportal_advisory_cache")) {
              localStorage.removeItem(k);
            }
          });
        } catch (e) {}

        const fetchAdvisoryData = async (forceRefresh = false) => {
          // Always fetch live data from Firestore directly on every view

          setLoading(true);
          setLoadingProgress(10);
          setLoadingMessage("Fetching global holidays...");
          try {
            // 1. Fetch holidays
            const holidaysDoc = await getDoc(
              doc(
                db,
                "artifacts",
                APP_ID,
                "public",
                "data",
                "settings",
                "globalHolidays",
              ),
            );
            const globalHolidays =
              holidaysDoc.exists() && holidaysDoc.data().holidays
                ? holidaysDoc.data().holidays
                : [];

            setLoadingProgress(20);
            setLoadingMessage("Fetching assigned trainees...");

            // 2. Fetch all BSTP trainees
            const traineesRef = collection(
              db,
              "artifacts",
              APP_ID,
              "public",
              "data",
              "trainees",
            );
            const qTrainees = query(
              traineesRef,
              where("Level", "==", "BSTP"),
            );
            const traineesSnap = await getDocs(qTrainees);

            let assignedTrainees = [];
            traineesSnap.forEach((d) => {
              const data = d.data();
              const level = (data.Level || data.level || "").toLowerCase();
              if (level === "astp") return; // Exclude ASTP level trainees

              const adviser = (
                data.adviser ||
                data.Adviser ||
                ""
              ).toLowerCase();
              if (
                lfData.initials &&
                adviser.includes(lfData.initials.toLowerCase())
              ) {
                assignedTrainees.push({ id: d.id, ...data });
              }
            });

            // 3. Pre-fetch registered contact profiles from trainee-portal
            setLoadingProgress(35);
            setLoadingMessage("Resolving portal contact profiles...");
            const profileMap = new Map();
            try {
              const profilesSnap = await getDocs(
                query(collectionGroup(db, "profile"), where("role", "==", "trainee"))
              );
              profilesSnap.forEach((pDoc) => {
                const pData = pDoc.data();
                const sId = String(pData.studentId || pData["Student ID#"] || "").trim();
                const em = String(pData.email || "").trim().toLowerCase();
                if (sId) profileMap.set(sId, pData);
                if (em) profileMap.set(em, pData);
              });
            } catch (profErr) {
              console.warn("Pre-fetching profiles failed, will fallback on click:", profErr);
            }

            // 4. Helper to calculate valid working days (excluding weekends and holidays)
            const calculateWorkingDays = (startDateStr, holidaysList = globalHolidays) => {
              if (!startDateStr) return { count: 0, dates: [] };
              let start;
              if (typeof startDateStr === "string" && startDateStr.includes("-")) {
                const p = startDateStr.split("T")[0].split("-");
                start = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]), 0, 0, 0, 0);
              } else {
                start = new Date(startDateStr);
                start.setHours(0, 0, 0, 0);
              }
              const end = new Date();
              end.setHours(0, 0, 0, 0);
              if (isNaN(start.getTime())) return { count: 0, dates: [] };

              let workingDays = 0;
              let workingDates = [];
              let current = new Date(start);

              const holidayDates = (holidaysList || []).map((h) => h.date);

              while (current <= end) {
                const dayOfWeek = current.getDay();
                const year = current.getFullYear();
                const month = String(current.getMonth() + 1).padStart(2, "0");
                const day = String(current.getDate()).padStart(2, "0");
                const dateStr = `${year}-${month}-${day}`;

                // 0 is Sunday, 6 is Saturday
                if (
                  dayOfWeek !== 0 &&
                  dayOfWeek !== 6 &&
                  !holidayDates.includes(dateStr)
                ) {
                  workingDays++;
                  workingDates.push(dateStr);
                }
                current.setDate(current.getDate() + 1);
              }
              return { count: workingDays, dates: workingDates };
            };

            setLoadingProgress(50);
            setLoadingMessage("Fetching attendance records...");

            // 5. Fetch attendance summaries in chunks
            const studentIds = assignedTrainees
              .map((t) => t.idNumber || t.id_number || t.id)
              .filter(Boolean);
            const summaryMap = new Map();

            if (studentIds.length > 0) {
              const chunkSize = 10;
              const totalChunks = Math.ceil(studentIds.length / chunkSize);
              for (let i = 0; i < studentIds.length; i += chunkSize) {
                const chunkIndex = i / chunkSize;
                const progress = 50 + Math.round((chunkIndex / totalChunks) * 40);
                setLoadingProgress(progress);
                setLoadingMessage(`Fetching attendance records (batch ${chunkIndex + 1}/${totalChunks})...`);

                const chunk = studentIds.slice(i, i + chunkSize);
                const qSum = query(
                  collection(
                    db,
                    "artifacts",
                    APP_ID,
                    "public",
                    "data",
                    "bstpAttendanceSummary",
                  ),
                  where("studentNo", "in", chunk),
                );
                const sumSnap = await getDocs(qSum);
                sumSnap.forEach((d) => {
                  const data = d.data();
                  if (!summaryMap.has(data.studentNo)) {
                    summaryMap.set(data.studentNo, []);
                  }
                  summaryMap.get(data.studentNo).push(data);
                });
              }
            }

            setLoadingProgress(95);
            setLoadingMessage("Processing metrics and contacts...");

            // 6. Compute metrics and attach profile contact information
            const enrichedTrainees = assignedTrainees.map((t) => {
              const sId = String(t.idNumber || t.id_number || t.id || t.studentId || "").trim();
              const summaries = summaryMap.get(sId) || [];
              const rawProfile = profileMap.get(sId) || (t.email ? profileMap.get(t.email.toLowerCase()) : null) || null;

              // Strictly resolve registration status:
              // Must be explicitly true or have valid registeredAt, and NOT deleted
              let isReg = false;
              if (t.isRegistered === false || t.accountDeletedAt) {
                isReg = false;
              } else if (t.isRegistered === true || t.isRegistered === "true") {
                isReg = true;
              } else if (t.registeredAt && !t.accountDeletedAt) {
                isReg = true;
              } else {
                isReg = false;
              }

              const regProfile = isReg ? rawProfile : null;

              let initialRegDate = null;
              if (isReg) {
                if (t.registeredAt) {
                  initialRegDate = t.registeredAt?.toDate ? t.registeredAt.toDate() : new Date(t.registeredAt);
                } else if (t.initialRegisteredAt) {
                  initialRegDate = t.initialRegisteredAt?.toDate ? t.initialRegisteredAt.toDate() : new Date(t.initialRegisteredAt);
                } else if (regProfile?.createdAt) {
                  initialRegDate = regProfile.createdAt?.toDate ? regProfile.createdAt.toDate() : new Date(regProfile.createdAt);
                }
              }

              let regDateStr = null;
              let normalizedRegDate = null;
              if (initialRegDate && !isNaN(initialRegDate.getTime())) {
                regDateStr = initialRegDate.toISOString().split("T")[0];
                normalizedRegDate = new Date(initialRegDate);
                normalizedRegDate.setHours(0, 0, 0, 0);
              }

              const workingInfo = (isReg && regDateStr) ? calculateWorkingDays(regDateStr) : { count: 0, dates: [] };
              const workingDays = workingInfo.count;
              const allWorkingDates = workingInfo.dates;

              let presentCount = 0;
              let lateCount = 0;
              const presentRecords = [];
              const lateRecords = [];
              const presentDateSet = new Set();

              summaries.forEach((s) => {
                let sDate = null;
                let sDateStr = null;
                if (s.date) {
                  sDate = new Date(s.date);
                  sDateStr = typeof s.date === "string" ? s.date.split("T")[0] : sDate.toISOString().split("T")[0];
                } else if (s.timestamp) {
                  sDate = s.timestamp?.toDate ? s.timestamp.toDate() : new Date(s.timestamp);
                  sDateStr = sDate.toISOString().split("T")[0];
                }

                if (sDate) {
                  sDate.setHours(0, 0, 0, 0);
                }

                if (sDate && normalizedRegDate && sDate.getTime() >= normalizedRegDate.getTime()) {
                  if (s.firstIn && s.lastOut) {
                    if (sDateStr && !presentDateSet.has(sDateStr)) {
                      presentCount++;
                      presentDateSet.add(sDateStr);
                      presentRecords.push({
                        date: sDateStr,
                        firstIn: s.firstIn || "-",
                        lastOut: s.lastOut || "-",
                        minutesLate: s.minutesLate || 0,
                      });
                    }
                  }
                  if (s.minutesLate && s.minutesLate > 0) {
                    lateCount++;
                    lateRecords.push({
                      date: sDateStr || "Unknown Date",
                      firstIn: s.firstIn || "-",
                      lastOut: s.lastOut || "-",
                      minutesLate: s.minutesLate,
                    });
                  }
                }
              });

              // Absences: working dates since registration without a valid present record
              const absenceRecords = [];
              if (isReg) {
                allWorkingDates.forEach((wDate) => {
                  if (!presentDateSet.has(wDate)) {
                    absenceRecords.push({
                      date: wDate,
                      day: new Date(wDate).toLocaleDateString("en-US", { weekday: "short" })
                    });
                  }
                });
              }

              // Sort records descending by date (most recent first)
              presentRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
              lateRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
              absenceRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

              let absencesCount = isReg ? absenceRecords.length : 0;

              let dateRegDisplay = "-";
              if (isReg) {
                dateRegDisplay = initialRegDate
                  ? initialRegDate.toLocaleDateString()
                  : "Yes";
              }

              const bstpStatus = t.currentbstpStatus || t.Status || t.status || "Active";

              return {
                ...t,
                isRegistered: isReg,
                registeredProfile: regProfile,
                portalPhone: isReg ? (regProfile?.phone || t.phone || t.contactNumber || null) : null,
                portalMessenger: isReg ? (regProfile?.messenger || t.messenger || null) : null,
                portalContactPerson: isReg ? (regProfile?.contactPerson || t.contactPerson || null) : null,
                portalContactPersonNo: isReg ? (regProfile?.contactPersonNo || t.contactPersonNo || null) : null,
                portalEmail: isReg ? (regProfile?.email || t.email || null) : null,
                portalDeviceId: isReg ? (regProfile?.deviceId || null) : null,
                portalBioEnrolled: isReg ? !!regProfile?.biometricCredentialId : false,
                portalFallbackPin: isReg ? (regProfile?.fallbackPin || null) : null,
                computedRegDate: dateRegDisplay,
                computedPresent: presentCount,
                computedAbsences: absencesCount,
                computedLate: lateCount,
                computedStatus: bstpStatus,
                presentRecords: presentRecords,
                absenceRecords: absenceRecords,
                lateRecords: lateRecords,
              };
            });

            setTrainees(enrichedTrainees);
            // Live data directly managed in state
          } catch (error) {
            console.error("Error fetching advisory data:", error);
            showMessage("Failed to load advisory class data.", "error");
          } finally {
            setLoading(false);
          }
        };

        fetchAdvisoryData();
        const handleRefresh = () => fetchAdvisoryData(true);
        window.addEventListener("lfportal_refresh", handleRefresh);
        return () => window.removeEventListener("lfportal_refresh", handleRefresh);
      }, [lfData, showMessage]);

      const handleOpenProfile = async (trainee) => {
        setAttendanceDetailTab(null);
        setSelectedProfile(trainee);

        const sid = String(trainee.idNumber || trainee.id_number || trainee.id || trainee.studentId || "").trim();
        const isCurrentlyRegistered = trainee.isRegistered !== false && !trainee.accountDeletedAt;
        const needsProfile = isCurrentlyRegistered && !trainee.registeredProfile;
        const needsAttendance = !trainee.presentRecords || !trainee.absenceRecords;

        if (needsProfile || needsAttendance) {
          setProfileLoading(true);
          try {
            let updatedFields = {};

            // 1. Fetch profile contact details if missing
            if (needsProfile && sid) {
              const q = query(collectionGroup(db, "profile"), where("studentId", "==", sid));
              const snap = await getDocs(q);
              if (!snap.empty) {
                const pData = snap.docs[0].data();
                updatedFields = {
                  registeredProfile: pData,
                  portalPhone: pData.phone || trainee.portalPhone,
                  portalMessenger: pData.messenger || trainee.portalMessenger,
                  portalContactPerson: pData.contactPerson || trainee.portalContactPerson,
                  portalContactPersonNo: pData.contactPersonNo || trainee.portalContactPersonNo,
                  portalEmail: pData.email || trainee.portalEmail,
                  portalDeviceId: pData.deviceId || trainee.portalDeviceId,
                  portalBioEnrolled: !!pData.biometricCredentialId,
                  portalFallbackPin: pData.fallbackPin || trainee.portalFallbackPin,
                };
              }
            }

            // 2. Fetch fresh attendance summaries if missing records
            if (needsAttendance && sid) {
              const qSum = query(
                collection(db, "artifacts", APP_ID, "public", "data", "bstpAttendanceSummary"),
                where("studentNo", "==", sid)
              );
              const sumSnap = await getDocs(qSum);
              const summaries = [];
              sumSnap.forEach((d) => summaries.push(d.data()));

              let isReg = false;
              if (trainee.isRegistered === false || trainee.accountDeletedAt) {
                isReg = false;
              } else if (trainee.isRegistered === true || trainee.isRegistered === "true") {
                isReg = true;
              } else if (trainee.registeredAt && !trainee.accountDeletedAt) {
                isReg = true;
              } else {
                isReg = false;
              }

              let initialRegDate = null;
              if (isReg) {
                if (trainee.registeredAt) {
                  initialRegDate = trainee.registeredAt?.toDate ? trainee.registeredAt.toDate() : new Date(trainee.registeredAt);
                } else if (trainee.initialRegisteredAt) {
                  initialRegDate = trainee.initialRegisteredAt?.toDate ? trainee.initialRegisteredAt.toDate() : new Date(trainee.initialRegisteredAt);
                } else if (updatedFields.registeredProfile?.createdAt) {
                  initialRegDate = updatedFields.registeredProfile.createdAt?.toDate ? updatedFields.registeredProfile.createdAt.toDate() : new Date(updatedFields.registeredProfile.createdAt);
                }
              }

              let regDateStr = null;
              let normalizedRegDate = null;
              if (initialRegDate && !isNaN(initialRegDate.getTime())) {
                regDateStr = initialRegDate.toISOString().split("T")[0];
                normalizedRegDate = new Date(initialRegDate);
                normalizedRegDate.setHours(0, 0, 0, 0);
              }
              const workingInfo = (isReg && regDateStr) ? calculateWorkingDays(regDateStr) : { count: 0, dates: [] };
              const allWorkingDates = workingInfo.dates;

              let presentCount = 0;
              let lateCount = 0;
              const presentRecords = [];
              const lateRecords = [];
              const presentDateSet = new Set();

              summaries.forEach((s) => {
                let sDateStr = s.date || (s.timestamp ? (s.timestamp?.toDate ? s.timestamp.toDate() : new Date(s.timestamp)).toISOString().split("T")[0] : null);
                let sDate = sDateStr ? new Date(sDateStr + "T00:00:00") : null;

                if (sDate && normalizedRegDate && sDate.getTime() >= normalizedRegDate.getTime()) {
                  if (s.firstIn && s.lastOut) {
                    if (sDateStr && !presentDateSet.has(sDateStr)) {
                      presentCount++;
                      presentDateSet.add(sDateStr);
                      presentRecords.push({
                        date: sDateStr,
                        firstIn: s.firstIn || "-",
                        lastOut: s.lastOut || "-",
                        minutesLate: s.minutesLate || 0,
                      });
                    }
                  }
                  if (s.minutesLate && s.minutesLate > 0) {
                    lateCount++;
                    lateRecords.push({
                      date: sDateStr || "Unknown Date",
                      firstIn: s.firstIn || "-",
                      lastOut: s.lastOut || "-",
                      minutesLate: s.minutesLate,
                    });
                  }
                }
              });

              const absenceRecords = [];
              if (isReg) {
                allWorkingDates.forEach((wDate) => {
                  if (!presentDateSet.has(wDate)) {
                    absenceRecords.push({
                      date: wDate,
                      day: new Date(wDate).toLocaleDateString("en-US", { weekday: "short" })
                    });
                  }
                });
              }

              presentRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
              lateRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
              absenceRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

              updatedFields = {
                ...updatedFields,
                computedPresent: presentCount,
                computedAbsences: isReg ? absenceRecords.length : 0,
                computedLate: lateCount,
                presentRecords,
                absenceRecords,
                lateRecords,
              };

              // Update trainees state so it's cached in memory
              setTrainees((prev) =>
                prev.map((t) => (t.id === trainee.id ? { ...t, ...updatedFields } : t))
              );
            }

            setSelectedProfile((prev) => ({
              ...prev,
              ...updatedFields,
            }));
          } catch (e) {
            console.warn("On-demand profile/attendance load error:", e);
          } finally {
            setProfileLoading(false);
          }
        }
      };

      const copyToClipboard = (text, fieldName) => {
        if (!text) return;
        navigator.clipboard.writeText(text);
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(null), 2000);
      };

      const deleteTraineeAccount = async (trainee) => {
        if (
          !window.confirm(
            `Are you sure you want to delete / reset the trainee portal account for ${trainee.firstName || trainee.Given} ${trainee.lastName || trainee.Family}? This will mark them as unregistered so they can re-register. Their attendance history will NOT be deleted.`,
          )
        )
          return;

        const targetEmail = (trainee.portalEmail || trainee.email || "").trim();
        const sid = String(trainee.idNumber || trainee.id_number || trainee.id || trainee.studentId || "").trim();

        try {
          // 1. Attempt to delete Firebase Auth user if email exists
          if (targetEmail) {
            try {
              const deleteFn = httpsCallable(functions, "deleteUserAuth");
              await deleteFn({ email: targetEmail });
            } catch (authErr) {
              console.warn("Auth delete note (proceeding with database reset):", authErr);
              // If user is already removed from Firebase Auth or not found, proceed smoothly
            }
          }

          // 2. Update trainee document in public data - ALWAYS EXECUTES!
          await updateDoc(
            doc(
              db,
              "artifacts",
              APP_ID,
              "public",
              "data",
              "trainees",
              trainee.id,
            ),
            {
              isRegistered: false,
              registeredAt: null,
              initialRegisteredAt: null,
              accountDeletedAt: serverTimestamp(),
            },
          );

          // 3. Remove or invalidate any existing Firestore profile documents
          try {
            const profQuery = sid
              ? query(collectionGroup(db, "profile"), where("studentId", "==", sid))
              : (targetEmail ? query(collectionGroup(db, "profile"), where("email", "==", targetEmail.toLowerCase())) : null);
            if (profQuery) {
              const profSnap = await getDocs(profQuery);
              const delOps = [];
              profSnap.forEach((pDoc) => {
                delOps.push(deleteDoc(pDoc.ref));
              });
              if (delOps.length > 0) {
                await Promise.all(delOps);
              }
            }
          } catch (profErr) {
            console.warn("Could not remove Firestore profile doc:", profErr);
          }

          showMessage(
            `Successfully reset registration status for ${trainee.firstName || trainee.Given} ${trainee.lastName || trainee.Family}. Marked as Unregistered.`,
            "success",
          );

          // 4. Update in-memory state immediately
          setTrainees((prev) =>
            prev.map((t) =>
              t.id === trainee.id
                ? {
                    ...t,
                    isRegistered: false,
                    registeredAt: null,
                    initialRegisteredAt: null,
                    accountDeletedAt: new Date().toISOString(),
                    computedRegDate: "-",
                    registeredProfile: null,
                    computedAbsences: 0,
                    absenceRecords: [],
                    portalPhone: null,
                    portalMessenger: null,
                    portalContactPerson: null,
                    portalContactPersonNo: null,
                    portalEmail: null,
                    portalDeviceId: null,
                    portalBioEnrolled: false,
                    portalFallbackPin: null,
                  }
                : t
            )
          );

          if (selectedProfile && selectedProfile.id === trainee.id) {
            setSelectedProfile(null);
          }
        } catch (error) {
          console.error("Error resetting trainee registration:", error);
          showMessage(
            error.message || "Failed to reset trainee registration.",
            "error",
          );
        }
      };

      const handleSort = (key) => {
        let direction = "asc";
        if (sortConfig.key === key && sortConfig.direction === "asc") {
          direction = "desc";
        }
        setSortConfig({ key, direction });
      };

      // Summary Stats
      const activeCount = trainees.filter((t) => (t.computedStatus || "").toLowerCase() === "active").length;
      const registeredCount = trainees.filter((t) => t.isRegistered).length;
      const highAbsenceTrainees = trainees.filter((t) => t.isRegistered && (t.computedAbsences || 0) > 5);
      const highAbsenceCount = highAbsenceTrainees.length;
      const totalPresents = trainees.reduce((acc, t) => acc + (t.computedPresent || 0), 0);

      const filteredTrainees = trainees.filter((t) => {
        // Status filter
        if (statusFilter === "active") {
          if ((t.computedStatus || "").toLowerCase() !== "active") return false;
        } else if (statusFilter === "inactive") {
          if ((t.computedStatus || "").toLowerCase() === "active") return false;
        }

        // Registration filter
        if (regFilter === "registered" && !t.isRegistered) return false;
        if (regFilter === "unregistered" && t.isRegistered) return false;

        // Absence filter (> 5 absences since trainee-portal registration)
        if (absenceFilter === "gt5") {
          if (!t.isRegistered || (t.computedAbsences || 0) <= 5) return false;
        }

        // Search query
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const name = `${t.firstName || t.Given || ""} ${t.lastName || t.Family || ""}`.toLowerCase();
        const studentNo = String(t.idNumber || t.id_number || t.id || t.studentId || "").toLowerCase();
        const section = String(t.section || t.Section || "").toLowerCase();
        const email = String(t.portalEmail || t.email || "").toLowerCase();
        const phone = String(t.portalPhone || "").toLowerCase();
        return name.includes(q) || studentNo.includes(q) || section.includes(q) || email.includes(q) || phone.includes(q);

          sortConfig.key === "computedPresent" ||

          if (numA > numB) return sortConfig.direction === "asc" ? 1 : -1;
          return 0;
        }

        if (sortConfig.key === "isRegistered") {
          const rA = a.isRegistered ? 1 : 0;
          const rB = b.isRegistered ? 1 : 0;
          if (rA < rB) return sortConfig.direction === "asc" ? -1 : 1;
          if (rA > rB) return sortConfig.direction === "asc" ? 1 : -1;
          return 0;
        }

        if (typeof valA === "string") valA = valA.toLowerCase();
        if (typeof valB === "string") valB = valB.toLowerCase();

        if (valA < valB) return sortConfig.direction === "asc" ? -1 : 1;
        if (valA > valB) return sortConfig.direction === "asc" ? 1 : -1;
        return 0;

                {/* Modal Footer */}

                      onClick={() => deleteTraineeAccount(selectedProfile)}
                      className="text-xs font-bold text-rose-600 hover:text-rose-700 dark:text-rose-400 flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"

                  <button

          {/* Photo Popup Modal */}
          {selectedPhoto && (

              <div
                className="bg-white dark:bg-slate-900 p-2 rounded-2xl shadow-2xl relative animate-in zoom-in-95 duration-200"
                onClick={(e) => e.stopPropagation()}

                <button
                  onClick={() => setSelectedPhoto(null)}
                  className="absolute -top-4 -right-4 bg-white dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white rounded-full p-2 shadow-lg border border-slate-200 dark:border-slate-700 transition-colors"
                >
                  <X size={20} />
                </button>
                <img
                  src={selectedPhoto}
                  alt="Trainee Profile Enlarged"
                  className="max-w-xs md:max-w-md max-h-[80vh] rounded-xl object-contain"
                  referrerPolicy="no-referrer"
