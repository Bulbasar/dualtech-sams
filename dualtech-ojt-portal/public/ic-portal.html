                                                                    {(() => { const v = t.schoolingDay || t['Schooling Day']; return (v && v !== '-') ? v : 'Saturday'; })()}
                                                                </button>
                                                            </td>}
                                                            {visibleColumns.has('restDay') && <td className="py-3 px-4 text-center">
                                                                <button onClick={() => setSelectedDayTrainee({ trainee: t, type: 'rest' })} className="text-xs font-semibold text-slate-600 hover:text-primary-600 hover:bg-slate-100 px-2 py-1 rounded transition-colors border border-transparent hover:border-slate-200">
                                                                    {(() => { const v = t.restDay || t['Rest Day']; return (v && v !== '-') ? v : 'Sunday'; })()}
                                                                </button>
                                                            </td>}
                                                            <td className="py-3 px-4 text-right">
                                                                <div className="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                    <button onClick={() => setSelectedProfile(t)} title="View Profile" className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors"><User size={16} /></button>
                                                                    <button onClick={() => setActiveNoteTrainee(t)} title="Add Notes" className="p-1.5 text-slate-400 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-amber-900/30 rounded-lg transition-colors"><ClipboardList size={16} /></button>
                                                                    <button onClick={() => setActiveHistoryTrainee(t)} title="Coaching/Meeting History" className="p-1.5 text-slate-400 hover:text-violet-600 hover:bg-violet-50 dark:hover:bg-violet-900/30 rounded-lg transition-colors"><History size={16} /></button>
                                                                    <button onClick={() => onNavigate('company_attendance', t.studentId)} title="Company Attendance" className="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 rounded-lg transition-colors"><ListChecks size={16} /></button>
                                                                    <button onClick={() => onNavigate('schooling_attendance', t.studentId)} title="Schooling Attendance" className="p-1.5 text-slate-400 hover:text-violet-600 hover:bg-violet-50 dark:hover:bg-violet-900/30 rounded-lg transition-colors"><BookOpen size={16} /></button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* MyTraineesTab Pagination */}
                                {sortedAndFiltered.length > 0 && (
                                    <div className="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/80 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <div className="flex items-center gap-3 text-sm text-slate-500 dark:text-slate-400">
                                            <span className="font-medium">Rows per page:</span>
                                            <select
                                                value={rowsPerPage}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setRowsPerPage(val === 'All' ? 'All' : Number(val));
                                                    setCurrentPage(1);
                                                }}
                                                className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md py-1 px-2 focus:ring-2 focus:ring-primary-500 outline-none text-slate-700 dark:text-slate-300 font-medium"
                                            >
                                                <option value={20}>20</option>
                                                <option value={50}>50</option>
                                                <option value={100}>100</option>
                                                <option value="All">All</option>
                                            </select>
                                            <span className="hidden sm:inline text-slate-400">|</span>
                                            <span className="hidden sm:inline">
                                                {indexOfFirstRow + 1}-{Math.min(rowsPerPage === 'All' ? totalItems : indexOfLastRow, totalItems)} of {totalItems}
                                            </span>
                                        </div>

                                        <div className="flex items-center gap-3">
                                            <button
                                                disabled={currentPage === 1}
                                                onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                                className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-50 disabled:hover:bg-transparent transition-colors shadow-sm"
                                            >
                                                <ChevronLeft size={18} />
                                            </button>
                                            <span className="text-sm font-bold text-slate-700 dark:text-slate-300 min-w-[5rem] text-center">
                                                Page {currentPage} of {totalPages || 1}
                                            </span>
                                            <button
                                                disabled={currentPage >= totalPages || totalPages === 0}
                                                onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                                className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-50 disabled:hover:bg-transparent transition-colors shadow-sm"
                                            >
                                                <ChevronRight size={18} />
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>


                    {viewMode === 'trainees' && selectedTrainees.size > 0 && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-slate-900 dark:bg-slate-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-6 animate-in slide-in-from-bottom-10 fade-in border border-slate-700">
                            <div className="flex items-center gap-3">
                                <div className="bg-primary-500/20 text-primary-400 p-2 rounded-lg">
                                    <Users size={20} />
                                </div>
                                <div>
                                    <p className="font-bold text-lg leading-tight">{selectedTrainees.size} Selected</p>
                                    <p className="text-xs text-slate-400">Ready for bulk actions</p>
                                </div>
                            </div>
                            <div className="h-10 w-px bg-slate-700"></div>
                            <button
                                onClick={() => setShowBulkMeetingModal(true)}
                                className="bg-primary-600 hover:bg-primary-500 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-primary-600/30 flex items-center gap-2"
                            >
                                <MessageCircle size={18} /> Record Meeting
                            </button>
                        </div>
                    )}
                    {selectedProfile && <TraineeProfileModal currentUser={currentUser} trainee={selectedProfile} onClose={() => setSelectedProfile(null)} />}
                    {showBulkMeetingModal && <BulkMeetingModal currentUser={currentUser} selectedIds={selectedTrainees} allTrainees={trainees} onClose={() => setShowBulkMeetingModal(false)} onSaveComplete={() => setSelectedTrainees(new Set())} />}
                    {activeNoteTrainee && <AddNotesModal currentUser={currentUser} trainee={activeNoteTrainee} onClose={() => setActiveNoteTrainee(null)} onUpdateTrainee={(newNotes) => {
                        setTrainees(trainees.map(tr => tr.docId === activeNoteTrainee.docId ? { ...tr, notes: newNotes } : tr));
                    }} />}
                    {activeHistoryTrainee && <CoachingHistoryModal trainee={activeHistoryTrainee} onClose={() => setActiveHistoryTrainee(null)} />}
                    {selectedMeritTrainee && <TraineeMeritModal currentUser={currentUser} trainee={selectedMeritTrainee} onClose={() => setSelectedMeritTrainee(null)} onUpdateTotal={(newTotal, newHistory) => {
                        setTrainees(trainees.map(tr => tr.docId === selectedMeritTrainee.docId ? { ...tr, meritPoints: newTotal, meritHistory: newHistory } : tr));
                        setSelectedMeritTrainee({ ...selectedMeritTrainee, meritPoints: newTotal, meritHistory: newHistory });
                    }} />}
                    {selectedDayTrainee && <UpdateTraineeDaysModal trainee={selectedDayTrainee.trainee} type={selectedDayTrainee.type} onClose={() => setSelectedDayTrainee(null)} onUpdate={(field, val) => {
                        setTrainees(trainees.map(tr => tr.docId === selectedDayTrainee.trainee.docId ? { ...tr, [field]: val } : tr));
                    }} />}
                </div>
            );
        }

        function MessageBubble({ currentUser }) {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [selectedReceiver, setSelectedReceiver] = useState(null);
            const [receiverOptions, setReceiverOptions] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [showActiveOnly, setShowActiveOnly] = useState(true);
            const [unreadCount, setUnreadCount] = useState(0);
            const messagesEndRef = useRef(null);
            const [selectedMsgs, setSelectedMsgs] = useState(new Set());

            const myId = currentUser.assignedIC || currentUser.name || currentUser.firstName || currentUser.email;

            const messagesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages');

            useEffect(() => {
                if (!isOpen) return;
                const loadOptions = async () => {
                    const qTrainees = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainees'), where('assignedIC', '==', myId));
                    const snap = await getDocs(qTrainees);

                    const traineesData = [];
                    snap.forEach(docSnap => {
                        traineesData.push({ ...docSnap.data(), docId: docSnap.id });
                    });

                    const studentIds = traineesData.map(t => t.studentId).filter(Boolean);
                    const registeredUsersMap = new Map();

                    if (studentIds.length > 0) {
                        const chunkArray = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
                        const chunks = chunkArray(studentIds, 30);

                        for (const chunk of chunks) {
                            const qUsers = query(collectionGroup(db, 'profile'), where('studentId', 'in', chunk));
                            const usersSnap = await getDocs(qUsers);
                            usersSnap.forEach(d => {
                                const uData = d.data();
                                if (uData.studentId) registeredUsersMap.set(uData.studentId, uData);
                            });
                        }
                    }

                    const opts = [];

                    traineesData.forEach(data => {
                        const userData = registeredUsersMap.get(data.studentId);
                        if (!userData) return;

                        const fName = data.firstName || data.given || '';
                        const lName = data.lastName || data.family || '';
                        const dispName = lName || fName ? `${lName}, ${fName}`.replace(/,\s*$/, '') : (data.email || data.name || 'Unknown Trainee');
                        const comp = data.company || 'Unassigned';

                        const isOnline = userData.lastActive && (Date.now() - userData.lastActive < 5 * 60 * 1000);

                        opts.push({
                            id: userData.uid || data.userId || data.studentId || data.docId,
                            name: dispName,
                            company: comp,
                            role: 'trainee',
                            status: (data.status || data.Status || 'Active').trim(),
                            isOnline: isOnline,
                            lastActive: userData.lastActive
                        });
                    });

                    // Sort options alphabetically by name
                    opts.sort((a, b) => a.name.localeCompare(b.name));

                    setReceiverOptions(opts);
                };
                loadOptions();

                // Set interval to reload options every minute to update online status
                const interval = setInterval(loadOptions, 60000);
                return () => clearInterval(interval);
            }, [isOpen, currentUser.assignedIC]);

            useEffect(() => {
                const threeDaysAgoMs = Date.now() - (3 * 24 * 60 * 60 * 1000);
                const q = query(messagesRef, where('createdAtMs', '>=', threeDaysAgoMs), orderBy('createdAtMs', 'asc'));

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const msgs = [];
                    let unread = 0;

                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.viewed && data.createdAtMs < threeDaysAgoMs) {
                            deleteDoc(docSnap.ref);
                            return;
                        }
                        const isSender = data.senderId === myId;
                        const isReceiver = data.receiverId === myId;

                        if (isSender || isReceiver) {
                            msgs.push({ id: docSnap.id, ...data });
                            if (isReceiver && !data.viewed && data.senderId !== myId) unread++;
                        }
                    });
                    setMessages(msgs);
                    setUnreadCount(unread);
                });
                return () => unsubscribe();
            }, [myId]);

            useEffect(() => {
                if (isOpen && selectedReceiver) {
                    messages.forEach(async (m) => {
                        if (m.senderId === selectedReceiver.id && !m.viewed && m.receiverId === myId) {
                            await updateDoc(doc(messagesRef, m.id), { viewed: true });
                        }
                    });
                }
            }, [isOpen, selectedReceiver, messages, myId]);

            useEffect(() => {
                if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isOpen, selectedReceiver]);

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!newMessage.trim() || !selectedReceiver) return;

                try {
                    await addDoc(messagesRef, {
                        senderId: myId, senderName: myId, senderRole: 'ic',
                        receiverId: selectedReceiver.id, receiverName: selectedReceiver.name, receiverRole: selectedReceiver.role || 'unknown',
                        text: newMessage, timestamp: serverTimestamp(), createdAtMs: Date.now(), viewed: false
                    });
                    setNewMessage('');
                } catch (err) {
                    console.error(err);
                }
            };

            const handleDeleteMessage = async (msgId) => {
                try {
                    await deleteDoc(doc(messagesRef, msgId));
                } catch (err) {
                    console.error(err);
                }
            };

            const handleDeleteSelected = async () => {
                if (selectedMsgs.size === 0) return;
                try {
                    const batch = writeBatch(db);
                    selectedMsgs.forEach(id => batch.delete(doc(messagesRef, id)));
                    await batch.commit();
                    setSelectedMsgs(new Set());
                } catch (err) {
                    console.error(err);
                }
            };

            const toggleSelect = (msgId) => {
                const newSet = new Set(selectedMsgs);
                if (newSet.has(msgId)) newSet.delete(msgId);
                else newSet.add(msgId);
                setSelectedMsgs(newSet);
            };

            const filteredOptions = receiverOptions.filter(o => {
                const matchesSearch = o.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    (o.company && o.company.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchesStatus = !showActiveOnly || (o.status && o.status.toLowerCase() === 'active');
                return matchesSearch && matchesStatus;
            });

            let groupedOptions = {};
            filteredOptions.forEach(o => {
                const g = o.company || 'Unassigned';
                if (!groupedOptions[g]) groupedOptions[g] = [];
                groupedOptions[g].push(o);
            });

            const getEnrichedName = (id, fallbackName) => {
                const opt = receiverOptions.find(o => o.id === id);
                if (opt) {
                    return opt.company && opt.company !== 'Unassigned' ? `${opt.name} - ${opt.company}` : opt.name;
                }
                return fallbackName;
            };

            const getTraineeDetails = (id) => {
                return receiverOptions.find(o => o.id === id);
            };

            const threadMap = {};
            messages.forEach(m => {
                const otherId = m.senderId === myId ? m.receiverId : m.senderId;
                if (!threadMap[otherId]) {
                    threadMap[otherId] = { id: otherId, name: getEnrichedName(otherId, m.senderId === myId ? m.receiverName : m.senderName), messages: [], unreadCount: 0, lastMessage: null };
                }
                threadMap[otherId].messages.push(m);
                if (m.receiverId === myId && !m.viewed && m.senderId !== myId) threadMap[otherId].unreadCount++;
                if (!threadMap[otherId].lastMessage || m.createdAtMs > threadMap[otherId].lastMessage.createdAtMs) {
                    threadMap[otherId].lastMessage = m;
                }
            });

            const threadMessages = selectedReceiver ? (threadMap[selectedReceiver.id]?.messages || []) : [];

            return (
                <div className="relative">
                    <button onClick={() => setIsOpen(!isOpen)} className={`w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center justify-center relative cursor-pointer ${unreadCount > 0 ? 'text-primary-600' : 'text-slate-500 dark:text-slate-400'}`} title="Messages">
                        <MessageSquare size={20} className={unreadCount > 0 ? 'animate-pulse' : ''} />
                        {unreadCount > 0 && (
                            <span className="absolute top-1.5 right-1.5 flex h-4 w-4">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-4 w-4 bg-red-500 text-[10px] text-white font-bold items-center justify-center border-2 border-white dark:border-slate-900">{unreadCount}</span>
                            </span>
                        )}
                    </button>

                    {isOpen && (
                        <>
                            <div className="fixed inset-0 z-40 md:hidden bg-slate-900/50 backdrop-blur-sm" onClick={() => setIsOpen(false)} />
                            <div className="fixed inset-x-4 top-20 bottom-4 md:absolute md:top-14 md:bottom-auto md:left-auto md:right-0 md:w-[400px] md:h-[600px] z-50 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">

                                <div className="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center shrink-0">
                                    <h3 className="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                                        {selectedReceiver && (
                                            <button onClick={() => { setSelectedReceiver(null); setSelectedMsgs(new Set()); }} className="hover:bg-slate-200 dark:hover:bg-slate-700 p-1 rounded-full"><ChevronLeft size={18} /></button>
                                        )}
                                        {selectedReceiver ? (
                                            <div className="flex items-center gap-2">
                                                <span className="truncate max-w-[180px]">{selectedReceiver.name}</span>
                                                {selectedReceiver.isOnline && <span className="w-2 h-2 rounded-full bg-emerald-500"></span>}
                                            </div>
                                        ) : (
                                            <><MessageSquare size={18} className="text-primary-600" /> Messages</>
                                        )}
                                    </h3>
                                    <div className="flex gap-2 items-center">
                                        {selectedMsgs.size > 0 && (
                                            <button onClick={handleDeleteSelected} className="text-rose-500 hover:text-rose-700 text-sm font-bold flex items-center gap-1 bg-rose-50 dark:bg-rose-900/30 px-2 py-1 rounded-lg">
                                                <Trash2 size={14} /> Delete ({selectedMsgs.size})
                                            </button>
                                        )}
                                        <button onClick={() => setIsOpen(false)} className="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200"><X size={18} /></button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-hidden flex flex-col">
                                    {!selectedReceiver && (
                                        <div className="shrink-0 p-3 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 relative z-10">
                                            <div className="flex items-center gap-2">
                                                <div className="relative flex-1">
                                                    <Search size={14} className="absolute left-3 top-2.5 text-slate-400" />
                                                    <input type="text" placeholder="Search trainee or company..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-8 pr-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500" />
                                                </div>
                                                <label className="flex items-center gap-1.5 cursor-pointer flex-shrink-0 text-xs font-semibold text-slate-600 dark:text-slate-300">
                                                    <input type="checkbox" checked={showActiveOnly} onChange={() => setShowActiveOnly(!showActiveOnly)} className="w-3 h-3 text-primary-600 rounded border-slate-300 focus:ring-primary-500" />
                                                    Active Only
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-slate-50/50 dark:bg-slate-900">
                                        {!selectedReceiver ? (
                                            <div className="h-full">
                                                {Object.keys(groupedOptions).length === 0 ? (
                                                    <div className="h-full flex items-center justify-center text-slate-400 text-sm text-center">
                                                        No registered trainees found.
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col space-y-4">
                                                        {Object.entries(groupedOptions).map(([company, trainees]) => (
                                                            <div key={company} className="space-y-2">
                                                                <div className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest pl-1">
                                                                    {company}
                                                                </div>
                                                                <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden divide-y divide-slate-50 dark:divide-slate-700/50">
                                                                    {trainees.map(t => {
                                                                        const thread = threadMap[t.id];
                                                                        const unread = thread ? thread.unreadCount : 0;
                                                                        return (
                                                                            <button key={t.id} onClick={() => { setSelectedReceiver(t); setSelectedMsgs(new Set()); }} className="w-full flex items-center gap-3 p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-left relative">
                                                                                <div className="relative flex-shrink-0">
                                                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg ${t.isOnline ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30' : 'bg-primary-100 text-primary-600 dark:bg-primary-900/50'}`}>
                                                                                        {t.name.charAt(0).toUpperCase()}
                                                                                    </div>
                                                                                    {t.isOnline && (
                                                                                        <span className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-800 rounded-full"></span>
                                                                                    )}
                                                                                    {unread > 0 && (
                                                                                        <span className="absolute -top-1 -right-1 flex h-4 w-4">
                                                                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                                                                            <span className="relative inline-flex rounded-full h-4 w-4 bg-red-500 text-[9px] text-white font-bold items-center justify-center border-2 border-white dark:border-slate-800">{unread}</span>
                                                                                        </span>
                                                                                    )}
                                                                                </div>
                                                                                <div className="flex-1 min-w-0">
                                                                                    <div className="flex justify-between items-baseline mb-0.5">
                                                                                        <span className={`text-sm truncate pr-2 ${unread > 0 ? 'font-bold text-slate-900 dark:text-white' : 'font-semibold text-slate-700 dark:text-slate-300'}`}>{t.name}</span>
                                                                                        {thread && thread.lastMessage && (
                                                                                            <span className="text-[10px] text-slate-400 whitespace-nowrap">
                                                                                                {new Date(thread.lastMessage.createdAtMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                                                            </span>
                                                                                        )}
                                                                                    </div>
                                                                                    {thread && thread.lastMessage ? (
                                                                                        <div className={`text-xs truncate ${unread > 0 ? 'font-semibold text-slate-700 dark:text-slate-300' : 'text-slate-500 dark:text-slate-400'}`}>
                                                                                            {thread.lastMessage.senderId === myId ? 'You: ' : ''}{thread.lastMessage.text}
                                                                                        </div>
                                                                                    ) : (
                                                                                        <div className="text-xs text-slate-400 italic">No messages yet</div>
                                                                                    )}
                                                                                </div>
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ) : threadMessages.length === 0 ? (
                                            <div className="h-full flex items-center justify-center text-slate-400 text-sm text-center">No messages yet. Say hello!</div>
                                        ) : threadMessages.map(m => {
                                            const isMe = m.senderId === myId;
                                            return (
                                                <div key={m.id} className={`flex items-end gap-2 w-full ${isMe ? 'justify-end' : 'justify-start'}`}>
                                                    {!isMe && (
