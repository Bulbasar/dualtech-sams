                            if (dayOfWeek === 0 || dayOfWeek === 6) {
                                currDate.setDate(currDate.getDate() + 1);
                                continue;
                            }

                            // Skip holidays
                            if (isHoliday(dateStr)) {
                                currDate.setDate(currDate.getDate() + 1);
                                continue;
                            }

                            // Skip trainee's rest day
                            if (traineeRestDay && dayName === traineeRestDay) {
                                currDate.setDate(currDate.getDate() + 1);
                                continue;
                            }

                            // Skip schooling day
                            const isSchoolingDay = traineeSchooling.some(s => {
                                const sDate = s.date || s.dateString || '';
                                return sDate === dateStr && ['Present', 'Late', 'Verified'].includes(s.status);
                            });
                            if (isSchoolingDay) {
                                currDate.setDate(currDate.getDate() + 1);
                                continue;
                            }

                            expectedWorkDays++;

                            // Check for attendance
                            const dayLogs = traineeLogs.filter(l => {
                                const logDate = l.date || l.dateString || '';
                                if (logDate === dateStr) return true;
                                if (l.timestamp) {
                                    const d = typeof l.timestamp.toDate === 'function' ? l.timestamp.toDate() : new Date(l.timestamp);
                                    return d.toLocaleDateString('en-CA') === dateStr;
                                }
                                if (l.timeIn) {
                                    const d = typeof l.timeIn.toDate === 'function' ? l.timeIn.toDate() : new Date(l.timeIn);
                                    return d.toLocaleDateString('en-CA') === dateStr;
                                }
                                return false;
                            });

                            let timeIn = null, timeOut = null;
                            let inLoc = null, outLoc = null;

                            dayLogs.forEach(l => {
                                const candIn = l.timeIn || (l.type === 'IN' ? l.timestamp : null);
                                if (candIn) {
                                    const parsedCandIn = parseLogTimestamp(candIn);
                                    if (parsedCandIn && (!timeIn || parsedCandIn < parseLogTimestamp(timeIn))) {
                                        timeIn = candIn;
                                        inLoc = getLoc(l.clockInDetails || l);
                                    }
                                }
                                const candOut = l.timeOut || (l.type === 'OUT' ? l.timestamp : null);
                                if (candOut) {
                                    const parsedCandOut = parseLogTimestamp(candOut);
                                    if (parsedCandOut && (!timeOut || parsedCandOut > parseLogTimestamp(timeOut))) {
                                        timeOut = candOut;
                                        outLoc = getLoc(l.clockOutDetails || l);
                                    }
                                }
                            });

                            if (timeIn) {
                                const tIn = typeof timeIn.toDate === 'function' ? timeIn.toDate() : new Date(timeIn);
                                let tOut = timeOut ? (typeof timeOut.toDate === 'function' ? timeOut.toDate() : new Date(timeOut)) : null;

                                if (isDailyFormat) {
                                    // Build daily-style row for this date
                                    const timeInStr = tIn.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                                    const timeOutStr = tOut ? tOut.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '--:--';

                                    let remarksArr = [];
                                    let dailyHoursRendered = 0;
                                    const compSettings = companySettings[trainee.company || trainee['Company Name']];
                                    if (compSettings && compSettings.location) {
                                        const compLoc = getLoc(compSettings);
                                        if (inLoc && compLoc) {
                                            const dist = getDistanceFromLatLonInM(inLoc.lat, inLoc.lon, compLoc.lat, compLoc.lon);
                                            if (dist > (compSettings.radius || 1000)) remarksArr.push('<span style="color:red;font-weight:bold;">Clock In: Out of Range</span>');
                                            else remarksArr.push('<span style="color:green;font-weight:bold;">Clock In: Valid Location</span>');
                                        } else {
                                            remarksArr.push('<span style="color:red;font-weight:bold;">Clock In: No Location data</span>');
                                        }
                                        if (tOut) {
                                            if (outLoc && compLoc) {
                                                const dist = getDistanceFromLatLonInM(outLoc.lat, outLoc.lon, compLoc.lat, compLoc.lon);
                                                if (dist > (compSettings.radius || 1000)) remarksArr.push('<span style="color:red;font-weight:bold;">Clock Out: Out of Range</span>');
                                                else remarksArr.push('<span style="color:green;font-weight:bold;">Clock Out: Valid Location</span>');
                                            } else {
                                                remarksArr.push('<span style="color:red;font-weight:bold;">Clock Out: No Location data</span>');
                                            }
                                        }
                                    } else {
                                        remarksArr.push('No location required');
                                    }

                                    if (!tOut) {
                                        remarksArr.push('<span style="color:#0284c7;font-weight:bold;">Currently Clocked In</span>');
                                    } else {
                                        const nextDay = (() => { const nd = new Date(tIn); nd.setDate(nd.getDate() + 1); return nd.toLocaleDateString('en-CA') === tOut.toLocaleDateString('en-CA'); })();
                                        let hrs = (tOut - tIn) / (1000 * 60 * 60);
                                        const compName = trainee.company || trainee['Company Name'];
                                        const cs = companySettings[compName];
                                        if (cs && cs.breakMinutes) hrs -= (cs.breakMinutes / 60);
                                        hrs = Math.max(0, hrs);

                                        if (hrs < 0 || (tOut < tIn && !nextDay)) {
                                            remarksArr.push('<span style="color:red;font-weight:bold;">Incomplete Shift</span>');
                                            dailyHoursRendered = 0;
                                        } else if (hrs < 8) {
                                            remarksArr.push('<span style="color:#d97706;font-weight:bold;">Incomplete Shift (' + hrs.toFixed(1) + 'h)</span>');
                                            dailyHoursRendered = hrs;
                                        } else {
                                            remarksArr.push('<span style="color:#059669;font-weight:bold;">Completed Shift</span>');
                                            dailyHoursRendered = hrs;
                                        }
                                    }

                                    results.push({
                                        studentId: trainee.studentId,
                                        name: `${trainee.lastName || ''}, ${trainee.firstName || ''}`,
                                        company: trainee.company || trainee['Company Name'] || '',
                                        dateRange: dateStr,
                                        timeInStr,
                                        timeOutStr,
                                        dailyRemarksStr: remarksArr.join('<br/>'),
                                        dailyHoursRendered: dailyHoursRendered.toFixed(1)
                                    });
                                }

                                if (tIn && tOut) {
                                    let hours = (tOut - tIn) / (1000 * 60 * 60);
                                    const compName = trainee.company || trainee['Company Name'];
                                    const cs = companySettings[compName];
                                    if (cs && cs.breakMinutes) hours -= (cs.breakMinutes / 60);
                                    totalHours += Math.max(0, hours);
                                }
                                daysPresent++;
                            } else if (isDailyFormat) {
                                // No attendance for this day — push an absent row
                                results.push({
                                    studentId: trainee.studentId,
                                    name: `${trainee.lastName || ''}, ${trainee.firstName || ''}`,
                                    company: trainee.company || trainee['Company Name'] || '',
                                    dateRange: dateStr,
                                    timeInStr: '--:--',
                                    timeOutStr: '--:--',
                                    dailyRemarksStr: '<span style="color:red;font-weight:bold;">Absent</span>',
                                    dailyHoursRendered: '0.0'
                                });
                            }

                            currDate.setDate(currDate.getDate() + 1);
                        }

                        // For non-daily formats (weekly/monthly), push an aggregated row

                if (!dateVal) return dateVal;
                let str = String(dateVal).trim();

                if (/^\d{4,5}(\.\d+)?$/.test(str)) {
                    const d = new Date((Number(str) - 25569) * 86400 * 1000);
                    const utc = new Date(d.getTime() + d.getTimezoneOffset() * 60000);
                    if (!isNaN(utc)) {
                        return `${utc.getFullYear()}-${String(utc.getMonth() + 1).padStart(2, '0')}-${String(utc.getDate()).padStart(2, '0')}`;
                    }
                }

                str = str.replace(/[A-Za-z]+/g, (match) => {
                    const lower = match.toLowerCase();
                    if (['jan', 'january', 'feb', 'february', 'mar', 'march', 'apr', 'april', 'may', 'jun', 'june', 'jul', 'july', 'aug', 'august', 'sep', 'sept', 'september', 'oct', 'october', 'nov', 'november', 'dec', 'december'].includes(lower)) {
                        return match;
                    }
                    return '';
                }).replace(/,/g, ' ').replace(/\s+/g, ' ').trim();

                const d = new Date(str);
                if (!isNaN(d)) {
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                }

                return dateVal;
            };

                if (!dateStr) return '';

                        const attRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'mentoring_attendance');
                        const creditRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'schooling_credit_applications');
                        const allRecs = [];
                        const allCreds = [];

                        const chunkSize = 10;
                        const chunks = [];
                        for (let i = 0; i < studentIds.length; i += chunkSize) {
                            chunks.push(studentIds.slice(i, i + chunkSize));
                        }

                        for (const chunk of chunks) {
                            if (chunk.length > 0) {
                                const qAtt = query(attRef, where('studentId', 'in', chunk));
                                const snapAtt = await getDocs(qAtt);
                                snapAtt.forEach(doc => {
                                    const data = doc.data();
                                    if (data.date) data.date = normalizeDateString(data.date);
                                    allRecs.push({ id: doc.id, ...data });
                                });

                                const qCred = query(creditRef, where('studentId', 'in', chunk));
                                const snapCred = await getDocs(qCred);
                                snapCred.forEach(doc => {
                                    const data = doc.data();
                                    if (data.status === 'Approved') {
                                        allCreds.push({ id: doc.id, ...data });
                                    }
                                });
                            }
                        }

                        setAllHistoricalRecords(allRecs);
                        setAllCreditRecords(allCreds);
                        setHistoricalFetched(true);
                    } catch (err) {
                        console.error("Error fetching historical attendance:", err);
                    }
                    setLoadingRecords(false);
                };

                fetchHistorical();
            }, [allTrainees, historicalFetched]);

            const getIsoWeekStr = (dateStr) => {
                if (!dateStr) return null;
                const d = new Date(dateStr);
                if (isNaN(d)) return null;
                const ys = new Date(d.getFullYear(), 0, 1);
                const days = Math.floor((d - ys) / 86400000);
                const wn = Math.ceil((days + ys.getDay() + 1) / 7);
                return `${d.getFullYear()}-W${String(wn).padStart(2, '0')}`;
            };

            const parseDate = (val) => {
                if (!val) return null;
                if (val.seconds) return new Date(val.seconds * 1000); // Firestore timestamp
                const d = new Date(val);
                return isNaN(d) ? null : d;
            };

            const tableData = useMemo(() => {
                if (filteredTrainees.length === 0 || allHistoricalRecords.length === 0) return [];

                return filteredTrainees.map(t => {
                    const sId = t.studentId || t['Student ID#'];
                    const tName = t.studentName || t['Student Name'] || t.name || `${t.firstName} ${t.lastName}` || '-';
                    const comp = t.company || t['Company Name'] || '-';
                    let rawVenue = t.assignedVenueName || t.assignedVenue || t.Venue || t.SchoolingVenue;
                    let assignedVenueStr = (rawVenue && rawVenue.trim() !== '' && rawVenue.trim().toLowerCase() !== 'n/a') ? rawVenue : 'Unassigned';
                    const myRecords = allHistoricalRecords.filter(r => r.studentId === sId).map(r => ({ ...r, date: normalizeDateString(r.date) }));
                    const myCredits = allCreditRecords.filter(c => c.studentId === sId);

                    let iptStart = t.iptDateStart || t['IPT Date Start'] || null;
                    let iptEnd = t.iptDateEnd || t['IPT Date End'] || null;
                    if (iptStart && typeof iptStart === 'string') iptStart = iptStart.split('T')[0];
                    if (iptEnd && typeof iptEnd === 'string') iptEnd = iptEnd.split('T')[0];

                    const startObj = parseDate(iptStart);
                    const endObj = parseDate(iptEnd);

                    let iptWeekToDate = 0;
                    let iptMonthToDate = 0;

                    let targetEndForCount = new Date(); // now
                    if (endObj && endObj < targetEndForCount) {
                        targetEndForCount = endObj; // Cap at IPT End Date if it has already passed
                    }

                    if (startObj) {
                        const timeDiff = targetEndForCount.getTime() - startObj.getTime();
                        if (timeDiff > 0) {
                            iptWeekToDate = Math.floor(timeDiff / (1000 * 3600 * 24 * 7));
                            const mDiff = (targetEndForCount.getFullYear() - startObj.getFullYear()) * 12 + (targetEndForCount.getMonth() - startObj.getMonth());
                            iptMonthToDate = mDiff >= 0 ? mDiff : 0;
                        }
                    }

                    let onlineCount = 0;
                    let f2fCount = 0;

                    const weekMap = {};

                    myRecords.forEach(r => {
                        const actType = (r.activityType || '').trim();
                        if (actType === 'Online Schooling') {
                            onlineCount++;
                        } else {
                            f2fCount++;
                        }

                        let dateStr = r.date || null;
                        if (!r.date && r.timestamp) {
                            const d = new Date(r.timestamp);
                            if (!isNaN(d.getTime())) dateStr = d.toISOString().split('T')[0];
                        }
                        const wStr = getIsoWeekStr(dateStr);
                        if (wStr) {
                            weekMap[wStr] = (weekMap[wStr] || 0) + 1;
                        }
                    });

                    const totalCreditCount = myCredits.reduce((sum, c) => sum + (Number(c.creditsRequested) || 0), 0);
                    const totalRecords = onlineCount + f2fCount + totalCreditCount;
                    const targetWeeks = iptWeekToDate > 72 ? 72 : iptWeekToDate;
                    let lacking = targetWeeks - totalRecords;
                    if (lacking < 0) lacking = 0;
                    const hasMultipleInSameWeek = Object.values(weekMap).some(count => count > 1);
                    const uniqueWeeksAttended = Object.keys(weekMap).length;

                    const missingWeeks = [];
                    if (startObj) {
                        let currentD = new Date(startObj);
                        let weeksCount = 0;
                        while (currentD <= targetEndForCount && weeksCount < iptWeekToDate) {
                            const wStr = getIsoWeekStr(currentD);
                            if (wStr && !weekMap[wStr]) {
                                const [y, w] = wStr.split('-W');
                                const j1 = new Date(parseInt(y), 0, 1);
                                const d_w = j1.getDay() || 7;
                                const m1 = new Date(j1);
                                m1.setDate(j1.getDate() + (1 - d_w));
                                const ws = new Date(m1);
                                ws.setDate(m1.getDate() + (parseInt(w) - 1) * 7);
                                const we = new Date(ws);
                                we.setDate(ws.getDate() + 6);
                                missingWeeks.push({ weekNo: wStr, dateRange: `${formatNiceDate(ws)} - ${formatNiceDate(we)}` });
                            }
                            currentD.setDate(currentD.getDate() + 7);
                            weeksCount++;
                        }
                    }

                    const totalWeekNoSchooling = missingWeeks.length;

                    return {
                        assignedVenue: assignedVenueStr,
                        studentId: sId || '-',
                        name: tName,
                        company: comp,
                        iptStart: iptStart || '-',
                        iptEnd: iptEnd || '-',
                        iptWeekToDate: iptWeekToDate,
                        iptMonthToDate: iptMonthToDate,
                        totalOnline: onlineCount,
                        totalF2F: f2fCount,
                        totalRecords: totalRecords,
                        lacking: lacking,
                        hasMultipleInSameWeek: hasMultipleInSameWeek,
                        totalWeekNoSchooling: totalWeekNoSchooling,
                        records: myRecords,
                        missingWeeks: missingWeeks,
                        credits: myCredits
                    };
                });
            }, [filteredTrainees, allHistoricalRecords]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const sortedData = useMemo(() => {
                const sortable = [...tableData];
                sortable.sort((a, b) => {
                    let valA = a[sortConfig.key];
                    let valB = b[sortConfig.key];

                    // numeric sort if both are numbers
                    if (!isNaN(valA) && !isNaN(valB)) {
                        valA = Number(valA);
                        valB = Number(valB);
                    }

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return sortable;
            }, [tableData, sortConfig]);

            const paginatedData = useMemo(() => {
                if (itemsPerPage === 'all') return sortedData;
                const startIndex = (currentPage - 1) * itemsPerPage;
                return sortedData.slice(startIndex, startIndex + itemsPerPage);
            }, [sortedData, currentPage, itemsPerPage]);

            const totalPages = itemsPerPage === 'all' ? 1 : Math.ceil(sortedData.length / itemsPerPage);

            const handleExportXLS = () => {
                let tableContent = `
                    <tr>
                        ${visibleColumns.studentId ? '<th>Student ID#</th>' : ''}
                        ${visibleColumns.name ? '<th>Trainee Name</th>' : ''}
                        ${visibleColumns.company ? '<th>Company Name</th>' : ''}
                        ${visibleColumns.iptStart ? '<th>IPT Date Start</th>' : ''}
                        ${visibleColumns.iptEnd ? '<th>IPT Date End</th>' : ''}
                        ${visibleColumns.iptWeekToDate ? '<th>IPT Week to Date</th>' : ''}
                        ${visibleColumns.iptMonthToDate ? '<th>IPT Month to Date</th>' : ''}
                        ${visibleColumns.totalOnline ? '<th>Total Online Schooling</th>' : ''}
                        ${visibleColumns.totalF2F ? '<th>Total Face to Face</th>' : ''}
                        ${visibleColumns.totalRecords ? '<th>Total Records</th>' : ''}
                        ${visibleColumns.lacking ? '<th>Submission/Attendance Lacking</th>' : ''}
                        ${visibleColumns.totalWeekNoSchooling ? '<th>Total Week No Schooling</th>' : ''}
                    </tr>
                `;

                sortedData.forEach(row => {
                    tableContent += `
                    <tr>
                        ${visibleColumns.studentId ? `<td>${row.studentId}</td>` : ''}
                        ${visibleColumns.name ? `<td>${row.name}</td>` : ''}
                        ${visibleColumns.company ? `<td>${row.company}</td>` : ''}
                        ${visibleColumns.assignedVenue ? `<td>${row.assignedVenue}</td>` : ''}
                        ${visibleColumns.iptStart ? `<td>${row.iptStart}</td>` : ''}
                        ${visibleColumns.iptEnd ? `<td>${row.iptEnd}</td>` : ''}
                        ${visibleColumns.iptWeekToDate ? `<td>${row.iptWeekToDate}</td>` : ''}
                        ${visibleColumns.iptMonthToDate ? `<td>${row.iptMonthToDate}</td>` : ''}
                        ${visibleColumns.totalOnline ? `<td>${row.totalOnline}</td>` : ''}
                        ${visibleColumns.totalF2F ? `<td>${row.totalF2F}</td>` : ''}
                        ${visibleColumns.totalRecords ? `<td style="${row.hasMultipleInSameWeek ? 'color: red; font-weight: bold;' : ''}">${row.totalRecords}</td>` : ''}
                        ${visibleColumns.lacking ? `<td>${row.lacking}</td>` : ''}
                        ${visibleColumns.totalWeekNoSchooling ? `<td>${row.totalWeekNoSchooling}</td>` : ''}
                    </tr>`;
                });

                const xlsTemplate = `
                    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                    <head>
                        <meta charset="utf-8">
                        <style>
                            table { border-collapse: collapse; font-family: Arial, sans-serif; }
                            th { background-color: #10b981; color: white; font-weight: bold; font-size: 14px; border: 1px solid #cccccc; padding: 8px; text-align: left; }
                            td { border: 1px solid #cccccc; padding: 6px 8px; font-size: 13px; mso-number-format:"\\@"; }
                        </style>
                    </head>
                    <body><table>${tableContent}</table></body>
                    </html>
                `;
                const blob = new Blob([xlsTemplate], { type: 'application/vnd.ms-excel;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `Schooling_Attendance_Trainee_Records.xls`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <ArrowUpDown size={14} className="ml-1 text-slate-300 dark:text-slate-600 inline" />;
                return sortConfig.direction === 'asc' ? <ChevronUp size={14} className="ml-1 text-primary-500 inline" /> : <ChevronDown size={14} className="ml-1 text-primary-500 inline" />;
            };

            // Modal sorting logic
            const modalSortedData = useMemo(() => {
                if (!selectedTraineeRecords) return [];

                let mappedData = [];
                if (selectedTraineeRecords.type === 'attended') {
                    const weekCounts = {};
                    const data = selectedTraineeRecords.records.map(r => {
                        let dateStr = r.date || '';
                        if (!r.date && r.timestamp) {
                            const d = new Date(r.timestamp);
                            if (!isNaN(d.getTime())) dateStr = d.toISOString().split('T')[0];
                        }
                        const weekNo = getIsoWeekStr(dateStr) || '-';
                        weekCounts[weekNo] = (weekCounts[weekNo] || 0) + 1;
                        return { date: dateStr, weekNo: weekNo };
                    });
                    mappedData = data.map(d => ({ ...d, isMultiple: weekCounts[d.weekNo] > 1 }));
                } else if (selectedTraineeRecords.type === 'missing') {
                    mappedData = [...selectedTraineeRecords.records];
                }

                mappedData.sort((a, b) => {
                    let valA = a[modalSortConfig.key];
                    let valB = b[modalSortConfig.key];
                    if (valA < valB) return modalSortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return modalSortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return mappedData;
            }, [selectedTraineeRecords, modalSortConfig]);

            const handleModalSort = (key) => {
                let direction = 'asc';
                if (modalSortConfig.key === key && modalSortConfig.direction === 'asc') direction = 'desc';
                setModalSortConfig({ key, direction });
            };

            const ModalSortIcon = ({ columnKey }) => {
                if (modalSortConfig.key !== columnKey) return <ArrowUpDown size={14} className="ml-1 text-slate-300 dark:text-slate-600 inline" />;
                return modalSortConfig.direction === 'asc' ? <ChevronUp size={14} className="ml-1 text-primary-500 inline" /> : <ChevronDown size={14} className="ml-1 text-primary-500 inline" />;
            };

            const inputClass = "w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all shadow-sm";

            return (
                <div className="flex flex-col flex-1 min-h-0 overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-900">
                    <div className="p-6 pb-0 flex-none space-y-6">
                        {/* Header & Controls */}
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div>
                                <h1 className="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Schooling Records</h1>
                                <p className="text-slate-500 dark:text-slate-400 mt-1">Schooling Attendance of Trainees Assigned to you</p>
                            </div>
                        </div>

                        {/* Filters Toolbar */}
                        <div className="flex flex-col lg:flex-row gap-4 items-center justify-between">
                            <div className="w-full lg:w-1/3 relative">
                                <Search className="absolute left-3 top-3 text-slate-400" size={18} />
                                <input
                                    type="text"
                                    placeholder="Search student ID, name, company..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className={inputClass}
                                />
                            </div>

                            <div className="flex w-full lg:w-auto gap-3 items-center justify-end">
                                <button
                                    onClick={() => setShowFilters(!showFilters)}
                                    className={`px-4 py-2.5 border text-sm font-bold rounded-xl shadow-sm transition-all flex items-center gap-2 ${showFilters ? 'bg-primary-50 dark:bg-primary-900/20 border-primary-200 dark:border-primary-800 text-primary-700 dark:text-primary-400' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'}`}
                                >
                                    <Filter size={16} /> Filters {showFilters ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                                </button>

                                <div className="relative">
                                    <button
                                        onClick={() => setShowColumnMenu(!showColumnMenu)}
                                        className="px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-all flex items-center gap-2"
                                    >
                                        <Columns size={16} /> <span className="hidden sm:inline">Columns</span>
                                    </button>
                                    {showColumnMenu && (
                                        <div className="absolute top-full left-0 lg:left-auto lg:right-0 mt-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl p-3 z-20 w-56 flex flex-col gap-2">
                                            {Object.entries({
                                                studentId: 'Student ID#',
                                                name: 'Trainee Name',
                                                company: 'Company Name',
                                                iptStart: 'IPT Start',
                                                iptEnd: 'IPT End',
                                                iptWeekToDate: 'Wk to Date',
                                                iptMonthToDate: 'Mo to Date',
                                                totalOnline: 'Total Online',
                                                totalF2F: 'Total F2F',
                                                totalRecords: 'Total Records',
                                                lacking: 'Lacking Submissions',
                                                totalWeekNoSchooling: 'No Schooling Wks'
                                            }).map(([key, label]) => (
                                                <label key={key} className="flex items-center gap-2 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 p-1.5 rounded-lg transition-colors">
                                                    <input
                                                        type="checkbox"
                                                        checked={visibleColumns[key]}
                                                        onChange={() => toggleColumn(key)}
                                                        className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500"
                                                    />
                                                    <span className="text-sm text-slate-700 dark:text-slate-300">{label}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={handleExportXLS}
                                    disabled={sortedData.length === 0}
                                    className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold rounded-xl transition-all shadow-sm flex items-center gap-2"
                                >
                                    <Download size={18} /> <span className="hidden sm:inline">Export</span>
                                </button>
                            </div>
                        </div>

                        {showFilters && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mt-4">
                                <div className="relative">
                                    <Building2 className="absolute left-3 top-3 text-slate-400" size={18} />
                                    <select
                                        value={selectedCompany}
                                        onChange={(e) => setSelectedCompany(e.target.value)}
                                        className={inputClass}
                                    >
                                        <option value="">All Companies</option>
                                        {companies.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>

                                <div className="relative">
                                    <Activity className="absolute left-3 top-3 text-slate-400" size={18} />
                                    <select
                                        value={statusFilter}
                                        onChange={(e) => setStatusFilter(e.target.value)}
                                        className={inputClass}
                                    >
                                        <option value="">All Statuses</option>
                                        {statuses.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Table View */}
                    <div className="flex-1 p-6 min-h-0">
                        <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 h-full flex flex-col overflow-hidden relative">
                            {(loadingTrainees || loadingRecords) && (
                                <div className="absolute inset-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm z-10 flex items-center justify-center">
                                    <div className="flex flex-col items-center gap-3">
                                        <div className="animate-spin rounded-full h-10 w-10 border-4 border-primary-500 border-t-transparent"></div>
                                        <p className="text-sm font-medium text-slate-500">Loading records...</p>
                                    </div>
                                </div>
                            )}
                            <div className="overflow-auto flex-1 custom-scrollbar">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 sticky top-0 z-20 shadow-sm">
                                        <tr>
                                            {visibleColumns.studentId && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('studentId')}>Student ID# <SortIcon columnKey="studentId" /></th>}
                                            {visibleColumns.name && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('name')}>Trainee Name <SortIcon columnKey="name" /></th>}
                                            {visibleColumns.company && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('company')}>Company Name <SortIcon columnKey="company" /></th>}
                                            {visibleColumns.assignedVenue && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('assignedVenue')}>Assigned Venue <SortIcon columnKey="assignedVenue" /></th>}
                                            {visibleColumns.iptStart && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('iptStart')}>IPT Start <SortIcon columnKey="iptStart" /></th>}
                                            {visibleColumns.iptEnd && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('iptEnd')}>IPT End <SortIcon columnKey="iptEnd" /></th>}
                                            {visibleColumns.iptWeekToDate && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center" onClick={() => handleSort('iptWeekToDate')}>Wk to Date <SortIcon columnKey="iptWeekToDate" /></th>}
                                            {visibleColumns.iptMonthToDate && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center" onClick={() => handleSort('iptMonthToDate')}>Mo to Date <SortIcon columnKey="iptMonthToDate" /></th>}
                                            {visibleColumns.totalOnline && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20" onClick={() => handleSort('totalOnline')}>Total Online <SortIcon columnKey="totalOnline" /></th>}
                                            {visibleColumns.totalF2F && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20" onClick={() => handleSort('totalF2F')}>Total F2F <SortIcon columnKey="totalF2F" /></th>}
                                            {visibleColumns.totalRecords && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center bg-slate-100 dark:bg-slate-800" onClick={() => handleSort('totalRecords')}>Total Records <SortIcon columnKey="totalRecords" /></th>}
                                            {visibleColumns.lacking && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20" onClick={() => handleSort('lacking')}>Submission/Attendance Lacking <SortIcon columnKey="lacking" /></th>}
                                            {visibleColumns.totalWeekNoSchooling && <th className="p-4 font-black text-[11px] uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-center text-red-600 dark:text-red-400" onClick={() => handleSort('totalWeekNoSchooling')}>No Schooling Wks <SortIcon columnKey="totalWeekNoSchooling" /></th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50">
                                        {sortedData.length === 0 && !loadingTrainees && !loadingRecords ? (
                                            <tr><td colSpan="11" className="p-8 text-center text-slate-500">No records found.</td></tr>
                                        ) : (
                                            sortedData.map((row, i) => (

        function TraineeMeritModal({ currentUser, trainee, onClose, onUpdateTotal }) {
            const [history, setHistory] = useState(trainee.meritHistory || []);
            const [points, setPoints] = useState('');
            const [caseDesc, setCaseDesc] = useState('');
            const [submitting, setSubmitting] = useState(false);

            const handleAddMerit = async (e) => {
                e.preventDefault();
                const p = parseInt(points);
                if (isNaN(p) || p === 0 || !caseDesc.trim()) return;
                setSubmitting(true);
                try {
                    const traineeRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainees', trainee.docId);
                    const newTotal = (trainee.meritPoints || 0) + p;

                    const logEntry = {
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now(),
                        change: p > 0 ? `+${p}` : `${p}`,
                        newTotal: newTotal,
                        remark: caseDesc.trim()
                    };

                    const newHistory = [...history, logEntry];

                    await updateDoc(traineeRef, {
                        meritPoints: newTotal,
                        meritHistory: newHistory
                    });

                    setHistory(newHistory);
                    onUpdateTotal(newTotal, newHistory);
                    setPoints('');
                    setCaseDesc('');
                } catch (err) {
                    console.error(err);
                    alert("Error saving merit record.");
                }
                setSubmitting(false);
            };

            const handleRevert = async (record) => {
                const numericChange = parseInt(record.change.replace(/[+]/g, ''));
                if (!confirm(`Are you sure you want to revert this record of ${record.change} points?`)) return;
                try {
                    const traineeRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainees', trainee.docId);

                    const newTotal = (trainee.meritPoints || 0) - numericChange;
                    const newHistory = history.filter(h => h.timestamp !== record.timestamp);

                    await updateDoc(traineeRef, {
                        meritPoints: newTotal,
                        meritHistory: newHistory
                    });

                    setHistory(newHistory);
                    onUpdateTotal(newTotal, newHistory);
                } catch (err) {
                    console.error(err);
                    alert("Error reverting record.");
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">

                            <div>
                                <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><Shield size={20} className="text-emerald-500" /> Merit Points</h2>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">{trainee.name} ({trainee.studentId})</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-center">
                                    <span className="block text-[10px] font-bold text-slate-400 uppercase">Total Points</span>
                                    <strong className={`text-2xl ${trainee.meritPoints >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-orange-600 dark:text-orange-400'}`}>{trainee.meritPoints || 0}</strong>
                                </div>
                                <button onClick={onClose} className="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-500"><X size={20} /></button>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto flex-1 space-y-6 custom-scrollbar bg-slate-50/50 dark:bg-slate-900/20">
                            {/* Add Form */}
                            <form onSubmit={handleAddMerit} className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-3">
                                <div className="w-24 flex-shrink-0">
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Points (+/-)</label>
                                    <input type="number" required placeholder="e.g. 5, -10" value={points} onChange={e => setPoints(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 text-sm border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-200 font-bold" />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Case Description</label>
                                    <input type="text" required placeholder="Reason for merit/demerit..." value={caseDesc} onChange={e => setCaseDesc(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 text-sm border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-200" />
                                </div>
                                <div className="flex items-end pb-[2px]">
                                    <button disabled={submitting} type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors disabled:opacity-50 flex items-center gap-2">
                                        {submitting ? <Loader2 size={16} className="animate-spin" /> : <Plus size={16} />}

                        const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainees'), where('assignedIC', '==', myId));

                        let tData = [];
                        let foundStatuses = new Set();
                        let foundCompanies = new Set();
                        snap.forEach(d => {
                            const data = d.data();
                            const stat = (data.status || data.Status || 'Active').trim();
                            const comp = (data.company || 'Unassigned').trim();

                                if (!dateString) return '-';
                                const d1 = new Date(dateString);
                                if (isNaN(d1)) return '-';
                                let months = (refDate.getFullYear() - d1.getFullYear()) * 12 + (refDate.getMonth() - d1.getMonth());
                                if (refDate.getDate() < d1.getDate()) months--;
                                return Math.max(0, months);
                            };

                            tData.push({
                                ...data,
                                docId: d.id,
                                status: stat,

                                restDay: data.restDay || data['Rest Day'] || '',
                                meritPoints: parseInt(data.meritPoints || 0),

                            });

                                                            </td>}
                                                            {visibleColumns.has('registered') && <td className="py-3 px-4 text-center">
                                                                <span className={`inline-flex items-center justify-center px-2 py-1 rounded-md font-bold text-xs ${t.isRegistered ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400'}`}>

                                                            {visibleColumns.has('schoolingDay') && <td className="py-3 px-4 text-center">
