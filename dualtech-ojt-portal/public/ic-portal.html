        // --- MY COMPANY ACCOUNTS TAB ---
        function MyCompanyAccountsTab({ currentUser, onNavigate }) {
            const formatToYYYYMMDD = (dateString) => {
                if (!dateString) return '';
                if (typeof dateString === 'string' && dateString.match(/^\d{4}-\d{2}-\d{2}$/)) return dateString;
                let parseString = dateString;
                if (typeof dateString === 'string' && !dateString.includes('T')) { parseString = dateString.replace(/-/g, '/'); }
                const d = new Date(parseString);
                if (isNaN(d.getTime())) return dateString;
                if (typeof dateString === 'string' && dateString.includes('T')) {
                    const offset = d.getTimezoneOffset() * 60000;
                    const localDate = new Date(d.getTime() - offset);
                    return localDate.toISOString().split('T')[0];
                }
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const yyyy = d.getFullYear();
                return `${yyyy}-${mm}-${dd}`;
            };

            const [companies, setCompanies] = useState([]);
            const [visits, setVisits] = useState([]);
            const [contacts, setContacts] = useState([]);
            const [companyProfiles, setCompanyProfiles] = useState({});
            const [geofences, setGeofences] = useState([]);
            const [loading, setLoading] = useState(true);
            const loadingState = useRef({ trainees: false, visits: false, companyVisits: false, contacts: false, profiles: false, geofences: false });
            const checkLoading = () => {
                if (Object.values(loadingState.current).every(v => v === true)) {
                    setLoading(false);
                }
            };
            const [activeOnly, setActiveOnly] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'company', direction: 'asc' });
            
            const [selectedCompanies, setSelectedCompanies] = useState([]);
            const [showBulkVisitModal, setShowBulkVisitModal] = useState(false);
            const [savingBulkVisit, setSavingBulkVisit] = useState(false);
            const [bulkVisitForm, setBulkVisitForm] = useState({ visitDate: formatToYYYYMMDD(new Date().toISOString()), visitType: 'Face-to-Face', isKamustahan: false, notes: '' });

            // Modals
            const [historyModalCompany, setHistoryModalCompany] = useState(null);
            const [showContactsModal, setShowContactsModal] = useState(false);
            const [selectedCompanyContacts, setSelectedCompanyContacts] = useState(null);
            const [contactForm, setContactForm] = useState({ name: '', email: '', designation: '', phone: '', fbMessenger: '' });
            const [savingContact, setSavingContact] = useState(false);

            const [showIssuesModal, setShowIssuesModal] = useState(false);
            const [selectedCompanyIssues, setSelectedCompanyIssues] = useState(null);
            const [issueText, setIssueText] = useState('');
            const [issueFilter, setIssueFilter] = useState('Open');
            const [savingIssue, setSavingIssue] = useState(false);

            const [showAddressModal, setShowAddressModal] = useState(false);
            const [selectedCompanyAddress, setSelectedCompanyAddress] = useState(null);
            const [profileForm, setProfileForm] = useState({ companyName: '', addresses: [{ text: '', geolocation: '' }], assignedICs: '' });
            const [savingProfile, setSavingProfile] = useState(false);
            const [mapInstance, setMapInstance] = useState(null);
            const [mapMarker, setMapMarker] = useState(null);
            const [mapCircle, setMapCircle] = useState(null);
            const mapRef = useRef(null);
            const [geofenceForm, setGeofenceForm] = useState({ radius: 500 });
            const [activeAddressIndex, setActiveAddressIndex] = useState(0);

            const resolveAddressCoords = (addr, companyName) => {
                if(!addr) return { lat: null, lng: null };
                let lat = addr.lat;
                let lng = addr.lng;
                
                if (addr.text) {
                    const existing = geofences.find(g => g.company === companyName && g.label === addr.text);
                    if (existing) {
                        if (!lat && existing.latitude) lat = existing.latitude;
                        if (!lng && existing.longitude) lng = existing.longitude;
                    }
                }
                if (!lat && addr.geolocation) {
                    const qMatch = addr.geolocation.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
                    if (qMatch) { lat = parseFloat(qMatch[1]); lng = parseFloat(qMatch[2]); }
                    else {
                        const atMatch = addr.geolocation.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                        if (atMatch) { lat = parseFloat(atMatch[1]); lng = parseFloat(atMatch[2]); }
                    }
                }
                return { lat, lng };
            };



            useEffect(() => {
                if (!currentUser?.assignedIC) return;

                const traineesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainees');
                const visitsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'visits');
                const companyVisitsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_visits');
                const contactsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'contacts');
                const profilesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles');
                const geofencesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'geofences');

                const unsubTrainees = onSnapshot(traineesRef, (snap) => {
                    const allTraineesData = snap.docs.map(d => d.data());
                    const myTrainees = allTraineesData.filter(t => t.assignedIC === currentUser.assignedIC);

                    const companiesMap = new Map();
                    myTrainees.forEach(t => {
                        const cName = (t.company || t['Company Name'] || 'Unassigned').trim();
                        const isActive = (t.status || 'Active').toLowerCase() === 'active';
                        if (!companiesMap.has(cName)) {
                            companiesMap.set(cName, { name: cName, activeTrainees: 0, totalTrainees: 0, hasActive: false });
                        }
                        const comp = companiesMap.get(cName);
                        comp.totalTrainees++;
                        if (isActive) {
                            comp.activeTrainees++;
                            comp.hasActive = true;
                        }
                    });
                    setCompanies(Array.from(companiesMap.values()));
                    if (!loadingState.current.trainees) {
                        loadingState.current.trainees = true;
                        checkLoading();
                    }
                });

                let currentVisits = [];
                let currentCompanyVisits = [];
                const updateVisits = () => setVisits([...currentVisits, ...currentCompanyVisits]);
                const unsubVisits = onSnapshot(visitsRef, snap => {
                    currentVisits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    updateVisits();
                    if (!loadingState.current.visits) { loadingState.current.visits = true; checkLoading(); }
                });
                const unsubCompanyVisits = onSnapshot(companyVisitsRef, snap => {
                    currentCompanyVisits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    updateVisits();
                    if (!loadingState.current.companyVisits) { loadingState.current.companyVisits = true; checkLoading(); }
                });
                const unsubContacts = onSnapshot(contactsRef, snap => {
                    setContacts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    if (!loadingState.current.contacts) { loadingState.current.contacts = true; checkLoading(); }
                });
                const unsubProfiles = onSnapshot(profilesRef, snap => {
                    const profiles = {};
                    snap.docs.forEach(doc => { profiles[doc.data().companyName] = { id: doc.id, ...doc.data() }; });
                    setCompanyProfiles(profiles);
                    if (!loadingState.current.profiles) { loadingState.current.profiles = true; checkLoading(); }
                });
                const unsubGeofences = onSnapshot(geofencesRef, snap => {
                    setGeofences(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    if (!loadingState.current.geofences) { loadingState.current.geofences = true; checkLoading(); }
                });

                return () => { unsubTrainees(); unsubVisits();
                    unsubCompanyVisits(); unsubContacts(); unsubProfiles(); unsubGeofences(); };
            }, [currentUser]);

            // MAP LOGIC
            useEffect(() => {
                if (showAddressModal && mapRef.current && !mapInstance) {
                    const firstAddr = profileForm.addresses[0] || {};
                    const { lat, lng } = resolveAddressCoords(firstAddr, profileForm.companyName);
                    const startLat = lat || 14.5995;
                    const startLng = lng || 120.9842;
                    let startRadius = 500;
                    if (firstAddr.text) {
                        const existing = geofences.find(g => g.company === profileForm.companyName && g.label === firstAddr.text);
                        if (existing && existing.radius) startRadius = existing.radius;
                    }
                    setGeofenceForm({ radius: startRadius });

                    const map = L.map(mapRef.current).setView([startLat, startLng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    const marker = L.marker([startLat, startLng], { draggable: true }).addTo(map);
                    const circle = L.circle([startLat, startLng], { radius: startRadius, color: 'blue', fillColor: '#3b82f6', fillOpacity: 0.2 }).addTo(map);

                    map.on('click', (e) => {
                        marker.setLatLng(e.latlng);
                        circle.setLatLng(e.latlng);
                        updateCurrentAddressCoords(e.latlng.lat, e.latlng.lng);
                    });

                    marker.on('dragend', (e) => {
                        const pos = marker.getLatLng();
                        circle.setLatLng(pos);
                        updateCurrentAddressCoords(pos.lat, pos.lng);
                    });

                    setMapInstance(map);
                    setMapMarker(marker);
                    setMapCircle(circle);
                }

                if (!showAddressModal && mapInstance) {
                    mapInstance.remove();
                    setMapInstance(null);
                    setMapMarker(null);
                    setMapCircle(null);
                }
            }, [showAddressModal]);

            const handleSearchLocation = async (query) => {
                if(!query) return;
                
                let lat = null, lon = null;
                const atMatch = query.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                if(atMatch) { lat = parseFloat(atMatch[1]); lon = parseFloat(atMatch[2]); }
                if(!lat) {
                    const qMatch = query.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
                    if(qMatch) { lat = parseFloat(qMatch[1]); lon = parseFloat(qMatch[2]); }
                }
                if(!lat) {
                    const exactMatch = query.match(/^(-?\d+\.\d+)[\s,]+(-?\d+\.\d+)$/);
                    if(exactMatch) { lat = parseFloat(exactMatch[1]); lon = parseFloat(exactMatch[2]); }
                }
                
                if(lat && lon) {
                    if(mapInstance) {
                        mapInstance.setView([lat, lon], 15);
                        mapMarker.setLatLng([lat, lon]);
                        mapCircle.setLatLng([lat, lon]);
                        updateCurrentAddressCoords(lat, lon);
                    }
                    return;
                }

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    if(data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        if(mapInstance) {
                            mapInstance.setView([lat, lon], 15);
                            mapMarker.setLatLng([lat, lon]);
                            mapCircle.setLatLng([lat, lon]);
                            updateCurrentAddressCoords(lat, lon);
                        }
                    } else {
                        alert("Location not found. Note: Shortened Google Maps links (goo.gl) are not supported directly unless they contain coordinates.");
                    }
                } catch(err) {
                    alert("Error searching location.");
                }
            };

            const updateCurrentAddressCoords = (lat, lng) => {
                setProfileForm(prev => {
                    const newAddresses = [...prev.addresses];
                    if (newAddresses[activeAddressIndex]) {
                        newAddresses[activeAddressIndex].geolocation = `https://www.google.com/maps?q=${lat},${lng}`;
                        newAddresses[activeAddressIndex].lat = lat;
                        newAddresses[activeAddressIndex].lng = lng;
                    }
                    return { ...prev, addresses: newAddresses };
                });
            };

            const handleSelectAddress = (idx) => {
                setActiveAddressIndex(idx);
                // We use a functional update to get the latest profileForm in case it's stale
                setProfileForm(currentProfile => {
                    const addr = currentProfile.addresses[idx];
                    if (mapInstance) {
                        const resolved = resolveAddressCoords(addr, currentProfile.companyName);
                        const lat = resolved.lat || 14.5995;
                        const lng = resolved.lng || 120.9842;
                        mapInstance.setView([lat, lng], 15);
                        mapMarker.setLatLng([lat, lng]);
                        mapCircle.setLatLng([lat, lng]);
                        
                        let radius = 500;
                        if (addr?.text) {
                            const existing = geofences.find(g => g.company === currentProfile.companyName && g.label === addr.text);
                            if (existing && existing.radius) radius = existing.radius;
                        }
                        setGeofenceForm({ radius });
                        mapCircle.setRadius(radius);
                    }
                    return currentProfile;
                });
            };

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const getOpenConcernsCount = (companyName) => {
                const profile = companyProfiles[companyName] || {};
                return (profile.concerns || []).filter(c => c.status === 'Open').length;
            };

            const filteredCompanies = companies.filter(c => {
                if (activeOnly && !c.hasActive) return false;
                if (searchQuery && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            }).sort((a, b) => {
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];

                if (sortConfig.key === 'issues') {
                    valA = getOpenConcernsCount(a.name);
                    valB = getOpenConcernsCount(b.name);
                } else if (sortConfig.key === 'company') {
                    valA = a.name; valB = b.name;
                }

                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const isMultipleVisitsThisMonth = (companyName) => {
                const compVisits = visits.filter(v => v.company === companyName);
                const currentMonth = new Date().toISOString().substring(0, 7);
                const thisMonthVisits = compVisits.filter(v => v.visitDate && v.visitDate.startsWith(currentMonth));
                return thisMonthVisits.length > 1;
            };

            const getLastVisitDate = (companyName) => {
                const compVisits = visits.filter(v => v.company === companyName).sort((a, b) => new Date(b.visitDate) - new Date(a.visitDate));
                return compVisits.length > 0 ? formatToYYYYMMDD(compVisits[0].visitDate) : 'No visits recorded';
            };

            // Modal Handlers (Contacts, Issues, Profiles)
            const handleSaveContact = async (e) => {
                e.preventDefault();
                setSavingContact(true);
                try {
                    const newContactData = {
                        company: selectedCompanyContacts,
                        ...contactForm,
                        addedByIC: currentUser.assignedIC || 'Unknown',
                        createdAt: new Date().toISOString()
                    };
                    const docRef = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'contacts'), newContactData);
                    setContacts(prev => [...prev, { id: docRef.id, ...newContactData }]);

                    setContactForm({ name: '', email: '', designation: '', phone: '', fbMessenger: '' });
                } catch (err) { alert('Error saving contact: ' + err.message); }
                setSavingContact(false);
            };

            const handleDeleteContact = async (contactId) => {
                if (!window.confirm("Delete this contact?")) return;
                try { await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'contacts', contactId)); }
                catch (err) { alert("Failed to delete contact."); }
            };

            const handleSaveIssue = async (e) => {
                e.preventDefault();
                if (!issueText.trim()) return;
                setSavingIssue(true);
                try {
                    const existing = companyProfiles[selectedCompanyIssues];
                    const newConcern = {
                        date: formatToYYYYMMDD(new Date().toISOString()),
                        timestamp: Date.now(),
                        text: issueText,
                        status: 'Open',
                        addedBy: currentUser?.name || currentUser?.firstName || "IC",
                        updates: []
                    };
                    if (existing && existing.id) {
                        await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles', existing.id), {
                            concerns: arrayUnion(newConcern),
                            updatedAt: new Date().toISOString()
                        });
                        setCompanyProfiles(prev => ({ ...prev, [selectedCompanyIssues]: { ...existing, concerns: [...(existing.concerns || []), newConcern] } }));
                    } else {
                        const docRef = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles'), {
                            companyName: selectedCompanyIssues,
                            concerns: [newConcern],
                            updatedAt: new Date().toISOString()
                        });
                        setCompanyProfiles(prev => ({ ...prev, [selectedCompanyIssues]: { id: docRef.id, companyName: selectedCompanyIssues, concerns: [newConcern] } }));
                    }
                    setIssueText('');
                    setIssueFilter('Open');
                } catch (err) { alert('Error logging issue: ' + err.message); }
                finally { setSavingIssue(false); }
            };

            const handleToggleIssueStatus = async (companyName, originalIndex, currentConcern) => {
                const existing = companyProfiles[companyName];
                if (!existing) return;
                const updatedConcerns = [...existing.concerns];
                const isCurrentlyOpen = currentConcern.status === 'Open';

                if (isCurrentlyOpen) {
                    const resolution = window.prompt("Enter resolution details (Optional):");
                    if (resolution === null) return;
                    if (resolution.trim() !== "") {
                        updatedConcerns[originalIndex].updates = [
                            ...(updatedConcerns[originalIndex].updates || []),
                            { date: formatToYYYYMMDD(new Date().toISOString()), timestamp: Date.now(), text: `Resolved: ${resolution.trim()}`, addedBy: currentUser.name || "IC" }
                        ];
                    }
                } else {
                    const revertReason = window.prompt("Reason for reverting to Open (Optional):");
                    if (revertReason === null) return;
                    if (revertReason.trim() !== "") {
                        updatedConcerns[originalIndex].updates = [
                            ...(updatedConcerns[originalIndex].updates || []),
                            { date: formatToYYYYMMDD(new Date().toISOString()), timestamp: Date.now(), text: `Reverted to Open: ${revertReason.trim()}`, addedBy: currentUser.name || "IC" }
                        ];
                    }
                }

                updatedConcerns[originalIndex].status = isCurrentlyOpen ? 'Resolved' : 'Open';
                try { 
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles', existing.id), { concerns: updatedConcerns }); 
                    setCompanyProfiles(prev => ({ ...prev, [companyName]: { ...existing, concerns: updatedConcerns } }));
                }
                catch (err) { alert("Error updating status: " + err.message); }
            };

            const handleAddIssueUpdate = async (companyName, originalIndex) => {
                const updateText = window.prompt("Enter an update or progress note for this issue:");
                if (!updateText || !updateText.trim()) return;
                const existing = companyProfiles[companyName];
                if (!existing) return;
                const updatedConcerns = [...existing.concerns];
                updatedConcerns[originalIndex].updates = [
                    ...(updatedConcerns[originalIndex].updates || []),
                    { date: formatToYYYYMMDD(new Date().toISOString()), timestamp: Date.now(), text: updateText.trim(), addedBy: currentUser.name || "IC" }
                ];
                try { 
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles', existing.id), { concerns: updatedConcerns }); 
                    setCompanyProfiles(prev => ({ ...prev, [companyName]: { ...existing, concerns: updatedConcerns } }));
                }
                catch (err) { alert("Error adding update: " + err.message); }
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                setSavingProfile(true);
                try {
                    const cleanedAddresses = profileForm.addresses.filter(a => a.text.trim() !== '' || a.geolocation.trim() !== '');
                    const existing = companyProfiles[profileForm.companyName];
                    if (existing && existing.id) {
                        await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles', existing.id), { addresses: cleanedAddresses, updatedAt: new Date().toISOString() });
                        setCompanyProfiles(prev => ({ ...prev, [profileForm.companyName]: { ...existing, addresses: cleanedAddresses } }));
                    } else {
                        const docRef = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles'), { companyName: profileForm.companyName, addresses: cleanedAddresses, concerns: [], updatedAt: new Date().toISOString() });
                        setCompanyProfiles(prev => ({ ...prev, [profileForm.companyName]: { id: docRef.id, companyName: profileForm.companyName, addresses: cleanedAddresses, concerns: [] } }));
                    }

                    // Save geofence if radius is set and lat/lng exist for active address
                    const actAddr = profileForm.addresses[activeAddressIndex];
                    if (actAddr && actAddr.lat && actAddr.lng) {
                        // Find existing geofence for this exact address/label
                        const existingGeofence = geofences.find(g => g.company === profileForm.companyName && g.label === actAddr.text);
                        if (existingGeofence) {
                            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'geofences', existingGeofence.id), {
                                latitude: actAddr.lat, longitude: actAddr.lng, radius: parseInt(geofenceForm.radius)
                            });
                            setGeofences(prev => prev.map(g => g.id === existingGeofence.id ? { ...g, latitude: actAddr.lat, longitude: actAddr.lng, radius: parseInt(geofenceForm.radius) } : g));
                        } else {
                            const newGeo = { company: profileForm.companyName, label: actAddr.text || 'Primary Location', latitude: actAddr.lat, longitude: actAddr.lng, radius: parseInt(geofenceForm.radius) };
                            const docRef = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'geofences'), newGeo);
                            setGeofences(prev => [...prev, { id: docRef.id, ...newGeo }]);
                        }
                    }
                    setShowAddressModal(false);
                } catch (err) { alert('Error saving company address: ' + err.message); }
                setSavingProfile(false);
            };

            const handleBulkLogVisit = async (e) => {
                e.preventDefault();
                setSavingBulkVisit(true);
                try {
                    const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyhpiog09a-Aa9u7OGcoj7kt9F46OODalv9OFDKNOiGwiAx3YyEr6Doa7A8ok9dJZ3NCg/exec";
                    
                    const newVisits = [];
                    for (const comp of selectedCompanies) {
                        const payload = {
                            company: comp,
                            visitDate: bulkVisitForm.visitDate,
                            visitType: bulkVisitForm.visitType,
                            isKamustahan: bulkVisitForm.isKamustahan,
                            notes: bulkVisitForm.notes,
                            icName: currentUser.name || currentUser.email || 'IC',
                            timestamp: serverTimestamp()
                        };
                        const docRef = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_visits'), payload);
                        newVisits.push({ id: docRef.id, payload });
                    }
                    
                    // Webhook sync
                    if (GAS_WEBHOOK_URL && GAS_WEBHOOK_URL.startsWith("https://script.google.com")) {
                        const sheetPayload = {
                            type: "CompanyVisit", 
                            data: newVisits.map(v => ({
                                id: v.id, 
                                visitDate: v.payload.visitDate,
                                icName: v.payload.icName,
                                company: v.payload.company,
                                visitType: v.payload.visitType,
                                isKamustahan: v.payload.isKamustahan,
                                notes: v.payload.notes,
                                action: 'New Log',
                                timestamp: new Date().toLocaleString()
                            }))
                        };
                        fetch(GAS_WEBHOOK_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(sheetPayload)
                        }).catch(err => console.error("GAS Sync Error", err));
                    }

                    setShowBulkVisitModal(false);
                    setSelectedCompanies([]);
                    setBulkVisitForm({ visitDate: formatToYYYYMMDD(new Date().toISOString()), visitType: 'Face-to-Face', isKamustahan: false, notes: '' });
                } catch (err) {
                    alert('Error saving bulk visits: ' + err.message);
                }
                setSavingBulkVisit(false);
            };

            const toggleCompanySelection = (companyName) => {
                setSelectedCompanies(prev => prev.includes(companyName) ? prev.filter(c => c !== companyName) : [...prev, companyName]);
            };

            const toggleAllSelection = () => {
                if (selectedCompanies.length === filteredCompanies.length) {
                    setSelectedCompanies([]);
                } else {
                    setSelectedCompanies(filteredCompanies.map(c => c.name));
                }
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 dark:bg-slate-900">
                    {/* Header */}
                    <div className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 p-6 flex-shrink-0">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                    <Building2 className="text-primary-600" size={28} />
                                    My Company Accounts
                                </h1>
                                <p className="text-slate-500 dark:text-slate-400 mt-1 font-medium">Manage companies and trainee assignments</p>
                            </div>
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                <div className="relative w-full sm:w-64">
                                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                    <input type="text" placeholder="Search companies..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-700 border-transparent focus:bg-white dark:focus:bg-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 transition-all dark:text-white" />
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer whitespace-nowrap bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                                    <input type="checkbox" checked={activeOnly} onChange={() => setActiveOnly(!activeOnly)} className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500" />
                                    <span className="text-sm font-bold text-slate-600 dark:text-slate-300">Active Only</span>
                                </label>
                                {selectedCompanies.length > 0 && (
                                    <button onClick={() => setShowBulkVisitModal(true)} className="flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors whitespace-nowrap">
                                        <CheckSquare size={16} /> Log Visit ({selectedCompanies.length})
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Table Area */}
                    <div className="flex-1 overflow-auto p-6">
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700">
                                            <th className="p-4 w-10">
                                                <input type="checkbox" checked={filteredCompanies.length > 0 && selectedCompanies.length === filteredCompanies.length} onChange={toggleAllSelection} className="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 cursor-pointer" />
                                            </th>
                                            <th className="p-4 font-bold text-xs uppercase text-slate-500 cursor-pointer hover:text-primary-600" onClick={() => handleSort('company')}>
                                                <div className="flex items-center gap-1">Company Name {sortConfig.key === 'company' && (sortConfig.direction === 'asc' ? <ChevronUp size={14} /> : <ChevronDown size={14} />)}</div>
                                            </th>
                                            <th className="p-4 font-bold text-xs uppercase text-slate-500 cursor-pointer hover:text-primary-600" onClick={() => handleSort('lastVisit')}>
                                                <div className="flex items-center gap-1">Last Visit Date {sortConfig.key === 'lastVisit' && (sortConfig.direction === 'asc' ? <ChevronUp size={14} /> : <ChevronDown size={14} />)}</div>
                                            </th>
                                            <th className="p-4 font-bold text-xs uppercase text-slate-500 cursor-pointer hover:text-primary-600" onClick={() => handleSort('activeTrainees')}>
                                                <div className="flex items-center gap-1">Active Trainees {sortConfig.key === 'activeTrainees' && (sortConfig.direction === 'asc' ? <ChevronUp size={14} /> : <ChevronDown size={14} />)}</div>
                                            </th>
                                            <th className="p-4 font-bold text-xs uppercase text-slate-500">Company Address</th>
                                            <th className="p-4 font-bold text-xs uppercase text-slate-500 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loading ? (
                                            <tr>
                                                <td colSpan="5" className="text-center py-20">
                                                    <div className="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400">
                                                        <div className="relative flex items-center justify-center mb-4">
                                                            <img src="dualtech-logo.png" alt="Loading" className="w-16 h-16 object-contain animate-pulse opacity-90 drop-shadow-md" />
                                                            <Loader2 className="absolute text-primary-600/50 animate-spin" size={100} strokeWidth={1.5} />
                                                        </div>
                                                        <p className="font-black tracking-wider animate-pulse text-primary-600 dark:text-primary-400">LOADING COMPANIES...</p>
                                                    </div>
                                                </td>
                                            </tr>
                                        ) : filteredCompanies.length === 0 ? (
                                            <tr><td colSpan="5" className="text-center py-10 text-slate-500 dark:text-slate-400 italic">No companies found matching your criteria.</td></tr>
                                        ) : (
                                            filteredCompanies.map(comp => {
                                                const profile = companyProfiles[comp.name] || {};
                                                const openIssuesCount = getOpenConcernsCount(comp.name);
                                                const lastVisit = getLastVisitDate(comp.name);
                                                const isGold = isMultipleVisitsThisMonth(comp.name);
                                                const addresses = profile.addresses || [];
                                                const primaryAddress = addresses.length > 0 ? addresses[0].text : 'No address set';

                                                return (
                                                    <tr key={comp.name} className={`border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors ${isGold ? 'bg-amber-50 dark:bg-amber-900/20' : ''}`}>
                                                        <td className="p-4">
                                                            <input type="checkbox" checked={selectedCompanies.includes(comp.name)} onChange={() => toggleCompanySelection(comp.name)} className="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 cursor-pointer" />
                                                        </td>
                                                        <td className="p-4 font-bold text-slate-800 dark:text-slate-200 cursor-pointer" onClick={() => toggleCompanySelection(comp.name)}>{comp.name}</td>
                                                        <td className="p-4">
                                                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold ${isGold ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400 border border-amber-200 dark:border-amber-700/50' : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}`}>
                                                                <Calendar size={14} className={isGold ? 'text-amber-600 dark:text-amber-400' : ''} /> {lastVisit}
                                                                {isGold && <span className="ml-1 px-1.5 py-0.5 bg-amber-500 text-white rounded text-[9px] uppercase tracking-wider">Multiple Visits</span>}
                                                            </span>
                                                        </td>
                                                        <td className="p-4">
                                                            <button onClick={() => {
                                                                // Use the passed onNavigate function to go to Company Attendance pre-filtered
                                                                // For now, we will simulate this or rely on a state update if we pass it down
                                                                // A safe way is to fire a custom event or callback
                                                                if (typeof onNavigate === 'function') {
                                                                    onNavigate('company_attendance', comp.name);
                                                                }
                                                            }} className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-400 font-bold hover:bg-blue-200 transition-colors cursor-pointer group relative">
                                                                {comp.activeTrainees}
                                                                <span className="absolute bottom-full mb-2 hidden group-hover:block w-max bg-slate-800 text-white text-xs px-2 py-1 rounded">View Trainees</span>
                                                            </button>
                                                        </td>
                                                        <td className="p-4">
                                                            <button onClick={() => {
                                                                const compGeofences = geofences.filter(g => g.company === comp.name);
                                                                let existingAddresses = profile.addresses && profile.addresses.length > 0 ? [...profile.addresses] : [];
                                                                
                                                                compGeofences.forEach(gf => {
                                                                    const exists = existingAddresses.find(a => a.text === gf.label);
                                                                    if (!exists) {
                                                                        existingAddresses.push({
                                                                            text: gf.label,
                                                                            geolocation: `https://www.google.com/maps?q=${gf.latitude},${gf.longitude}`,
                                                                            lat: gf.latitude,
                                                                            lng: gf.longitude
                                                                        });
                                                                    }
                                                                });

                                                                if (existingAddresses.length === 0) {
                                                                    existingAddresses.push({ text: '', geolocation: '' });
                                                                }

                                                                setProfileForm({ companyName: comp.name, addresses: existingAddresses, assignedICs: profile.assignedICs || '' });
                                                                setActiveAddressIndex(0);
                                                                setShowAddressModal(true);
                                                            }} className="text-sm text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 hover:underline flex items-center gap-2 truncate max-w-xs text-left">
                                                                <MapPin size={16} className="shrink-0 text-slate-400" />
                                                                <span className="truncate">{primaryAddress}</span>
                                                            </button>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex items-center justify-center gap-2">
                                                                <button onClick={() => { setSelectedCompanyContacts(comp.name); setShowContactsModal(true); }} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg transition-colors tooltip" title="Contacts">
                                                                    <Users size={18} />
                                                                </button>
                                                                <button onClick={() => { setSelectedCompanyIssues(comp.name); setShowIssuesModal(true); }} className={`p-2 rounded-lg transition-colors tooltip ${openIssuesCount > 0 ? 'text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20' : 'text-slate-400 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-slate-700'}`} title="Issues">
                                                                    <div className="relative">
                                                                        <AlertTriangle size={18} className={openIssuesCount > 0 ? 'animate-pulse' : ''} />
                                                                        {openIssuesCount > 0 && <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span></span>}
                                                                    </div>
                                                                </button>
                                                                <button onClick={() => { setHistoryModalCompany(comp.name); }} className="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-slate-700 rounded-lg transition-colors tooltip" title="Visit History">
                                                                    <History size={18} />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Visit History Modal */}
                    {historyModalCompany && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" onClick={() => setHistoryModalCompany(null)}>
                            <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-6 border-b border-slate-100 dark:border-slate-700">
                                    <div>
                                        <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><History className="text-emerald-500" /> Visit History</h3>
                                        <p className="text-slate-500 text-sm mt-1">{historyModalCompany}</p>
                                    </div>
                                    <button onClick={() => setHistoryModalCompany(null)} className="text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-full transition-colors"><X size={20} /></button>
                                </div>
                                <div className="p-6 overflow-y-auto">
                                    {visits.filter(v => v.company === historyModalCompany).sort((a, b) => new Date(b.visitDate) - new Date(a.visitDate)).length === 0 ? (
                                        <div className="text-center py-10 text-slate-400 italic">No visit history found.</div>
                                    ) : (
                                        <div className="space-y-4">
                                            {visits.filter(v => v.company === historyModalCompany).sort((a, b) => new Date(b.visitDate) - new Date(a.visitDate)).map(v => (
                                                <div key={v.id} className="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-100 dark:border-slate-600">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div className="font-bold text-slate-700 dark:text-slate-200">
                                                            {v.visitDate}
                                                            {v.icName && <div className="text-xs font-medium text-slate-500 mt-0.5">Logged by: {v.icName}</div>}
                                                        </div>
                                                        <span className={`px-2 py-1 rounded text-[10px] font-bold uppercase ${v.visitType === 'Face-to-Face' ? 'bg-violet-100 text-violet-700' : 'bg-sky-100 text-sky-700'}`}>{v.visitType}</span>
                                                    </div>
                                                    {v.isKamustahan && <div className="mb-2"><span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase inline-block">Kamustahan</span></div>}
                                                    <p className="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap">{v.notes || 'No notes provided.'}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Contacts Modal */}
                    {showContactsModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" onClick={() => setShowContactsModal(false)}>
                            <div className="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-4xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-6 border-b border-slate-100 dark:border-slate-700">
                                    <div>
                                        <h3 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2"><Users className="text-blue-500" /> Company Contacts</h3>
                                        <p className="text-slate-500 text-sm mt-1">{selectedCompanyContacts}</p>
                                    </div>
                                    <button onClick={() => setShowContactsModal(false)} className="text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-full transition-colors"><X size={20} /></button>
                                </div>
                                <div className="p-6 overflow-y-auto flex flex-col lg:flex-row gap-6">
                                    <div className="w-full lg:w-1/3">
                                        <form onSubmit={handleSaveContact} className="bg-slate-50 dark:bg-slate-700/30 p-5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-4">
                                            <h4 className="font-bold text-slate-700 dark:text-slate-300 mb-2">Add New Contact</h4>

        // 3. Weekly Attendance Progress

            { week: 'Week 5 (29th+)', short: 'W5', completed: 0, noClock: 0, total: 0, start: 29, end: new Date(currentYear, currentMonth + 1, 0).getDate(), completedList: [], noClockList: [] },
        ];

        const registeredTrainees = myActiveTrainees.filter(t => t.isRegistered);
        const currentMonthStr = String(currentMonth + 1).padStart(2, '0');

        registeredTrainees.forEach(trainee => {
            const tLogs = allLogs.filter(l => (trainee.uid && l.uid === trainee.uid) || l.traineeId === String(trainee.studentId) || l.studentId === String(trainee.studentId));
            const tSchooling = allSchooling.filter(s => s.studentId === trainee.studentId);
            const tRequests = allLeaveRequests.filter(r => r.studentId === trainee.studentId && (r.status === 'Approved' || r.icStatus === 'Approved'));
            const compSettings = companySettings[trainee.company || trainee['Company Name']] || {};
            
            const formatDateLocal = (dateStr) => {
                if (!dateStr) return '';
                if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return dateStr;
                let p = dateStr;
                if (typeof p === 'string' && !p.includes('T')) p = p.replace(/-/g, '/');
                const d = new Date(p);
                if (isNaN(d.getTime())) return String(dateStr);
                if (typeof dateStr === 'string' && dateStr.includes('T')) {
                    const offset = d.getTimezoneOffset() * 60000;
                    return new Date(d.getTime() - offset).toISOString().split('T')[0];
                }
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${d.getFullYear()}-${mm}-${dd}`;
            };

            const processDayMini = (dateString) => {
                const dayLogs = tLogs.filter(l => l.dateString === dateString || l.date === dateString || (l.id && l.id.startsWith(dateString)));
                let timeIn = null, timeOut = null;
                dayLogs.forEach(l => {
                    if (l.type === 'IN') timeIn = l.timestamp;
                    if (l.type === 'OUT') timeOut = l.timestamp;
                });

                let isSchoolingDay = false;
                tSchooling.forEach(s => {
                    let match = s.date === dateString;
                    if (!match && s.timestamp) {
                        const d = new Date(s.timestamp);
                        if (!isNaN(d.getTime())) {
                            match = d.toISOString().startsWith(dateString);
                        }
                    }
                    if (match) {
                        if (['Present', 'Late', 'Verified'].includes(s.status)) isSchoolingDay = true;
                    }
                });

                let isExcused = false;
                tRequests.forEach(r => {
                    const rDate = formatDateLocal(r.date);
                    const tDate = formatDateLocal(r.targetDate);
                    const lDate = formatDateLocal(r.leaveDate);
                    if ((r.type?.toLowerCase().includes('leave') || r.type?.toLowerCase().includes('absence') || r.requestType?.toLowerCase().includes('leave')) &&
                        (rDate === dateString || tDate === dateString || lDate === dateString || String(r.date).includes(dateString))) {
                        if (r.status === 'Approved') {
                            isExcused = true;
                        }
                    }
                });

                let hours = 0;
                if (timeIn && timeOut) {
                    hours = (new Date(timeOut) - new Date(timeIn)) / (1000 * 60 * 60);
                    if (compSettings.applyBreak && hours > 4) hours -= (compSettings.breakMinutes / 60);
                }

                const dateObj = new Date(dateString);
                const dayOfWeekNum = dateObj.getDay();
                const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const traineeRestDay = (trainee.restDay || '').trim().toLowerCase();
                let isRestDay = false;
                if (traineeRestDay === dayNames[dayOfWeekNum].toLowerCase()) isRestDay = true;
                else if ((traineeRestDay === '' || traineeRestDay === 'weekend') && (dayOfWeekNum === 0 || dayOfWeekNum === 6)) isRestDay = true;

                let isHoliday = globalHolidays.some(h => h.date === dateString);
                if (compSettings.customHolidays && compSettings.customHolidays.find(h => h.date === dateString)) isHoliday = true;

                return { timeIn, timeOut, hours, isSchoolingDay, isExcused, isRestDay, isHoliday };
            };

            const currentDate = today.getDate();

            weeklyAttendanceProgress.forEach(wp => {
                if (wp.start > currentDate && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    return;
                }
                
                wp.total++;

                let expected = 0;
                let present = 0;
                let hasClock = false;

                let missingDates = [];
                
                const curDateObj = new Date();
                const curMonthCheck = curDateObj.getMonth();
                const curYearCheck = curDateObj.getFullYear();
                const curDay = curDateObj.getDate();
                
                let actualEnd = wp.end;
                let skipWeek = false;

                if (currentYear > curYearCheck || (currentYear === curYearCheck && currentMonth > curMonthCheck)) {
                    skipWeek = true;
                } else if (currentYear === curYearCheck && currentMonth === curMonthCheck) {
                    if (wp.start > curDay) skipWeek = true;
                    actualEnd = Math.min(wp.end, curDay);
                }

                if (skipWeek) return;

                for (let day = wp.start; day <= actualEnd; day++) {
                    const dStr = `${currentYear}-${currentMonthStr}-${String(day).padStart(2, '0')}`;
                    const stats = processDayMini(dStr);

                    if (stats.isRestDay || stats.isHoliday) {
                        if (stats.timeIn) { present++; hasClock = true; }
                    } else {
                        expected++;
                        if (stats.isSchoolingDay) {
                            present++;
                        } else if (stats.hours >= 8) {
                            present++;
                            hasClock = true;
                        } else {
                            if (stats.timeIn) hasClock = true;
                            
                            if (stats.isExcused) {
                                expected--; // Excused absences reduce expected days
                            } else {
                                if (stats.timeIn && stats.hours < 8) {
                                    missingDates.push({ date: dStr, status: 'Incomplete Hours' });
                                } else if (!stats.timeIn && !stats.isSchoolingDay) {
                                    missingDates.push({ date: dStr, status: 'AWOL/Absent' });
                                }
                            }
                        }
                    }
                }

                if (expected > 0 && missingDates.length === 0) {
                    wp.completed++;
                    wp.completedList.push({ 
                        name: trainee.name || (trainee.lastName ? `${trainee.lastName}, ${trainee.firstName}` : '') || trainee['Trainee Name'] || 'Unknown Trainee', 
                        id: trainee.studentId || trainee['Student ID#'] || '',
                        company: trainee.company || trainee['Company Name'] || 'Unassigned' 
                    });
                } else if (expected > 0 && missingDates.length > 0) {
                    wp.noClock++;
                    wp.noClockList.push({ 
                        name: trainee.name || (trainee.lastName ? `${trainee.lastName}, ${trainee.firstName}` : '') || trainee['Trainee Name'] || 'Unknown Trainee', 
                        id: trainee.studentId || trainee['Student ID#'] || '',
                        company: trainee.company || trainee['Company Name'] || 'Unassigned',

                    });
                }
            });

            { week: 'Week 2 (8th-14th)', short: 'W2', f2f: 0, online: 0, kamustahan: 0 },
            { week: 'Week 3 (15th-21st)', short: 'W3', f2f: 0, online: 0, kamustahan: 0 },
            { week: 'Week 4 (22nd-28th)', short: 'W4', f2f: 0, online: 0, kamustahan: 0 },
            { week: 'Week 5 (29th+)', short: 'W5', f2f: 0, online: 0, kamustahan: 0 },
        ];
        mtdCompanyVisits.forEach(v => {
            const d = new Date(v.visitDate || v.timestamp);
            const day = d.getDate();
            let weekIdx = 0;
            if (day >= 8 && day <= 14) weekIdx = 1;
            else if (day >= 15 && day <= 21) weekIdx = 2;
            else if (day >= 22 && day <= 28) weekIdx = 3;
            else if (day >= 29) weekIdx = 4;
            
            if (v.visitType === 'Online') {
                weeklyCompanyProgress[weekIdx].online++;
            } else {
                weeklyCompanyProgress[weekIdx].f2f++;
            }
            
            if (v.isKamustahan) {
                weeklyCompanyProgress[weekIdx].kamustahan++;
            }
        });

        const maxCompVal = Math.max(1, ...weeklyCompanyProgress.map(wp => Math.max(wp.f2f, wp.online, wp.kamustahan)));


        // SVG Line Graph Calculations
        const maxVal = Math.max(1, ...weeklyProgress.map(wp => Math.max(wp.f2f, wp.online)));
        const graphHeight = 200;
        const graphWidth = 800;
        const paddingX = 40;
        const paddingY = 40;
        const usableHeight = graphHeight - paddingY * 2;
        const usableWidth = graphWidth - paddingX * 2;
        const stepX = usableWidth / (weeklyProgress.length - 1);
        

        const f2fPoints = weeklyProgress.map((wp, i) => `${paddingX + i * stepX},${graphHeight - paddingY - (wp.f2f / maxVal) * usableHeight}`).join(' ');
        const onlinePoints = weeklyProgress.map((wp, i) => `${paddingX + i * stepX},${graphHeight - paddingY - (wp.online / maxVal) * usableHeight}`).join(' ');

        const compF2fPoints = weeklyCompanyProgress.map((wp, i) => `${paddingX + i * stepX},${graphHeight - paddingY - (wp.f2f / maxCompVal) * usableHeight}`).join(' ');
        const compOnlinePoints = weeklyCompanyProgress.map((wp, i) => `${paddingX + i * stepX},${graphHeight - paddingY - (wp.online / maxCompVal) * usableHeight}`).join(' ');
        const compKamustahanPoints = weeklyCompanyProgress.map((wp, i) => `${paddingX + i * stepX},${graphHeight - paddingY - (wp.kamustahan / maxCompVal) * usableHeight}`).join(' ');


        return (

                    <div className="flex justify-between items-center w-full">
                        <h1 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                            <LayoutDashboard className="text-primary-600" />
                            Performance Dashboard
                        </h1>
                        <button 
                            onClick={loadData}
                            disabled={isRefreshing}
                            className={`flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl transition-colors text-sm font-bold shadow-sm border border-slate-200 dark:border-slate-700 ${isRefreshing ? 'opacity-50 cursor-not-allowed' : ''}`}

                        {modalType === 'companies' && (

                                    <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">

                                            <Building2 className="text-emerald-600" size={24} /> 
                                            Companies Visited Details
                                        </h2>

                                            <X size={20} />

                                    <div className="p-6 overflow-y-auto custom-scrollbar bg-slate-100/50 dark:bg-slate-900/20">

                                                    <div>
                                                        <div className="font-bold text-slate-800 dark:text-slate-200">{c.company}</div>
                                                        {c.visited && c.dates.length > 0 && (
                                                            <div className="text-xs text-slate-500 mt-1">Visited: {c.dates.join(', ')} ({c.timesVisited} time{c.timesVisited > 1 ? 's' : ''})</div>
                                                        )}
                                                    </div>
                                                    {c.visited ? (
                                                        <div className="flex flex-wrap gap-2">
                                                            {c.f2f > 0 && <span className="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">Face-to-Face ({c.f2f})</span>}
                                                            {c.online > 0 && <span className="bg-sky-100 text-sky-800 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">Online ({c.online})</span>}
                                                            {c.kamustahan > 0 && <span className="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">Kamustahan ({c.kamustahan})</span>}
                                                        </div>

                                                        <span className="text-orange-500 font-bold text-sm bg-orange-100 dark:bg-orange-900/30 px-3 py-1 rounded-full self-start sm:self-center whitespace-nowrap">Yet to Visit</span>
