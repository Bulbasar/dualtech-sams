                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </div>
        );
    } catch(err) {
        return <div className="p-10 text-red-500 font-bold bg-white">ERROR in DashboardTab: {err.message} - {err.stack}</div>;
    }
}




// =================== SCHEDULE REQUESTS TAB ===================
        function ScheduleRequestsTab({ currentUser }) {
    const [requests, setRequests] = useState([]);
    const [loading, setLoading] = useState(true);
    const [statusFilter, setStatusFilter] = useState('Pending');
    const [searchQuery, setSearchQuery] = useState('');
    const [rejectingId, setRejectingId] = useState(null);
    const [rejectionReason, setRejectionReason] = useState('');
    const [processingId, setProcessingId] = useState(null);
    const [selectedIds, setSelectedIds] = useState([]);
    const [bulkProcessing, setBulkProcessing] = useState(false);
    const [showBulkRejectModal, setShowBulkRejectModal] = useState(false);
    const [bulkRejectReason, setBulkRejectReason] = useState('');
    const [traineesMap, setTraineesMap] = useState({});

    useEffect(() => {
        const myId = currentUser.assignedIC || currentUser.name || currentUser.firstName || currentUser.email;

        const qTrainees = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainees'), where('assignedIC', '==', myId));
        getDocs(qTrainees).then(tSnap => {
            const tMap = {};
            tSnap.forEach(d => {
                const data = d.data();
                tMap[d.id] = {
                    schoolingDay: data.schoolingDay || data['Schooling Day'] || 'N/A',
                    restDay: data.restDay || data['Rest Day'] || 'N/A'
                };
            });
            setTraineesMap(tMap);
        }).catch(console.error);

        const q = query(
            collection(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests'),
            where('assignedIC', '==', myId)
        );
        const unsub = onSnapshot(q, (snap) => {
            const reqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            reqs.sort((a, b) => {
                const ta = a.requestedAt?.toDate ? a.requestedAt.toDate().getTime() : (a.requestedAt || 0);
                const tb = b.requestedAt?.toDate ? b.requestedAt.toDate().getTime() : (b.requestedAt || 0);
                return tb - ta;
            });
            setRequests(reqs);
            setLoading(false);
        });
        return () => unsub();
    }, [currentUser]);

    const filteredRequests = useMemo(() => {
        let filtered = requests;
        if (statusFilter !== 'All') filtered = filtered.filter(r => r.status === statusFilter);
        if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            filtered = filtered.filter(r => 
                (r.traineeName || '').toLowerCase().includes(q) ||
                (r.traineeId || '').toLowerCase().includes(q)
            );
        }
        return filtered;
    }, [requests, statusFilter, searchQuery]);

    const pendingCount = requests.filter(r => r.status === 'Pending').length;
    const pendingFiltered = filteredRequests.filter(r => r.status === 'Pending');
    const selectedPendingCount = selectedIds.filter(id => pendingFiltered.some(r => r.id === id)).length;

    // Clear selection when filter changes
    useEffect(() => { setSelectedIds([]); }, [statusFilter, searchQuery]);

    const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    };

    const toggleSelectAll = () => {
        const allPendingIds = pendingFiltered.map(r => r.id);
        const allSelected = allPendingIds.every(id => selectedIds.includes(id));
        if (allSelected) {
            setSelectedIds(prev => prev.filter(id => !allPendingIds.includes(id)));
        } else {
            setSelectedIds(prev => [...new Set([...prev, ...allPendingIds])]);
        }
    };

    const handleApprove = async (req) => {
        setProcessingId(req.id);
        try {
            const reqRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests', req.id);
            await updateDoc(reqRef, {
                status: 'Approved',
                reviewedAt: serverTimestamp(),
                reviewedBy: currentUser.name || currentUser.firstName || currentUser.email || 'IC'
            });
            if (req.traineeDocId) {
                const traineeRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainees', req.traineeDocId);
                await updateDoc(traineeRef, {
                    schoolingDay: req.requestedSchoolingDay,
                    'Schooling Day': req.requestedSchoolingDay,
                    restDay: req.requestedRestDay,
                    'Rest Day': req.requestedRestDay
                });
            }
        } catch (err) {
            console.error('Error approving schedule request:', err);
            alert('Failed to approve request. Please try again.');
        } finally {
            setProcessingId(null);
        }
    };

    const handleReject = async (req) => {
        if (!rejectionReason.trim()) {
            alert('Please provide a reason for rejection.');
            return;
        }
        setProcessingId(req.id);
        try {
            const reqRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests', req.id);
            await updateDoc(reqRef, {
                status: 'Rejected',
                rejectionReason: rejectionReason.trim(),
                reviewedAt: serverTimestamp(),
                reviewedBy: currentUser.name || currentUser.firstName || currentUser.email || 'IC'
            });
            setRejectingId(null);
            setRejectionReason('');
        } catch (err) {
            console.error('Error rejecting schedule request:', err);
            alert('Failed to reject request. Please try again.');
        } finally {
            setProcessingId(null);
        }
    };

    const handleBulkApprove = async () => {
        if (selectedIds.length === 0) return;
        if (!confirm(`Are you sure you want to approve ${selectedIds.length} selected request(s)?`)) return;
        setBulkProcessing(true);
        const reviewedBy = currentUser.name || currentUser.firstName || currentUser.email || 'IC';
        let successCount = 0;
        for (const id of selectedIds) {
            const req = requests.find(r => r.id === id && r.status === 'Pending');
            if (!req) continue;
            try {
                const reqRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests', id);
                await updateDoc(reqRef, { status: 'Approved', reviewedAt: serverTimestamp(), reviewedBy });
                if (req.traineeDocId) {
                    const traineeRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainees', req.traineeDocId);
                    await updateDoc(traineeRef, { 
                        schoolingDay: req.requestedSchoolingDay,
                        'Schooling Day': req.requestedSchoolingDay,
                        restDay: req.requestedRestDay,
                        'Rest Day': req.requestedRestDay
                    });
                }
                successCount++;
            } catch (err) { console.error('Bulk approve error for', id, err); }
        }
        setSelectedIds([]);
        setBulkProcessing(false);
        alert(`Successfully approved ${successCount} of ${selectedIds.length} request(s).`);
    };

    const handleBulkReject = async () => {
        if (!bulkRejectReason.trim()) { alert('Please provide a reason for rejection.'); return; }
        setBulkProcessing(true);
        const reviewedBy = currentUser.name || currentUser.firstName || currentUser.email || 'IC';
        let successCount = 0;
        for (const id of selectedIds) {
            const req = requests.find(r => r.id === id && r.status === 'Pending');
            if (!req) continue;
            try {
                const reqRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests', id);
                await updateDoc(reqRef, { status: 'Rejected', rejectionReason: bulkRejectReason.trim(), reviewedAt: serverTimestamp(), reviewedBy });
                successCount++;
            } catch (err) { console.error('Bulk reject error for', id, err); }
        }
        setSelectedIds([]);
        setBulkProcessing(false);
        setShowBulkRejectModal(false);
        setBulkRejectReason('');
        alert(`Successfully rejected ${successCount} of ${selectedIds.length} request(s).`);
    };

    if (loading) return (
        <div className="flex-1 overflow-y-auto p-6 flex items-center justify-center">
            <div className="text-center">
                <Loader2 className="animate-spin text-primary-600 mx-auto mb-3" size={32} />
                <p className="text-sm font-bold text-slate-500 dark:text-slate-400">Loading schedule requests...</p>
            </div>
        </div>
    );

    return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
            {/* Header */}
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                        <Calendar className="text-primary-600" size={24} /> Schedule Requests
                    </h2>
                    <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Review and approve trainee schedule change requests.</p>
                </div>
                {pendingCount > 0 && (
                    <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl px-4 py-2 flex items-center gap-2">
                        <AlertTriangle size={16} className="text-amber-500" />
                        <span className="text-sm font-bold text-amber-700 dark:text-amber-300">{pendingCount} pending request{pendingCount !== 1 ? 's' : ''}</span>
                    </div>
                )}
            </div>

            {/* Filters + Bulk Actions Bar */}
            <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 space-y-3">
                <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div className="flex gap-2 flex-wrap">
                        {['Pending', 'Approved', 'Rejected', 'All'].map(f => (
                            <button key={f} onClick={() => setStatusFilter(f)} className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${
                                statusFilter === f
                                    ? f === 'Pending' ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 ring-1 ring-amber-300'
                                    : f === 'Approved' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300 ring-1 ring-emerald-300'
                                    : f === 'Rejected' ? 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300 ring-1 ring-red-300'
                                    : 'bg-primary-100 text-primary-800 dark:bg-primary-900/40 dark:text-primary-300 ring-1 ring-primary-300'
                                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'
                            }`}>
                                {f}
                                {f === 'Pending' && pendingCount > 0 && <span className="ml-1.5 bg-amber-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full">{pendingCount}</span>}
                            </button>
                        ))}
                    </div>
                    <div className="relative w-full md:w-72">
                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} />
                        <input type="text" placeholder="Search by name or ID..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                            className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 dark:focus:ring-primary-900/40 text-slate-800 dark:text-slate-100" />
                    </div>
                </div>

                {/* Bulk Actions Bar */}
                {pendingFiltered.length > 0 && (
                    <div className="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 rounded-xl p-3 border border-slate-200 dark:border-slate-700">
                        <div className="flex items-center gap-3">
                            <button onClick={toggleSelectAll} className="flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-primary-600 transition-colors">
                                <div className={`w-5 h-5 rounded border-2 flex items-center justify-center transition-all ${
                                    pendingFiltered.length > 0 && pendingFiltered.every(r => selectedIds.includes(r.id))
                                        ? 'bg-primary-600 border-primary-600 text-white' : 'border-slate-300 dark:border-slate-600'
                                }`}>
                                    {pendingFiltered.length > 0 && pendingFiltered.every(r => selectedIds.includes(r.id)) && <Check size={14} />}
                                </div>
                                Select All Pending ({pendingFiltered.length})
                            </button>
                            {selectedPendingCount > 0 && (
                                <span className="text-xs font-bold text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-900/30 px-2.5 py-1 rounded-full">
                                    {selectedPendingCount} selected
                                </span>
                            )}
                        </div>
                        {selectedPendingCount > 0 && (
                            <div className="flex gap-2">
                                <button onClick={handleBulkApprove} disabled={bulkProcessing}
                                    className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl hover:bg-emerald-700 disabled:opacity-50 transition-all text-sm flex items-center gap-2 shadow-sm">
                                    {bulkProcessing ? <Loader2 className="animate-spin" size={14} /> : <CheckCircle2 size={14} />}
                                    Approve ({selectedPendingCount})
                                </button>
                                <button onClick={() => setShowBulkRejectModal(true)} disabled={bulkProcessing}
                                    className="bg-red-600 text-white font-bold px-4 py-2 rounded-xl hover:bg-red-700 disabled:opacity-50 transition-all text-sm flex items-center gap-2 shadow-sm">
                                    <XCircle size={14} /> Reject ({selectedPendingCount})
                                </button>
                            </div>
                        )}
                    </div>
                )}
            </div>

            {/* Request Cards */}
            {filteredRequests.length === 0 ? (
                <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-12 text-center">
                    <Calendar size={48} className="text-slate-300 dark:text-slate-600 mx-auto mb-4" />
                    <p className="text-slate-500 dark:text-slate-400 font-bold">No {statusFilter.toLowerCase()} schedule requests found.</p>
                    <p className="text-xs text-slate-400 dark:text-slate-500 mt-1">Schedule change requests from your trainees will appear here.</p>
                </div>
            ) : (
                <div className="space-y-4">
                    {filteredRequests.map(req => (
                        <div key={req.id} className={`bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden transition-all hover:shadow-md ${
                            selectedIds.includes(req.id) ? 'ring-2 ring-primary-400 dark:ring-primary-600' :
                            req.status === 'Pending' ? 'border-amber-200 dark:border-amber-800/50' :
                            req.status === 'Approved' ? 'border-emerald-200 dark:border-emerald-800/50' :
                            'border-red-200 dark:border-red-800/50'
                        }`}>
                            {/* Card Header */}
                            <div className={`px-5 py-3 flex items-center justify-between ${
                                req.status === 'Pending' ? 'bg-amber-50 dark:bg-amber-900/10 border-b border-amber-100 dark:border-amber-800/30' :
                                req.status === 'Approved' ? 'bg-emerald-50 dark:bg-emerald-900/10 border-b border-emerald-100 dark:border-emerald-800/30' :
                                'bg-red-50 dark:bg-red-900/10 border-b border-red-100 dark:border-red-800/30'
                            }`}>
                                <div className="flex items-center gap-3">
                                    {/* Checkbox for pending items */}
                                    {req.status === 'Pending' && (
                                        <button onClick={() => toggleSelect(req.id)} className={`w-5 h-5 rounded border-2 flex items-center justify-center transition-all shrink-0 ${
                                            selectedIds.includes(req.id) ? 'bg-primary-600 border-primary-600 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-primary-400'

                                            {selectedIds.includes(req.id) && <Check size={14} />}

                                    )}
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-white font-black text-sm ${
                                        req.status === 'Pending' ? 'bg-amber-500' :
                                        req.status === 'Approved' ? 'bg-emerald-500' : 'bg-red-500'
                                    }`}>
                                        {(req.traineeName || '?')[0].toUpperCase()}
                                    </div>
                                    <div>
                                        <p className="font-bold text-slate-800 dark:text-white text-sm">{req.traineeName || 'Unknown Trainee'}</p>
                                        <p className="text-[10px] text-slate-500 dark:text-slate-400 font-mono">{req.traineeId || '--'}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${
                                        req.status === 'Pending' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' :
                                        req.status === 'Approved' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' :
                                        'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300'
                                    }`}>{req.status}</span>
                                    <span className="text-[10px] text-slate-400 dark:text-slate-500">
                                        {req.requestedAt?.toDate ? req.requestedAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '--'}
                                    </span>
                                </div>
                            </div>

                            {/* Card Body */}
                            <div className="p-5 space-y-4">
                                {/* Schedule Change Visual */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase mb-2">Schooling Day</p>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 px-3 py-1.5 rounded-lg text-sm font-bold border border-blue-200 dark:border-blue-800">{traineesMap[req.traineeDocId]?.schoolingDay || req.currentSchoolingDay || 'N/A'}</span>
                                            <ArrowRight size={16} className="text-slate-400" />
                                            <span className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-black shadow-sm">{req.requestedSchoolingDay}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase mb-2">Rest Day</p>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-lg text-sm font-bold border border-emerald-200 dark:border-emerald-800">{traineesMap[req.traineeDocId]?.restDay || req.currentRestDay || 'N/A'}</span>
                                            <ArrowRight size={16} className="text-slate-400" />
                                            <span className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-black shadow-sm">{req.requestedRestDay}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Reason */}
                                <div className="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-3 border border-slate-200 dark:border-slate-700">
                                    <p className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase mb-1">Reason</p>
                                    <p className="text-sm text-slate-700 dark:text-slate-300">{req.reason || 'No reason provided.'}</p>
                                </div>

                                {/* Review Info (for Approved/Rejected) */}
                                {req.status !== 'Pending' && (
                                    <div className={`rounded-xl p-3 border text-sm ${
                                        req.status === 'Approved' ? 'bg-emerald-50 dark:bg-emerald-900/10 border-emerald-200 dark:border-emerald-800' : 'bg-red-50 dark:bg-red-900/10 border-red-200 dark:border-red-800'
                                    }`}>
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{req.status === 'Approved' ? 'Approved' : 'Rejected'} by: {req.reviewedBy || '--'}</span>
                                            <span className="text-[10px] text-slate-400">{req.reviewedAt?.toDate ? req.reviewedAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '--'}</span>
                                        </div>
                                        {req.status === 'Rejected' && req.rejectionReason && (
                                            <p className="text-xs text-red-600 dark:text-red-400 mt-1">Reason: {req.rejectionReason}</p>
                                        )}
                                    </div>
                                )}

                                {/* Action Buttons (Pending only) */}
                                {req.status === 'Pending' && (
                                    <div>
                                        {rejectingId === req.id ? (
                                            <div className="space-y-3">
                                                <textarea
                                                    value={rejectionReason}
                                                    onChange={e => setRejectionReason(e.target.value)}
                                                    placeholder="Enter reason for rejection..."
                                                    rows={2}
                                                    className="w-full p-3 rounded-xl border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/10 text-sm outline-none focus:border-red-400 focus:ring-2 focus:ring-red-100 dark:focus:ring-red-900/40 resize-none text-slate-800 dark:text-slate-100 placeholder-red-300"
                                                />
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setRejectingId(null); setRejectionReason(''); }} className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-sm">
                                                        Cancel
                                                    </button>
                                                    <button onClick={() => handleReject(req)} disabled={processingId === req.id || !rejectionReason.trim()} className="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl hover:bg-red-700 disabled:opacity-50 transition-colors text-sm flex items-center justify-center gap-2">
                                                        {processingId === req.id ? <><Loader2 className="animate-spin" size={16} /> Processing...</> : <><XCircle size={16} /> Confirm Reject</>}
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex gap-3">
                                                <button onClick={() => handleApprove(req)} disabled={processingId === req.id} className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-700 disabled:opacity-50 transition-all shadow-sm flex items-center justify-center gap-2 text-sm">
                                                    {processingId === req.id ? <><Loader2 className="animate-spin" size={16} /> Approving...</> : <><CheckCircle2 size={16} /> Approve</>}
                                                </button>
                                                <button onClick={() => setRejectingId(req.id)} disabled={processingId === req.id} className="flex-1 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 font-bold py-2.5 rounded-xl hover:bg-red-100 dark:hover:bg-red-900/30 disabled:opacity-50 transition-all text-sm flex items-center justify-center gap-2">
                                                    <XCircle size={16} /> Reject
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            )}

            {/* Bulk Reject Modal */}
            {showBulkRejectModal && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) { setShowBulkRejectModal(false); setBulkRejectReason(''); } }}>
                    <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-800 animate-in zoom-in-95 duration-200">
                        <div className="p-5 border-b border-slate-100 dark:border-slate-800 bg-red-50 dark:bg-red-900/10">
                            <h3 className="font-black text-red-800 dark:text-red-200 text-lg flex items-center gap-2"><XCircle size={20} /> Bulk Reject</h3>
                            <p className="text-xs text-red-600 dark:text-red-400 mt-1">Rejecting {selectedPendingCount} selected request(s). This action cannot be undone.</p>
                        </div>
                        <div className="p-5 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1.5">Rejection Reason <span className="text-red-500">*</span></label>
                                <textarea value={bulkRejectReason} onChange={e => setBulkRejectReason(e.target.value)} placeholder="Enter a reason that will apply to all selected requests..." rows={3}
                                    className="w-full p-3 rounded-xl border border-red-200 dark:border-red-800 bg-white dark:bg-slate-800 text-sm outline-none focus:border-red-400 focus:ring-2 focus:ring-red-100 dark:focus:ring-red-900/40 resize-none text-slate-800 dark:text-slate-100 placeholder-slate-400" />
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => { setShowBulkRejectModal(false); setBulkRejectReason(''); }} className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-sm">
                                    Cancel
                                </button>
                                <button onClick={handleBulkReject} disabled={bulkProcessing || !bulkRejectReason.trim()} className="flex-1 bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 disabled:opacity-50 transition-colors text-sm flex items-center justify-center gap-2">
                                    {bulkProcessing ? <><Loader2 className="animate-spin" size={16} /> Processing...</> : <><XCircle size={16} /> Reject {selectedPendingCount} Request(s)</>}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}





const AbsenceRequestsTab = ({ currentUser, db, appId }) => {
    const safeISO = (d) => {
        if (!d) return 'N/A';
        const date = new Date(d);
        return isNaN(date.getTime()) ? String(d) : date.toISOString().split('T')[0];
    };
    const [requests, setRequests] = useState([]);
    const [loading, setLoading] = useState(true);
    const [searchTrainee, setSearchTrainee] = useState('');
    const [searchCompany, setSearchCompany] = useState('');
    const [filterStatus, setFilterStatus] = useState('All');
    const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

    const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
            direction = 'desc';
        }
        setSortConfig({ key, direction });
    };

    const ModalSortIcon = ({ columnKey }) => {
        if (sortConfig.key !== columnKey) return <ChevronDown size={14} className="inline opacity-20" />;
        return sortConfig.direction === 'asc' ? <ChevronUp size={14} className="inline text-blue-500" /> : <ChevronDown size={14} className="inline text-blue-500" />;
    };

    
    // Action modal state
    const [actionModal, setActionModal] = useState({ isOpen: false, requests: [], actionType: '' });
    const [actionRemark, setActionRemark] = useState('');
    const [isProcessing, setIsProcessing] = useState(false);
    const [selectedRequests, setSelectedRequests] = useState(new Set());

    useEffect(() => {
        if (!currentUser) return;
        
        const fetchRequests = async () => {
            try {
                // Fetch trainees assigned to this IC
                const traineesSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'trainees'));
                const allTrainees = traineesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const activeTrs = allTrainees.filter(t => t.assignedIC === currentUser.assignedIC && String(t.status || 'Active').toLowerCase() === 'active');
                
                const studentIds = activeTrs.map(t => t.studentId || t['Student ID#']).filter(Boolean);
                
                if (studentIds.length === 0) {
                    setRequests([]);
                    setLoading(false);
                    return null;
                }
                
                const requestsRef = collection(db, 'artifacts', appId, 'public', 'data', 'requests');
                const unsub = onSnapshot(query(requestsRef), (snap) => {
                    let fetched = [];
                    snap.forEach(doc => {
                        const data = doc.data();
                        if ((data.type?.toLowerCase().includes('leave') || data.type?.toLowerCase().includes('absence') || data.requestType?.toLowerCase().includes('leave')) &&
                            (studentIds.includes(data.studentId) || studentIds.includes(data['Student ID#']))) {
                            fetched.push({ id: doc.id, ...data });
                        }
                    });
                    setRequests(fetched);
                    setLoading(false);
                });
                return unsub;
            } catch (err) {
                console.error("Error fetching absence requests:", err);
                setLoading(false);
                return null;
            }
        };
        
        let unsubFn = null;
        fetchRequests().then(unsub => { unsubFn = unsub; });
        return () => { if (unsubFn) unsubFn(); };
    }, [currentUser, db, appId]);

    const handleAction = async () => {
        const targetRequests = actionModal.requests || (actionModal.request ? [actionModal.request] : []);
        if (targetRequests.length === 0 || isProcessing) return;
        setIsProcessing(true);
        try {
            let newIcStatus = '';
            let newStatus = '';
            
            if (actionModal.actionType === 'Approve') {
                newIcStatus = 'Approved';
                newStatus = 'Approved by IC'; 
            } else if (actionModal.actionType === 'Deny') {
                newIcStatus = 'Denied';
                newStatus = 'Denied by IC';
            } else if (actionModal.actionType === 'Revert') {
                newIcStatus = 'Pending';
                newStatus = 'Pending IC & HR Approval';
            }

            const updatePromises = targetRequests.map(req => {
                const reqRef = doc(db, 'artifacts', appId, 'public', 'data', 'requests', req.id);
                return updateDoc(reqRef, {
                    icStatus: newIcStatus,
                    status: newStatus,
                    icRemarks: actionRemark,
                    updatedAt: new Date().toISOString()
                });
            });

            await Promise.all(updatePromises);

            setActionModal({ isOpen: false, requests: [], actionType: '' });
            setActionRemark('');
            setSelectedRequests(new Set());
        } catch (error) {
            console.error("Error updating requests:", error);
            alert("Failed to update requests. See console.");
        } finally {
            setIsProcessing(false);
        }
    };

    const filteredRequests = requests.filter(r => {
        const matchTrainee = (r.studentName || '').toLowerCase().includes(searchTrainee.toLowerCase()) || 
                             (r.studentId || '').toLowerCase().includes(searchTrainee.toLowerCase());
        const matchCompany = (r.companyName || '').toLowerCase().includes(searchCompany.toLowerCase());
        
        let matchStatus = true;
        if (filterStatus === 'Pending') matchStatus = r.icStatus === 'Pending' || !r.icStatus;
        else if (filterStatus === 'Approved') matchStatus = r.icStatus === 'Approved';
        else if (filterStatus === 'Denied') matchStatus = r.icStatus === 'Denied';

        return matchTrainee && matchCompany && matchStatus;
    }).sort((a, b) => {
        let valA = a[sortConfig.key] || '';
        let valB = b[sortConfig.key] || '';
        if (sortConfig.key === 'icStatus') {
            valA = a.icStatus || 'Pending';
            valB = b.icStatus || 'Pending';
        } else if (sortConfig.key === 'dateRequested') {
             valA = new Date(a.createdAt || a.timestamp || 0).getTime();
             valB = new Date(b.createdAt || b.timestamp || 0).getTime();
        } else if (sortConfig.key === 'date') {
            valA = new Date(a.date || 0).getTime();
            valB = new Date(b.date || 0).getTime();
        }
        
        if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
        if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
    });

    return (
        <div className="h-full flex flex-col bg-slate-50 dark:bg-slate-900">
            {/* Header Controls */}
            <div className="p-6 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col gap-4 shrink-0">
                <h2 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                    <Calendar className="text-primary-600" />
                    Absence Requests
                </h2>
                <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div className="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                        <div className="relative">
                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                        <input
                            type="text"
                            placeholder="Search Trainee Name or ID..."
                            value={searchTrainee}
                            onChange={e => setSearchTrainee(e.target.value)}
                            className="pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm w-full md:w-64"
                        />
                    </div>
                    <div className="relative">
                        <Building2 className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                        <input
                            type="text"
                            placeholder="Search Company..."
                            value={searchCompany}
                            onChange={e => setSearchCompany(e.target.value)}
                            className="pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm w-full md:w-64"
                        />
                    </div>
                </div>
                {selectedRequests.size > 0 && (
                    <div className="flex items-center gap-3 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 px-4 py-1.5 rounded-xl text-sm font-bold animate-fade-in border border-blue-100 dark:border-blue-800">
                        <span>{selectedRequests.size} selected</span>
                        <div className="h-4 w-px bg-blue-200 dark:bg-blue-800 mx-1"></div>
                        <button onClick={() => setActionModal({ isOpen: true, requests: filteredRequests.filter(r => selectedRequests.has(r.id)), actionType: 'Approve' })} className="hover:text-blue-900 dark:hover:text-blue-100 transition-colors flex items-center gap-1"><CheckCircle2 size={16}/> Approve</button>
                        <button onClick={() => setActionModal({ isOpen: true, requests: filteredRequests.filter(r => selectedRequests.has(r.id)), actionType: 'Deny' })} className="hover:text-blue-900 dark:hover:text-blue-100 transition-colors flex items-center gap-1"><X size={16}/> Deny</button>
                    </div>
                )}
                <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl w-full md:w-auto">
                    {['All', 'Pending', 'Approved', 'Denied'].map(f => (
                        <button
                            key={f}
                            onClick={() => setFilterStatus(f)}
                            className={`flex-1 md:flex-none px-4 py-1.5 rounded-lg text-sm font-bold transition-colors ${filterStatus === f ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}
                        >
                            {f}
                        </button>
                    ))}
                </div>
                </div>
            </div>

            {/* Table Content */}
            <div className="flex-1 overflow-auto p-6 relative">
                {loading ? (
                    <div className="flex flex-col items-center justify-center p-8 h-64">
                        <div className="relative flex items-center justify-center mb-6">
                            <img src="dualtech-logo.png" alt="Loading" className="w-16 h-16 object-contain animate-pulse opacity-90 drop-shadow-md" />
                            <Loader2 className="absolute text-primary-600/50 animate-spin" size={100} strokeWidth={1.5} />
                        </div>
                    </div>
                ) : filteredRequests.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                        <FileText size={48} className="mb-4 opacity-50" />
                        <p>No absence requests found.</p>
                    </div>
                ) : (
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <div className="overflow-x-auto w-full custom-scrollbar">
                            <table className="w-full text-left border-collapse min-w-[1000px]">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                                        <th className="p-4 w-12 text-center">
                                            <input 
                                                type="checkbox" 
                                                className="w-4 h-4 rounded border-slate-300 cursor-pointer"
                                                checked={filteredRequests.length > 0 && selectedRequests.size === filteredRequests.length}
                                                onChange={e => {
                                                    if (e.target.checked) {
                                                        setSelectedRequests(new Set(filteredRequests.map(r => r.id)));
                                                    } else {
                                                        setSelectedRequests(new Set());
                                                    }
                                                }}
                                            />
                                        </th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('studentName')}>Trainee <ModalSortIcon columnKey="studentName" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('companyName')}>Company <ModalSortIcon columnKey="companyName" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('type')}>Type & Category <ModalSortIcon columnKey="type" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('date')}>Date(s) <ModalSortIcon columnKey="date" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('dateRequested')}>Date Requested <ModalSortIcon columnKey="dateRequested" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase min-w-[200px]">Reason</th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase text-center whitespace-nowrap">Attachment</th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap" onClick={() => handleSort('icStatus')}>Status <ModalSortIcon columnKey="icStatus" /></th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase text-right whitespace-nowrap">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">
                                {filteredRequests.map(req => (
                                    <tr key={req.id} className={`transition-colors even:bg-slate-50 dark:even:bg-slate-700/30 ${selectedRequests.has(req.id) ? 'bg-blue-50/50 dark:bg-blue-900/10' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                        <td className="p-4 text-center">
                                            <input 
                                                type="checkbox" 
                                                className="w-4 h-4 rounded border-slate-300 cursor-pointer"
                                                checked={selectedRequests.has(req.id)}
                                                onChange={e => {
                                                    const newSet = new Set(selectedRequests);
                                                    if (e.target.checked) newSet.add(req.id);
                                                    else newSet.delete(req.id);
                                                    setSelectedRequests(newSet);
                                                }}
                                            />
                                        </td>
                                        <td className="p-4">
                                            <div className="font-bold text-slate-800 dark:text-slate-200">{req.studentName}</div>
                                            <div className="text-xs text-slate-500">{req.studentId}</div>
                                        </td>
                                        <td className="p-4 text-sm text-slate-600 dark:text-slate-400">
                                            {req.companyName}
                                        </td>
                                        <td className="p-4 text-sm">
                                            <div className="font-bold text-slate-700 dark:text-slate-300">{req.type}</div>
                                            <div className="text-xs text-slate-500">{req.category}</div>
                                        </td>
                                        <td className="p-4 text-sm font-medium text-slate-700 dark:text-slate-300 whitespace-nowrap">
                                            {req.date ? safeISO(req.date) : (req.targetDate ? safeISO(req.targetDate) : 'N/A')}
                                        </td>
                                        <td className="p-4 text-sm text-slate-500 dark:text-slate-400 whitespace-nowrap">
                                            {req.createdAt ? safeISO(req.createdAt) : (req.timestamp ? safeISO(req.timestamp) : 'N/A')}
                                        </td>
                                        <td className="p-4 text-sm text-slate-600 dark:text-slate-400 min-w-[200px] whitespace-normal">
                                            {req.reason}
                                        </td>
                                        <td className="p-4 text-center">
                                            {req.proofUrl ? (
                                                <a href={req.proofUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold hover:bg-blue-200 transition-colors">
                                                    <Paperclip size={14} /> View
                                                </a>
                                            ) : (
                                                <span className="text-xs text-slate-400 italic">None</span>
                                            )}
                                        </td>
                                        <td className="p-4">

                        {activeTab === 'dashboard' && <DashboardTab currentUser={currentUser} />}
                        {activeTab === 'my_trainees' && <MyTraineesTab currentUser={currentUser} onNavigate={(tab, search) => { setGlobalSearchPreFill(search); setActiveTab(tab); }} />}
                        {activeTab === 'company_attendance' && <AttendanceSchoolingTab currentUser={currentUser} globalSearchPreFill={globalSearchPreFill} setGlobalSearchPreFill={setGlobalSearchPreFill} />}
                        {activeTab === 'schooling_attendance' && <SchoolingAttendanceTab currentUser={currentUser} globalSearchPreFill={globalSearchPreFill} setGlobalSearchPreFill={setGlobalSearchPreFill} />}
                        {activeTab === 'absence_requests' && <AbsenceRequestsTab currentUser={currentUser} db={db} appId={APP_ID}  />}
                        {activeTab === 'company_accounts' && <MyCompanyAccountsTab currentUser={currentUser} onNavigate={(tab, search) => { setGlobalSearchPreFill(search); setActiveTab(tab); }} />}
                        {activeTab === 'schedule_requests' && <ScheduleRequestsTab currentUser={currentUser} />}

                        {showProfileModal && <ProfileModal currentUser={currentUser} onClose={() => setShowProfileModal(false)} />}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>

</html>
