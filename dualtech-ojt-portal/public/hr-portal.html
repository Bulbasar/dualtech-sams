        // --- COMPANY SETUP TAB (Departments & Trainers) ---
        function CompanySetupTab({ currentUser }) {
            const [departments, setDepartments] = useState([]);
            const [newDept, setNewDept] = useState('');
            
            const [trainers, setTrainers] = useState([]);
            const [trainerForm, setTrainerForm] = useState({ name: '', email: '', phone: '', password: '' });
            const [saving, setSaving] = useState(false);

            const companyName = currentUser?.companyName || currentUser?.company;

            // Fetch Departments
            useEffect(() => {
                if (!companyName) return;
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_settings', companyName);
                const unsub = onSnapshot(docRef, (snap) => {
                    if (snap.exists() && snap.data().departments) {
                        setDepartments(snap.data().departments);
                    }
                });
                return () => unsub();
            }, [companyName]);

            // Fetch Trainers
            useEffect(() => {
                if (!companyName) return;
                const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainers'), where('company', '==', companyName));
                const unsub = onSnapshot(q, (snap) => {
                    setTrainers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [companyName]);

            // FIXED: Using standard arrays instead of arrayUnion to avoid import errors
            const handleAddDept = async (e) => {
                e.preventDefault();
                if (!newDept.trim()) return;
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_settings', companyName);
                
                try {
                    const snap = await getDoc(docRef);
                    let currentDepts = [];
                    if (snap.exists() && snap.data().departments) {
                        currentDepts = snap.data().departments;
                    }
                    if (!currentDepts.includes(newDept.trim())) {
                        await setDoc(docRef, { departments: [...currentDepts, newDept.trim()] }, { merge: true });
                    }
                    setNewDept('');
                } catch (err) {
                    alert("Error adding department: " + err.message);
                }
            };

            // FIXED: Using standard arrays instead of arrayRemove
            const handleRemoveDept = async (dept) => {
                if (!window.confirm(`Delete department: ${dept}?`)) return;
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'company_settings', companyName);
                
                try {
                    const snap = await getDoc(docRef);
                    if (snap.exists() && snap.data().departments) {
                        const newDepts = snap.data().departments.filter(d => d !== dept);
                        await setDoc(docRef, { departments: newDepts }, { merge: true });
                    }
                } catch (err) {
                    console.error("Error removing department: ", err);
                }
            };

            // ACCOUNT CREATION LOGIC
            const handleAddTrainer = async (e) => {
                e.preventDefault();
                setSaving(true);
                
                try {
                    const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${app.options.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: trainerForm.email,
                            password: trainerForm.password,
                            returnSecureToken: true
                        })
                    });
                    
                    const authData = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(authData.error.message || "Failed to create authentication account.");
                    }
                    
                    const newUid = authData.localId; 

                    await setDoc(doc(db, 'users', newUid), {
                        name: trainerForm.name,
                        email: trainerForm.email,
                        role: 'COMPANY_TRAINER',
                        company: companyName,
                        status: 'Active',
                        createdAt: new Date().toISOString()
                    });

                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainers', newUid), {
                        uid: newUid,
                        company: companyName,
                        name: trainerForm.name,
                        email: trainerForm.email,
                        phone: trainerForm.phone,
                        status: 'Active',
                        createdAt: new Date().toISOString()
                    });

                    setTrainerForm({ name: '', email: '', phone: '', password: '' });
                    alert("Trainer account created successfully! They can now log in using the email and password you set.");
                    
                } catch (err) {
                    alert("Failed to add trainer: " + err.message);
                }
                setSaving(false);
            };

            const handleRemoveTrainer = async (id) => {
                if (!window.confirm("Remove this trainer profile? This will revoke their portal access.")) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'trainers', id));
                    await deleteDoc(doc(db, 'users', id));
                } catch (err) {
                    console.error("Error removing trainer: ", err);
                }
            };

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div>
                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Building className="text-blue-600" /> Company Setup</h2>
                        <p className="text-slate-500 text-sm mt-1">Manage your company's departments and create accounts for designated trainers.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* DEPARTMENTS CARD */}
                        <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col h-[520px]">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4 pb-2 border-b border-slate-100"><Briefcase size={18} className="text-blue-500"/> Departments</h3>
                            
                            <form onSubmit={handleAddDept} className="flex gap-2 mb-4">
                                <input type="text" value={newDept} onChange={(e) => setNewDept(e.target.value)} placeholder="e.g. IT Department" className="flex-1 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 text-sm" required />
                                <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition-colors flex items-center gap-1"><PlusCircle size={16}/> Add</button>
                            </form>

                            <div className="flex-1 overflow-y-auto space-y-2 pr-2">
                                {departments.length === 0 ? (
                                    <p className="text-slate-400 text-sm italic text-center mt-10">No departments added yet.</p>
                                ) : (
                                    departments.map((dept, i) => (
                                        <div key={i} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                            <span className="font-bold text-slate-700 text-sm">{dept}</span>
                                            <button onClick={() => handleRemoveDept(dept)} className="text-slate-400 hover:text-red-500 transition-colors"><Trash2 size={16}/></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* TRAINERS CARD */}
                        <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col h-[520px]">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4 pb-2 border-b border-slate-100"><UserPlus size={18} className="text-emerald-500"/> Company Trainers</h3>
                            
                            <form onSubmit={handleAddTrainer} className="space-y-3 mb-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <input type="text" value={trainerForm.name} onChange={e => setTrainerForm({...trainerForm, name: e.target.value})} placeholder="Trainer Full Name" className="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm" required />
                                
                                <div className="flex gap-2">
                                    <input type="email" value={trainerForm.email} onChange={e => setTrainerForm({...trainerForm, email: e.target.value})} placeholder="Email (Used for Login)" className="flex-1 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm" required />
                                    <input type="text" value={trainerForm.phone} onChange={e => setTrainerForm({...trainerForm, phone: e.target.value})} placeholder="Phone (Optional)" className="w-1/3 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm" />
                                </div>

                                <input type="password" value={trainerForm.password} onChange={e => setTrainerForm({...trainerForm, password: e.target.value})} placeholder="Set Account Password (min. 6 characters)" minLength="6" className="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:border-emerald-500 text-sm" required />

                                <button type="submit" disabled={saving} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition-colors flex justify-center items-center gap-2 mt-1">
                                    {saving ? <Activity size={16} className="animate-spin"/> : <UserPlus size={16}/>} Create Account & Profile
                                </button>
                            </form>

                            <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                {trainers.length === 0 ? (
                                    <p className="text-slate-400 text-sm italic text-center mt-4">No trainer accounts created yet.</p>
                                ) : (
                                    trainers.map(t => (
                                        <div key={t.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center group">
                                            <div>
                                                <p className="font-bold text-slate-800 text-sm flex items-center gap-1.5"><UserCircle2 size={14} className="text-emerald-600"/> {t.name}</p>
                                                <p className="text-xs text-slate-500 mt-0.5">{t.email || 'No email'} • {t.phone || 'No phone'}</p>
                                            </div>
                                            <button onClick={() => handleRemoveTrainer(t.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1" title="Delete account"><Trash2 size={16}/></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }


        // --- DASHBOARD LAYOUT (MOBILE RESPONSIVE) ---
        function Dashboard({ user, handleLogout }) {
            const [activeTab, setActiveTab] = useState('attendance');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [unreadMessages, setUnreadMessages] = useState(0);

            // Fetch unread messages counter
            useEffect(() => {
                if (!user?.company) return;

                // --- 1. OPTIMISTIC CACHE LOAD ---
                const cacheKeyDashboard = `hr_cache_dashboard_${user.company.replace(/\s+/g, '_')}`;
                const cachedData = localStorage.getItem(cacheKeyDashboard);
                if (cachedData) {
                    const parsed = JSON.parse(cachedData);
                    if (parsed.announcements) setRecentAnnouncements(parsed.announcements);
                    if (parsed.issues) setOpenIssues(parsed.issues);
                }

                // Helper to save data back to cache
                const updateDashboardCache = (newData) => {
                    const existing = JSON.parse(localStorage.getItem(cacheKeyDashboard) || '{}');
                    localStorage.setItem(cacheKeyDashboard, JSON.stringify({ ...existing, ...newData }));
                };

                const todayStr = getTodayString();

                // --- 2. FETCH LIVE ATTENDANCE (Never cached, must always be today's live data) ---
                const attendanceRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'attendance');
                const unsubAttendance = onSnapshot(
                    query(attendanceRef, where('company', '==', user.company), where('date', '==', todayStr)),
                    (snap) => {
                        const logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        
                        const uniqueTrainees = [...new Set(logs.map(l => l.studentId))];
                        setDailyStats(prev => ({ ...prev, presentToday: uniqueTrainees.length }));

                        const lates = logs.filter(l => {
                            if (l.type !== 'Clock In' || !l.time) return false;
                            const [hours, minutes] = l.time.split(':');
                            const totalMins = parseInt(hours) * 60 + parseInt(minutes || 0);
                            return totalMins > (8 * 60); 
                        });
                        setDailyStats(prev => ({ ...prev, lateToday: [...new Set(lates.map(l => l.studentId))].length }));
                    }
                );

                // --- 3. FETCH LIVE ANNOUNCEMENTS & UPDATE CACHE ---
                const unsubAnnouncements = onSnapshot(
                    query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'announcements'), where('status', '==', 'Active')),
                    (snap) => {
                        const acts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setRecentAnnouncements(acts);
                        updateDashboardCache({ announcements: acts }); // Save to cache
                    }
                );

                // --- 4. FETCH LIVE ISSUES & UPDATE CACHE ---
                const unsubIssues = onSnapshot(
                    query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_profiles'), where('companyName', '==', user.company)),
                    (snap) => {
                        let issuesList = [];
                        snap.docs.forEach(doc => {
                            const data = doc.data();
                            if (data.concerns) {
                                issuesList = [...issuesList, ...data.concerns.map(c => ({ ...c, profileId: doc.id }))];
                            }
                        });
                        const open = issuesList.filter(i => i.status === 'Open').sort((a,b) => b.timestamp - a.timestamp);
                        setOpenIssues(open);
                        updateDashboardCache({ issues: open }); // Save to cache
                    }
                );

                return () => { unsubAttendance(); unsubAnnouncements(); unsubIssues(); };
            }, [user]);


            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsMobileMenuOpen(false);
            };

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden font-sans selection:bg-blue-200 w-full">
                    
                    {/* MOBILE HEADER */}
                    <div className="md:hidden fixed top-0 left-0 w-full bg-slate-900 text-white z-50 flex items-center justify-between p-4 shadow-md">
                        <div className="flex items-center gap-2 font-black text-lg tracking-tight">
                            <Building className="text-blue-500" size={24} />
                            <span>HR <span className="text-blue-500">Portal</span></span>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-300 hover:text-white focus:outline-none p-1">
                            {isMobileMenuOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>

                    {/* SIDEBAR */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 flex flex-col transition-transform duration-300 ease-in-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 md:flex shadow-2xl md:shadow-none`}>
                        <div className="hidden md:flex p-6 items-center gap-3 border-b border-slate-800">
                            <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-900/20">
                                <Building className="text-white" size={24} />
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white tracking-tight leading-none">HR Portal</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Dualtech OJT</p>
                            </div>
                        </div>

                        <div className="p-5 mt-16 md:mt-0 border-b border-slate-800 bg-slate-800/30">
                            <p className="text-sm font-bold text-white truncate">{user.name || 'HR Admin'}</p>
                            <p className="text-xs text-slate-400 truncate">{user.company}</p>
                        </div>

                        <div className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <button onClick={() => handleTabChange('messages')} className={`w-full flex justify-between items-center px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeTab === 'messages' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                <div className="flex items-center gap-3"><MessageSquare size={20} /> Messages</div>
                                {/* HIGHLIGHTER BADGE */}
                                {unreadMessages > 0 && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse shadow-sm">{unreadMessages}</span>}
                            </button>
                            <button onClick={() => handleTabChange('attendance')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'attendance' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><CalendarDays size={18} /> Attendance</button>
                            <button onClick={() => handleTabChange('schooling')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'schooling' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><CalendarDays size={18} />Schooling</button>
                            <button onClick={() => handleTabChange('trainees')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'trainees' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><Users size={18} /> Trainees</button>
                            <button onClick={() => handleTabChange('setup')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'setup' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><Building size={18} /> Company Setup</button>
                            <button onClick={() => handleTabChange('schedule')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'schedule' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><CalendarClock size={18} /> Schedule</button>
                            <button onClick={() => handleTabChange('requests')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'requests' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><FileQuestion size={18} /> Requests & Disputes</button>
                            <button onClick={() => handleTabChange('settings')} className={`w-full flex items-center gap-3 p-3.5 rounded-xl font-bold transition-all ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'}`}><Settings size={18} /> Settings</button>
                        </div>

                        <div className="p-4 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 p-3.5 rounded-xl font-bold text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors border border-red-500/20"><LogOut size={18} /> Sign Out</button>
                        </div>
                    </div>

                    {/* OVERLAY FOR MOBILE */}
                    {isMobileMenuOpen && <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>}

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex flex-col h-full w-full relative mt-16 md:mt-0 overflow-hidden">
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 relative bg-slate-50 w-full">
                            <div className="max-w-6xl mx-auto pb-10">
                                {activeTab === 'messages' && <MessagesTab currentUser={user} />}
                                {activeTab === 'attendance' && <AttendanceTab currentUser={user} />}
                                {activeTab === 'schooling' && <SchoolingAttendanceTab currentUser={user} />}
                                {activeTab === 'trainees' && <TraineesTab currentUser={user} />}
                                {activeTab === 'setup' && <CompanySetupTab currentUser={user} />}
                                {activeTab === 'schedule' && <ScheduleTab currentUser={user} />}
                                {activeTab === 'requests' && <RequestsTab currentUser={user} />}
                                {activeTab === 'settings' && <SettingsTab currentUser={user} />}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NEW: MESSAGES TAB ---
        function MessagesTab({ currentUser }) {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [loading, setLoading] = useState(true);
            
            const [availableRecipients, setAvailableRecipients] = useState([]);
            const [selectedRecipients, setSelectedRecipients] = useState([]);
            
            const messagesEndRef = useRef(null);

            // 1. Fetch available ICs and Trainers
            useEffect(() => {
                if (!currentUser?.company) return;
                const traineesRef = collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees');
                const q = query(traineesRef, where('company', '==', currentUser.company));
                
                getDocs(q).then(snap => {
                    const recipients = new Set();
                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.assignedIC) recipients.add(data.assignedIC);
                        if (data.trainer) recipients.add(data.trainer);
                    });
                    setAvailableRecipients(Array.from(recipients).filter(Boolean));
                });
            }, [currentUser]);

            // 2. Fetch Messages
            useEffect(() => {
                if (!currentUser?.company) return;
                const messagesRef = collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'messages');
                const q = query(messagesRef, where('company', '==', currentUser.company), orderBy('timestamp', 'asc'));

                const unsub = onSnapshot(q, (snap) => {
                    const msgs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMessages(msgs);
                    setLoading(false);

                    msgs.forEach(msg => {
                        if (msg.senderRole !== 'HR') {
                            const currentViewedBy = msg.viewedBy || [];
                            const hrName = currentUser.name || 'HR Partner';
                            
                            if (!currentViewedBy.includes(hrName)) {
                                updateDoc(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'messages', msg.id), {
                                    viewedBy: [...currentViewedBy, hrName],
                                    readByHR: true 
                                });
                            }
                        }
                    });
                });
                return () => unsub();
            }, [currentUser]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const toggleRecipient = (rec) => {
                if (selectedRecipients.includes(rec)) {
                    setSelectedRecipients(selectedRecipients.filter(r => r !== rec));
                } else {
                    setSelectedRecipients([...selectedRecipients, rec]);
                }
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!newMessage.trim()) return;
                
                // THE FIX: If no recipients are selected, default to ALL available recipients!
                let finalRecipients = selectedRecipients;
                if (finalRecipients.length === 0) {
                    finalRecipients = availableRecipients.length > 0 ? availableRecipients : ['All'];
                }

                await addDoc(collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'messages'), {
                    company: currentUser.company,
                    senderName: currentUser.name || 'HR Partner',
                    senderRole: 'HR',
                    text: newMessage.trim(),
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleString(),
                    allowedViewers: finalRecipients,
                    viewedBy: []
                });
                
                setNewMessage('');
                setSelectedRecipients([]); // Clear selections after sending
            };

            // 3. Handle Message Deletion (Unsend)
            const handleDelete = async (messageId) => {
                if (window.confirm("Are you sure you want to unsend this message? It will be removed for everyone.")) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'messages', messageId));
                    } catch (error) {
                        alert("Failed to delete message: " + error.message);
                    }
                }
            };

            if (loading) return <div className="flex justify-center items-center h-64 text-slate-400"><Loader2 className="animate-spin" size={32} /></div>;

            return (
                <div className="flex flex-col h-[85vh] bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden animate-in fade-in">
                    <div className="p-5 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                        <div>
                            <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><MessageSquare className="text-blue-600" /> Communications</h2>
                            <p className="text-slate-500 text-sm mt-1">Direct message exchange with Dualtech ICs and Company Trainers.</p>
                        </div>
                    </div>
                    
                    <div className="flex-1 p-6 overflow-y-auto bg-slate-50/50 space-y-4">
                        {messages.length === 0 ? (
                            <div className="text-center text-slate-400 italic mt-10">No messages yet. Start the conversation!</div>
                        ) : (
                            messages.map((msg) => {
                                const isHR = msg.senderRole === 'HR';
                                return (
                                    <div key={msg.id} className={`flex flex-col ${isHR ? 'items-end' : 'items-start'}`}>
                                        
                                        {/* Sender info and Delete button */}
                                        <div className={`flex items-center gap-2 mb-1 ml-1 mr-1 ${isHR ? 'flex-row-reverse' : ''}`}>
                                            <span className="text-[10px] font-bold text-slate-400">
                                                {msg.senderName} ({msg.senderRole}) • {msg.dateStr}
                                            </span>
                                            {isHR && (
                                                <button 
                                                    onClick={() => handleDelete(msg.id)} 
                                                    className="text-slate-300 hover:text-red-500 transition-colors p-1" 
                                                    title="Unsend this message"
                                                >
                                                    <Trash2 size={12} />
                                                </button>
                                            )}
                                        </div>

                                        <div className={`px-4 py-3 rounded-2xl max-w-[85%] md:max-w-[70%] text-sm shadow-sm ${isHR ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'}`}>
                                            {msg.text}
                                        </div>
                                        
                                        {isHR && (
                                            <div className="text-[9px] text-slate-400 mt-1 mr-2 text-right">
                                                <div className="mb-0.5">Sent to: {msg.allowedViewers?.includes('All') ? 'All Assignees' : msg.allowedViewers?.join(', ') || 'All Assignees'}</div>
                                                {msg.viewedBy && msg.viewedBy.length > 0 ? (
                                                    <span className="text-blue-500 font-bold flex items-center justify-end gap-1">
                                                        <CheckCircle2 size={10} /> Viewed by {msg.viewedBy.join(', ')}
                                                    </span>
                                                ) : (
                                                    <span>Sent • Unread</span>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="p-3 bg-slate-50 border-t border-slate-200">
                        <div className="flex justify-between items-center mb-2">
                            <div className="text-xs font-bold text-slate-600 uppercase tracking-wider">Send to:</div>
                            {selectedRecipients.length === 0 && availableRecipients.length > 0 && <span className="text-[10px] font-bold text-blue-500 bg-blue-100 px-2 py-0.5 rounded">Defaulting to ALL</span>}
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {availableRecipients.length === 0 && <span className="text-xs text-slate-400 italic">No assigned ICs or Trainers found.</span>}
                            {availableRecipients.map(rec => (
                                <button 
                                    key={rec} 
                                    type="button"
                                    onClick={() => toggleRecipient(rec)}
                                    className={`px-3 py-1.5 rounded-full border text-xs font-bold transition-colors ${selectedRecipients.includes(rec) ? 'bg-blue-100 border-blue-500 text-blue-700 shadow-sm' : 'bg-white border-slate-300 text-slate-500 hover:bg-slate-100'}`}
                                >
                                    {rec}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-4 bg-white border-t border-slate-100">
                        <form onSubmit={handleSend} className="flex gap-3">
                            <input 
                                type="text" 
                                value={newMessage} 
                                onChange={(e) => setNewMessage(e.target.value)} 
                                placeholder={selectedRecipients.length === 0 ? "Type message to ALL assignees..." : "Type your message..."}
                                className="flex-1 p-3.5 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm bg-slate-50 focus:bg-white transition-colors"
                            />
                            {/* THE FIX: Removed the disabled check for selectedRecipients */}
                            <button type="submit" disabled={!newMessage.trim()} className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-5 rounded-xl transition-colors shadow-sm flex items-center justify-center">
                                <Send size={20} />
                            </button>
                        </form>
                    </div>
                </div>
            );
        }



        // --- LOGIN SCREEN ---
        const LoginScreen = ({ error }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [localError, setLocalError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLocalError('');
                setLoading(true);
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const userDoc = await getDoc(doc(db, 'users', userCredential.user.uid));
                    
                    if (!userDoc.exists()) {
                        await signOut(auth);
                        setLocalError("User profile missing from database.");
                    } else {
                        const rawRole = String(userDoc.data().role || '').trim().toUpperCase();
                        const allowedRoles = ['COMPANY_HR', 'COMPANY HR', 'HR'];
                        if (!allowedRoles.includes(rawRole) && !rawRole.includes('HR')) {
                            await signOut(auth);
                            setLocalError(`Access Denied: Role '${rawRole}' is not an HR account.`);
                        }
                    }
                } catch (err) { setLocalError(err.message.replace('Firebase: ', '')); } finally { setLoading(false); }
            };

            return (
                <div className="flex items-center justify-center min-h-screen bg-slate-100 p-4 w-full">
                    <div className="bg-white p-6 md:p-10 rounded-3xl shadow-xl max-w-md w-full border border-slate-200 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><Building size={32} /></div></div>
                        <h2 className="text-2xl font-black text-center text-slate-800 mb-2">Company HR Portal</h2>
                        <p className="text-center text-slate-500 mb-8 font-medium text-sm">Log in to manage your deployed trainees</p>
                        
                        {(error || localError) && (
                            <div className="mb-6 p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-bold flex items-start gap-3">
                                <AlertTriangle size={18} className="shrink-0 mt-0.5" />
                                <span>{error || localError}</span>
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Email Address</label>
                                <input type="email" required className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={email} onChange={e => setEmail(e.target.value)} placeholder="hr@company.com" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Password</label>
                                <input type="password" required className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors mt-4 flex justify-center items-center gap-2 shadow-md">
                                {loading ? <Loader2 size={20} className="animate-spin" /> : 'Secure Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };




        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState("");

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    if (currentUser) {
                        try {
                            const docSnap = await getDoc(doc(db, 'users', currentUser.uid));
                            if (docSnap.exists()) {
                                const rawRole = String(docSnap.data().role || '').trim().toUpperCase();
                                if (['COMPANY_HR', 'COMPANY HR', 'HR'].includes(rawRole) || rawRole.includes('HR')) {
                                    setUser({ id: docSnap.id, ...docSnap.data() });
                                } else { await signOut(auth); setUser(null); }
                            } else { await signOut(auth); setUser(null); }
                        } catch (error) { console.error(error); }
                    } else { setUser(null); }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="h-screen w-full flex items-center justify-center bg-slate-50"><Loader2 className="animate-spin text-blue-500" size={40} /></div>;
            if (!user) return <LoginScreen error={authError} />;
            return <Dashboard user={user} handleLogout={() => signOut(auth)} />;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
