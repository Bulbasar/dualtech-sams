            start: '', 
            end: '', 
            schoolingDay: 'Saturday', 
            restDay: 'Sunday' 
        });
        const [savingBulk, setSavingBulk] = useState(false);

        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        // Fetch Break Settings on Load
        useEffect(() => {
            if (!currentUser?.company) return;
            const settingsRef = doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'company_settings', currentUser.company);
            
            const unsub = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.applyBreak !== undefined) setApplyBreak(data.applyBreak);
                    if (data.breakMinutes !== undefined) setBreakMinutes(data.breakMinutes);
                }
            });
            return () => unsub();
        }, [currentUser]);

        // Save Break Settings to DB
        const handleUpdateBreakSettings = async (newApplyBreak, newBreakMinutes) => {
            setApplyBreak(newApplyBreak);
            setBreakMinutes(newBreakMinutes);
            try {
                const settingsRef = doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'company_settings', currentUser.company);
                await setDoc(settingsRef, { 
                    applyBreak: newApplyBreak, 
                    breakMinutes: newBreakMinutes,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (err) {
                console.error("Error saving break settings:", err);
                alert("Failed to save break settings.");
            }
        };

        // Search / Filter Logic
        const filteredTrainees = useMemo(() => {
            if (!searchQuery.trim()) return trainees;
            const search = searchQuery.toLowerCase();
            return trainees.filter(t => {
                const name = `${t.firstName || t.Given || ''} ${t.lastName || t.Family || t.name || ''}`.toLowerCase();
                const sid = String(t.studentId || t['Student ID#'] || '').toLowerCase();
                return name.includes(search) || sid.includes(search);
            });
        }, [trainees, searchQuery]);

        // Selection Logic
        const handleSelectAll = () => {
            if (selectedIds.length === filteredTrainees.length && filteredTrainees.length > 0) setSelectedIds([]);
            else setSelectedIds(filteredTrainees.map(t => t.id));
        };

        const handleSelect = (id) => {
            setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
        };

        // --- BULK SCHEDULE SAVE LOGIC ---
        const handleBulkSchedule = async (e) => {
            e.preventDefault();
            if (selectedIds.length === 0) return;
            if (!bulkForm.start || !bulkForm.end) {
                alert("Please set both 'From' and 'To' times to determine the complete schedule.");
                return;
            }
            
            // VALIDATION: Schooling and Rest days cannot overlap
            if (bulkForm.schoolingDay === bulkForm.restDay) {
                alert("Schooling Day and Rest Day cannot be the same day.");
                return;
            }

            setSavingBulk(true);
            try {
                // Build the 7-day schedule map
                const weeklySchedule = {};
                daysOfWeek.forEach(day => {
                    if (day === bulkForm.schoolingDay) weeklySchedule[day] = 'Schooling';
                    else if (day === bulkForm.restDay) weeklySchedule[day] = 'Rest';
                    else weeklySchedule[day] = 'Training'; // Remaining 5 days default to Training
                });

                const updatePromises = selectedIds.map(id => {
                    const trainee = trainees.find(t => t.id === id);
                    const traineeRef = doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees', id);
                    
                    return setDoc(traineeRef, {
                        shiftStart: bulkForm.start,
                        shiftEnd: bulkForm.end,
                        schoolingDay: bulkForm.schoolingDay,
                        restDay: bulkForm.restDay,
                        weeklySchedule: weeklySchedule, // Save full 7-day mapping
                        userId: trainee.id,
                        company: currentUser.company,
                        name: trainee.name || `${trainee.firstName || trainee.Given || ''} ${trainee.lastName || trainee.Family || ''}`.trim()
                    }, { merge: true });
                });

                await Promise.all(updatePromises);
                
                setShowBulkModal(false);
                setSelectedIds([]);
                setBulkForm({ start: '', end: '', schoolingDay: 'Saturday', restDay: 'Sunday' });
            } catch (err) {
                alert("Scheduling failed: " + err.message);
            } finally {
                setSavingBulk(false);
            }
        };

        // Format Time for Display (e.g., 14:30 -> 02:30 PM)
        const formatTime = (timeStr) => {
            if (!timeStr) return '--:--';
            const [h, m] = timeStr.split(':');
            const date = new Date();
            date.setHours(h, m, 0);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        if (loading) return <div className="flex p-12 justify-center text-slate-400"><Loader2 className="animate-spin" size={32} /></div>;

        return (
            <div className="space-y-6 animate-in fade-in duration-300 w-full relative">
                
                {/* --- Company-Wide Break Settings Card --- */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">
                            <Clock size={20} className="text-blue-600"/> 
                            Break Time Policy
                        </h2>
                        <p className="text-sm text-slate-500 mt-1">Automatically deduct break time for shifts longer than 4 hours.</p>
                    </div>
                    <div className="flex items-center gap-3 bg-slate-50 px-4 py-3 rounded-xl border border-slate-200">
                        <div className="flex items-center gap-2">
                            <input 
                                type="checkbox" 
                                id="applyBreak" 
                                checked={applyBreak} 
                                onChange={e => handleUpdateBreakSettings(e.target.checked, breakMinutes)} 
                                className="w-4 h-4 text-blue-600 rounded cursor-pointer" 
                            />
                            <label htmlFor="applyBreak" className="text-sm font-bold text-slate-700 cursor-pointer">
                                Deduct Break
                            </label>
                        </div>
                        <select 
                            disabled={!applyBreak} 
                            value={breakMinutes} 
                            onChange={e => handleUpdateBreakSettings(applyBreak, Number(e.target.value))} 
                            className="text-sm font-semibold border border-slate-200 bg-white rounded-lg p-2 outline-none disabled:opacity-50"
                        >
                            <option value={30}>30 mins</option>
                            <option value={60}>1 hour</option>
                            <option value={90}>1.5 hours</option>
                            <option value={120}>2 hours</option>
                        </select>
                    </div>
                </div>

                {/* --- Schedule Manager Data Table --- */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    
                    {/* Table Header & Controls */}
                    <div className="p-4 md:p-6 border-b border-slate-100 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="flex gap-4 items-center">
                            <div className="bg-indigo-100 text-indigo-600 p-3 rounded-full shrink-0"><CalendarClock size={24} className="md:w-7 md:h-7" /></div>
                            <div>
                                <h2 className="text-lg md:text-xl font-black text-slate-800">Trainee Schedule Manager</h2>
                                <p className="text-xs md:text-sm text-slate-500 mt-1">Select multiple trainees to set their shifts in bulk.</p>
                            </div>
                        </div>
                        
                        <div className="flex w-full md:w-auto gap-3 items-center">
                            <div className="relative flex-1 md:w-64">
                                <Search className="absolute left-3 top-2.5 text-slate-400" size={18} />
                                <input type="text" placeholder="Search trainee..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm shadow-sm" />
                            </div>
                            {selectedIds.length > 0 && (
                                <button onClick={() => setShowBulkModal(true)} className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-indigo-700 shadow-sm flex items-center gap-2 transition-all animate-in slide-in-from-bottom-2 whitespace-nowrap">
                                    <CheckSquare size={16}/> Set Schedule ({selectedIds.length})
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Trainees List Table */}
                    <div className="overflow-x-auto w-full p-0 max-h-[500px]">
                        <table className="w-full text-left text-sm whitespace-nowrap min-w-[700px] border-collapse">
                            <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th className="px-6 py-4 w-12 text-center">
                                        <input type="checkbox" checked={selectedIds.length === filteredTrainees.length && filteredTrainees.length > 0} onChange={handleSelectAll} className="w-4 h-4 rounded border-slate-300 text-indigo-600 cursor-pointer"/>
                                    </th>
                                    <th className="px-6 py-4">Trainee Name</th>
                                    <th className="px-6 py-4">Shift Time</th>
                                    <th className="px-6 py-4">Schooling Day</th>
                                    <th className="px-6 py-4">Rest Day</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredTrainees.map(t => {
                                    const isSelected = selectedIds.includes(t.id);
                                    const hasSchedule = t.shiftStart && t.shiftEnd;
                                    return (
                                        <tr key={t.id} className={`transition-colors hover:bg-slate-50 cursor-pointer ${isSelected ? 'bg-indigo-50/50' : ''}`} onClick={() => handleSelect(t.id)}>
                                            <td className="px-6 py-4 text-center">
                                                <input type="checkbox" checked={isSelected} onChange={() => {}} className="w-4 h-4 rounded border-slate-300 text-indigo-600 cursor-pointer"/>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="font-bold text-slate-800">{t.name || t.firstName || t.Given} {t.lastName || t.Family}</div>
                                                <div className="text-[10px] text-slate-400 font-mono mt-0.5">{t.studentId || t['Student ID#']}</div>
                                            </td>
                                            <td className="px-6 py-4">
                                                {hasSchedule ? <span className="font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded border border-indigo-100">{formatTime(t.shiftStart)} - {formatTime(t.shiftEnd)}</span> : <span className="text-slate-400 italic">Not set</span>}
                                            </td>
                                            <td className="px-6 py-4">
                                                {t.schoolingDay ? <span className="font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded border border-blue-100">{t.schoolingDay}</span> : <span className="text-slate-400 italic">Not set</span>}
                                            </td>
                                            <td className="px-6 py-4">
                                                {t.restDay ? <span className="font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-100">{t.restDay}</span> : <span className="text-slate-400 italic">Not set</span>}
                                            </td>
                                        </tr>
                                    );
                                })}
                                {filteredTrainees.length === 0 && <tr><td colSpan="5" className="text-center p-8 text-slate-500 font-medium">No trainees found matching search.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>

                {/* --- BULK SCHEDULING MODAL --- */}
                {showBulkModal && (
                    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                            <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h3 className="font-black text-slate-800 flex items-center gap-2"><CalendarClock className="text-indigo-600"/> Batch Schedule</h3>
                                <button onClick={() => setShowBulkModal(false)} className="p-1.5 text-slate-400 hover:bg-slate-200 rounded-lg"><X size={20}/></button>
                            </div>
                            <form onSubmit={handleBulkSchedule} className="p-6 space-y-4">
                                <div className="bg-indigo-50 text-indigo-800 text-sm font-bold p-3 rounded-xl mb-4 border border-indigo-100 flex justify-center items-center gap-2">
                                    <Users size={16}/> Updating Schedule for {selectedIds.length} Trainee(s)
                                </div>
                                
                                {/* Shift Times */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Shift Start (From)</label>
                                        <input type="time" required value={bulkForm.start} onChange={e => setBulkForm({...bulkForm, start: e.target.value})} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm bg-white font-mono" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Shift End (To)</label>
                                        <input type="time" required value={bulkForm.end} onChange={e => setBulkForm({...bulkForm, end: e.target.value})} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm bg-white font-mono" />
                                    </div>
                                </div>

                                {/* Day Assignments */}
                                <div className="grid grid-cols-2 gap-4 mt-2">
                                    <div>
                                        <label className="block text-xs font-bold text-blue-600 mb-1">Schooling Day</label>
                                        <select value={bulkForm.schoolingDay} onChange={e => setBulkForm({...bulkForm, schoolingDay: e.target.value})} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm bg-white font-medium">
                                            {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-emerald-600 mb-1">Rest Day</label>
                                        <select value={bulkForm.restDay} onChange={e => setBulkForm({...bulkForm, restDay: e.target.value})} className="w-full p-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm bg-white font-medium">
                                            {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <p className="text-[11px] text-slate-400 italic leading-tight text-center">
                                    * The remaining 5 days will be automatically assigned as Training Days.
                                </p>

                                <div className="pt-4 flex gap-3">
                                    <button type="button" onClick={() => setShowBulkModal(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors">Cancel</button>
                                    <button type="submit" disabled={savingBulk} className="flex-1 py-3 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-colors flex items-center justify-center gap-2 disabled:opacity-70">
                                        {savingBulk ? <Loader2 size={16} className="animate-spin" /> : <Save size={16}/>} Apply Schedule
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

            </div>
        );
    };

        // --- DISPUTES & REQUESTS TAB (WITH DELETE FOR DENIED REQUESTS) ---
        const RequestsTab = ({ currentUser }) => {
            const { trainees, traineeMap, loading: traineesLoading } = useCompanyTrainees(currentUser.company);
            const [generalRequests, setGeneralRequests] = useState([]);
            const [makeupRequests, setMakeupRequests] = useState([]);
            const [loadingReqs, setLoadingReqs] = useState(true);
            const [filter, setFilter] = useState('Pending');
            
            const [activeRequest, setActiveRequest] = useState(null);
            const [actionType, setActionType] = useState('');
            const [hrRemarks, setHrRemarks] = useState('');
            const [saving, setSaving] = useState(false);

            // Fetch General Requests (Absences & Disputes)
            useEffect(() => {
                if (!currentUser?.company) return;
                const unsubRequests = onSnapshot(collection(db, `${BASE_PATH}/requests`), (snap) => {
                    const reqs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setGeneralRequests(reqs);
                });
                return () => unsubRequests();
            }, [currentUser]);

            // Fetch Make-Up Requests PER TRAINEE
            useEffect(() => {
                if (traineesLoading || !trainees || trainees.length === 0) {
                    setLoadingReqs(false);
                    return;
                }

                let unsubs = [];
                let isMounted = true;
                
                const initListeners = async () => {
                    setLoadingReqs(true);
                    
                    const idToUid = {};
                    try {
                        const profilesSnap = await getDocs(collectionGroup(db, 'profile'));
                        profilesSnap.docs.forEach(docItem => {
                            const data = docItem.data();
                            if (data.studentId) {
                                idToUid[data.studentId] = data.uid || (docItem.ref.parent && docItem.ref.parent.parent ? docItem.ref.parent.parent.id : null);
                            }
                        });
                    } catch(e) { console.warn("Could not fetch profiles for mapping", e); }

                    if (!isMounted) return;

                    const makeupsMap = {};

                    trainees.forEach(t => {
                        const uid = idToUid[t.studentId] || t.id;
                        if (uid) {
                            const mkRef = collection(db, 'artifacts', APP_ID, 'users', uid, 'makeups');
                            const unsub = onSnapshot(mkRef, (snap) => {
                                const tReqs = snap.docs.map(docSnap => {
                                    const data = docSnap.data();
                                    return {
                                        id: docSnap.id,
                                        isMakeup: true,
                                        userId: uid,
                                        studentId: t.studentId,
                                        userName: t.name,
                                        type: 'Make-Up Request',
                                        hrStatus: (data.status === 'Pending HR Approval' || data.status === 'Pending') ? 'Pending' : (data.status === 'Rejected' ? 'Denied' : data.status),
                                        createdAt: data.createdAt?.seconds ? new Date(data.createdAt.seconds * 1000).toISOString() : new Date().toISOString(),
                                        ...data
                                    };
                                });
                                makeupsMap[uid] = tReqs;
                                if (isMounted) {
                                    setMakeupRequests(Object.values(makeupsMap).flat());
                                }
                            }, (err) => console.warn("Makeup listener error", err));
                            
                            unsubs.push(unsub);
                        }
                    });

                    if (isMounted) setLoadingReqs(false);
                };

                initListeners();

                return () => {
                    isMounted = false;
                    unsubs.forEach(fn => fn());
                };
            }, [trainees, traineesLoading]);

            // Combine both sets of requests
            const allRequests = [...generalRequests, ...makeupRequests];
            
            const companyRequests = allRequests
                .filter(req => req.isMakeup || traineeMap[req.userId] || traineeMap[req.studentId])
                // Blocks anything with "device" in the type
                .filter(req => {
                    if (!req.type) return true;
                    return !String(req.type).toLowerCase().includes('device');
                })
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            
            const filteredRequests = companyRequests.filter(req => {
                const isPending = req.hrStatus === 'Pending' || !req.hrStatus;
                return filter === 'Pending' ? isPending : !isPending;
            });

            const openModal = (req, action) => {
                setActiveRequest(req);
                setActionType(action);
                setHrRemarks('');
            };

            const handleAction = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    if (activeRequest.isMakeup) {
                        const makeupStatus = actionType === 'Approve' ? 'Approved' : actionType === 'Deny' ? 'Rejected' : 'Acknowledged';
                        await updateDoc(doc(db, 'artifacts', APP_ID, 'users', activeRequest.userId, 'makeups', activeRequest.id), {
                            status: makeupStatus,
                            hrRemarks: hrRemarks,
                            updatedAt: new Date().toISOString(),
                            hrName: currentUser.name
                        });
                    } else {
                        const newHrStatus = actionType === 'Approve' ? 'Approved' : actionType === 'Deny' ? 'Denied' : 'Acknowledged';
                        let newGlobalStatus = activeRequest.status || 'Pending';

                        if (newHrStatus === 'Denied') newGlobalStatus = 'Denied by HR';
                        else if (newHrStatus === 'Approved') newGlobalStatus = 'Approved by HR';
                        else if (newHrStatus === 'Acknowledged') newGlobalStatus = 'Acknowledged by HR';

                        await updateDoc(doc(db, `${BASE_PATH}/requests`, activeRequest.id), {
                            hrStatus: newHrStatus,
                            status: newGlobalStatus,
                            hrRemarks: hrRemarks,
                            updatedAt: new Date().toISOString(),
                            hrName: currentUser.name
                        });
                    }
                    
                    setActiveRequest(null);
                    setHrRemarks('');
                } catch(err) {
                    alert("Failed to process request. Please try again.");
                }
                setSaving(false);
            };

            // NEW: Delete Request Handler
            const handleDeleteRequest = async (req) => {
                if (!window.confirm(`Are you sure you want to permanently delete this ${req.type}? This action cannot be undone.`)) return;
                
                try {
                    if (req.isMakeup) {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', req.userId, 'makeups', req.id));
                    } else {
                        await deleteDoc(doc(db, `${BASE_PATH}/requests`, req.id));
                    }
                    // No need to manually update state, the onSnapshot listeners will auto-remove it
                } catch (error) {
                    alert("Failed to delete request: " + error.message);
                }
            };

            if (traineesLoading || loadingReqs) return <div className="flex justify-center p-12 text-slate-400"><Loader2 className="animate-spin" size={32} /></div>;

            return (
                <div className="space-y-6 pb-20 animate-in fade-in duration-300 w-full">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-4">
                        <div>
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 flex items-center gap-2"><FileQuestion className="text-amber-500" /> Requests & Disputes</h2>
                            <p className="text-slate-500 text-sm mt-1">Manage absences, make-up requests, and emergency disputes.</p>
                        </div>
                        <div className="flex bg-slate-200 p-1 rounded-xl w-full md:w-auto">
                            {['Pending', 'Processed'].map(f => (
                                <button key={f} onClick={() => setFilter(f)} className={`flex-1 md:px-8 py-2 text-sm font-bold rounded-lg transition-colors whitespace-nowrap ${filter === f ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    {f}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Action Modal */}
                    {activeRequest && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className={`p-4 border-b flex justify-between items-center text-white ${actionType === 'Approve' ? 'bg-blue-600' : actionType === 'Deny' ? 'bg-red-600' : 'bg-purple-600'}`}>
                                    <h3 className="font-bold flex items-center gap-2">
                                        {actionType === 'Approve' ? <ThumbsUp size={18}/> : actionType === 'Deny' ? <ThumbsDown size={18}/> : <CheckCircle size={18}/>}
                                        {actionType} Request
                                    </h3>
                                    <button onClick={() => setActiveRequest(null)} className="text-white/70 hover:text-white"><X size={20}/></button>
                                </div>
                                <form onSubmit={handleAction} className="p-6">
                                    <p className="text-sm text-slate-600 mb-4">
                                        You are about to <strong>{actionType.toLowerCase()}</strong> the {activeRequest.type} for <strong>{activeRequest.userName || traineeMap[activeRequest.userId]?.name || traineeMap[activeRequest.studentId]?.name || 'Trainee'}</strong>.
                                    </p>

                                    {activeRequest.proofUrl && !activeRequest.isMakeup && (
                                    <div className="mb-4">
                                        <label className="block text-xs font-bold text-slate-500 mb-1">Attached Evidence</label>
                                        <a href={activeRequest.proofUrl} target="_blank" rel="noreferrer">
                                            <img src={activeRequest.proofUrl} alt="Evidence" className="w-full h-32 object-cover rounded-xl border border-slate-200 hover:opacity-90 transition-opacity" />
                                        </a>
                                    </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">HR Remarks (Optional)</label>
                                        <textarea value={hrRemarks} onChange={e => setHrRemarks(e.target.value)} placeholder="Add a note or reason..." className="w-full p-3 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm resize-none h-24" />
                                    </div>
                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setActiveRequest(null)} className="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition-colors">Cancel</button>
                                        <button type="submit" disabled={saving} className={`px-6 py-2.5 rounded-xl text-sm font-bold text-white flex items-center gap-2 transition-opacity disabled:opacity-50 ${actionType === 'Approve' ? 'bg-blue-600 hover:bg-blue-700' : actionType === 'Deny' ? 'bg-red-600 hover:bg-red-700' : 'bg-purple-600 hover:bg-purple-700'}`}>
                                            {saving ? <Loader2 size={16} className="animate-spin"/> : <Save size={16}/>} Confirm
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {filteredRequests.length === 0 ? (
                        <div className="bg-white rounded-3xl p-10 text-center border border-slate-200 shadow-sm w-full">
                            <div className="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300"><FileQuestion size={40} /></div>
                            <h3 className="text-xl font-bold text-slate-700 mb-2">No {filter} Requests</h3>
                            <p className="text-slate-500">There are currently no requests in this category.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
                            {filteredRequests.map(req => {
                                const traineeName = req.userName || traineeMap[req.userId]?.name || traineeMap[req.studentId]?.name || 'Unknown Trainee';
                                const hrPending = req.hrStatus === 'Pending' || !req.hrStatus;
                                const isDenied = req.hrStatus === 'Denied' || req.hrStatus === 'Rejected';
                                
                                return (
                                    <div key={req.id} className={`bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col transition-all hover:shadow-md ${
                                        req.isMakeup ? 'border-teal-200' : 'border-slate-200'
                                    }`}>
                                        <div className={`p-4 border-b flex justify-between items-start ${
                                            req.type === 'Emergency Absence' ? 'bg-rose-50 border-rose-100' : 
                                            req.type === 'Dispute' ? 'bg-amber-50 border-amber-100' : 
                                            req.isMakeup ? 'bg-teal-50 border-teal-100' : 
                                            'bg-blue-50 border-blue-100'
                                        }`}>
                                            <div>
                                                <span className={`text-xs font-black uppercase tracking-wider px-2 py-1 rounded-md ${
                                                    req.type === 'Emergency Absence' ? 'bg-rose-100 text-rose-700' : 
                                                    req.type === 'Dispute' ? 'bg-amber-100 text-amber-700' : 
                                                    req.isMakeup ? 'bg-teal-100 text-teal-700' :
                                                    'bg-blue-100 text-blue-700'
                                                }`}>
                                                    {req.type}
                                                </span>
                                                <h3 className="font-bold text-slate-800 mt-2">{traineeName}</h3>
                                            </div>
                                            <div className="text-right">

                                                    <span className="font-bold text-slate-500 block text-xs uppercase mb-1">Attached Document</span>
                                                    <img src={req.proofUrl} alt="Attached Evidence" className="w-full h-24 object-cover rounded-lg border border-slate-200 hover:opacity-90 transition-opacity" />
                                                    </a>
                                                    )}
                                                </>
                                            )}
                                            {/* Show HR Remarks if it was processed and remarks were left */}
                                            {!hrPending && req.hrRemarks && (
                                                <div className="mt-3 p-3 bg-slate-50 border border-slate-100 rounded-lg text-xs">
                                                    <span className="font-bold text-slate-500 uppercase block mb-1">HR Notes:</span>

                                                </div>
                                            )}
                                        </div>
                                        <div className="pt-2 border-t border-slate-100 flex flex-wrap gap-2 p-3 bg-slate-50">
                                            {hrPending ? (
                                                <>
                                                    {(req.type === 'Scheduled Absence' || req.isMakeup) && <button onClick={() => openModal(req, 'Approve')} className="flex-1 bg-white hover:bg-blue-600 hover:text-white text-blue-700 border border-blue-200 transition-colors font-bold py-2 rounded-xl text-xs flex justify-center items-center gap-1.5 shadow-sm"><ThumbsUp size={14}/> Approve</button>}
                                                    {(req.type === 'Emergency Absence' || req.type === 'Scheduled Absence') && !req.isMakeup && <button onClick={() => openModal(req, 'Acknowledge')} className="flex-1 bg-white hover:bg-purple-600 hover:text-white text-purple-700 border border-purple-200 transition-colors font-bold py-2 rounded-xl text-xs flex justify-center items-center gap-1.5 shadow-sm"><CheckCircle size={14}/> Ack</button>}
                                                    <button onClick={() => openModal(req, 'Deny')} className="flex-1 bg-white hover:bg-red-600 hover:text-white text-red-700 border border-red-200 transition-colors font-bold py-2 rounded-xl text-xs flex justify-center items-center gap-1.5 shadow-sm"><ThumbsDown size={14}/> Deny</button>

                                                    </span>

                                                    {isDenied && (
                                                        <button 
                                                            onClick={() => handleDeleteRequest(req)} 
                                                            className="flex items-center gap-1.5 text-xs font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-100 transition-colors shadow-sm"
                                                            title="Permanently delete this denied request"
                                                        >

                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // SCHOOLING ATTENDANCE TAB (HR PORTAL)
        // ==========================================
        function SchoolingAttendanceTab({ currentUser }) {
            // Leverage HR Portal's custom hook to only fetch active trainees for THIS company
            const { trainees: companyTrainees, loading: loadingCompanyTrainees } = useCompanyTrainees(currentUser?.company);

            const [allActiveTrainees, setAllActiveTrainees] = useState([]);
            const [displayedTrainees, setDisplayedTrainees] = useState([]);
            const [loadingTrainees, setLoadingTrainees] = useState(true);
            const [loadingLogs, setLoadingLogs] = useState(false);
            const [exportingAll, setExportingAll] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [durationFilter, setDurationFilter] = useState('');

            // Pagination States
            const [currentPage, setCurrentPage] = useState(1);
            const [pageSize, setPageSize] = useState(50); 
            const [totalPages, setTotalPages] = useState(1);

            useEffect(() => {
                setCurrentPage(1);
            }, [durationFilter, pageSize]);

            const durationOptions = [
                { value: '1', label: '1st Month (0 - 4 Weeks)', min: 0, max: 4 },
                { value: '2', label: '2nd Month (5 - 8 Weeks)', min: 5, max: 8 },
                { value: '3', label: '3rd Month (9 - 12 Weeks)', min: 9, max: 12 },
                { value: '4', label: '4th Month (13 - 16 Weeks)', min: 13, max: 16 },
                { value: '5', label: '5th Month (17 - 20 Weeks)', min: 17, max: 20 },
                { value: '6', label: '6th Month (21 - 24 Weeks)', min: 21, max: 24 },
                { value: '7', label: '7th Month (25 - 28 Weeks)', min: 25, max: 28 },
                { value: '8', label: '8th Month (29 - 32 Weeks)', min: 29, max: 32 },
                { value: '9', label: '9th Month (33 - 36 Weeks)', min: 33, max: 36 },
                { value: '10', label: '10th Month (37 - 40 Weeks)', min: 37, max: 40 },
                { value: '11', label: '11th Month (41 - 44 Weeks)', min: 41, max: 44 },
                { value: '12', label: '12th Month (45 - 48 Weeks)', min: 45, max: 48 },
                { value: '13', label: '13th Month (49 - 52 Weeks)', min: 49, max: 52 },
                { value: '14', label: '14th Month (53 - 56 Weeks)', min: 53, max: 56 },
                { value: '15', label: '15th Month (57 - 60 Weeks)', min: 57, max: 60 },
                { value: '16', label: '16th Month (61 - 64 Weeks)', min: 61, max: 64 },
                { value: '17', label: '17th Month (65 - 68 Weeks)', min: 65, max: 68 },
                { value: '18', label: '18th Month (69 - 72 Weeks)', min: 69, max: 72 },
                { value: '19', label: 'Overtime / Extension (73+ Weeks)', min: 73, max: 999 }
            ];

            const getMeetingCredits = (record) => {
                const locationText = `${record.hub || ''} ${record.venue || ''} ${record.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                const combinedText = `${record.activityType || ''} ${record.type || ''} ${record.topic || ''} ${record.rawSheetData?.['Topic'] || ''} ${locationText}`.toUpperCase();
                
                if (combinedText.includes('RETREAT')) return 4;
                if (combinedText.includes('PDS9') || combinedText.includes('PDS 9') || 
                    combinedText.includes('PDS18') || combinedText.includes('PDS 18')) return 2;
                return 1; 
            };

            // Phase 1: Process Hook Trainees and Calculate WTD
            useEffect(() => {
                if (loadingCompanyTrainees) {
                    setLoadingTrainees(true);
                    return;
                }
                
                setErrorMsg('');
                
                try {
                    const processedTraineesBase = companyTrainees.map(trainee => {
                        const startDateStr = trainee.iptDateStart !== 'N/A' ? trainee.iptDateStart : '';
                        let iptWTD = 0;
                        if (startDateStr) {
                            const start = new Date(startDateStr);
                            const now = new Date();
                            if (!isNaN(start.getTime()) && start < now) {
                                iptWTD = Math.floor((now - start) / (1000 * 60 * 60 * 24 * 7));
                            }
                        }
                        return { ...trainee, calculatedIptWTD: iptWTD };
                    });

                    setAllActiveTrainees(processedTraineesBase);
                    
                    if (processedTraineesBase.length === 0) setErrorMsg('No "Active" trainees were found in your company.');
                } catch (err) {
                    console.error("Trainee Processing Error:", err);
                    setErrorMsg(`Failed to process company trainees: ${err.message}`);
                }
                setLoadingTrainees(false);
            }, [companyTrainees, loadingCompanyTrainees]);

            // Phase 2: Lazy Load Logs for PAGINATED trainees only
            useEffect(() => {
                const loadLogsForFilter = async () => {
                    if (durationFilter === '') {
                        setDisplayedTrainees([]);
                        return;
                    }

                    setLoadingLogs(true);
                    setErrorMsg(''); 
                    
                    try {
                        let targetTrainees = [];
                        if (durationFilter === 'All') {
                            targetTrainees = [...allActiveTrainees];
                        } else {
                            const matchedOpt = durationOptions.find(opt => opt.value === durationFilter);
                            if (matchedOpt) {
                                targetTrainees = allActiveTrainees.filter(t => t.calculatedIptWTD >= matchedOpt.min && t.calculatedIptWTD <= matchedOpt.max);
                            }
                        }

                        const pagesCount = Math.ceil(targetTrainees.length / pageSize) || 1;
                        setTotalPages(pagesCount);

                        const startIndex = (currentPage - 1) * pageSize;
                        const pagedTrainees = targetTrainees.slice(startIndex, startIndex + pageSize);

                        if (pagedTrainees.length === 0) {
                            setDisplayedTrainees([]);
                            setLoadingLogs(false);
                            return;
                        }

                        const studentIds = pagedTrainees
                            .map(t => t.studentId || '')
                            .filter(id => id !== '' && id !== 'N/A');

                        let fetchedLogs = [];

                        if (studentIds.length > 0) {
                            const logsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'mentoring_attendance');
                            const chunks = [];
                            for (let i = 0; i < studentIds.length; i += 30) {
                                chunks.push(studentIds.slice(i, i + 30));
                            }

                            const queryPromises = chunks.map(chunk => {
                                const q = query(logsRef, where('studentId', 'in', chunk));
                                return getDocs(q);
                            });

                            const snapshots = await Promise.all(queryPromises);
                            snapshots.forEach(snap => {
                                snap.forEach(doc => {
                                    fetchedLogs.push({ id: doc.id, ...doc.data() });
                                });
                            });
                        }

                        const completeData = pagedTrainees.map(trainee => {
                            const sId = trainee.studentId || '';
                            const studentLogs = fetchedLogs.filter(l => l.studentId === sId);
                            
                            const validSchoolingRecords = studentLogs.filter(h => {
                                const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                                const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                                const isSchooling = combinedText.includes('SCHOOLING') || combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || combinedText.includes('PDS') || combinedText.includes('RETREAT');
                                if (!isSchooling) return false;
                                return ['Present', 'Late', 'Verified', 'Pending Attendance'].includes(h.status);
                            });

                            validSchoolingRecords.sort((a, b) => {
                                let timeA = a.timestamp?.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
                                let timeB = b.timestamp?.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
                                if (!timeA && a.date) timeA = new Date(a.date).getTime();
                                if (!timeB && b.date) timeB = new Date(b.date).getTime();
                                return timeA - timeB;
                            });

                            const totalActivitiesCredits = validSchoolingRecords.reduce((total, h) => {
                                if (['Present', 'Late', 'Verified'].includes(h.status)) return total + getMeetingCredits(h);
                                return total;
                            }, 0);

                            const fullName = trainee.name || 'Unknown';
                            const company = trainee.company || 'Unassigned';
                            const ic = trainee.assignedIC || 'Unassigned';
                            const startDateStr = trainee.iptDateStart !== 'N/A' ? trainee.iptDateStart : '';
                            const endDateStr = trainee.iptDateEnd || 'N/A';
                            const iptWTD = trainee.calculatedIptWTD;

                            const startObj = new Date(startDateStr);
                            const attendedWeeks = new Set();

                            if (!isNaN(startObj.getTime())) {
                                validSchoolingRecords.forEach(h => {
                                    if (!['Present', 'Late', 'Verified'].includes(h.status)) return;
                                    let entryDateStr = h.date || h.importedAt;
                                    if (entryDateStr) {
                                        let entryDate = new Date(entryDateStr);
                                        if (!isNaN(entryDate.getTime())) {
                                            const diffTime = entryDate.getTime() - startObj.getTime();
                                            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                                            
                                            let weekNum = 1;
                                            if (diffDays >= 0) {
                                                weekNum = Math.floor(diffDays / 7) + 1;
                                            }
                                            attendedWeeks.add(weekNum);
                                        }
                                    }
                                });
                            }

                            const explicitMissingWeeksList = [];
                            for (let w = 1; w <= iptWTD; w++) {
                                if (!attendedWeeks.has(w)) {
                                    explicitMissingWeeksList.push(w);
                                }
                            }
                            const missingWeeksStr = explicitMissingWeeksList.length > 0 
                                ? explicitMissingWeeksList.map(w => `W${w}`).join(', ') 
                                : (iptWTD > 0 ? 'None' : 'N/A');

                            const datesPresent = validSchoolingRecords
                                .filter(h => ['Present', 'Late', 'Verified'].includes(h.status))
                                .map(l => l.date || (l.importedAt ? new Date(l.importedAt).toLocaleDateString() : 'Unknown'))
                                .filter(Boolean)
                                .join(', ');

                            const weeksNoEntry = Math.max(0, iptWTD - totalActivitiesCredits);

                            return {
                                id: trainee.id,
                                studentId: sId || 'N/A',
                                name: fullName,
                                company: company,
                                ic: ic,
                                startDate: startDateStr || 'N/A',
                                endDate: endDateStr,
                                totalActivities: totalActivitiesCredits,
                                iptWTD: iptWTD,
                                datesPresent: datesPresent || 'None',
                                explicitMissingWeeks: missingWeeksStr,
                                weeksNoEntry: weeksNoEntry,
                                totalWeeksNoSchooling: weeksNoEntry
                            };
                        });

                        setDisplayedTrainees(completeData);
                    } catch (err) {
                        console.error("Lazy Load Logs Error:", err);
                        setErrorMsg(`Error loading attendance logs: ${err.message}`); 
                    }
                    setLoadingLogs(false);
                };

                loadLogsForFilter();
            }, [durationFilter, allActiveTrainees, currentPage, pageSize]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const sortedTrainees = [...displayedTrainees].sort((a, b) => {
                if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
                if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            // --- EXPORT TO CSV LOGIC (CURRENT PAGE) ---
            const handleExportPageCSV = () => {
                if (sortedTrainees.length === 0) return;
                generateCSV(sortedTrainees, `Schooling_Records_Page${currentPage}`);
            };

            // --- EXPORT TO CSV LOGIC (ALL PAGES) ---
            const handleExportAllCSV = async () => {
                setExportingAll(true);
                setErrorMsg('');
                
                try {
                    let targetTrainees = [];
                    if (durationFilter === 'All') {
                        targetTrainees = [...allActiveTrainees];
                    } else {
                        const matchedOpt = durationOptions.find(opt => opt.value === durationFilter);
                        if (matchedOpt) {
                            targetTrainees = allActiveTrainees.filter(t => t.calculatedIptWTD >= matchedOpt.min && t.calculatedIptWTD <= matchedOpt.max);
                        }
                    }

                    if (targetTrainees.length === 0) {
                        setExportingAll(false);
                        return;
                    }

                    const studentIds = targetTrainees
                        .map(t => t.studentId || '')
                        .filter(id => id !== '' && id !== 'N/A');

                    let fetchedLogs = [];

                    if (studentIds.length > 0) {
                        const logsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'mentoring_attendance');
                        const chunks = [];
                        for (let i = 0; i < studentIds.length; i += 30) {
                            chunks.push(studentIds.slice(i, i + 30));
                        }

                        for (const chunk of chunks) {
                            const q = query(logsRef, where('studentId', 'in', chunk));
                            const snap = await getDocs(q);
                            snap.forEach(doc => {
                                fetchedLogs.push({ id: doc.id, ...doc.data() });
                            });
                        }
                    }

                    const completeData = targetTrainees.map(trainee => {
                        const sId = trainee.studentId || '';
                        const studentLogs = fetchedLogs.filter(l => l.studentId === sId);
                        
                        const validSchoolingRecords = studentLogs.filter(h => {
                            const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                            const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                            const isSchooling = combinedText.includes('SCHOOLING') || combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || combinedText.includes('PDS') || combinedText.includes('RETREAT');
                            if (!isSchooling) return false;
                            return ['Present', 'Late', 'Verified', 'Pending Attendance'].includes(h.status);
                        });

                        validSchoolingRecords.sort((a, b) => {
                            let timeA = a.timestamp?.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
                            let timeB = b.timestamp?.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
                            if (!timeA && a.date) timeA = new Date(a.date).getTime();
                            if (!timeB && b.date) timeB = new Date(b.date).getTime();
                            return timeA - timeB;
                        });

                        const totalActivitiesCredits = validSchoolingRecords.reduce((total, h) => {
                            if (['Present', 'Late', 'Verified'].includes(h.status)) return total + getMeetingCredits(h);
                            return total;
                        }, 0);

                        const fullName = trainee.name || 'Unknown';
                        const company = trainee.company || 'Unassigned';
                        const ic = trainee.assignedIC || 'Unassigned';
                        const startDateStr = trainee.iptDateStart !== 'N/A' ? trainee.iptDateStart : '';
                        const endDateStr = trainee.iptDateEnd || 'N/A';
                        const iptWTD = trainee.calculatedIptWTD;

                        const startObj = new Date(startDateStr);
                        const attendedWeeks = new Set();

                        if (!isNaN(startObj.getTime())) {
                            validSchoolingRecords.forEach(h => {
                                if (!['Present', 'Late', 'Verified'].includes(h.status)) return;
                                let entryDateStr = h.date || h.importedAt;
                                if (entryDateStr) {
                                    let entryDate = new Date(entryDateStr);
                                    if (!isNaN(entryDate.getTime())) {
                                        const diffTime = entryDate.getTime() - startObj.getTime();
                                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                                        let weekNum = 1;
                                        if (diffDays >= 0) weekNum = Math.floor(diffDays / 7) + 1;
                                        attendedWeeks.add(weekNum);
                                    }
                                }
                            });
                        }

                        const explicitMissingWeeksList = [];
                        for (let w = 1; w <= iptWTD; w++) {
                            if (!attendedWeeks.has(w)) explicitMissingWeeksList.push(w);
                        }
                        const missingWeeksStr = explicitMissingWeeksList.length > 0 
                            ? explicitMissingWeeksList.map(w => `W${w}`).join(', ') : (iptWTD > 0 ? 'None' : 'N/A');

                        const datesPresent = validSchoolingRecords
                            .filter(h => ['Present', 'Late', 'Verified'].includes(h.status))
                            .map(l => l.date || (l.importedAt ? new Date(l.importedAt).toLocaleDateString() : 'Unknown'))
                            .filter(Boolean).join(', ');

                        const weeksNoEntry = Math.max(0, iptWTD - totalActivitiesCredits);

                        return {
                            studentId: sId || 'N/A', name: fullName, company: company, ic: ic,
                            startDate: startDateStr || 'N/A', endDate: endDateStr || 'N/A',
                            totalActivities: totalActivitiesCredits, iptWTD: iptWTD,
                            datesPresent: datesPresent || 'None', explicitMissingWeeks: missingWeeksStr,
                            weeksNoEntry: weeksNoEntry, totalWeeksNoSchooling: weeksNoEntry
                        };
                    });

                    completeData.sort((a, b) => a.name.localeCompare(b.name));

                    let fileNameMonth = durationFilter === 'All' ? 'All_Active' : `Month_${durationFilter}`;
                    generateCSV(completeData, `Schooling_Records_${fileNameMonth}_COMPLETE`);

                } catch (err) {
                    console.error("Export All Error:", err);
                    setErrorMsg(`Failed to export all records: ${err.message}`);
                }
                setExportingAll(false);
            };

            const generateCSV = (dataList, fileName) => {
                const headers = [
                    "Student ID", "Trainee Name", "Company Name", "Assigned IC",
                    "IPT Date Start", "IPT Date End", "Total Activities", 
                    "IPT WTD", "Dates Present", "Missing Week #s", "Total Weeks No Schooling"
                ];

                const csvRows = [headers.join(",")];
                
                dataList.forEach(t => {
                    const row = [
                        `"${t.studentId}"`, `"${t.name}"`, `"${t.company}"`, `"${t.ic}"`,
                        `"${t.startDate}"`, `"${t.endDate}"`, `"${t.totalActivities}"`,
                        `"${t.iptWTD}"`, `"${t.datesPresent}"`, `"${t.explicitMissingWeeks}"`,
                        `"${t.totalWeeksNoSchooling}"`
                    ];
                    csvRows.push(row.join(","));
                });

                const csvString = csvRows.join("\n");
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `${fileName}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <div className="w-3" />;
                return sortConfig.direction === 'asc' ? <span className="text-xs ml-1">▲</span> : <span className="text-xs ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                            <BookOpen className="text-indigo-600" size={28} /> 
                            Schooling Attendance (Your Company)
                        </h2>
                        
                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full xl:w-auto">
                            <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200 w-full sm:w-auto">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-2 whitespace-nowrap">
                                    Select Period:
                                </label>
                                <select 
                                    value={durationFilter} 
                                    onChange={e => setDurationFilter(e.target.value)}
                                    disabled={loadingTrainees || exportingAll}
                                    className="bg-white border border-slate-200 text-slate-800 font-bold rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 cursor-pointer shadow-sm w-full disabled:opacity-50"

        // --- SETTINGS TAB ---
        const SettingsTab = ({ currentUser }) => {
            const [currentPassword, setCurrentPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState({ type: '', text: '' });

            const handleUpdatePassword = async (e) => {
                e.preventDefault();
                setMessage({ type: '', text: '' });

                if (newPassword !== confirmPassword) {
                    return setMessage({ type: 'error', text: 'New passwords do not match.' });
                }
                if (newPassword.length < 6) {
                    return setMessage({ type: 'error', text: 'Password must be at least 6 characters.' });
                }

                setLoading(true);
                try {
                    const user = auth.currentUser;
                    const credential = EmailAuthProvider.credential(user.email, currentPassword);
                    await reauthenticateWithCredential(user, credential);
                    await updatePassword(user, newPassword);
                    
                    setMessage({ type: 'success', text: 'Account password updated successfully!' });
                    setCurrentPassword('');
                    setNewPassword('');
                    setConfirmPassword('');
                } catch (error) {
                    setMessage({ type: 'error', text: error.message.replace('Firebase: ', '') });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6 max-w-2xl animate-in fade-in duration-300 pb-20 w-full">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">

                                <label className="block text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Full Name</label>

                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
                                <div className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium text-sm md:text-base truncate">{currentUser.email}</div>
                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Assigned Company</label>
                                <div className="w-full p-3 bg-blue-50 border border-blue-200 rounded-xl text-blue-800 font-bold text-sm md:text-base">{currentUser.company || 'Not Assigned'}</div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Lock className="text-slate-500"/> Security & Password</h2>
                        
                        {message.text && (
                            <div className={`p-4 rounded-xl text-sm font-bold flex items-start gap-3 mb-6 ${message.type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                                {message.type === 'error' ? <AlertTriangle size={18} className="shrink-0 mt-0.5" /> : <CheckCircle size={18} className="shrink-0 mt-0.5" />}
                                <span>{message.text}</span>
                            </div>
                        )}

                        <form onSubmit={handleUpdatePassword} className="space-y-4">
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1">Current Password</label>
                                <input type="password" required value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm md:text-base" />
                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1">New Password</label>
