    <script>
    // Disable Right-Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable common developer tools keyboard shortcuts
    document.onkeydown = function(e) {
        // Disable F12
        if(e.keyCode == 123) { return false; } 
        // Disable Ctrl+Shift+I (Inspect)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } 
        // Disable Ctrl+Shift+C (Inspect Element)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } 
        // Disable Ctrl+Shift+J (Console)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } 
        // Disable Ctrl+U (View Source)
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } 
    }
    </script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

<body class="text-slate-900 h-screen w-screen overflow-hidden">

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Menu, X, LogOut, Users, CheckCircle, Clock, CheckCircle2,
            MapPin, Save, Building, Loader2, Settings, CalendarClock, Check,
            FileQuestion, ThumbsUp, ThumbsDown, Calendar, Download, Search, CalendarDays, AlertTriangle,
            ChevronRight, Mail, Phone, BookOpen, Lock, Activity, FileText, UserPlus, History, Trash2,
            CheckSquare, Briefcase, PlusCircle, UserCircle2, User, Edit, Send, MessageSquare, AlertCircle, BellRing
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from 'firebase/auth';
        import { initializeFirestore, getFirestore, collection, collectionGroup, doc, getDoc, getDocs, setDoc, updateDoc, onSnapshot, query, where, addDoc, orderBy, deleteDoc} from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U",
            authDomain: "dualtech-ojt-portal.firebaseapp.com",
            projectId: "dualtech-ojt-portal",
            storageBucket: "dualtech-ojt-portal.firebasestorage.app",
            messagingSenderId: "255242185978",
            appId: "1:255242185978:web:2f07c554fad2e3a78ead43"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Use initializeFirestore to force Long Polling to bypass Ad-Blockers
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });

        const APP_ID = 'dualtech-ojt-portal';
        const BASE_PATH = `artifacts/${APP_ID}/public/data`;
        const TOTAL_REQUIRED_HOURS = 3168;
        
        const isMatch = (str1, str2) => {
            if (!str1 || !str2) return false;
            return String(str1).trim().toLowerCase() === String(str2).trim().toLowerCase();
        };

        // --- CUSTOM HOOK: FETCH ONLY TRAINEES IN HR'S COMPANY (CACHED) ---
        const useCompanyTrainees = (company) => {
            // 1. Create unique cache keys based on the company name
            const safeCompanyKey = (company || 'unknown').replace(/\s+/g, '_');
            const cacheKeyTrainees = `hr_cache_trainees_${safeCompanyKey}`;
            const cacheKeyMap = `hr_cache_traineeMap_${safeCompanyKey}`;

            // 2. Instantly initialize state from Local Storage if it exists
            const [trainees, setTrainees] = useState(() => {
                const cached = localStorage.getItem(cacheKeyTrainees);
                return cached ? JSON.parse(cached) : [];
            });
            
            const [traineeMap, setTraineeMap] = useState(() => {
                const cached = localStorage.getItem(cacheKeyMap);
                return cached ? JSON.parse(cached) : {};
            });
            
            // 3. Skip loading spinner if we successfully loaded from cache
            const [loading, setLoading] = useState(() => !localStorage.getItem(cacheKeyTrainees));

            useEffect(() => {
                if (!company) return;

                const unsubUsers = onSnapshot(collection(db, 'users'), (userSnap) => {
                    const usersMap = {};
                    userSnap.docs.forEach(d => { usersMap[d.id] = { id: d.id, ...d.data() }; });

                    const unsubTrainees = onSnapshot(collection(db, `${BASE_PATH}/trainees`), (tSnap) => {
                        const fetchedMap = {};

                        const addOrUpdateTrainee = (id, rawData) => {
                            const data = (rawData.profile && typeof rawData.profile === 'object') ? 
                                         { ...rawData, ...rawData.profile } : rawData;

                            if (!fetchedMap[id]) fetchedMap[id] = { id, ...data };
                            else {
                                for (const key in data) {
                                    if (data[key] !== undefined && data[key] !== null && data[key] !== '') {
                                        fetchedMap[id][key] = data[key];
                                    }
                                }
                            }
                        };

                        Object.values(usersMap).forEach(uData => {
                            const role = String(uData.role || uData.userType || '').toUpperCase();
                            const userComp = uData.company || uData.assignedCompany || uData.companyName || '';
                            const isHRAdmin = role.includes('HR') || role.includes('ADMIN');
                            if (!isHRAdmin && isMatch(userComp, company)) {
                                addOrUpdateTrainee(uData.id, uData);
                            }
                        });

                        tSnap.docs.forEach(doc => {
                            const tData = doc.data();
                            const tId = tData.userId || tData.studentId || doc.id;
                            const tComp = tData.company || tData.assignedCompany || '';
                            
                            let rootData = usersMap[tId];
                            if (!rootData && tData.email) rootData = Object.values(usersMap).find(u => isMatch(u.email, tData.email));
                            const effectiveComp = tComp || (rootData ? (rootData.company || rootData.assignedCompany) : '');

                            if (isMatch(effectiveComp, company)) {
                                const finalId = rootData ? rootData.id : tId;
                                if (rootData) addOrUpdateTrainee(finalId, rootData);
                                addOrUpdateTrainee(finalId, tData);
                            }
                        });

                        let finalTrainees = Object.values(fetchedMap).map(data => ({
                            ...data,
                            name: data.name || data.fullName || data.userName || data.studentName || (data.firstName ? `${data.firstName} ${data.lastName || ''}`.trim() : '') || 'Unknown Trainee',
                            email: data.email || data.userEmail || data.studentEmail || 'N/A',
                            studentId: data.studentId || data.idNo || data.id || 'N/A',
                            course: data.course || data.program || data.department || 'N/A',
                            contact: data.contact || data.phone || data.mobile || data.contactNo || data.phoneNumber || 'N/A',
                            renderedHours: Number(data.renderedHours || data.hoursRendered || data.totalHours || 0),
                            requiredHours: TOTAL_REQUIRED_HOURS,
                            iptDateStart: data.iptDateStart || data.iptStartDate || data.startDate || data['IPT Date Start'] || data['IPT Start Date'] || 'N/A',
                            iptDateEnd: data.iptDateEnd || data.iptEndDate || data.endDate || data['IPT Date End'] || data['IPT End Date'] || 'N/A',
                            shiftStart: data.shiftStart || null,
                            shiftEnd: data.shiftEnd || null,
                            status: data.status || 'Active'
                        }));

                        finalTrainees = finalTrainees.filter(t => t.status.trim().toLowerCase() === 'active');
                        finalTrainees.sort((a, b) => a.name.localeCompare(b.name));
                        
                        const newMap = {};
                        finalTrainees.forEach(t => newMap[t.id] = t);
                        
                        // 4. Update React State
                        setTrainees(finalTrainees);
                        setTraineeMap(newMap);
                        setLoading(false);

                        // 5. Update Local Storage Cache silently in the background
                        localStorage.setItem(cacheKeyTrainees, JSON.stringify(finalTrainees));
                        localStorage.setItem(cacheKeyMap, JSON.stringify(newMap));
                    });
                    return () => unsubTrainees();
                });
                return () => unsubUsers();
            }, [company, cacheKeyTrainees, cacheKeyMap]); // Added cache keys to dependencies

            return { trainees, traineeMap, loading };
        };

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-8 text-center text-red-500 bg-red-50 h-screen flex flex-col items-center justify-center w-full">
                        <h2 className="text-2xl font-bold mb-4">Something went wrong.</h2>
                        <p className="font-mono text-sm bg-white p-4 rounded shadow">{this.state.error?.toString()}</p>
                        <button onClick={() => window.location.reload()} className="mt-6 bg-red-600 text-white px-6 py-2 rounded-lg">Reload App</button>
                    </div>;
                }
                return this.props.children;
            }
        }

        // --- HELPER DATE FUNCTIONS ---
        const getTodayString = () => {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        };
        const getWeekString = () => {
            const d = new Date();
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const w = Math.round(((d.getTime() - new Date(d.getFullYear(), 0, 4).getTime()) / 86400000 + 1) / 7);
            return `${d.getFullYear()}-W${String(w).padStart(2, '0')}`;
        };
        const getMonthString = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        // --- ATTENDANCE TAB ---
            const AttendanceTab = ({ currentUser }) => {
            const { trainees, loading: traineesLoading } = useCompanyTrainees(currentUser.company);
            const [logs, setLogs] = useState([]);
            const [loadingLogs, setLoadingLogs] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            
            const [viewMode, setViewMode] = useState('daily'); 
            const [selectedDate, setSelectedDate] = useState(getTodayString());
            const [selectedWeek, setSelectedWeek] = useState(getWeekString());
            const [selectedMonth, setSelectedMonth] = useState(getMonthString());

            useEffect(() => {
                if (traineesLoading || !currentUser?.company) return;

                const fetchLogs = async () => {
                    setLoadingLogs(true);
                    try {
                        const idToUid = {};
                        const profilesSnap = await getDocs(collectionGroup(db, 'profile'));
                        profilesSnap.docs.forEach(docItem => {
                            const data = docItem.data();
                            if (data.studentId) {
                                idToUid[data.studentId] = data.uid || (docItem.ref.parent && docItem.ref.parent.parent ? docItem.ref.parent.parent.id : null);
                            }
                        });

                        let allLogs = [];
                        await Promise.all(trainees.map(async (t) => {
                            const uid = idToUid[t.studentId] || t.id;
                            if (uid) {
                                const logsRef = collection(db, 'artifacts', APP_ID, 'users', uid, 'attendanceLogs');
                                const snap = await getDocs(logsRef);
                                snap.docs.forEach(docSnap => {
                                    allLogs.push({ id: docSnap.id, extractedUserId: t.id, ...docSnap.data() });
                                });
                            }
                        }));
                        setLogs(allLogs);
                    } catch (error) {
                        console.error("Error fetching logs:", error);
                    }
                    setLoadingLogs(false);
                };

                fetchLogs();
            }, [trainees, traineesLoading, currentUser, selectedDate, selectedWeek, selectedMonth]);

            const getRange = () => {
                let start, end;
                if (viewMode === 'daily') {
                    start = new Date(`${selectedDate}T00:00:00`);
                    end = new Date(`${selectedDate}T23:59:59`);
                } else if (viewMode === 'weekly') {
                    const [year, week] = selectedWeek.split('-W');
                    const simple = new Date(year, 0, 1 + (week - 1) * 7);
                    const dow = simple.getDay();
                    start = new Date(simple);
                    start.setDate(simple.getDate() - dow + (dow === 0 ? -6 : 1));
                    start.setHours(0,0,0,0);
                    end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    end.setHours(23,59,59,999);
                } else if (viewMode === 'monthly') {
                    const [year, month] = selectedMonth.split('-');
                    start = new Date(year, month - 1, 1, 0,0,0,0);
                    end = new Date(year, month, 0, 23,59,59,999);
                }
                return { start, end };
            };

            const parseTime = (val) => {
                if (!val) return null;
                if (val.seconds) return new Date(val.seconds * 1000);
                return new Date(val);
            };

            const processedData = useMemo(() => {
                if (!trainees.length) return [];
                const { start, end } = getRange();

                // Explicitly filter out Company Trainers so they do not appear in the attendance list
                const validTrainees = trainees.filter(t => {
                    const roleStr = String(t.role || t.Role || '').toUpperCase();
                    return roleStr !== 'COMPANY_TRAINER' && roleStr !== 'COMPANY TRAINER' && !roleStr.includes('TRAINER');
                });

                const rows = validTrainees.map(t => {
                    const tLogs = logs.filter(l => {
                        const matchId = l.extractedUserId === t.id || l.extractedUserId === t.studentId || l.studentId === t.id || l.studentId === t.studentId;
                        const matchEmail = l.email && t.email && t.email !== 'N/A' && l.email.toLowerCase() === t.email.toLowerCase();
                        const matchName = l.name && t.name && t.name !== 'Unknown Trainee' && l.name.toLowerCase() === t.name.toLowerCase();
                        const isTraineeLog = matchId || matchEmail || matchName;

                        let logTime = parseTime(l.timestamp) || parseTime(l.timeIn) || parseTime(l.createdAt) || parseTime(l.date);
                        if (!logTime || isNaN(logTime.getTime())) return false;

                        return isTraineeLog && logTime >= start && logTime <= end;
                    });

                    const checkVerified = (details, fallback) => {
                        if (details?.statusRemark?.toLowerCase().includes('verified')) return true;
                        if (fallback === true || fallback === 'Verified') return true;
                        return false;
                    };

                    const getLoc = (details, rootLog) => {
                        if (details?.location?.lat) return `${details.location.lat},${details.location.lon}`;
                        if (details?.location?.latitude) return `${details.location.latitude},${details.location.longitude}`;
                        if (details?.lat) return `${details.lat},${details.lon}`;
                        if (details?.latitude) return `${details.latitude},${details.longitude}`;
                        if (rootLog?.location?.lat) return `${rootLog.location.lat},${rootLog.location.lon}`;
                        if (rootLog?.location?.latitude) return `${rootLog.location.latitude},${rootLog.location.longitude}`;
                        if (rootLog?.lat) return `${rootLog.lat},${rootLog.lon}`;
                        if (rootLog?.latitude) return `${rootLog.latitude},${rootLog.longitude}`;
                        return null;
                    };

                    if (viewMode === 'daily') {
                        let timeIn = null, timeOut = null;
                        let disputeRemark = ''; 
                        
                        tLogs.forEach(l => {
                            if (l.timeIn || (l.timestamp && String(l.type).toLowerCase().includes('in'))) {
                                const ti = parseTime(l.timeIn || l.timestamp);
                                if (!timeIn || ti < timeIn.time) {
                                    timeIn = { 
                                        time: ti, 
                                        str: ti.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 
                                        loc: getLoc(l.clockInDetails, l),
                                        verified: checkVerified(l.clockInDetails, l.inGeofence || l.status)
                                    };
                                }
                            }
                            if (l.timeOut || (l.timestamp && String(l.type).toLowerCase().includes('out'))) {
                                const to = parseTime(l.timeOut || l.timestamp);
                                if (!timeOut || to > timeOut.time) {
                                    timeOut = { 
                                        time: to, 
                                        str: to.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 
                                        loc: getLoc(l.clockOutDetails, l),
                                        verified: checkVerified(l.clockOutDetails, l.inGeofence || l.status)
                                    };
                                }
                            }
                            if (l.disputeRemark || l.clockInDetails?.statusRemark === 'Blocked') {
                                disputeRemark = l.disputeRemark || 'Location Blocked / Disputed';
                            }
                        });

                        let duration = 0;
                        if (timeIn && timeOut) duration = (timeOut.time - timeIn.time) / (1000 * 60 * 60);

                        let dailyStatus = 'Absent';
                        let isLate = false;
                        let isUndertime = false;

                        if (timeIn || timeOut) {
                            if (t.shiftStart && timeIn) {
                                const [h, m] = t.shiftStart.split(':').map(Number);
                                const shiftStartObj = new Date(start);
                                shiftStartObj.setHours(h, m, 0, 0);
                                if (timeIn.time > shiftStartObj) isLate = true;
                            }
                            if (t.shiftEnd && timeOut) {
                                const [h, m] = t.shiftEnd.split(':').map(Number);
                                const shiftEndObj = new Date(start);
                                shiftEndObj.setHours(h, m, 0, 0);
                                if (timeOut.time < shiftEndObj) isUndertime = true;
                            }

                            if (timeIn && !timeOut) dailyStatus = 'Currently Clocked In';
                            else if (duration >= 8) dailyStatus = 'Present'; 
                            else if (isLate && isUndertime) dailyStatus = 'Late & Undertime';
                            else if (isLate) dailyStatus = 'Late';
                            else if (isUndertime || (!t.shiftStart && duration < 8)) dailyStatus = 'Undertime';
                            else dailyStatus = 'Present';
                        }

                        return { ...t, timeIn, timeOut, duration, dailyStatus, disputeRemark, hasLogs: tLogs.length > 0 };
                    } else {
                        const dailyMap = {};
                        tLogs.forEach(l => {
                            if (l.timeIn) {
                                const ti = parseTime(l.timeIn);
                                const dStr = ti.toLocaleDateString();
                                if (!dailyMap[dStr]) dailyMap[dStr] = { in: null, out: null };
                                if (!dailyMap[dStr].in || ti < dailyMap[dStr].in) dailyMap[dStr].in = ti;
                            }
                            if (l.timeOut) {
                                const to = parseTime(l.timeOut);
                                const dStr = to.toLocaleDateString();
                                if (!dailyMap[dStr]) dailyMap[dStr] = { in: null, out: null };
                                if (!dailyMap[dStr].out || to > dailyMap[dStr].out) dailyMap[dStr].out = to;
                            }
                            if (l.timestamp && typeof l.type === 'string') {
                                const time = parseTime(l.timestamp);
                                const dStr = time.toLocaleDateString();
                                if (!dailyMap[dStr]) dailyMap[dStr] = { in: null, out: null };
                                const type = String(l.type).toLowerCase();
                                if (type.includes('in') && (!dailyMap[dStr].in || time < dailyMap[dStr].in)) dailyMap[dStr].in = time;
                                if (type.includes('out') && (!dailyMap[dStr].out || time > dailyMap[dStr].out)) dailyMap[dStr].out = time;
                            }
                        });

                        let totalHours = 0;
                        let daysPresent = 0;
                        Object.values(dailyMap).forEach(day => {
                            if (day.in && day.out) {
                                totalHours += (day.out - day.in) / (1000 * 60 * 60);
                                daysPresent++;
                            }
                        });

                        return { ...t, totalHours, daysPresent, hasLogs: tLogs.length > 0 };
                    }
                });

                let filtered = rows.filter(r => (r.name || '').toLowerCase().includes(searchTerm.toLowerCase()));
                
                if (viewMode === 'daily') {
                    const priorities = { 'Currently Clocked In': 1, 'Present': 2, 'Late': 3, 'Undertime': 4, 'Late & Undertime': 5, 'Absent': 6 };
                    filtered.sort((a, b) => priorities[a.dailyStatus] - priorities[b.dailyStatus] || (a.name || '').localeCompare(b.name || ''));
                }

                return filtered;
            }, [trainees, logs, viewMode, selectedDate, selectedWeek, selectedMonth, searchTerm]);

            // --- CSV EXPORT LOGIC ---
            const handleExportCSV = () => {
                let csvContent = "";
                const compName = currentUser.company ? currentUser.company.replace(/\s+/g, '_') : 'Company';
                
                if (viewMode === 'daily') {
                    const fileName = `Attendance_Report_${compName}_Daily_${selectedDate}.csv`;
                    csvContent += "Student Number,Full Name,Company,Date of Attendance,Time In,Time In Location,Time Out,Time Out Location,Remarks\n";
                    
                    processedData.forEach(row => {
                        const studentNo = `="${row.studentId || ''}"`; 
                        const name = `"${(row.name || '').replace(/"/g, '""')}"`;
                        const company = `"${(currentUser.company || '').replace(/"/g, '""')}"`;
                        const date = selectedDate;
                        const timeInStr = row.timeIn ? row.timeIn.str : '--:--';
                        const timeInLocStr = row.timeIn && row.timeIn.loc ? (row.timeIn.verified ? 'Within Valid Location' : 'Outside Valid Location') : 'N/A';
                        const timeOutStr = row.timeOut ? row.timeOut.str : '--:--';
                        const timeOutLocStr = row.timeOut && row.timeOut.loc ? (row.timeOut.verified ? 'Within Valid Location' : 'Outside Valid Location') : 'N/A';
                        
                        let remarks = row.disputeRemark || '';
                        if (!remarks) {
                            if (!row.timeIn && !row.timeOut) remarks = 'Absent';
                            else if (row.timeIn && !row.timeOut) remarks = 'Currently Clocked In';
                            else remarks = row.dailyStatus || 'Completed Shift';
                        }
                        remarks = `"${remarks.replace(/"/g, '""')}"`;
                        
                        csvContent += `${studentNo},${name},${company},${date},${timeInStr},${timeInLocStr},${timeOutStr},${timeOutLocStr},${remarks}\n`;
                    });
                    
                    downloadCSV(csvContent, fileName);
                } else {
                    const dateTag = viewMode === 'weekly' ? selectedWeek : selectedMonth;
                    const fileName = `Attendance_Report_${compName}_${viewMode}_${dateTag}.csv`;
                    csvContent += "Student Number,Full Name,Company,Days Present,Total Hours Rendered,Record Status\n";
                    
                    processedData.forEach(row => {
                        const studentNo = `="${row.studentId || ''}"`;
                        const name = `"${(row.name || '').replace(/"/g, '""')}"`;
                        const company = `"${(currentUser.company || '').replace(/"/g, '""')}"`;
                        const daysPresent = row.daysPresent || 0;
                        const totalHours = row.totalHours ? row.totalHours.toFixed(2) : '0.00';
                        const recordStatus = row.hasLogs ? 'Has Attendance' : 'No Records Found';
                        
                        csvContent += `${studentNo},${name},${company},${daysPresent},${totalHours},${recordStatus}\n`;
                    });
                    downloadCSV(csvContent, fileName);
                }
            };

            const downloadCSV = (content, fileName) => {
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleExportPDF = () => {
                const element = document.getElementById('attendance-export-container');
                const opt = {
                    margin: [0.5, 0.5],
                    filename: `Attendance_Report_${currentUser.company.replace(/\s+/g, '_')}_${viewMode}.pdf`,

                                                                        <span className="text-orange-600 font-bold bg-orange-50 px-2 py-1 rounded border border-orange-100">{row.timeOut.str}</span>
                                                                        {row.timeOut.loc && (
                                                                            <a href={`https://maps.google.com/?q=$${row.timeOut.loc}`} target="_blank" rel="noreferrer" className={`text-[10px] underline flex items-center gap-1 font-bold mt-1 ${row.timeOut.verified ? 'text-emerald-600 hover:text-emerald-800' : 'text-red-500 hover:text-red-700'}`}>
                                                                                <MapPin size={10}/> View Map ({row.timeOut.verified ? 'Within Valid Location' : 'Outside Valid Location'})
                                                                            </a>
                                                                        )}
                                                                    </div>
                                                                ) : <span className="text-slate-300 italic">--:--</span>}
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <span className={`font-bold ${row.duration >= 8 ? 'text-emerald-600' : row.duration > 0 ? 'text-amber-600' : 'text-slate-400'}`}>

                                                                    {row.dailyStatus === 'Late' && <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-full border border-amber-100">Late</span>}
                                                                    {row.dailyStatus === 'Undertime' && <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-full border border-amber-100">Undertime</span>}

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- TRAINEES TAB (WITH ACTIVE FILTER, REMARKS, IC REPORTING & FULL PROFILE) ---
        function TraineesTab({ currentUser }) {
            const [trainees, setTrainees] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedIds, setSelectedIds] = useState([]);
            
            // NEW: Active Filter State (Defaults to true)
            const [showActiveOnly, setShowActiveOnly] = useState(true);

            // Assignment Data Setup
            const [departments, setDepartments] = useState([]);
            const [trainers, setTrainers] = useState([]);
            
            // Modals
            const [showAssignModal, setShowAssignModal] = useState(false);
            const [assignForm, setAssignForm] = useState({ department: '', role: '', trainer: '' });
            
            const [historyModalTrainee, setHistoryModalTrainee] = useState(null);
            const [infoModalTrainee, setInfoModalTrainee] = useState(null);
            
            // HR Remarks
            const [editingRemarks, setEditingRemarks] = useState(false);
            const [remarksText, setRemarksText] = useState('');

            // Reporting to IC
            const [reportModalTrainee, setReportModalTrainee] = useState(null);
            const [reportForm, setReportForm] = useState({ category: 'Performance', details: '' });

            const companyName = currentUser?.companyName || currentUser?.company;

            useEffect(() => {
                if (!companyName) {
                    setLoading(false); 
                    return;
                }
                
                setLoading(true);

                const qTrainees = query(collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees'), where('company', '==', companyName));
                const unsubTrainees = onSnapshot(qTrainees, (snap) => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setTrainees(data);
                    
                    // Keep modals updated with live data
                    setHistoryModalTrainee(prev => prev ? data.find(t => t.id === prev.id) || null : prev);
                    setInfoModalTrainee(prev => prev ? data.find(t => t.id === prev.id) || null : prev);
                    
                    setLoading(false);
                });

                const unsubDept = onSnapshot(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'company_settings', companyName), (snap) => {
                    if (snap.exists() && snap.data().departments) setDepartments(snap.data().departments);
                });

                const qTrainers = query(collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainers'), where('company', '==', companyName));
                const unsubTrainers = onSnapshot(qTrainers, (snap) => {
                    setTrainers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { unsubTrainees(); unsubDept(); unsubTrainers(); };
            }, [companyName]);

            // --- UPDATED FILTER LOGIC ---
            const filteredTrainees = useMemo(() => {
                return trainees.filter(t => {
                    const rawStatus = t.status || t.Status || 'Active';
                    const s = rawStatus.toLowerCase();
                    
                    // Filter out non-active trainees if the checkbox is checked
                    if (showActiveOnly && !s.includes('active')) {
                        return false;
                    }

                    // Filter by search query
                    if (!searchQuery.trim()) return true;
                    const search = searchQuery.toLowerCase();
                    const name = `${t.firstName || ''} ${t.lastName || ''}`.toLowerCase();
                    const sid = String(t.studentId || t['Student ID#'] || '').toLowerCase();
                    return name.includes(search) || sid.includes(search);
                });
            }, [trainees, searchQuery, showActiveOnly]);

            const handleSelectAll = () => {
                if (selectedIds.length === filteredTrainees.length && filteredTrainees.length > 0) setSelectedIds([]);
                else setSelectedIds(filteredTrainees.map(t => t.id));
            };

            const handleSelect = (id) => {
                setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            // --- Bulk Assign Handler ---
            const handleBulkAssign = async (e) => {
                e.preventDefault();
                if (selectedIds.length === 0) {
                    alert("Please select at least one trainee first.");
                    return;
                }
                
                try {
                    const updatePromises = selectedIds.map(id => {
                        const traineeRef = doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees', id);
                        return setDoc(traineeRef, {
                            department: assignForm.department,
                            role: assignForm.role,
                            companyTrainer: assignForm.trainer // <-- THE FIX: Changed 'trainer' to 'companyTrainer'
                        }, { merge: true });
                    });
                    
                    await Promise.all(updatePromises);
                    alert("Successfully assigned trainees!");
                    
                    setShowAssignModal(false);
                    setSelectedIds([]); 
                    setAssignForm({ department: '', role: '', trainer: '' });
                    
                } catch (err) { 
                    alert("Assignment failed: " + err.message);
                }
            };

            // --- Revert Assignment Handler ---
            const handleRevert = async (trainee, historyItem) => {
                if (!window.confirm("Are you sure you want to revert the trainee to this past assignment?")) return;
                const revertLog = { ...historyItem, date: new Date().toLocaleDateString(), timestamp: Date.now(), updatedBy: `${currentUser?.name || 'HR Admin'} (Reverted)` };
                try {
                    await updateDoc(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees', trainee.id), {
                        department: historyItem.department, traineeRole: historyItem.role, companyTrainer: historyItem.trainer, assignmentHistory: [...(trainee.assignmentHistory || []), revertLog]
                    });
                } catch (err) { alert("Revert failed: " + err.message); }
            };

            // --- Save HR Remarks ---
            const handleSaveRemarks = async () => {
                try {
                    await updateDoc(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees', infoModalTrainee.id), {
                        hrRemarks: remarksText,
                        lastRemarkUpdate: new Date().toLocaleDateString()
                    });
                    setEditingRemarks(false);
                } catch (error) { alert("Failed to save remarks: " + error.message); }
            };

            // --- Send Report to IC Logic ---
            const handleSendReport = async (e) => {
                e.preventDefault();
                if (!reportForm.details.trim()) return alert("Please provide report details.");

                const newReport = {
                    date: new Date().toLocaleDateString(),
                    timestamp: Date.now(),
                    category: reportForm.category,
                    details: reportForm.details,
                    reportedBy: currentUser?.name || 'HR Admin',
                    company: companyName,
                    status: 'Unread'
                };
                try {
                    // 1. Save to Firebase 
                    await updateDoc(doc(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'trainees', reportModalTrainee.id), {
                        hrReports: [...(reportModalTrainee.hrReports || []), newReport]
                    });
                    
                    await addDoc(collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'ic_reports'), {
                        ...newReport, 
                        traineeId: reportModalTrainee.id, 
                        traineeName: `${reportModalTrainee.firstName || reportModalTrainee.Given} ${reportModalTrainee.lastName || reportModalTrainee.Family}`, 
                        assignedIC: reportModalTrainee.assignedIC || 'Unassigned'
                    });

                    // 2. TRIGGER THE GOOGLE SHEETS WEBHOOK
                    const webhookUrl = "https://script.google.com/macros/s/AKfycbzljhHScjWS6jWwjxwaPRqTJ_DJDFmKRWIs50k65It5bZhtON4FmISEDwWl5aB0rJdccg/exec";
                    const sheetPayload = {
                        studentId: reportModalTrainee.studentId || reportModalTrainee['Student ID#'] || 'N/A',
                        traineeName: `${reportModalTrainee.firstName || reportModalTrainee.Given} ${reportModalTrainee.lastName || reportModalTrainee.Family}`,
                        company: companyName,
                        hrName: currentUser?.name || 'HR Admin',
                        reportType: reportForm.category,
                        details: reportForm.details,
                        icName: reportModalTrainee.assignedIC || 'Unassigned'
                    };
                    fetch(webhookUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(sheetPayload)
                    }).catch(err => console.log("Webhook triggered with minor warning (normal for no-cors):", err));

                    // 3. SAVE TO MESSAGES TAB FOR CHAT HISTORY
                    await addDoc(collection(db, 'artifacts', 'dualtech-ojt-portal', 'public', 'data', 'messages'), {
                        company: companyName,
                        senderName: currentUser?.name || 'HR Admin',
                        senderRole: 'HR',
                        text: `[Report for Trainee: ${reportModalTrainee.firstName || reportModalTrainee.Given} ${reportModalTrainee.lastName || reportModalTrainee.Family}]\nCategory: ${reportForm.category}\nDetails: ${reportForm.details}`,
                        timestamp: Date.now(),
                        dateStr: new Date().toLocaleString(),
                        readByHR: true,
                        allowedViewers: [reportModalTrainee.assignedIC, reportModalTrainee.trainer].filter(Boolean),
                        viewedBy: []
                    });

                    setReportModalTrainee(null);
                    setReportForm({ category: 'Performance', details: '' });
                    alert("Report sent to the Industry Coordinator successfully!");
                } catch (error) { 
                    alert("Failed to send report: " + error.message);
                }
            };

            // DYNAMIC STATUS BADGE LOGIC
            const getStatusBadge = (status = '') => {
                const s = status.toLowerCase();
                if (s.includes('active')) return 'bg-emerald-100 text-emerald-700';
                if (s.includes('completed') || s.includes('finished') || s.includes('completed ipt')) return 'bg-purple-100 text-purple-700';
                if (s.includes('loa') || s.includes('leave')) return 'bg-amber-100 text-amber-700';
                if (s.includes('pull') || s.includes('drop') || s.includes('terminate')) return 'bg-red-100 text-red-700';
                return 'bg-slate-100 text-slate-700';
            };

            if (loading) return <div className="p-20 text-center"><Activity className="animate-spin mx-auto text-blue-500 mb-4" size={32}/></div>;
            const meritPoints = infoModalTrainee ? parseInt(infoModalTrainee.meritPoints || 0) : 0;

            return (
                <div className="space-y-6 animate-in fade-in duration-300 relative">
                    
                    {/* HEADER & CONTROLS */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Users className="text-blue-600" /> Trainees Management</h2>
                            <p className="text-slate-500 text-sm mt-1">Manage active trainees, update assignments, and communicate with Coordinators.</p>
                        </div>
                        
                        {/* --- NEW: CHECKBOX & SEARCH BAR CONTAINER --- */}
                        <div className="flex flex-wrap w-full md:w-auto gap-3 items-center">
                            
                            <label className="flex items-center gap-2 cursor-pointer bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm text-sm font-bold text-slate-600 hover:bg-slate-50 transition-colors">
                                <input 
                                    type="checkbox" 
                                    checked={showActiveOnly}
                                    onChange={(e) => setShowActiveOnly(e.target.checked)}
                                    className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                                />
                                Active Only
                            </label>

                            <div className="relative flex-1 min-w-[200px] md:w-64">
                                <Search className="absolute left-3 top-2.5 text-slate-400" size={18} />
                                <input type="text" placeholder="Search trainees..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm shadow-sm" />
                            </div>
                            
                            {selectedIds.length > 0 && (
                                <button onClick={() => setShowAssignModal(true)} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-blue-700 shadow-sm flex items-center gap-2 transition-all animate-in slide-in-from-bottom-2">
                                    <CheckSquare size={16}/> Assign ({selectedIds.length})
                                </button>
                            )}
                        </div>
                    </div>

                    {/* DATA TABLE */}
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                            <table className="w-full text-left text-sm border-collapse">
                                <thead className="sticky top-0 bg-slate-50 shadow-sm z-10 border-b border-slate-200">
                                    <tr className="text-slate-500 text-xs uppercase tracking-wider">
                                        <th className="p-4 w-12 text-center"><input type="checkbox" checked={selectedIds.length === filteredTrainees.length && filteredTrainees.length > 0} onChange={handleSelectAll} className="w-4 h-4 rounded border-slate-300 text-blue-600 cursor-pointer"/></th>
                                        <th className="p-4 font-bold">Student Name</th>
                                        <th className="p-4 font-bold">Status</th>
                                        <th className="p-4 font-bold">Department</th>
                                        <th className="p-4 font-bold">Role</th>
                                        <th className="p-4 font-bold">Assigned Trainer</th>
                                        <th className="p-4 font-bold text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredTrainees.map(t => {
                                        const isSelected = selectedIds.includes(t.id);
                                        const traineeStatus = t.status || t.Status || 'Active';

        const ScheduleTab = ({ currentUser }) => {

        const [searchQuery, setSearchQuery] = useState('');
        
        // --- Break Settings States ---
        const [applyBreak, setApplyBreak] = useState(false);

        // --- Bulk Scheduling States ---
        const [selectedIds, setSelectedIds] = useState([]);
        const [showBulkModal, setShowBulkModal] = useState(false);
        
        // UPDATED: Added schoolingDay and restDay to the form state
