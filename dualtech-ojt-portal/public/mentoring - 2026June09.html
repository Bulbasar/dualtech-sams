                                                            <td className="p-4 font-bold text-indigo-600 bg-indigo-50/30">{t.totalActivities} / 72</td>
                                                            <td className="p-4 font-bold text-slate-700">{t.iptWTD} Wks</td>
                                                            <td className="p-4 text-slate-500">
                                                                <div className="max-w-[12rem] overflow-x-auto hide-scrollbar text-xs font-mono" title={t.datesPresent}>{t.datesPresent}</div>
                                                            </td>
                                                            <td className="p-4 font-bold text-amber-600 bg-amber-50/40">
                                                                <div className="max-w-[12rem] overflow-x-auto hide-scrollbar text-xs" title={t.explicitMissingWeeks}>{t.explicitMissingWeeks}</div>
                                                            </td>
                                                            <td className="p-4 font-bold text-rose-600 bg-rose-50/40">{t.totalWeeksNoSchooling}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                                        <div className="flex items-center gap-2 text-sm text-slate-600 font-semibold">
                                            <span>Show</span>
                                            <select 
                                                value={pageSize} 
                                                onChange={(e) => setPageSize(Number(e.target.value))}
                                                className="border border-slate-300 rounded-md p-1.5 outline-none focus:border-indigo-500 cursor-pointer text-xs font-bold"
                                            >
                                                <option value={20}>20</option>
                                                <option value={50}>50</option>
                                                <option value={100}>100</option>
                                            </select>
                                            <span>records per page</span>
                                        </div>

                                        <div className="flex items-center gap-4">
                                            <button 
                                                disabled={currentPage === 1}
                                                onClick={() => setCurrentPage(p => p - 1)}
                                                className="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm"
                                            >
                                                Previous
                                            </button>
                                            <span className="text-sm font-bold text-slate-600">
                                                Page {currentPage} of {totalPages}
                                            </span>
                                            <button 
                                                disabled={currentPage === totalPages || totalPages === 0}
                                                onClick={() => setCurrentPage(p => p + 1)}
                                                className="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm"
                                            >
                                                Next
                                            </button>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // --- IMPORT RECORDS TAB (WITH EXACT HEADERS, FORM RESPONSES & TERMINAL UI) ---
        const ImportRecordsTab = () => {
            const [sheetUrl, setSheetUrl] = useState('');
            const [importType, setImportType] = useState('AttendanceRecords');
            const [uploading, setUploading] = useState(false);
            const [validationError, setValidationError] = useState('');
            const [progress, setProgress] = useState({ total: 0, current: 0 });
            const [syncLogs, setSyncLogs] = useState([]);
            
            const terminalEndRef = useRef(null);

            const addLog = (message, type = 'info') => {
                const time = new Date().toLocaleTimeString([], { hour12: false });
                setSyncLogs(prev => [...prev, { time, message, type }]);
            };

            useEffect(() => {
                if (terminalEndRef.current) {
                    terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [syncLogs]);
            
            const handleSync = async () => {
                if (!sheetUrl.trim()) {
                    setValidationError("Please paste the Google Sheet URL first.");
                    return;
                }

                const match = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (!match) {
                    setValidationError("Invalid URL format. Could not find the Spreadsheet ID.");
                    return;
                }
                
                const sheetId = match[1];
                setUploading(true);
                setValidationError('');
                setProgress({ total: 0, current: 0 });
                setSyncLogs([]);
                
                addLog(`Connecting to Google Sheets...`, 'info');
                
                // --- NEW LOGIC: FIND LATEST DATE IN DATABASE ---
                let latestRecordDateMs = 0;
                let latestRecordDateStr = '';
                const attendanceRef = collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance');
                
                try {
                    addLog("Checking database for the latest synced record...", "info");
                    const qLatest = query(attendanceRef, orderBy('date', 'desc'), limit(1));
                    const snapLatest = await getDocs(qLatest);
                    
                    if (!snapLatest.empty) {
                        latestRecordDateStr = snapLatest.docs[0].data().date;
                        latestRecordDateMs = new Date(latestRecordDateStr).getTime();
                        addLog(`Most recent record in database is from: ${latestRecordDateStr}. Older rows will be skipped.`, "info");
                    } else {
                        addLog("Database is empty. Performing full initial sync.", "info");
                    }
                } catch (e) {
                    addLog("Could not fetch latest date (missing index or empty DB). Will scan all rows.", "warning");
                }
                // -----------------------------------------------

                const sheetName = importType; 
                const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

                addLog(`Downloading data from sheet "${sheetName}"...`, 'info');
                
                window.Papa.parse(csvUrl, {
                    download: true,
                    header: true, 
                    skipEmptyLines: true,
                    complete: async (results) => {
                        const data = results.data;
                        
                        if (!data || data.length === 0) {
                            addLog("The Google Sheet is empty or could not be read.", 'error');
                            setValidationError("The Google Sheet is empty.");
                            setUploading(false); return;
                        }

                        const firstKey = Object.keys(data[0])[0];
                        if (firstKey && String(firstKey).toLowerCase().includes("<!doctype html>")) {
                            addLog("Access Denied! Make sure the Google Sheet is set to 'Anyone with the link can view'.", 'error');
                            setValidationError("Access Denied! Ensure Link Sharing is set to Public.");
                            setUploading(false); return;
                        }

                        const total = data.length;
                        addLog(`Parse complete. Found ${total} rows in sheet.`, 'info');
                        
                        try {
                            setProgress({ total, current: 0 });
                            let processed = 0;
                            let skipCount = 0;
                            let duplicateCount = 0; 
                            let skipOldCount = 0; // Tracks rows skipped because they are older than latest DB record
                            const BATCH_SIZE = 100;
                            
                            const seenRecords = new Set();
                            
                            for (let i = 0; i < total; i += BATCH_SIZE) {
                                const batch = writeBatch(db);
                                const chunk = data.slice(i, i + BATCH_SIZE);
                                let batchHasWrites = false; // Track if we actually have things to write in this batch
                                
                                chunk.forEach((row) => {
                                    let newDoc; 
                                    const cleanRowData = {};
                                    for (const [key, value] of Object.entries(row)) {
                                        if (key && key.trim() !== '') {
                                            const safeKey = key.replace(/[\.\/\\~\[\]\*]/g, '').trim();
                                            cleanRowData[safeKey] = value;
                                        }
                                    }
                                    
                                    // ==========================================
                                    // LOGIC A: STANDARD ATTENDANCE RECORDS
                                    // ==========================================
                                    if (importType === 'AttendanceRecords') {
                                        const rawActivityDetails = row['Attendance Details'] ? String(row['Attendance Details']).trim() : '';
                                        const studentNumber = row['Student Number'] ? String(row['Student Number']).trim() : '';
                                        const dateLogged = row['Date'] ? String(row['Date']).trim() : '';
                                        
                                        if (!rawActivityDetails || !studentNumber) {
                                            skipCount++; return; 
                                        }

                                        const finalRowDate = dateLogged || row['Timestamp']?.split(' ')[0] || new Date().toISOString().split('T')[0];
                                        const rowDateMs = new Date(finalRowDate).getTime();

                                        // SKIP OLD RECORDS LOGIC
                                        if (latestRecordDateMs > 0 && rowDateMs < latestRecordDateMs) {
                                            skipOldCount++; return;
                                        }

                                        newDoc = doc(attendanceRef);

                                        const normalizedType = rawActivityDetails.toLowerCase();
                                        let activityType = rawActivityDetails;
                                        let attendanceStatus = 'Present';

                                        if (normalizedType === 'present' || normalizedType === 'late') {
                                            activityType = 'Schooling';
                                            attendanceStatus = normalizedType === 'late' ? 'Late' : 'Present';
                                        } else if (normalizedType === 'ims') {
                                            activityType = 'IMS';
                                        } else if (normalizedType === 'discipline') {
                                            activityType = 'Discipline';
                                        } else if (normalizedType === 'semestral evaluation') {
                                            activityType = 'Semestral Evaluation';
                                        }
                                        
                                        batch.set(newDoc, {
                                            importedAt: new Date().toISOString(),
                                            activityType: activityType,
                                            status: attendanceStatus,
                                            date: finalRowDate,
                                            studentId: studentNumber,
                                            studentName: row["Scholar's Name"] || 'Unknown',
                                            topic: row['Topic'] || '',
                                            hub: row['Schooling / Mentoring Hub'] || '',
                                            remarks: row['Remarks'] || '',
                                            rawSheetData: cleanRowData 
                                        });
                                        batchHasWrites = true;
                                    }
                                    // ==========================================
                                    // LOGIC B: ONLINE FORM RESPONSES
                                    // ==========================================
                                    else if (importType === 'Form Responses 1') {
                                        const ObjectKeys = Object.keys(row);
                                        
                                        const colA_Timestamp = String(row[ObjectKeys[0]] || '').trim();
                                        const colC_Date = String(row[ObjectKeys[2]] || '').trim();
                                        const colE_StudentNum = String(row[ObjectKeys[4]] || '').trim();
                                        const colG_LSCE = String(row[ObjectKeys[6]] || '').trim();
                                        const colI_VFL = String(row[ObjectKeys[8]] || '').trim();

                                        if (!colA_Timestamp || !colE_StudentNum) {
                                            skipCount++; return;
                                        }

                                        const timeStampDatePart = colA_Timestamp.split(' ')[0];
                                        const rowDateMs = new Date(timeStampDatePart).getTime();

                                        // SKIP OLD RECORDS LOGIC
                                        if (latestRecordDateMs > 0 && rowDateMs < latestRecordDateMs) {
                                            skipOldCount++; return;
                                        }

                                        // 1. Skip exact file duplicates
                                        const recordFootprint = `${colA_Timestamp}_${colC_Date}_${colE_StudentNum}`;
                                        if (seenRecords.has(recordFootprint)) {
                                            duplicateCount++; return; 
                                        }
                                        seenRecords.add(recordFootprint);

                                        // 2. Generate deterministic ID
                                        const safeStudentNum = colE_StudentNum.replace(/[^a-zA-Z0-9]/g, '');
                                        const safeTimestamp = colA_Timestamp.replace(/[^a-zA-Z0-9]/g, '');
                                        const docId = `online_${safeStudentNum}_${safeTimestamp}`;
                                        newDoc = doc(attendanceRef, docId);
                                        
                                        let isLate = false;
                                        try {
                                            const tDate = new Date(timeStampDatePart).toDateString();
                                            const cDate = new Date(colC_Date).toDateString();
                                            if (tDate !== cDate) isLate = true;
                                        } catch (e) {
                                            if (timeStampDatePart !== colC_Date) isLate = true;
                                        }

                                        let remarksArr = [];
                                        if (colG_LSCE) remarksArr.push(`LSCE: ${colG_LSCE}`);
                                        if (colI_VFL) remarksArr.push(`VFL: ${colI_VFL}`);
                                        remarksArr.push(`Stated Date: ${colC_Date}`);
                                        if (isLate) remarksArr.push(`(LATE SUBMISSION)`);

                                        batch.set(newDoc, {
                                            importedAt: new Date().toISOString(),
                                            activityType: 'Schooling',
                                            status: isLate ? 'Late Submission' : 'Present', 
                                            date: timeStampDatePart, 
                                            studentId: colE_StudentNum,
                                            studentName: 'Unknown (Online form)', 
                                            topic: '', 
                                            hub: 'Online',
                                            remarks: remarksArr.join(' | '), 
                                            rawSheetData: cleanRowData
                                        }, { merge: true });
                                        batchHasWrites = true;
                                    }
                                });

                                // Only commit to database if we actually have new records to add
                                if (batchHasWrites) {
                                    await Promise.race([
                                        batch.commit(),
                                        new Promise((_, reject) => setTimeout(() => reject(new Error("Network timeout: Firebase connection blocked.")), 120000))
                                    ]);
                                    await new Promise(resolve => setTimeout(resolve, 1000)); // Small delay to prevent quota hits
                                }
                                
                                processed += chunk.length;
                                setProgress({ total, current: processed });
                            }
                            
                            // Final Terminal Reporting
                            if (skipCount > 0) addLog(`Skipped ${skipCount} incomplete rows.`, 'warning');
                            if (skipOldCount > 0) addLog(`Skipped ${skipOldCount} old rows (prior to ${latestRecordDateStr}).`, 'info');
                            if (duplicateCount > 0) addLog(`Merged ${duplicateCount} identical duplicate records.`, 'warning');
                            
                            const successfullyProcessed = total - skipCount - skipOldCount - duplicateCount;
                            addLog(`Synchronization completed! ${successfullyProcessed} new records appended.`, 'success');
                            setSheetUrl(''); 
                            
                        } catch (err) {
                            addLog(`Database Error: ${err.message}`, 'error');
                            setValidationError("Sync stopped. Check terminal logs.");
                        }
                        setUploading(false);
                    },
                    error: (err) => {
                        addLog(`Parse Error: Could not fetch Google Sheet. Check permissions.`, 'error');
                        setValidationError("Failed to fetch Google Sheet. Check permissions.");
                        setUploading(false);
                    }
                });
            };

            const handleCleanupDuplicates = async () => {
                if (!window.confirm("Are you sure you want to scan and delete duplicate records? This optimized process might take a moment but won't time out.")) return;
                
                setUploading(true);
                setSyncLogs([]);
                addLog("Starting optimized, paginated database cleanup scan...", "info");

                try {
                    const attendanceRef = collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance');
                    
                    let lastVisible = null;
                    let hasMore = true;
                    const PAGE_SIZE = 500; 
                    const uniqueRecords = new Map();
                    const docsToDelete = [];
                    let totalScanned = 0;

                    while (hasMore) {
                        addLog(`Querying next chunk of ${PAGE_SIZE} records... (Scanned so far: ${totalScanned})`, "info");
                        
                        let q;
                        if (lastVisible) {
                            q = query(attendanceRef, orderBy('studentId'), startAfter(lastVisible), limit(PAGE_SIZE));
                        } else {
                            q = query(attendanceRef, orderBy('studentId'), limit(PAGE_SIZE));
                        }

                        const snapshot = await getDocs(q);
                        
                        if (snapshot.empty) {
                            hasMore = false;
                            break;
                        }

                        totalScanned += snapshot.docs.length;
                        lastVisible = snapshot.docs[snapshot.docs.length - 1];

                        snapshot.forEach(document => {
                            const data = document.data();
                            const uniqueKey = `${data.studentId}_${data.date}_${data.activityType}`;

                            if (uniqueRecords.has(uniqueKey)) {
                                docsToDelete.push(document.id);
                            } else {
                                uniqueRecords.set(uniqueKey, document.id);
                            }
                        });

                        if (snapshot.docs.length < PAGE_SIZE) {
                            hasMore = false;
                        }
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }

                    addLog(`Scan completed successfully! Evaluated ${totalScanned} total records.`, "info");

                    if (docsToDelete.length === 0) {
                        addLog("No duplicates found! Your database is completely clean.", "success");
                        setUploading(false);
                        return;
                    }

                    addLog(`Identified ${docsToDelete.length} duplicate records. Starting deletion batches...`, "warning");

                    let deletedCount = 0;
                    const BATCH_SIZE = 100;

                    for (let i = 0; i < docsToDelete.length; i += BATCH_SIZE) {
                        const batch = writeBatch(db);
                        const chunk = docsToDelete.slice(i, i + BATCH_SIZE);

                        chunk.forEach(docId => {
                            const docRef = doc(attendanceRef, docId);
                            batch.delete(docRef);
                        });

                        await batch.commit();
                        deletedCount += chunk.length;
                        addLog(`[Progress] Deleted ${deletedCount} of ${docsToDelete.length} duplicates...`, "info");
                        await new Promise(resolve => setTimeout(resolve, 300));
                    }

                    addLog(`Cleanup successful! Successfully wiped ${deletedCount} duplicate entries.`, "success");

                } catch (error) {
                    addLog(`Error during cleanup: ${error.message}`, "error");
                    console.error(error);
                }
                
                setUploading(false);
            };

            return (
                <div className="bg-white rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 max-w-4xl mx-auto mt-6">
                    <div className="border-b border-slate-100 pb-4 md:pb-6 mb-6">
                        <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><Database className="text-blue-600" /> Import Attendance</h2>
                        <p className="text-slate-500 text-sm mt-1">Synchronize logs directly from the selected Google Sheet Tab.</p>
                    </div>

                    <div className="mb-6 bg-blue-50 p-5 md:p-6 rounded-2xl border border-blue-100 overflow-hidden">
                        <h3 className="font-bold text-blue-900 mb-2 flex items-center gap-2"><FileUp size={18} /> Google Sheets Sync</h3>
                        <p className="text-sm text-blue-800 mb-4">Select the format of your sheet and paste the link below.</p>
                        
                        {/* NEW: SHEET FORMAT SELECTOR */}
                        <div className="mb-5 bg-white p-2 rounded-xl border border-blue-200 inline-flex shadow-sm w-full md:w-auto">
                            <button 
                                onClick={() => setImportType('AttendanceRecords')}
                                className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors flex-1 ${importType === 'AttendanceRecords' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                Standard (AttendanceRecords)
                            </button>
                            <button 
                                onClick={() => setImportType('Form Responses 1')}
                                className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors flex-1 ${importType === 'Form Responses 1' ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-100'}`}
                            >
                                Online (Form Responses 1)
                            </button>
                        </div>

                        <div className="bg-white border-l-4 border-amber-500 p-4 rounded-r-lg mb-5 shadow-sm">
                            <p className="text-xs text-amber-800 font-bold uppercase tracking-wider mb-1">Mapping Configuration ({importType}):</p>
                            {importType === 'AttendanceRecords' ? (
                                <ul className="text-xs text-amber-700 space-y-1 list-disc list-inside">
                                    <li>Reading <strong>Date</strong> field.</li>
                                    <li>Reading <strong>Student Number</strong> field.</li>
                                    <li>Reading <strong>Attendance Details</strong> field to determine Activity Type.</li>
                                    <li><strong>Smart Sync Enabled:</strong> Old rows prior to last sync are ignored.</li>
                                </ul>
                            ) : (
                                <ul className="text-xs text-amber-700 space-y-1 list-disc list-inside">
                                    <li><strong>Column A (Timestamp)</strong> serves as the official date.</li>
                                    <li><strong>Column C (Date)</strong> is cross-checked. If mismatched, marked as "Late Submission".</li>
                                    <li><strong>Column E</strong> is captured as the Student Number.</li>
                                    <li><strong>Columns G (LSCE) & I (VFL)</strong> are appended into Remarks.</li>
                                    <li><strong>Smart Sync Enabled:</strong> Old rows prior to last sync are ignored. Deduplication safely merges identical entries.</li>
                                </ul>
                            )}
                        </div>
                        
                        <div className="mb-5">
                            <label className="block text-xs font-bold text-blue-800 uppercase mb-2">Google Sheet URL</label>
                            <input 
                                type="text" 
                                placeholder="e.g. https://docs.google.com/spreadsheets/d/1Tgw_2ZtXNOzg..." 
                                className="w-full p-3.5 bg-white border border-blue-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all text-slate-700 font-mono text-sm shadow-sm"
                                value={sheetUrl}
                                onChange={(e) => setSheetUrl(e.target.value)}
                                disabled={uploading}
                            />
                        </div>
                        
                        <div className="flex flex-col md:flex-row gap-3 items-start md:items-center">
                            <button 
                                onClick={handleSync} 
                                disabled={uploading || !sheetUrl.trim()} 
                                className="bg-blue-600 w-full md:w-auto text-white font-bold px-8 py-3.5 rounded-xl hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center justify-center gap-2 shadow-sm"
                            >
                                {uploading ? <RefreshCw className="animate-spin" size={18} /> : <Activity size={18} />}
                                {uploading ? 'Syncing Records...' : 'Start Live Sync'}
                            </button>
                            
                            {/* CLEANUP BUTTON ADDED HERE */}
                            <button 
                                onClick={handleCleanupDuplicates} 
                                disabled={uploading} 
                                className="bg-rose-100 text-rose-700 border border-rose-200 w-full md:w-auto font-bold px-6 py-3.5 rounded-xl hover:bg-rose-200 disabled:opacity-50 transition-colors flex items-center justify-center gap-2 shadow-sm"
                            >
                                Clean Up Duplicates
                            </button>
                        </div>

                        {validationError && <div className="mt-4 p-4 bg-red-100 text-red-700 rounded-xl text-sm border border-red-200 font-medium leading-relaxed">{validationError}</div>}
                    </div>

                    {/* TERMINAL UI */}
                    <div className="bg-slate-900 rounded-2xl overflow-hidden shadow-inner border border-slate-800 w-full">
                        <div className="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700">
                            <h3 className="font-mono text-xs font-bold text-slate-300 flex items-center gap-2">
                                <Activity size={14} className="text-green-400" /> TERMINAL
                            </h3>
                            {uploading && progress.total > 0 && (
                                <span className="font-mono text-xs font-bold text-blue-400">
                                    {Math.round((progress.current / progress.total) * 100)}% COMPLETE
                                </span>
                            )}
                        </div>
                        
                        {progress.total > 0 && (
                            <div className="w-full bg-slate-800 h-1">
                                <div className="bg-green-500 h-1 transition-all duration-300" style={{ width: `${(progress.current / progress.total) * 100}%` }}></div>
                            </div>
                        )}

                        <div className="p-4 h-[300px] md:h-[400px] overflow-y-auto font-mono text-[10px] md:text-sm leading-relaxed break-words w-full">
                            {syncLogs.length === 0 ? (
                                <div className="text-slate-500 italic flex items-center h-full justify-center">Ready to fetch data from Google Sheets...</div>
                            ) : (
                                syncLogs.map((log, index) => (
                                    <div key={index} className="flex flex-col md:flex-row md:gap-3 mb-2 md:mb-1 border-b border-slate-800 pb-1 md:border-none md:pb-0">
                                        <span className="text-slate-500 shrink-0 mb-1 md:mb-0">[{log.time}]</span>
                                        <span className={`
                                            ${log.type === 'error' ? 'text-red-400 font-bold' : ''}
                                            ${log.type === 'success' ? 'text-green-400' : ''}
                                            ${log.type === 'warning' ? 'text-amber-400' : ''}
                                            ${log.type === 'info' ? 'text-slate-300' : ''}
                                        `}>
                                            {log.message}
                                        </span>
                                    </div>
                                ))
                            )}
                            {uploading && (
                                <div className="flex items-center gap-2 text-slate-400 mt-2">
                                    <span className="w-2 h-4 bg-emerald-400 animate-pulse inline-block"></span>
                                </div>
                            )}
                            <div ref={terminalEndRef} />
                        </div>
                        
                        {progress.current > 0 && progress.current === progress.total && !uploading && (
                            <div className="bg-green-900/40 px-4 py-3 border-t border-green-800/50 flex items-center gap-2 text-green-400 font-mono text-xs">
                                <CheckCircle2 size={16} /> Sync finished. System is up to date.
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false); 
            
            const [attendance, setAttendance] = useState([]);
            const [profiles, setProfiles] = useState({}); 

            useEffect(() => {
                const initAuth = async () => {
                    onAuthStateChanged(auth, async (currentUser) => {
                        if (currentUser) {
                            setUser(currentUser);
                            
                            try {
                                const profSnap = await getDocs(collectionGroup(db, 'profile'));
                                const profMap = {};
                                profSnap.forEach(doc => {
                                    const data = doc.data();
                                    if(data.uid) profMap[data.uid] = data.companyName || 'Unassigned';
                                });
                                setProfiles(profMap);
                            } catch(e) { console.error("Error fetching profiles", e); }

                            const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), snap => {
                                const recs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setAttendance(recs.map(r => ({ ...r, companyName: profiles[r.traineeUid] || 'Unknown Company' })));
                            });
                            
                            setLoading(false);
                            return () => unsub();
                        } else {
                            setUser(null);
                            setLoading(false);
                        }
                    });
                };
                initAuth();
            }, []);

            const enrichedAttendance = attendance.map(r => ({
                ...r,
                companyName: profiles[r.traineeUid] || 'Unknown Company'
            }));

            if (loading) return <div className="flex h-screen items-center justify-center font-bold text-slate-500"><Loader2 className="animate-spin mr-2"/> Loading Admin Portal...</div>;
            
            if (!user) return (
                <div className="flex h-screen items-center justify-center p-4">
                    <div className="bg-white p-8 rounded shadow text-center">
                        <h2 className="text-xl font-bold mb-4">Admin Authentication Required</h2>
                        <p className="text-slate-500 text-sm mb-4">Please log in via the main Admin System to access the Mentoring Console.</p>
                        <a href="adminsystem.html" className="bg-blue-700 text-white px-4 py-2 rounded font-bold hover:bg-blue-800">Go to Main Admin System</a>
                    </div>
                </div>
            );

            // Updated items to list your new analytics layout tab safely
            const tabs = [
                { id: 'dashboard', name: 'Dashboard', icon: LayoutDashboard },
                { id: 'mentors', name: 'Mentors & Venues', icon: Users },
                { id: 'schooling_records', name: 'Schooling Records', icon: FileText },
                { id: 'Personal Development Seminar', name: 'PDS Logs', icon: BookOpen },
                { id: 'Retreat', label: 'Retreat Logs', name: 'Retreat Logs', icon: Heart },
                { id: 'import', label: 'Import Records', name: 'Import Records', icon: Upload }
            ];

            return (
                <div className="min-h-screen bg-slate-50 flex overflow-hidden">
                    
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-40 md:hidden" 
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <div className={`${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50`}>
                        <div className="p-4 font-bold text-xl border-b border-slate-800 tracking-wide text-blue-400 flex justify-between items-center">
                            Mentoring Admin
                            <button className="md:hidden text-slate-400 hover:text-white" onClick={() => setIsSidebarOpen(false)}>
                                <X size={24}/>
                            </button>
                        </div>
                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            {tabs.map(tab => {
                                const Icon = tab.icon;
                                return (
                                    <button 
                                        key={tab.id} 
                                        onClick={() => {
                                            setActiveTab(tab.id);
                                            setIsSidebarOpen(false); 
                                        }} 
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition-colors ${activeTab === tab.id ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>
                                        <Icon size={18}/> {tab.name}
                                    </button>
                                );
                            })}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <button onClick={() => window.location.href="adminsystem.html"} className="w-full text-slate-400 hover:text-white text-sm font-semibold flex justify-center items-center gap-2 py-2 transition-colors">
                                <LogOut size={16}/> Back to Main System
                            </button>
                        </div>
                    </div>

                    {/* Main Content View */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="bg-white shadow-sm p-4 border-b flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <button className="md:hidden text-slate-600 hover:text-slate-900" onClick={() => setIsSidebarOpen(true)}>
                                    <Menu size={24}/>
                                </button>
                                <span className="font-bold text-slate-800 md:hidden">Mentoring Admin</span>
                            </div>
                            <span className="font-semibold text-slate-600 flex items-center gap-2 text-sm md:text-base">
                                <CheckCircle size={16} className="text-emerald-500"/> <span className="hidden sm:inline">System Connected</span>
                            </span>
                        </header>
                        <main className="flex-1 p-4 md:p-6 overflow-y-auto">
                            {activeTab === 'dashboard' && <DashboardTab records={enrichedAttendance} />}
                            {activeTab === 'mentors' && <MentorsVenuesTab />}
                            {activeTab === 'schooling_records' && <SchoolingRecordsTab />}
                            {['Personal Development Seminar', 'Retreat'].includes(activeTab) && (
                                <ActivityTab activityType={activeTab} records={enrichedAttendance} />
                            )}
                            {activeTab === 'import' && <ImportRecordsTab />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
