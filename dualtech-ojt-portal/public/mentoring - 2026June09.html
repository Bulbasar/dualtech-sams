        // --- Helper: Date Bucketing ---
        const getBucket = (dateStr, view) => {
            const d = new Date(dateStr);
            const y = d.getFullYear();
            const m = d.getMonth();
            if(view === 'Daily') return d.toLocaleDateString();
            if(view === 'Weekly') {
                const firstDay = new Date(y, 0, 1);
                const pastDays = (d - firstDay) / 86400000;
                const week = Math.ceil((pastDays + firstDay.getDay() + 1) / 7);
                return `Week ${week}, ${y}`;
            }
            if(view === 'Monthly') return `${d.toLocaleString('default', {month:'long'})} ${y}`;
            if(view === 'Quarterly') return `Q${Math.floor(m/3)+1} ${y}`;
            if(view === 'Semestral') return `H${Math.floor(m/6)+1} ${y}`;
            if(view === 'Yearly') return `${y}`;
            return d.toLocaleDateString();
        };

        // --- 1. DASHBOARD TAB ---
        function DashboardTab({ records }) {
            const [view, setView] = useState('Monthly');
            const views = ['Weekly', 'Monthly', 'Quarterly', 'Semestral', 'Yearly'];

            // Group by Company -> Type -> Bucket
            const grouped = records.reduce((acc, rec) => {
                const comp = rec.companyName || 'Unknown Company';
                const type = rec.type || 'Unknown Type';
                const bucket = getBucket(rec.timestamp, view);

                if (!acc[comp]) acc[comp] = {};
                if (!acc[comp][type]) acc[comp][type] = {};
                if (!acc[comp][type][bucket]) acc[comp][type][bucket] = 0;
                
                acc[comp][type][bucket]++;
                return acc;
            }, {});

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-center mb-6 gap-4">
                        <h2 className="text-xl font-bold">Attendance Dashboard</h2>
                        <select value={view} onChange={e => setView(e.target.value)} className="p-2 border rounded-lg bg-slate-50">
                            {views.map(v => <option key={v} value={v}>{v} View</option>)}
                        </select>
                    </div>

                    {Object.keys(grouped).length === 0 && <p className="text-slate-500 text-center py-10">No records found.</p>}

                    <div className="space-y-8">
                        {Object.entries(grouped).map(([company, types]) => (
                            <div key={company} className="border border-slate-200 rounded-lg overflow-hidden">
                                <div className="bg-slate-100 p-3 font-bold text-slate-800 border-b border-slate-200">{company}</div>
                                <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {Object.entries(types).map(([type, buckets]) => (
                                        <div key={type} className="bg-white border rounded p-4 shadow-sm">
                                            <h4 className="font-bold text-blue-800 mb-3 border-b pb-2">{type}</h4>
                                            <ul className="space-y-2">
                                                {Object.entries(buckets).map(([bucket, count]) => (
                                                    <li key={bucket} className="flex justify-between text-sm">
                                                        <span className="text-slate-600">{bucket}</span>
                                                        <span className="font-bold bg-blue-100 text-blue-800 px-2 rounded-full">{count}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

        // --- 2. MENTORS & VENUES TAB ---
        function MentorsVenuesTab() {
            const [mentors, setMentors] = useState([]);

            const [newVenue, setNewVenue] = useState({ name: '', lat: '', lng: '' });

            useEffect(() => {
                const unsubMentors = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'mentors'), snap => {
                    setMentors(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubVenues = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'venues'), snap => {

                return () => { unsubMentors(); unsubVenues(); };

                        lat: newVenue.lat,

                if(window.confirm("Are you sure you want to delete this venue? Mentors assigned here will lose this tag.")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'venues', id));
                }

                setEditingVenueId(v.id);
                setNewVenue({ name: v.name, lat: v.lat || '', lng: v.lng || '' });

                setEditingVenueId(null);
                setNewVenue({ name: '', lat: '', lng: '' });
            };

                e.preventDefault();
                setIsCreating(true);

                        // Update existing mentor (Only update name/venues, email/pass locked)

                        const secondaryAuth = getAuth(secondaryApp);
                        
                        const userCredential = await createUserWithEmailAndPassword(secondaryAuth, newMentor.email, newMentor.password);
                        const newUid = userCredential.user.uid;
                        
                        await signOut(secondaryAuth);

                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mentors', newUid), {
                            name: newMentor.name,
                            email: newMentor.email,
                            password: newMentor.password, 
                            assignedVenues: newMentor.assignedVenues
                        });
                        alert("✅ Mentor Account Created Successfully!");
                    }
                    cancelMentorEdit();
                } catch(err) {
                    console.error(err);
                    alert("Error: " + err.message);

                if(window.confirm("Are you sure you want to delete this mentor? Note: This removes their database record, but their Auth login remains.")) {

                setEditingMentorId(m.id);
                setNewMentor({ name: m.name, email: m.email, password: 'UNCHANGED', assignedVenues: m.assignedVenues });
            };

            const cancelMentorEdit = () => {
                setEditingMentorId(null);
                setNewMentor({ name: '', email: '', password: '', assignedVenues: [] });
            };

            const toggleMentorVenue = async (mentorId, currentVenues, venueId) => {
                const updated = currentVenues.includes(venueId) 
                    ? currentVenues.filter(v => v !== venueId) 
                    : [...currentVenues, venueId];
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mentors', mentorId), { assignedVenues: updated });

                            <input required type="email" placeholder="Email Address" value={newMentor.email} onChange={e => setNewMentor({...newMentor, email: e.target.value})} disabled={editingMentorId} className="w-full p-2 border rounded disabled:bg-slate-200 disabled:text-slate-500" />
                            <input required placeholder="Temporary Password (min 6 chars)" minLength="6" value={newMentor.password} onChange={e => setNewMentor({...newMentor, password: e.target.value})} disabled={editingMentorId} className="w-full p-2 border rounded disabled:bg-slate-200 disabled:text-slate-500" />
                            <button disabled={isCreating} className={`w-full text-white font-bold py-2 rounded flex justify-center items-center gap-2 ${editingMentorId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-700 hover:bg-blue-800 disabled:bg-blue-400'}`}>
                                {isCreating ? <Loader2 className="animate-spin" size={18}/> : (editingMentorId ? "Update Mentor" : "Add Mentor")}
                            </button>
                        </form>

                        {/* Mentors List */}
                        <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                            {mentors.map(m => (
                                <div key={m.id} className={`p-4 border rounded shadow-sm bg-white relative ${editingMentorId === m.id ? 'ring-2 ring-amber-400' : ''}`}>
                                    <div className="absolute top-4 right-4 flex gap-2">
                                        <button onClick={() => startMentorEdit(m)} className="text-slate-400 hover:text-blue-600 transition-colors"><Edit size={16}/></button>
                                        <button onClick={() => handleDeleteMentor(m.id)} className="text-slate-400 hover:text-red-600 transition-colors"><Trash2 size={16}/></button>
                                    </div>
                                    <h4 className="font-bold text-slate-800 pr-12">{m.name}</h4>
                                    <p className="text-sm text-slate-500 mb-3">{m.email}</p>
                                    <p className="text-xs font-bold text-slate-700 mb-2">Assigned Venues:</p>
                                    <div className="flex flex-wrap gap-2">

                            <div className="flex justify-between items-center mb-1">

                                {editingVenueId ? 'Update Venue' : 'Add Venue'}
                            </button>
                        </form>

                        {/* Venues List */}
                        <ul className="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                            {venues.map(v => (
                                <li key={v.id} className={`p-3 border rounded flex justify-between items-center bg-slate-50 ${editingVenueId === v.id ? 'ring-2 ring-amber-400' : ''}`}>
                                    <div className="flex flex-col">
                                        <span className="font-bold text-slate-800">{v.name}</span>
                                        <span className="text-[10px] text-slate-400 font-mono mt-1">{v.lat && v.lng ? `${v.lat}, ${v.lng}` : 'No GPS Data'}</span>

                                        <button onClick={() => startVenueEdit(v)} className="text-slate-400 hover:text-blue-600 transition-colors"><Edit size={16}/></button>
                                        <button onClick={() => handleDeleteVenue(v.id)} className="text-slate-400 hover:text-red-600 transition-colors"><Trash2 size={16}/></button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        // --- 3. ACTIVITY TAB (Used for PDS and Retreat Logs) ---
        function ActivityTab({ activityType, records }) {
            const [view, setView] = useState('Daily');
            
            const filtered = records.filter(r => r.type === activityType);

            const grouped = filtered.reduce((acc, rec) => {
                const comp = rec.companyName || 'Unknown Company';
                const bucket = getBucket(rec.timestamp, view);
                if (!acc[comp]) acc[comp] = {};
                if (!acc[comp][bucket]) acc[acc[comp][bucket] = []];
                if (!acc[comp][bucket]) acc[comp][bucket] = [];
                acc[comp][bucket].push(rec);
                return acc;
            }, {});

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                        <h2 className="text-xl font-bold text-blue-900">{activityType} Logs</h2>
                        <select value={view} onChange={e => setView(e.target.value)} className="p-2 border rounded-lg bg-slate-50 font-semibold text-slate-700 w-full md:w-auto">
                            <option value="Daily">Daily View (Individual)</option>
                            <option value="Weekly">Weekly Summary</option>
                            <option value="Monthly">Monthly Summary</option>
                        </select>
                    </div>

                    {Object.keys(grouped).length === 0 && <p className="text-slate-500 text-center py-10">No records found for {activityType}.</p>}

                    <div className="space-y-6">
                        {Object.entries(grouped).map(([company, buckets]) => (
                            <div key={company} className="border border-slate-300 rounded-lg overflow-hidden">
                                <div className="bg-slate-800 text-white p-3 font-bold">{company}</div>
                                
                                {Object.entries(buckets).map(([bucket, recs]) => (
                                    <div key={bucket} className="border-t border-slate-200">
                                        <div className="bg-slate-100 p-3 font-semibold text-slate-700 flex justify-between items-center">
                                            <span>{bucket}</span>
                                            <span className="bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full text-sm">Total: {recs.length}</span>
                                        </div>
                                        
                                        <div className="p-0 overflow-x-auto">
                                            <table className="min-w-full text-left text-sm whitespace-nowrap">
                                                <thead className="bg-slate-50 text-slate-500">
                                                    <tr>
                                                        <th className="p-3">Trainee</th>
                                                        <th className="p-3">Topic</th>
                                                        {view !== 'Daily' && <th className="p-3">Exact Date</th>}
                                                        <th className="p-3">Location Match</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {recs.map((r, i) => (
                                                        <tr key={i} className="border-t border-slate-100 hover:bg-slate-50">
                                                            <td className="p-3">
                                                                <div className="font-bold text-slate-800">{r.traineeName}</div>
                                                                <div className="text-xs text-slate-500">{r.studentId}</div>
                                                            </td>
                                                            <td className="p-3 font-medium whitespace-normal min-w-[200px]">{r.topic}</td>
                                                            {view !== 'Daily' && <td className="p-3 text-xs">{new Date(r.timestamp).toLocaleDateString()}</td>}
                                                            <td className="p-3">
                                                                <span className={`px-2 py-1 rounded text-xs font-bold ${r.locationValidated === 'Yes' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                                                    {r.locationValidated === 'Yes' ? 'Valid' : 'Flagged'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==========================================

        // ==========================================

            const [loadingTrainees, setLoadingTrainees] = useState(true);
            const [loadingLogs, setLoadingLogs] = useState(false);
            const [exportingAll, setExportingAll] = useState(false); // NEW STATE
            const [errorMsg, setErrorMsg] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [durationFilter, setDurationFilter] = useState('');

            // Pagination States

            useEffect(() => {

            const durationOptions = [

                { value: '10', label: '10th Month (37 - 40 Weeks)', min: 37, max: 40 },
                { value: '11', label: '11th Month (41 - 44 Weeks)', min: 41, max: 44 },
                { value: '12', label: '12th Month (45 - 48 Weeks)', min: 45, max: 48 },
                { value: '13', label: '13th Month (49 - 52 Weeks)', min: 49, max: 52 },
                { value: '14', label: '14th Month (53 - 56 Weeks)', min: 53, max: 56 },
                { value: '15', label: '15th Month (57 - 60 Weeks)', min: 57, max: 60 },

                { value: '18', label: '18th Month (69 - 72 Weeks)', min: 69, max: 72 },
                { value: '19', label: 'Overtime / Extension (73+ Weeks)', min: 73, max: 999 }
            ];

            const getMeetingCredits = (record) => {
                const locationText = `${record.hub || ''} ${record.venue || ''} ${record.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                const combinedText = `${record.activityType || ''} ${record.type || ''} ${record.topic || ''} ${record.rawSheetData?.['Topic'] || ''} ${locationText}`.toUpperCase();
                
                if (combinedText.includes('RETREAT')) return 4;
                if (combinedText.includes('PDS9') || combinedText.includes('PDS 9') || 
                    combinedText.includes('PDS18') || combinedText.includes('PDS 18')) return 2;
                return 1; 
            };

            // Phase 1: Load Trainees with Session Caching protection
            useEffect(() => {
                const fetchTrainees = async () => {
                    setLoadingTrainees(true);
                    setErrorMsg('');

                    if (window._schoolingTraineesCache && window._schoolingTraineesCache.length > 0) {
                        setAllActiveTrainees(window._schoolingTraineesCache);
                        setLoadingTrainees(false);
                        return;
                    }

                    try {
                        const traineesRef = collection(db, 'artifacts', appId, 'public', 'data', 'trainees');
                        const traineesSnap = await getDocs(traineesRef);
                        let rawTrainees = traineesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        
                        rawTrainees = rawTrainees.filter(t => {
                            const stat = String(t.Status || t.status || t.studentStatus || 'Unknown').trim().toLowerCase();
                            return stat === 'active'; 
                        });

                        const processedTraineesBase = rawTrainees.map(trainee => {
                            const startDateStr = trainee['IPT Date Start'] || trainee.iptDateStart || trainee.startDate || '';
                            let iptWTD = 0;
                            if (startDateStr) {
                                const start = new Date(startDateStr);
                                const now = new Date();
                                if (!isNaN(start.getTime()) && start < now) {
                                    iptWTD = Math.floor((now - start) / (1000 * 60 * 60 * 24 * 7));
                                }
                            }
                            return { ...trainee, calculatedIptWTD: iptWTD };
                        });

                        window._schoolingTraineesCache = processedTraineesBase;
                        setAllActiveTrainees(processedTraineesBase);
                        
                        if (processedTraineesBase.length === 0) setErrorMsg('No "Active" trainees were found in the database.');
                    } catch (err) {
                        console.error("Firestore Registry Error:", err);
                        setErrorMsg(`Failed fetching trainees: ${err.message}`);
                    }
                    setLoadingTrainees(false);
                };
                fetchTrainees();
            }, []);

            // Phase 2: Lazy Load Logs for PAGINATED trainees only
            useEffect(() => {
                const loadLogsForFilter = async () => {
                    if (durationFilter === '') {
                        setDisplayedTrainees([]);
                        return;
                    }

                    setLoadingLogs(true);
                    setErrorMsg(''); 
                    
                    try {
                        let targetTrainees = [];
                        if (durationFilter === 'All') {
                            targetTrainees = [...allActiveTrainees];
                        } else {
                            const matchedOpt = durationOptions.find(opt => opt.value === durationFilter);
                            if (matchedOpt) {
                                targetTrainees = allActiveTrainees.filter(t => t.calculatedIptWTD >= matchedOpt.min && t.calculatedIptWTD <= matchedOpt.max);
                            }
                        }

                        const pagesCount = Math.ceil(targetTrainees.length / pageSize) || 1;
                        setTotalPages(pagesCount);

                        const startIndex = (currentPage - 1) * pageSize;
                        const pagedTrainees = targetTrainees.slice(startIndex, startIndex + pageSize);

                        if (pagedTrainees.length === 0) {
                            setDisplayedTrainees([]);
                            setLoadingLogs(false);
                            return;
                        }

                        const studentIds = pagedTrainees
                            .map(t => t['Student ID#'] || t.studentId || '')
                            .filter(id => id !== '');

                        let fetchedLogs = [];

                        if (studentIds.length > 0) {
                            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance');
                            const chunks = [];
                            for (let i = 0; i < studentIds.length; i += 30) {
                                chunks.push(studentIds.slice(i, i + 30));
                            }

                            const queryPromises = chunks.map(chunk => {
                                const q = query(logsRef, where('studentId', 'in', chunk));
                                return getDocs(q);
                            });

                            const snapshots = await Promise.all(queryPromises);
                            snapshots.forEach(snap => {
                                snap.forEach(doc => {
                                    fetchedLogs.push({ id: doc.id, ...doc.data() });
                                });
                            });
                        }

                        const completeData = pagedTrainees.map(trainee => {
                            const sId = trainee['Student ID#'] || trainee.studentId || '';
                            const studentLogs = fetchedLogs.filter(l => l.studentId === sId);
                            
                            const validSchoolingRecords = studentLogs.filter(h => {
                                const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                                const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                                const isSchooling = combinedText.includes('SCHOOLING') || combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || combinedText.includes('PDS') || combinedText.includes('RETREAT');
                                if (!isSchooling) return false;
                                return ['Present', 'Late', 'Verified', 'Pending Attendance'].includes(h.status);
                            });

                            validSchoolingRecords.sort((a, b) => {
                                let timeA = a.timestamp?.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
                                let timeB = b.timestamp?.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
                                if (!timeA && a.date) timeA = new Date(a.date).getTime();
                                if (!timeB && b.date) timeB = new Date(b.date).getTime();
                                return timeA - timeB;
                            });

                            const totalActivitiesCredits = validSchoolingRecords.reduce((total, h) => {
                                if (['Present', 'Late', 'Verified'].includes(h.status)) return total + getMeetingCredits(h);
                                return total;
                            }, 0);

                            const fullName = `${trainee.Given || trainee.given || trainee.firstName || ''} ${trainee.Family || trainee.family || trainee.lastName || ''}`.trim() || trainee.name || trainee.Name || 'Unknown';
                            const company = trainee['Company Name'] || trainee.companyName || trainee.company || trainee.Company || 'Unassigned';
                            const ic = trainee.assignedIC || trainee['Assigned IC'] || 'Unassigned';
                            const startDateStr = trainee['IPT Date Start'] || trainee.iptDateStart || trainee.startDate || '';
                            const endDateStr = trainee['IPT Date End'] || trainee.iptDateEnd || trainee.endDate || '';
                            const iptWTD = trainee.calculatedIptWTD;

                            const startObj = new Date(startDateStr);
                            const attendedWeeks = new Set();

                            if (!isNaN(startObj.getTime())) {
                                validSchoolingRecords.forEach(h => {
                                    if (!['Present', 'Late', 'Verified'].includes(h.status)) return;
                                    let entryDateStr = h.date || h.importedAt;
                                    if (entryDateStr) {
                                        let entryDate = new Date(entryDateStr);
                                        if (!isNaN(entryDate.getTime())) {
                                            const diffTime = entryDate.getTime() - startObj.getTime();
                                            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                                            
                                            let weekNum = 1;
                                            if (diffDays >= 0) {
                                                weekNum = Math.floor(diffDays / 7) + 1;
                                            }
                                            attendedWeeks.add(weekNum);
                                        }
                                    }
                                });
                            }

                            const explicitMissingWeeksList = [];
                            for (let w = 1; w <= iptWTD; w++) {
                                if (!attendedWeeks.has(w)) {
                                    explicitMissingWeeksList.push(w);
                                }
                            }
                            const missingWeeksStr = explicitMissingWeeksList.length > 0 
                                ? explicitMissingWeeksList.map(w => `W${w}`).join(', ') 
                                : (iptWTD > 0 ? 'None' : 'N/A');

                            const datesPresent = validSchoolingRecords
                                .filter(h => ['Present', 'Late', 'Verified'].includes(h.status))
                                .map(l => l.date || (l.importedAt ? new Date(l.importedAt).toLocaleDateString() : 'Unknown'))
                                .filter(Boolean)
                                .join(', ');

                            const weeksNoEntry = Math.max(0, iptWTD - totalActivitiesCredits);

                            return {
                                id: trainee.id,
                                studentId: sId || 'N/A',
                                name: fullName,
                                company: company,
                                ic: ic,
                                startDate: startDateStr || 'N/A',
                                endDate: endDateStr || 'N/A',
                                totalActivities: totalActivitiesCredits,
                                iptWTD: iptWTD,
                                datesPresent: datesPresent || 'None',
                                explicitMissingWeeks: missingWeeksStr,
                                weeksNoEntry: weeksNoEntry,
                                totalWeeksNoSchooling: weeksNoEntry
                            };
                        });

                        setDisplayedTrainees(completeData);
                    } catch (err) {
                        console.error("Lazy Load Logs Error:", err);
                        setErrorMsg(`Error loading attendance logs: ${err.message}`); 
                    }
                    setLoadingLogs(false);
                };

                loadLogsForFilter();
            }, [durationFilter, allActiveTrainees, currentPage, pageSize]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const sortedTrainees = [...displayedTrainees].sort((a, b) => {
                if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
                if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            // --- EXPORT TO CSV LOGIC (CURRENT PAGE) ---
            const handleExportPageCSV = () => {
                if (sortedTrainees.length === 0) return;
                generateCSV(sortedTrainees, `Schooling_Records_Page${currentPage}`);
            };

            // --- EXPORT TO CSV LOGIC (ALL PAGES) ---
            const handleExportAllCSV = async () => {
                setExportingAll(true);
                setErrorMsg('');
                
                try {
                    let targetTrainees = [];
                    if (durationFilter === 'All') {
                        targetTrainees = [...allActiveTrainees];
                    } else {
                        const matchedOpt = durationOptions.find(opt => opt.value === durationFilter);
                        if (matchedOpt) {
                            targetTrainees = allActiveTrainees.filter(t => t.calculatedIptWTD >= matchedOpt.min && t.calculatedIptWTD <= matchedOpt.max);
                        }
                    }

                        return;
                    }

                    const studentIds = targetTrainees
                        .map(t => t['Student ID#'] || t.studentId || '')
                        .filter(id => id !== '');

                        const chunks = [];
                        for (let i = 0; i < studentIds.length; i += 30) {
                            chunks.push(studentIds.slice(i, i + 30));
                        }

                        // Fetch sequentially so we don't crash the browser or hit burst quotas
                        for (const chunk of chunks) {
                            const q = query(logsRef, where('studentId', 'in', chunk));
                            const snap = await getDocs(q);
                            snap.forEach(doc => {
                                fetchedLogs.push({ id: doc.id, ...doc.data() });
                            });
                        }
                    }

                    const completeData = targetTrainees.map(trainee => {

                        const studentLogs = fetchedLogs.filter(l => l.studentId === sId);
                        
                        const validSchoolingRecords = studentLogs.filter(h => {

                            const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                            const isSchooling = combinedText.includes('SCHOOLING') || combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || combinedText.includes('PDS') || combinedText.includes('RETREAT');
                            if (!isSchooling) return false;

                            if (!timeA && a.date) timeA = new Date(a.date).getTime();
                            if (!timeB && b.date) timeB = new Date(b.date).getTime();
                            return timeA - timeB;

                            return total;
                        }, 0);

                        const fullName = `${trainee.Given || trainee.given || trainee.firstName || ''} ${trainee.Family || trainee.family || trainee.lastName || ''}`.trim() || trainee.name || trainee.Name || 'Unknown';
                        const company = trainee['Company Name'] || trainee.companyName || trainee.company || trainee.Company || 'Unassigned';
                        const ic = trainee.assignedIC || trainee['Assigned IC'] || 'Unassigned';
                        const startDateStr = trainee['IPT Date Start'] || trainee.iptDateStart || trainee.startDate || '';
                        const endDateStr = trainee['IPT Date End'] || trainee.iptDateEnd || trainee.endDate || '';
                        const iptWTD = trainee.calculatedIptWTD;

                        const startObj = new Date(startDateStr);
                        const attendedWeeks = new Set();

                        if (!isNaN(startObj.getTime())) {
                            validSchoolingRecords.forEach(h => {
                                if (!['Present', 'Late', 'Verified'].includes(h.status)) return;
                                let entryDateStr = h.date || h.importedAt;
                                if (entryDateStr) {
                                    let entryDate = new Date(entryDateStr);
                                    if (!isNaN(entryDate.getTime())) {
                                        const diffTime = entryDate.getTime() - startObj.getTime();
                                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                                        let weekNum = 1;
                                        if (diffDays >= 0) weekNum = Math.floor(diffDays / 7) + 1;
                                        attendedWeeks.add(weekNum);
                                    }
                                }
                            });
                        }

                        const explicitMissingWeeksList = [];
                        for (let w = 1; w <= iptWTD; w++) {
                            if (!attendedWeeks.has(w)) explicitMissingWeeksList.push(w);
                        }
                        const missingWeeksStr = explicitMissingWeeksList.length > 0 
                            ? explicitMissingWeeksList.map(w => `W${w}`).join(', ') : (iptWTD > 0 ? 'None' : 'N/A');

                        const datesPresent = validSchoolingRecords
                            .filter(h => ['Present', 'Late', 'Verified'].includes(h.status))
                            .map(l => l.date || (l.importedAt ? new Date(l.importedAt).toLocaleDateString() : 'Unknown'))
                            .filter(Boolean).join(', ');

                        const weeksNoEntry = Math.max(0, iptWTD - totalActivitiesCredits);

                        return {
                            studentId: sId || 'N/A', name: fullName, company: company, ic: ic,
                            startDate: startDateStr || 'N/A', endDate: endDateStr || 'N/A',
                            totalActivities: totalActivitiesCredits, iptWTD: iptWTD,
                            datesPresent: datesPresent || 'None', explicitMissingWeeks: missingWeeksStr,
                            weeksNoEntry: weeksNoEntry, totalWeeksNoSchooling: weeksNoEntry
                        };
                    });

                    completeData.sort((a, b) => a.name.localeCompare(b.name));

                    let fileNameMonth = durationFilter === 'All' ? 'All_Active' : `Month_${durationFilter}`;
                    generateCSV(completeData, `Schooling_Records_${fileNameMonth}_COMPLETE`);

                } catch (err) {
                    console.error("Export All Error:", err);
                    setErrorMsg(`Failed to export all records: ${err.message}`);
                }
                setExportingAll(false);
            };

            const generateCSV = (dataList, fileName) => {
                const headers = [
                    "Student ID", "Trainee Name", "Company Name", "Assigned IC",
                    "IPT Date Start", "IPT Date End", "Total Activities", 
                    "IPT WTD", "Dates Present", "Missing Week #s", "Total Weeks No Schooling"
                ];

                const csvRows = [headers.join(",")];
                
                dataList.forEach(t => {
                    const row = [
                        `"${t.studentId}"`, `"${t.name}"`, `"${t.company}"`, `"${t.ic}"`,
                        `"${t.startDate}"`, `"${t.endDate}"`, `"${t.totalActivities}"`,
                        `"${t.iptWTD}"`, `"${t.datesPresent}"`, `"${t.explicitMissingWeeks}"`,
                        `"${t.totalWeeksNoSchooling}"`
                    ];
                    csvRows.push(row.join(","));
                });

                const csvString = csvRows.join("\n");
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `${fileName}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const SortIcon = ({ columnKey }) => {
                if (sortConfig.key !== columnKey) return <div className="w-3" />;
                return sortConfig.direction === 'asc' ? <span className="text-xs ml-1">▲</span> : <span className="text-xs ml-1">▼</span>;
            };

            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                            <FileText className="text-indigo-600" size={28} /> 
                            Schooling Records (Active Only)
                        </h2>
                        
                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full xl:w-auto">
                            <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200 w-full sm:w-auto">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-2 whitespace-nowrap">
                                    Select Period:
                                </label>
                                <select 
                                    value={durationFilter} 
                                    onChange={e => setDurationFilter(e.target.value)}
                                    disabled={loadingTrainees || exportingAll}
                                    className="bg-white border border-slate-200 text-slate-800 font-bold rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500 cursor-pointer shadow-sm w-full disabled:opacity-50"
                                >
                                    <option value="">-- Choose Training Month --</option>
                                    <option value="All">Show All Active Trainees</option>
                                    {durationOptions.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    ))}
                                </select>
                            </div>
                            
                            <div className="flex gap-2 w-full sm:w-auto">
                                <button
                                    onClick={handleExportPageCSV}
                                    disabled={loadingLogs || loadingTrainees || sortedTrainees.length === 0 || exportingAll}
                                    className="flex-1 sm:flex-none items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 disabled:opacity-50 disabled:cursor-not-allowed font-bold py-2.5 px-4 rounded-xl border border-slate-300 transition-colors text-sm flex"
                                    title="Export current page to CSV"
                                >
                                    <Download size={18} /> Page
                                </button>

                                <button
                                    onClick={handleExportAllCSV}
                                    disabled={loadingLogs || loadingTrainees || durationFilter === '' || exportingAll}
                                    className="flex-1 sm:flex-none items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-2.5 px-4 rounded-xl shadow-sm transition-colors text-sm flex"
                                    title="Export all pages in current filter to CSV"
                                >
                                    {exportingAll ? <Loader2 size={18} className="animate-spin" /> : <Download size={18} />}
                                    {exportingAll ? "Exporting..." : "Export All"}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    {errorMsg && (
                        <div className="bg-rose-50 border border-rose-200 text-rose-800 p-5 rounded-xl font-semibold text-sm flex flex-col gap-1">
                            <span>⚠️ {errorMsg}</span>
                        </div>
                    )}

                    {loadingTrainees ? (
                        <div className="p-12 text-center text-slate-500 flex flex-col items-center justify-center bg-white border border-slate-200 rounded-2xl">
                            <Loader2 className="animate-spin mb-2 text-indigo-500" size={32} />
                            <p className="font-medium text-slate-600">Initializing database session map safely...</p>
                        </div>
                    ) : durationFilter === '' ? (
                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-16 text-center flex flex-col items-center justify-center space-y-3">

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-xs">

                                                {sortedTrainees.length === 0 ? (
