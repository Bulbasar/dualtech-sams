    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useMemo } from "react";
      import { createRoot } from "react-dom/client";
      import * as Lucide from "lucide-react";
      import { initializeApp, deleteApp } from "firebase/app";
      import {
        initializeAppCheck,
        ReCaptchaEnterpriseProvider,
        CustomProvider,
        getToken
      } from "firebase/app-check";
      // ADDED EmailAuthProvider and reauthenticateWithCredential
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut,
        createUserWithEmailAndPassword,
        EmailAuthProvider,
        reauthenticateWithCredential,
      } from "firebase/auth";

        getFirestore,

        doc,

      // ADDED UserPlus at the end
      const {
        ClipboardList,
        Eye,
        Calendar,
        Download,

        MapPin,
        Users,
        LogOut,
        Plus,

        Trash2,
        Edit3,
        Copy,
        RefreshCw,
        Key,
        Shield,
        UploadCloud,

        Lock,
        Mail,
        Activity,
        CheckCircle2,
        FileUp,
        Award,
        UserCog,
        Edit,
        Edit2,
        X,
        Menu,
        AlertTriangle,
        FileText,
        Smartphone,
        Search,
        UserPlus,
        Loader2,
        History,
        Sun,
        Moon,
      } = Lucide;

      // --- Firebase Configuration ---
      const firebaseConfig = {
        apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U",
        authDomain: "dualtech-ojt-portal.firebaseapp.com",
        projectId: "dualtech-ojt-portal",
        storageBucket: "dualtech-ojt-portal.firebasestorage.app",
        messagingSenderId: "255242185978",
        appId: "1:255242185978:web:2f07c554fad2e3a78ead43",
      };
      const app = initializeApp(firebaseConfig);
      const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaEnterpriseProvider(
          "6LeGUowtAAAAALQKvlwQ1T7UtdbAqcL47wPVBxff",
        ),
        isTokenAutoRefreshEnabled: true,
      });
      const auth = getAuth(app);
      const db = getFirestore(app);

      const appId = "dualtech-ojt-portal";

      const generatePassword = () => {
        const chars =
          "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%";
        let pwd = "";
        for (let i = 0; i < 10; i++)
          pwd += chars.charAt(Math.floor(Math.random() * chars.length));
        return pwd;
      };

      const copyToClipboard = (text) => {
        const el = document.createElement("textarea");
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
      };

      // --- LOGIN COMPONENT ---
      function LoginScreen() {
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [loading, setLoading] = useState(false);
        const [errorMsg, setErrorMsg] = useState("");

        const handleSubmit = async (e) => {
          e.preventDefault();
          setErrorMsg("");

          const formattedEmail = email.trim().toLowerCase();

          setLoading(true);
          try {
            await signInWithEmailAndPassword(auth, formattedEmail, password);
          } catch (error) {
            setErrorMsg("Invalid email or password. Please try again.");
          }
          setLoading(false);
        };

        return (
          <div className="min-h-screen bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4 h-full overflow-y-auto w-full relative">
            <div className="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] rounded-full bg-blue-500/10 blur-[120px] pointer-events-none"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[30rem] h-[30rem] rounded-full bg-emerald-500/10 blur-[100px] pointer-events-none"></div>

            <div className="bg-white dark:bg-slate-800/80 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl max-w-md w-full border border-slate-200 dark:border-slate-700 relative overflow-hidden z-10">
              <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
              <div className="flex justify-center mb-6">
                <div className="bg-blue-50 dark:bg-blue-900/40 p-4 rounded-full text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-800/50 shadow-inner">
                  <Shield size={40} />
                </div>
              </div>
              <h2 className="text-2xl font-black text-center text-slate-800 dark:text-white mb-2 tracking-tight">
                System Admin Console
              </h2>
              <p className="text-center text-slate-500 dark:text-slate-500 text-sm mb-8 font-medium">
                Sign in with your authorized Dualtech email
              </p>

              {errorMsg && (
                <div className="mb-6 p-4 bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 rounded-xl text-red-600 dark:text-red-400 text-sm flex items-start gap-3 shadow-sm">
                  <AlertCircle size={18} className="shrink-0 mt-0.5" />
                  <span>{errorMsg}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-[10px] font-bold text-slate-500 dark:text-slate-500 mb-1.5 uppercase tracking-wider">
                    Email Address
                  </label>
                  <div className="relative">
                    <Mail
                      className="absolute left-4 top-3.5 text-slate-400 dark:text-slate-500 dark:text-slate-500"
                      size={18}
                    />
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 focus:border-blue-500 dark:focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-500/30 outline-none transition-all text-slate-800 dark:text-white text-sm placeholder-slate-400 dark:placeholder-slate-500 shadow-sm"
                      placeholder="admin@dualtech.edu.ph"
                      required
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-[10px] font-bold text-slate-500 dark:text-slate-500 mb-1.5 uppercase tracking-wider">
                    Password
                  </label>
                  <div className="relative">
                    <Lock
                      className="absolute left-4 top-3.5 text-slate-400 dark:text-slate-500 dark:text-slate-500"
                      size={18}
                    />
                    <input
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 focus:border-blue-500 dark:focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-500/30 outline-none transition-all text-slate-800 dark:text-white text-sm placeholder-slate-400 dark:placeholder-slate-500 shadow-sm"
                      placeholder="••••••••"
                      required
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/20 disabled:opacity-70 mt-2 active:scale-[0.99] flex justify-center"
                >
                  {loading ? (
                    <Loader2 className="animate-spin" size={20} />
                  ) : (
                    "Secure Sign In"
                  )}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // --- DISPUTES TAB (ONLY DEVICE DISPUTES) ---
      function DisputesTab({ showMessage }) {
        const [disputes, setDisputes] = useState([]);
        const [loading, setLoading] = useState(true);
        const [selectedIds, setSelectedIds] = useState([]); // NEW: State for bulk selection

        const fetchDisputes = async () => {
          setLoading(true);
          setSelectedIds([]); // Reset selection on refresh
          try {
            // Fetch directly from the centralized public requests collection
            const requestsRef = collection(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "requests",
            );
            const adminDisputesQuery = query(
              requestsRef,
              where("category", "==", "System/Device Warning"),
            );
            const snap = await getDocs(adminDisputesQuery);

            let data = snap.docs.map((doc) => ({
              ref: doc.ref,
              id: doc.id,
              ...doc.data(),
            }));

            // Sort so "Pending Admin Approval" are at the top, then by newest date
            data.sort((a, b) => {
              const statusA = String(a.status || "");
              const statusB = String(b.status || "");
              const isAPending = statusA.includes("Pending");
              const isBPending = statusB.includes("Pending");

              if (isAPending && !isBPending) return -1;
              if (!isAPending && isBPending) return 1;
              return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
            });

            setDisputes(data);
          } catch (err) {
            showMessage(
              "Error fetching disputes. Ensure Firestore rules are set.",
              "error",
            );
            console.error(err);
          }
          setLoading(false);
        };

        useEffect(() => {
          fetchDisputes();
        }, []);

        // --- CHECKBOX SELECTION LOGIC ---
        const toggleSelectAll = () => {
          if (selectedIds.length === disputes.length) {
            setSelectedIds([]);
          } else {
            setSelectedIds(disputes.map((d) => d.id));
          }
        };

        const toggleSelect = (id) => {
          if (selectedIds.includes(id)) {
            setSelectedIds(selectedIds.filter((itemId) => itemId !== id));
          } else {
            setSelectedIds([...selectedIds, id]);
          }
        };

        // --- INDIVIDUAL ACTIONS ---
        const handleApproveDevice = async (dispute) => {
          if (
            !window.confirm(
              "Approve this device? It will be permanently added to the trainee's trusted devices.",
            )
          )
            return;
          try {
            if (dispute.uid && dispute.deviceUsed) {
              const profileRef = doc(
                db,
                "artifacts",
                appId,
                "users",
                dispute.uid,
                "profile",
                "main",
              );
              await updateDoc(profileRef, {
                trustedDevices: arrayUnion(dispute.deviceUsed),
              });
            }
            await updateDoc(dispute.ref, {
              status: "Resolved (Device Trusted)",
              resolvedAt: new Date().toISOString(),
            });
            showMessage("Device approved and added to trusted list!");
            fetchDisputes();
          } catch (err) {
            showMessage("Error resolving dispute: " + err.message, "error");
          }
        };

        const handleRejectDispute = async (dispute) => {
          if (
            !window.confirm(
              "Reject this dispute? No changes will be made to the trainee's profile.",
            )
          )
            return;
          try {
            await updateDoc(dispute.ref, {
              status: "Rejected",
              resolvedAt: new Date().toISOString(),
            });
            showMessage("Dispute rejected.");
            fetchDisputes();
          } catch (err) {
            showMessage("Error rejecting dispute: " + err.message, "error");
          }
        };

        // --- BULK ACTIONS ---
        const handleBulkApprove = async () => {
          if (
            !window.confirm(`Approve ${selectedIds.length} selected devices?`)
          )
            return;
          setLoading(true);
          try {
            const selected = disputes.filter((d) => selectedIds.includes(d.id));
            const promises = selected.map(async (dispute) => {
              if (dispute.uid && dispute.deviceUsed) {
                const profileRef = doc(
                  db,
                  "artifacts",
                  appId,
                  "users",
                  dispute.uid,
                  "profile",
                  "main",
                );
                await updateDoc(profileRef, {
                  trustedDevices: arrayUnion(dispute.deviceUsed),
                });
              }
              return updateDoc(dispute.ref, {
                status: "Resolved (Device Trusted)",
                resolvedAt: new Date().toISOString(),
              });
            });
            await Promise.all(promises);
            showMessage(`${selected.length} devices successfully approved!`);
            fetchDisputes();
          } catch (err) {
            showMessage("Error in bulk approval: " + err.message, "error");
            setLoading(false);
          }
        };

        const handleBulkReject = async () => {
          if (
            !window.confirm(`Reject ${selectedIds.length} selected disputes?`)
          )
            return;
          setLoading(true);
          try {
            const selected = disputes.filter((d) => selectedIds.includes(d.id));
            const promises = selected.map((d) =>
              updateDoc(d.ref, {
                status: "Rejected",
                resolvedAt: new Date().toISOString(),
              }),
            );
            await Promise.all(promises);
            showMessage(`${selected.length} disputes rejected.`);
            fetchDisputes();
          } catch (err) {
            showMessage("Error in bulk rejection: " + err.message, "error");
            setLoading(false);
          }
        };

        const handleBulkDelete = async () => {
          if (
            !window.confirm(
              `Permanently DELETE ${selectedIds.length} selected disputes? This cannot be undone.`,
            )
          )
            return;
          setLoading(true);
          try {
            const selected = disputes.filter((d) => selectedIds.includes(d.id));
            const promises = selected.map((d) => deleteDoc(d.ref)); // Requires import of deleteDoc
            await Promise.all(promises);
            showMessage(`${selected.length} disputes permanently deleted.`);
            fetchDisputes();
          } catch (err) {
            showMessage("Error in bulk deletion: " + err.message, "error");
            setLoading(false);
          }
        };

        return (
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 relative">
            <div className="border-b border-slate-100 dark:border-slate-700 pb-4 md:pb-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h2 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                  <AlertCircle className="text-amber-500" /> Device Disputes
                </h2>
                <p className="text-slate-500 dark:text-slate-500 text-sm mt-1">
                  Review and approve unrecognized devices flagged by the system.
                </p>
              </div>
              <button
                onClick={fetchDisputes}
                className="p-3 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center gap-2 w-full md:w-auto border border-transparent dark:border-slate-600"
              >
                <RefreshCw size={18} />{" "}
                <span className="md:hidden font-bold">Refresh</span>
              </button>
            </div>

            {/* BULK ACTION TOOLBAR */}
            {selectedIds.length > 0 && !loading && (
              <div className="flex flex-wrap items-center gap-2 bg-blue-50/50 p-3 rounded-xl mb-4 border border-blue-100">
                <span className="text-blue-700 font-bold text-sm mr-auto px-2">
                  {selectedIds.length} row(s) selected
                </span>
                <button
                  onClick={handleBulkApprove}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors shadow-sm"
                >
                  Approve Selected
                </button>
                <button
                  onClick={handleBulkReject}
                  className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors shadow-sm"
                >
                  Reject Selected
                </button>
                <button
                  onClick={handleBulkDelete}
                  className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 text-xs font-bold px-4 py-2 rounded-lg transition-colors"
                >
                  Delete Selected
                </button>
              </div>
            )}

            {loading ? (
              <div className="flex flex-col items-center justify-center py-12 text-slate-400 dark:text-slate-500 dark:text-slate-500">
                <RefreshCw className="animate-spin mb-4" size={32} /> Loading
                disputes...
              </div>
            ) : (
              <div className="overflow-x-auto bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 w-full">
                <table className="w-full min-w-[800px] text-left border-collapse text-sm">
                  <thead>
                    <tr className="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-500">
                      {/* MASTER CHECKBOX */}
                      <th className="p-4 w-10">
                        <input
                          type="checkbox"
                          className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                          onChange={toggleSelectAll}
                          checked={
                            disputes.length > 0 &&
                            selectedIds.length === disputes.length
                          }
                        />
                      </th>
                      <th className="p-4 font-bold">Date Filed</th>
                      <th className="p-4 font-bold">Trainee Info</th>
                      <th className="p-4 font-bold">Reason & Device Info</th>
                      <th className="p-4 font-bold">Status</th>
                      <th className="p-4 font-bold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {disputes.map((d, i) => {
                      const safeStatus = String(d.status || "Unknown");
                      const isPending = safeStatus.includes("Pending");
                      const isSelected = selectedIds.includes(d.id);

                      return (
                        <tr
                          key={d.id}
                          className={`border-b border-slate-100 hover:bg-slate-50 transition-colors ${isSelected ? "bg-blue-50/30" : ""}`}
                        >
                          {/* ROW CHECKBOX */}
                          <td className="p-4">
                            <input
                              type="checkbox"
                              className="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                              onChange={() => toggleSelect(d.id)}
                              checked={isSelected}
                            />
                          </td>
                          <td className="p-4 text-slate-600 dark:text-slate-300 font-medium whitespace-nowrap">
                            {d.createdAt
                              ? new Date(d.createdAt).toLocaleDateString()
                              : d.date || "N/A"}
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-800 dark:text-white">
                              {d.studentName || "Unknown"}
                            </div>
                            <div className="text-xs text-slate-500 dark:text-slate-500">
                              {d.studentId || d.studentNo || "Unknown"}
                            </div>
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1">
                              <Smartphone
                                size={14}
                                className="text-amber-500"
                              />{" "}
                              Unrecognized Device
                            </div>
                            <div className="text-xs text-slate-500 dark:text-slate-500 mt-1 italic bg-white dark:bg-slate-800 p-2 rounded border border-slate-200 dark:border-slate-700">
                              "{d.reason || "No reason provided"}"
                            </div>
                            {d.deviceUsed && (
                              <div
                                className="text-[10px] text-slate-400 dark:text-slate-500 font-mono mt-1 max-w-xs truncate"
                                title={d.deviceUsed}
                              >
                                Device Profile: {d.deviceUsed}
                              </div>
                            )}
                          </td>
                          <td className="p-4">
                            <span
                              className={`px-2 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider whitespace-nowrap ${isPending ? "bg-amber-100 text-amber-700" : safeStatus.includes("Rejected") ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700"}`}
                            >
                              {safeStatus}
                            </span>
                          </td>
                          <td className="p-4 text-right whitespace-nowrap">
                            {isPending && (
                              <>
                                <button
                                  onClick={() => handleApproveDevice(d)}
                                  className="bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 text-xs font-bold px-3 py-2 rounded-lg transition-colors mr-2"
                                >
                                  Trust
                                </button>
                                <button
                                  onClick={() => handleRejectDispute(d)}
                                  className="bg-slate-50 dark:bg-slate-900/50 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700/50 dark:bg-slate-900 text-xs font-bold px-3 py-2 rounded-lg transition-colors"
                                >
                                  Reject
                                </button>
                              </>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                    {disputes.length === 0 && (
                      <tr>
                        <td
                          colSpan="6"
                          className="p-8 text-center text-slate-400 dark:text-slate-500"
                        >
                          No device disputes found.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      }

      // --- MANAGE ACCOUNTS TAB ---
      function ManageAccountsTab({ showMessage }) {
        const [accounts, setAccounts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [editingAccount, setEditingAccount] = useState(null);

        // Search & Selection state
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedAccounts, setSelectedAccounts] = useState([]);

        const fetchAccounts = async () => {
          setLoading(true);
          try {
            const q = query(
              collectionGroup(db, "profile"),
              where("role", "==", "trainee"),
            );
            const snap = await getDocs(q);

            const data = snap.docs.map((doc) => ({
              // FIX: doc.id is always 'main', so we must use uid or the reference path for true uniqueness!
              id: doc.data().uid || doc.ref.path,
              ref: doc.ref,
              ...doc.data(),
            }));

            setAccounts(data);
            setSelectedAccounts([]); // Clear selection on refresh
          } catch (err) {
            showMessage(
              "Error fetching accounts. Note: This requires a Firestore index or updated rules.",
              "error",
            );
            console.error(err);
          }
          setLoading(false);
        };

        useEffect(() => {
          fetchAccounts();
        }, []);

        const handleDelete = async (acc) => {
          const confirmed = window.confirm(
            `WARNING: Are you sure you want to delete the portal account for ${acc.given} ${acc.family}? \n\nThey will be logged out and will need to re-register their account.`,
          );
          if (!confirmed) return;

          try {
            await deleteDoc(acc.ref);

            const traineesRef = collection(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "trainees",
            );
            const q = query(
              traineesRef,
              where("studentId", "==", acc.studentId),
            );
            const snap = await getDocs(q);

            if (!snap.empty) {
              const masterDocRef = snap.docs[0].ref;
              await updateDoc(masterDocRef, { isRegistered: false });
            }

            showMessage("Account successfully deleted.");
            fetchAccounts();
          } catch (err) {
            showMessage("Error deleting account: " + err.message, "error");
          }
        };

        const handleDeleteMultiple = async () => {
          const confirmed = window.confirm(
            `WARNING: Are you sure you want to delete ${selectedAccounts.length} selected portal accounts? \n\nThey will be logged out and will need to re-register.`,
          );
          if (!confirmed) return;

          setLoading(true);
          let successCount = 0;

          try {
            for (const acc of selectedAccounts) {
              await deleteDoc(acc.ref);
              const traineesRef = collection(
                db,
                "artifacts",
                appId,
                "public",
                "data",
                "trainees",
              );
              const q = query(
                traineesRef,
                where("studentId", "==", acc.studentId),
              );
              const snap = await getDocs(q);

              if (!snap.empty) {
                const masterDocRef = snap.docs[0].ref;
                await updateDoc(masterDocRef, { isRegistered: false });
              }
              successCount++;
            }
            showMessage(`Successfully deleted ${successCount} accounts.`);
            fetchAccounts();
          } catch (err) {
            showMessage(
              "Error deleting multiple accounts: " + err.message,
              "error",
            );
            setLoading(false);
          }
        };

        const handleSaveEdit = async (e) => {
          e.preventDefault();
          try {
            await setDoc(
              editingAccount.ref,
              {
                given: editingAccount.given,
                family: editingAccount.family,
                contactNo: editingAccount.contactNo,
                contactPerson: editingAccount.contactPerson,
                contactPersonNo: editingAccount.contactPersonNo,
                assignedIC: editingAccount.assignedIC,
                companyName: editingAccount.companyName,
              },
              { merge: true },
            );

            showMessage("Trainee details updated successfully!");
            setEditingAccount(null);
            fetchAccounts();
          } catch (err) {
            showMessage("Error updating details: " + err.message, "error");
          }
        };

        // DYNAMIC SEARCH FILTER (Searches Name, Company, Student ID, and Email)
        const filteredAccounts = useMemo(() => {
          if (!searchQuery.trim()) return accounts;

          const lowerQ = searchQuery.toLowerCase();
          return accounts.filter((acc) => {
            const fullName =
              `${acc.given || ""} ${acc.family || ""}`.toLowerCase();
            const studentId = String(acc.studentId || "").toLowerCase();
            const email = String(acc.email || "").toLowerCase();
            const company = String(acc.companyName || "").toLowerCase();
            const ic = String(acc.assignedIC || "").toLowerCase();

            return (
              fullName.includes(lowerQ) ||
              studentId.includes(lowerQ) ||
              email.includes(lowerQ) ||
              company.includes(lowerQ) ||
              ic.includes(lowerQ)
            );
          });
        }, [accounts, searchQuery]);

        // NEW: Group the filtered accounts by Company Name
        const groupedAccounts = useMemo(() => {
          const groups = {};
          filteredAccounts.forEach((acc) => {
            // Group by company name (or 'Unassigned' if blank)
            const company = (acc.companyName || "Unassigned / No Company")
              .trim()
              .toUpperCase();
            if (!groups[company]) groups[company] = [];
            groups[company].push(acc);
          });

          // Sort companies alphabetically
          return Object.keys(groups)
            .sort()
            .map((company) => ({
              company,
              accounts: groups[company],
            }));
        }, [filteredAccounts]);

        const handleSelectAll = (e) => {
          if (e.target.checked) setSelectedAccounts(filteredAccounts);
          else setSelectedAccounts([]);
        };

        const handleSelectOne = (acc) => {
          const isSelected = selectedAccounts.some((s) => s.id === acc.id);
          if (isSelected) {
            setSelectedAccounts(
              selectedAccounts.filter((s) => s.id !== acc.id),

          } else {
            setSelectedAccounts([...selectedAccounts, acc]);

        };

        return (
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 relative">
            <div className="border-b border-slate-100 dark:border-slate-700 pb-4 md:pb-6 mb-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
              <div>
                <h2 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                  <UserCog className="text-purple-600" /> Manage Trainee
                  Accounts
                </h2>
                <p className="text-slate-500 dark:text-slate-500 text-sm mt-1">
                  View, edit, or delete trainees who have created an account via
                  the portal.
                </p>
              </div>

              <div className="flex flex-col md:flex-row items-center gap-3 w-full lg:w-auto">
                {selectedAccounts.length > 0 && (
                  <button
                    onClick={handleDeleteMultiple}
                    className="p-2 bg-red-100 text-red-600 hover:bg-red-200 font-bold rounded-xl transition-colors flex items-center justify-center gap-2 w-full md:w-auto px-4 shrink-0 text-sm"
                  >
                    <Trash2 size={16} /> Delete Selected (
                    {selectedAccounts.length})
                  </button>
                )}

                <div className="relative w-full md:w-64">
                  <Search
                    className="absolute left-3 top-2.5 text-slate-400 dark:text-slate-500"
                    size={18}
                  />
                  <input
                    type="text"
                    placeholder="Search Name, ID, or Company..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none text-sm transition-all"
                  />
                </div>
                <button
                  onClick={fetchAccounts}
                  className="p-2 bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 rounded-xl text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center gap-2 w-full md:w-auto px-4 shrink-0"
                >
                  <RefreshCw size={18} />{" "}
                  <span className="md:hidden font-bold">Refresh</span>
                </button>
              </div>
            </div>

            {/* Edit Modal (Stays the Same) */}
            {editingAccount && (
              <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-[60] p-4 overflow-y-auto">
                <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-lg w-full shadow-2xl relative my-auto">
                  <button
                    onClick={() => setEditingAccount(null)}
                    className="absolute top-4 right-4 p-2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 dark:text-slate-300 bg-slate-100 dark:bg-slate-900 rounded-full"
                  >
                    <X size={18} />
                  </button>
                  <h3 className="text-lg font-black text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <Edit size={18} className="text-blue-600" /> Edit Trainee
                    Profile
                  </h3>
                  <form onSubmit={handleSaveEdit} className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          First Name
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.given}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              given: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          Last Name
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.family}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              family: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          Assigned IC
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.assignedIC}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              assignedIC: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          Company
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.companyName}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              companyName: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                        Trainee Contact No.
                      </label>
                      <input
                        type="text"
                        className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                        value={editingAccount.contactNo}
                        onChange={(e) =>
                          setEditingAccount({
                            ...editingAccount,
                            contactNo: e.target.value,
                          })
                        }
                      />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          Emergency Contact Person
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.contactPerson}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              contactPerson: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-500 mb-1">
                          Emergency Contact No.
                        </label>
                        <input
                          type="text"
                          className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                          value={editingAccount.contactPersonNo}
                          onChange={(e) =>
                            setEditingAccount({
                              ...editingAccount,
                              contactPersonNo: e.target.value,
                            })
                          }
                          required
                        />
                      </div>
                    </div>
                    <button
                      type="submit"
                      className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 mt-2"
                    >
                      Save Changes
                    </button>
                  </form>
                </div>
              </div>
            )}

            {loading ? (
              <div className="flex flex-col items-center justify-center py-12 text-slate-400 dark:text-slate-500">
                <RefreshCw className="animate-spin mb-4" size={32} /> Loading
                accounts...
              </div>
            ) : (
              <div className="overflow-x-auto bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 w-full">
                <table className="w-full min-w-[600px] text-left border-collapse text-sm">
                  <thead>
                    <tr className="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-500">
                      <th className="p-4 w-10">
                        <input
                          type="checkbox"
                          className="rounded border-slate-300 w-4 h-4 text-purple-600 focus:ring-purple-500 cursor-pointer"
                          onChange={handleSelectAll}
                          checked={
                            selectedAccounts.length ===
                              filteredAccounts.length &&
                            filteredAccounts.length > 0
                          }
                        />
                      </th>
                      <th className="p-4 font-bold">Trainee</th>
                      <th className="p-4 font-bold">Placement</th>
                      <th className="p-4 font-bold">Contact Info</th>
                      <th className="p-4 font-bold text-right">Actions</th>
                    </tr>
                  </thead>

                  {/* Render Grouped Accounts */}
                  {groupedAccounts.length > 0 ? (
                    groupedAccounts.map((group) => (
                      <tbody key={group.company}>
                        {/* Company Header Row */}
                        <tr className="bg-slate-100 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-700">
                          <td
                            colSpan="5"
                            className="p-3 px-4 font-black text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider"
                          >
                            🏢 {group.company}{" "}
                            <span className="text-slate-400 dark:text-slate-500 font-bold ml-1">
                              ({group.accounts.length})
                            </span>
                          </td>
                        </tr>

                        {/* Trainee Rows within this Company */}
                        {group.accounts.map((acc) => (
                          <tr
                            key={acc.id}
                            className={`border-b border-slate-100 hover:bg-slate-50 ${selectedAccounts.some((s) => s.id === acc.id) ? "bg-purple-50/50" : ""}`}
                          >
                            <td className="p-4">
                              <input
                                type="checkbox"
                                className="rounded border-slate-300 w-4 h-4 text-purple-600 focus:ring-purple-500 cursor-pointer"
                                checked={selectedAccounts.some(
                                  (s) => s.id === acc.id,
                                )}
                                onChange={() => handleSelectOne(acc)}
                              />
                            </td>
                            <td className="p-4">
                              <div className="font-bold text-slate-700 dark:text-slate-200">
                                {acc.given} {acc.family}
                              </div>
                              <div className="text-xs text-slate-500 dark:text-slate-500 mt-1">
                                ID: {acc.studentId}
                              </div>
                              <div className="text-xs text-blue-500 mt-0.5">
                                {acc.email}
                              </div>
                            </td>
                            <td className="p-4">
                              <div className="font-bold text-slate-700 dark:text-slate-200 text-xs">
                                {acc.companyName || "Unassigned"}
                              </div>
                              <div className="text-xs text-slate-500 dark:text-slate-500 mt-1">
                                IC: {acc.assignedIC || "None"}
                              </div>
                            </td>
                            <td className="p-4">
                              <div className="text-xs text-slate-700 dark:text-slate-200">
                                Self: {acc.contactNo || "N/A"}
                              </div>
                              <div className="text-xs text-slate-500 dark:text-slate-500 mt-1">
                                Emg: {acc.contactPerson} ({acc.contactPersonNo})
                              </div>
                            </td>
                            <td className="p-4 text-right whitespace-nowrap">
                              <button
                                onClick={() => setEditingAccount(acc)}
                                className="text-blue-500 hover:bg-blue-50 p-2 rounded-lg transition-colors mr-1"
                              >
                                <Edit size={16} />
                              </button>
                              <button
                                onClick={() => handleDelete(acc)}
                                className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors"
                              >
                                <Trash2 size={16} />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    ))
                  ) : (
                    <tbody>
                      <tr>
                        <td
                          colSpan="5"
                          className="p-8 text-center text-slate-400 dark:text-slate-500"
                        >
                          {searchQuery
                            ? "No accounts matched your search query."
                            : "No registered trainees found."}
                        </td>
                      </tr>
                    </tbody>
                  )}
                </table>
              </div>
            )}
          </div>
        );
      }

      // --- COORDINATORS TAB ---
      function CoordinatorsTab({ showMessage }) {
        const [coordinators, setCoordinators] = useState([]);
        const [loading, setLoading] = useState(false);
        const [availableCompanies, setAvailableCompanies] = useState([]);
        const [availableICs, setAvailableICs] = useState([]);

        // Search & Edit States
        const [searchTerm, setSearchTerm] = useState("");
        const [editingCoord, setEditingCoord] = useState(null);

        const [newCoord, setNewCoord] = useState({
          name: "",
          email: "",
          company: "",
          role: "Company HR",
          assignedIC: "",
          tempPassword: generatePassword(),
        });

        useEffect(() => {
          const coordRef = collection(
            db,
            "artifacts",
            appId,
            "public",
            "data",
            "coordinators",
          );
          const unsubscribe = onSnapshot(coordRef, (snapshot) => {
            setCoordinators(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })),
            );
          });

          const traineesRef = collection(
            db,
            "artifacts",
            appId,
            "public",
            "data",
            "trainees",
          );
          const unsubTrainees = onSnapshot(traineesRef, (snapshot) => {
            const companies = [
              ...new Set(
                snapshot.docs.map((doc) => doc.data().company).filter(Boolean),
              ),
            ].sort();
            setAvailableCompanies(companies);

            const ics = [
              ...new Set(
                snapshot.docs
                  .map((doc) => doc.data().assignedIC)
                  .filter(Boolean),
              ),
            ].sort();
            setAvailableICs(ics);
          });

          return () => {
            unsubscribe();
            unsubTrainees();
          };
        }, []);

        const handleAdd = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const secondaryApp = initializeApp(
              app.options,
              `TempApp-${Date.now()}`,
            );
            const secondaryAuth = getAuth(secondaryApp);

            const userCredential = await createUserWithEmailAndPassword(
              secondaryAuth,
              newCoord.email,
              newCoord.tempPassword,
            );
            const newUid = userCredential.user.uid;

            await signOut(secondaryAuth);
            await deleteApp(secondaryApp);

            const coordData = {
              name: newCoord.name,
              email: newCoord.email,
              role: newCoord.role,
              company:
                newCoord.role === "Company HR" ? newCoord.company : "Dualtech",
              assignedIC:
                newCoord.role === "Industrial Coordinator"
                  ? newCoord.assignedIC
                  : null,
              status: "Active",
              dateAdded: new Date().toISOString(),
            };

            await setDoc(
              doc(
                db,
                "artifacts",
                appId,
                "public",
                "data",
                "coordinators",
                newUid,
              ),
              {
                ...coordData,
                tempPassword: newCoord.tempPassword, // Only save temp pass in artifacts
              },
            );

            await setDoc(doc(db, "users", newUid), {
              ...coordData,
              role:
                newCoord.role === "Company HR" ? "COMPANY_HR" : newCoord.role,
              createdAt: new Date().toISOString(),
            });

            showMessage(`${newCoord.role} added successfully!`);
            setNewCoord({
              name: "",
              email: "",
              company: "",
              role: "Company HR",
              assignedIC: "",
              tempPassword: generatePassword(),
            });
          } catch (err) {
            showMessage("Error adding account: " + err.message, "error");
          }
          setLoading(false);
        };

        const handleDelete = async (id) => {
          if (
            window.confirm(
              "Are you sure you want to remove this account from the database? (Note: You may also need to delete them from the Firebase Auth console)",
            )
          ) {
            await deleteDoc(
              doc(db, "artifacts", appId, "public", "data", "coordinators", id),
            );
            try {
              await deleteDoc(doc(db, "users", id));
            } catch (e) {}
            showMessage("Account removed successfully");
          }
        };

        const handleEditSubmit = async (e) => {
          e.preventDefault();
          try {
            const updatedData = {
              name: editingCoord.name,
              role: editingCoord.role,
              company:
                editingCoord.role === "Company HR"
                  ? editingCoord.company
                  : "Dualtech",
              assignedIC:
                editingCoord.role === "Industrial Coordinator"
                  ? editingCoord.assignedIC
                  : null,
            };

            await updateDoc(
              doc(
                db,
                "artifacts",
                appId,
                "public",
                "data",
                "coordinators",
                editingCoord.id,
              ),
              updatedData,
            );
            await updateDoc(doc(db, "users", editingCoord.id), {
              ...updatedData,
              role:
                updatedData.role === "Company HR"
                  ? "COMPANY_HR"
                  : updatedData.role,
            });

            setEditingCoord(null);
            showMessage("Account updated successfully!");
          } catch (err) {
            showMessage("Error updating account.", "error");
          }
        };

        const handlePasswordReset = async (email) => {
          try {
            await sendPasswordResetEmail(auth, email);
            showMessage(`Password reset email sent to ${email}`);
          } catch (err) {
            showMessage("Error sending reset email: " + err.message, "error");
          }
        };

        // --- FILTERING & GROUPING LOGIC ---
        const filteredCoords = coordinators.filter((c) => {
          const search = searchTerm.toLowerCase();
          return (
            (c.name || "").toLowerCase().includes(search) ||
            (c.email || "").toLowerCase().includes(search) ||
            (c.role || "").toLowerCase().includes(search) ||
            (c.company || "").toLowerCase().includes(search) ||
            (c.assignedIC || "").toLowerCase().includes(search)
          );
        });

        // Group by Role and then by Company
        const groupedHR = {}; // { "Company A": [coord1, coord2] }
        const groupedIC = []; // [coord1, coord2]

        filteredCoords.forEach((c) => {
          if (c.role === "Company HR") {
            const comp = c.company || "Unassigned Company";
            if (!groupedHR[comp]) groupedHR[comp] = [];
            groupedHR[comp].push(c);
          } else {
            groupedIC.push(c);
          }
        });

        return (
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 relative">
            <div className="border-b border-slate-100 dark:border-slate-700 pb-4 md:pb-6 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <h2 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <Briefcase className="text-blue-600" /> HR & Coordinators

      // --- GEOFENCE TAB ---

      function GeofenceSettingsTab({ showMessage }) {
        const [geofences, setGeofences] = useState([]);
        const [availableCompanies, setAvailableCompanies] = useState([]);
        const [newLocation, setNewLocation] = useState({
          company: "",
          label: "",
          latitude: "",
          longitude: "",
          radius: "500",
        });

        // NEW: State for the search bar
        const [searchTerm, setSearchTerm] = useState("");

        useEffect(() => {
          const unsubscribeLocs = onSnapshot(
            collection(db, "artifacts", appId, "public", "data", "geofences"),
            (snapshot) => {
              setGeofences(
                snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })),
              );
            },
          );

          const unsubscribeTrainees = onSnapshot(
            collection(db, "artifacts", appId, "public", "data", "trainees"),
            (snapshot) => {
              const companies = [
                ...new Set(
                  snapshot.docs
                    .map((doc) => doc.data().company)
                    .filter(Boolean),
                ),
              ].sort();
              setAvailableCompanies(companies);
            },
          );

          return () => {
            unsubscribeLocs();
            unsubscribeTrainees();
          };
        }, []);

        const handleAdd = async (e) => {
          e.preventDefault();
          try {
            await setDoc(
              doc(
                collection(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "geofences",
                ),
              ),
              {
                ...newLocation,
                latitude: parseFloat(newLocation.latitude),
                longitude: parseFloat(newLocation.longitude),
                radius: parseInt(newLocation.radius),
              },
            );
            showMessage("Location added");
            setNewLocation({
              ...newLocation,
              label: "",
              latitude: "",
              longitude: "",
            });
          } catch (err) {
            showMessage("Error adding location", "error");
          }
        };

        const handleDelete = async (id) => {
          if (window.confirm("Remove this geofence marker?"))
            await deleteDoc(
              doc(db, "artifacts", appId, "public", "data", "geofences", id),
            );
        };

        // NEW: Filter and group the geofences
        const filteredGeofences = geofences.filter(
          (g) =>
            (g.company || "")
              .toLowerCase()
              .includes(searchTerm.toLowerCase()) ||
            (g.label || "").toLowerCase().includes(searchTerm.toLowerCase()),
        );

        const groupedGeofences = filteredGeofences.reduce((groups, loc) => {
          const company = loc.company || "Unknown Company";
          if (!groups[company]) groups[company] = [];
          groups[company].push(loc);
          return groups;
        }, {});

        return (
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700">
            <div className="border-b border-slate-100 dark:border-slate-700 pb-4 md:pb-6 mb-6">
              <h2 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <MapPin className="text-green-600" /> Geofence Settings
              </h2>
            </div>

            <form
              onSubmit={handleAdd}
              className="bg-slate-50 dark:bg-slate-900/50 p-5 md:p-6 rounded-2xl border border-slate-200 dark:border-slate-700 mb-8 grid grid-cols-1 md:grid-cols-5 gap-4"
            >
              <div className="md:col-span-2">
                <input
                  type="text"
                  list="geofence-companies"
                  className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                  placeholder="Company Name"
                  value={newLocation.company}
                  onChange={(e) =>
                    setNewLocation({ ...newLocation, company: e.target.value })
                  }
                  required
                />
                <datalist id="geofence-companies">
                  {availableCompanies.map((c, i) => (
                    <option key={i} value={c} />
                  ))}
                </datalist>
              </div>
              <input
                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 md:col-span-3"
                placeholder="Branch / Label (e.g. Main Plant)"
                value={newLocation.label}
                onChange={(e) =>
                  setNewLocation({ ...newLocation, label: e.target.value })
                }
                required
              />
              <input
                type="number"
                step="any"
                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 md:col-span-2"
                placeholder="Latitude"
                value={newLocation.latitude}
                onChange={(e) =>
                  setNewLocation({ ...newLocation, latitude: e.target.value })
                }
                required
              />
              <input
                type="number"
                step="any"
                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 md:col-span-2"
                placeholder="Longitude"
                value={newLocation.longitude}
                onChange={(e) =>
                  setNewLocation({ ...newLocation, longitude: e.target.value })
                }
                required
              />
              <input
                type="number"
                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700"
                placeholder="Radius (m)"
                value={newLocation.radius}
                onChange={(e) =>
                  setNewLocation({ ...newLocation, radius: e.target.value })
                }
                required
              />
              <div className="md:col-span-5 mt-2">
                <button
                  type="submit"
                  className="w-full lg:w-auto bg-green-600 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-green-700 transition-colors"
                >
                  Add Location Marker
                </button>
              </div>
            </form>

            {/* NEW: Search Bar */}
            <div className="mb-6 relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <Search
                  size={18}
                  className="text-slate-400 dark:text-slate-500"
                />
              </div>
              <input
                type="text"
                className="w-full p-3 pl-10 rounded-xl border border-slate-200 dark:border-slate-700 outline-none focus:border-green-500"
                placeholder="Search defined locations by company or label..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>

            {/* NEW: Grouped Rendering */}
            <div className="space-y-6">
              {Object.keys(groupedGeofences)
                .sort()
                .map((companyName) => (
                  <div
                    key={companyName}
                    className="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm"
                  >
                    <div className="bg-slate-200 px-5 py-3 font-black text-slate-800 dark:text-white text-lg flex items-center justify-between">
                      {companyName}
                      <span className="text-xs font-bold text-slate-500 dark:text-slate-500 bg-white dark:bg-slate-800 px-2 py-1 rounded-md">
                        {groupedGeofences[companyName].length} location(s)
                      </span>
                    </div>
                    <div className="p-4 space-y-3">
                      {groupedGeofences[companyName].map((loc) => (
                        <div
                          key={loc.id}
                          className="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl p-4 flex justify-between items-center hover:shadow-md transition-shadow"
                        >
                          <div>
                            <div className="font-bold text-slate-800 dark:text-white">
                              {loc.label}
                            </div>
                            <div className="text-xs text-slate-500 dark:text-slate-500 font-mono mt-1 break-all">
                              Lat: {loc.latitude} | Lng: {loc.longitude} | Rad:{" "}
                              {loc.radius}m
                            </div>
                          </div>
                          <button
                            onClick={() => handleDelete(loc.id)}
                            className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors ml-4 shrink-0"
                            title="Delete Location"
                          >
                            <Trash2 size={18} />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              {Object.keys(groupedGeofences).length === 0 && (
                <div className="text-center p-10 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 font-medium">
                  No geofence locations found.
                </div>
              )}
            </div>
          </div>
        );
      }
