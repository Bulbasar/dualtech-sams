                  iptEnd: d["IPT Date End"] || d.iptDateEnd || "",
                  status: String(d.Status || d.status || "Unknown").trim(),
                  meritPoints: parseInt(d.meritPoints || 0),
                  meritHistory: d.meritHistory || [], // NEW: Fetch History Array
                };
              });
              setTrainees(
                data.sort((a, b) => a.lastName.localeCompare(b.lastName)),
              );
              setLoading(false);
            },
          );
          return () => unsubscribe();
        }, []);

        const uniqueStatuses = [
          "All",
          ...new Set(trainees.map((t) => t.status).filter(Boolean)),
        ].sort();

        // 2. Filter & Group Data
        const filteredTrainees = trainees.filter((t) => {
          const matchesSearch =
            t.studentId.toLowerCase().includes(searchTerm.toLowerCase()) ||
            `${t.firstName} ${t.lastName}`
              .toLowerCase()
              .includes(searchTerm.toLowerCase()) ||
            t.company.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesStatus =
            statusFilter === "All" ||
            t.status.toLowerCase() === statusFilter.toLowerCase();
          return matchesSearch && matchesStatus;
        });

        const groupedTrainees = filteredTrainees.reduce((acc, t) => {
          if (!acc[t.company]) acc[t.company] = [];
          acc[t.company].push(t);
          return acc;
        }, {});

        const handleToggleTrainee = (id) =>
          setSelectedTrainees((prev) =>
            prev.includes(id)
              ? prev.filter((tid) => tid !== id)
              : [...prev, id],
          );

        const handleToggleCompany = (company) => {
          const companyIds = groupedTrainees[company].map((t) => t.id);
          const allSelected = companyIds.every((id) =>
            selectedTrainees.includes(id),
          );
          if (allSelected) {
            setSelectedTrainees((prev) =>
              prev.filter((id) => !companyIds.includes(id)),
            );
          } else {
            setSelectedTrainees((prev) => [
              ...new Set([...prev, ...companyIds]),
            ]);
          }
        };

        // 3. Handle Updates with Remarks
        const handleBulkAddPoints = async (e) => {
          e.preventDefault();
          if (selectedTrainees.length === 0)
            return showMessage("Please select at least one trainee.", "error");
          const pts = parseInt(pointsInput);
          if (isNaN(pts))
            return showMessage("Enter a valid number for points.", "error");

          // NEW: Ask for a remark/reason
          const remark = window.prompt(
            `Applying ${pts} points to ${selectedTrainees.length} trainees. Please enter a remark/reason (e.g. "Perfect Attendance", "Late penalty"):`,
          );
          if (!remark)
            return showMessage(
              "Update cancelled. A remark is required.",
              "error",
            );

          try {
            await Promise.all(
              selectedTrainees.map(async (id) => {
                const trainee = trainees.find((t) => t.id === id);
                const current = trainee ? trainee.meritPoints : 0;
                const newTotal = current + pts;

                // NEW: Create Log Entry
                const logEntry = {
                  date: new Date().toLocaleDateString(),
                  timestamp: Date.now(),
                  change: pts > 0 ? `+${pts}` : `${pts}`,
                  newTotal: newTotal,
                  remark: remark,
                };

                await updateDoc(
                  doc(db, "artifacts", appId, "public", "data", "trainees", id),
                  {
                    meritPoints: newTotal,
                    meritHistory: [...(trainee.meritHistory || []), logEntry],
                  },
                );
              }),
            );
            showMessage(`Successfully applied ${pts} points.`);
            setSelectedTrainees([]);
            setPointsInput("");
          } catch (err) {
            showMessage("Error assigning points: " + err.message, "error");
          }
        };

        const handleEditSingle = async (trainee) => {
          const newVal = window.prompt(
            `Set exact total merit points for ${trainee.firstName} ${trainee.lastName}:`,
            trainee.meritPoints,
          );
          if (newVal === null || newVal.trim() === "") return;
          const pts = parseInt(newVal);
          if (isNaN(pts))
            return showMessage("Please enter a valid number.", "error");

          const remark = window.prompt(
            `Reason for manually changing points to ${pts}?`,
          );
          if (!remark)
            return showMessage(
              "Update cancelled. A remark is required.",
              "error",
            );

          const difference = pts - trainee.meritPoints;
          const logEntry = {
            date: new Date().toLocaleDateString(),
            timestamp: Date.now(),
            change:
              difference >= 0
                ? `+${difference} (Manual Set)`
                : `${difference} (Manual Set)`,
            newTotal: pts,
            remark: remark,
          };

          try {
            await updateDoc(
              doc(
                db,
                "artifacts",
                appId,
                "public",
                "data",
                "trainees",
                trainee.id,
              ),
              {
                meritPoints: pts,
                meritHistory: [...(trainee.meritHistory || []), logEntry],
              },
            );
            showMessage("Merit points updated successfully.");
          } catch (err) {
            showMessage("Error updating points.", "error");
          }
        };

        if (loading)
          return (
            <div className="p-10 flex justify-center text-amber-500">
              <Loader2 className="animate-spin" size={32} />
            </div>
          );

        return (
          <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 relative">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-100 dark:border-slate-700 pb-4 md:pb-6 mb-6 gap-4">
              <h2 className="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <Award className="text-amber-500" /> Manage Merit Points
              </h2>
              <div className="flex gap-2 items-center">
                <span className="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-full text-sm">
                  {selectedTrainees.length} Selected
                </span>
                {selectedTrainees.length > 0 && (
                  <button
                    onClick={() => setSelectedTrainees([])}
                    className="text-xs text-slate-500 dark:text-slate-500 hover:text-red-500 font-bold"
                  >
                    Clear All
                  </button>
                )}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
              <div className="relative">
                <Search
                  className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"
                  size={18}
                />
                <input
                  type="text"
                  placeholder="Search ID, Name, or Company..."
                  className="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-amber-500 transition-colors"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>
              <div>
                <select
                  className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-amber-500 transition-colors font-medium text-slate-700 dark:text-slate-200"
                  value={statusFilter}
                  onChange={(e) => setStatusFilter(e.target.value)}
                >
                  {uniqueStatuses.map((status) => (
                    <option key={status} value={status}>
                      {status === "All" ? "Filter by Status: All" : status}
                    </option>
                  ))}
                </select>
              </div>
              <form onSubmit={handleBulkAddPoints} className="flex gap-2">
                <input
                  type="number"
                  placeholder="Points (+ or -)"
                  className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-amber-500 transition-colors"
                  value={pointsInput}
                  onChange={(e) => setPointsInput(e.target.value)}
                  required
                />
                <button
                  type="submit"
                  className="bg-amber-500 text-white font-bold px-6 py-3 rounded-xl hover:bg-amber-600 transition-colors shrink-0 shadow-sm active:scale-95 text-sm lg:text-base"
                >
                  Apply
                </button>
              </form>
            </div>

            <div className="space-y-6">
              {Object.keys(groupedTrainees)
                .sort()
                .map((company) => (
                  <div
                    key={company}
                    className="border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-slate-800 shadow-sm"
                  >
                    <div className="bg-slate-100 dark:bg-slate-900 px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                      <div className="font-bold text-slate-800 dark:text-white flex items-center gap-3">
                        <input
                          type="checkbox"
                          className="w-4 h-4 cursor-pointer accent-blue-600"
                          checked={groupedTrainees[company].every((t) =>
                            selectedTrainees.includes(t.id),
                          )}
                          onChange={() => handleToggleCompany(company)}
                        />
                        {company}{" "}
                        <span className="text-xs bg-slate-200 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full">
                          {groupedTrainees[company].length}
                        </span>
                      </div>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-500 font-bold border-b border-slate-200 dark:border-slate-700">
                          <tr>
                            <th className="p-3 w-10 text-center"></th>
                            <th className="p-3">Student ID</th>
                            <th className="p-3">Full Name</th>
                            <th className="p-3">Status</th>
                            <th className="p-3 text-center">Merit Points</th>
                            <th className="p-3 text-center">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                          {groupedTrainees[company].map((t) => (
                            <tr
                              key={t.id}
                              className="hover:bg-slate-50 dark:hover:bg-slate-700/50 dark:bg-slate-900/50 transition-colors"
                            >
                              <td className="p-3 text-center">
                                <input
                                  type="checkbox"
                                  className="w-4 h-4 cursor-pointer accent-blue-600"
                                  checked={selectedTrainees.includes(t.id)}
                                  onChange={() => handleToggleTrainee(t.id)}
                                />
                              </td>
                              <td className="p-3 font-mono text-slate-500 dark:text-slate-500">
                                {t.studentId}
                              </td>
                              <td className="p-3 font-bold text-slate-800 dark:text-white">
                                {t.lastName}, {t.firstName}
                              </td>
                              <td className="p-3">
                                <span
                                  className={`px-2 py-1 rounded-md text-[11px] uppercase tracking-wider font-bold ${t.status.toLowerCase() === "active" ? "bg-green-100 text-green-700" : "bg-slate-200 text-slate-600"}`}
                                >
                                  {t.status}
                                </span>
                              </td>
                              <td className="p-3 text-center font-black text-amber-600 text-base">
                                {t.meritPoints}
                              </td>
                              <td className="p-3 text-center flex items-center justify-center gap-1">
                                <button
                                  onClick={() => handleEditSingle(t)}
                                  className="text-blue-500 hover:bg-blue-50 p-2 rounded-lg transition-colors"
                                  title="Edit exact points"
                                >
                                  <Edit size={16} />
                                </button>
                                <button
                                  onClick={() => setHistoryModal(t)}
                                  className="text-slate-500 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700/50 dark:bg-slate-900 p-2 rounded-lg transition-colors"
                                  title="View History"
                                >
                                  <History size={16} />
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ))}
              {Object.keys(groupedTrainees).length === 0 && (
                <div className="text-center p-10 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 font-medium">
                  No trainees found matching your search.
                </div>
              )}
            </div>

            {/* NEW: MERIT HISTORY MODAL */}
            {historyModal && (
              <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in">
                  <div className="p-5 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                    <div>
                      <h3 className="font-black text-slate-800 dark:text-white text-lg flex items-center gap-2">
                        <History className="text-amber-500" /> Merit History
                      </h3>
                      <p className="text-sm text-slate-500 dark:text-slate-500">
                        {historyModal.firstName} {historyModal.lastName} (
                        {historyModal.studentId})
                      </p>
                    </div>
                    <button
                      onClick={() => setHistoryModal(null)}
                      className="p-2 text-slate-400 dark:text-slate-500 hover:bg-slate-200 rounded-full"
                    >
                      <X size={20} />
                    </button>
                  </div>
                  <div className="p-5 max-h-[60vh] overflow-y-auto bg-white dark:bg-slate-800 space-y-3">
                    {historyModal.meritHistory.length === 0 ? (
                      <p className="text-center text-slate-400 dark:text-slate-500 italic py-6">
                        No merit point history found for this trainee.
                      </p>
                    ) : (
                      [...historyModal.meritHistory].reverse().map((log, i) => (
                        <div
                          key={i}
                          className="p-4 border border-slate-100 dark:border-slate-700 rounded-2xl bg-slate-50 dark:bg-slate-900/50 flex justify-between items-center"
                        >
                          <div>
                            <p className="font-bold text-slate-800 dark:text-white text-sm mb-1">
                              {log.remark}
                            </p>
                            <p className="text-xs text-slate-500 dark:text-slate-500 font-medium">
                              {log.date} at{" "}
                              {new Date(log.timestamp).toLocaleTimeString()}
                            </p>
                          </div>
                          <div className="text-right shrink-0 ml-4">
                            <span
                              className={`block font-black text-sm ${log.change.includes("+") ? "text-green-600" : "text-red-600"}`}
                            >
                              {log.change}
                            </span>
                            <span className="text-[10px] text-slate-500 dark:text-slate-500 font-bold uppercase tracking-wider">
                              Total: {log.newTotal}
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // --- TRAINEES TAB (WITH GOOGLE SHEETS SYNC) ---
      function TraineesTab({ showMessage }) {
        const [sheetUrl, setSheetUrl] = useState("");
        const [uploading, setUploading] = useState(false);
        const [validationError, setValidationError] = useState("");
        const [progress, setProgress] = useState({ total: 0, current: 0 });
        const [syncLogs, setSyncLogs] = useState([]);

        const terminalEndRef = useRef(null);

        // Keep required headers minimal so the sync doesn't fail if a minor column is accidentally deleted
        const REQUIRED_HEADERS = ["Student ID#", "Family", "Given"];

        const addLog = (message, type = "info") => {
          const time = new Date().toLocaleTimeString([], { hour12: false });
          setSyncLogs((prev) => [...prev, { time, message, type }]);
        };

        useEffect(() => {
          if (terminalEndRef.current) {
            terminalEndRef.current.scrollIntoView({ behavior: "smooth" });
          }
        }, [syncLogs]);

        const handleSync = async () => {
          if (!sheetUrl.trim()) {
            setValidationError("Please paste the Google Sheet URL first.");
            return;
          }

          const match = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (!match) {
            setValidationError(
              "Invalid URL format. Could not find the Spreadsheet ID.",
            );
            return;
          }

          const sheetId = match[1];
          setUploading(true);
          setValidationError("");
          setProgress({ total: 0, current: 0 });
          setSyncLogs([]);

          addLog(`Connecting to Google Sheets...`, "info");
          addLog(`Extracted Sheet ID: ${sheetId}`, "info");
          const sheetName = "Extract_SIMS";
          const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

          addLog(`Downloading data from sheet "Extract_SIMS"...`, "info");
          window.Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: async (results) => {
              const data = results.data;
              if (!data || data.length === 0) {
                addLog(
                  "The Google Sheet is empty or could not be read.",
                  "error",
                );
                setValidationError("The Google Sheet is empty.");
                setUploading(false);
                return;
              }

              if (
                data[0] &&
                Object.keys(data[0])[0]
                  .toLowerCase()
                  .includes("<!doctype html>")
              ) {
                addLog(
                  "Access Denied! Make sure the Google Sheet is set to 'Anyone with the link can view'.",
                  "error",
                );
                setValidationError(
                  "Access Denied! Ensure Link Sharing is set to Public.",
                );
                setUploading(false);
                return;
              }

              addLog(
                `Found ${data.length} total rows. Validating required headers...`,
                "info",
              );

              const normalizeHeader = (str) =>
                str ? str.toLowerCase().replace(/[^a-z0-9]/g, "") : "";
              const actualHeaders = Object.keys(data[0]);
              const missingHeaders = REQUIRED_HEADERS.filter(
                (h) =>
                  !actualHeaders.some(
                    (ah) => normalizeHeader(ah) === normalizeHeader(h),
                  ),
              );

              if (missingHeaders.length > 0) {
                const errMsg = `Missing headers: ${missingHeaders.join(", ")}`;
                addLog(errMsg, "error");
                setValidationError(errMsg);
                setUploading(false);
                return;
              }

              addLog(
                "Header validation passed. Fetching existing database to preserve trainee history...",
                "info",
              );
              let existingMap = new Map();
              try {
                const snap = await getDocs(
                  collection(
                    db,
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "trainees",
                  ),
                );
                snap.forEach((doc) => existingMap.set(doc.id, doc.data()));
                addLog(
                  `Loaded ${existingMap.size} existing profiles for comparison.`,
                  "success",
                );
              } catch (e) {
                addLog(
                  `Warning: Could not fetch existing profiles. History may not be preserved. ${e.message}`,
                  "warning",
                );
              }

              addLog("Preparing database batches...", "info");
              try {
                const total = data.length;
                setProgress({ total, current: 0 });
                let processed = 0;
                const BATCH_SIZE = 100;

                for (let i = 0; i < total; i += BATCH_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = data.slice(i, i + BATCH_SIZE);

                  addLog(
                    `Processing batch ${Math.floor(i / BATCH_SIZE) + 1} (${chunk.length} records)...`,
                    "info",
                  );

                  chunk.forEach((row) => {
                    const getField = (target) => {
                      const normTarget = normalizeHeader(target);
                      for (const [key, value] of Object.entries(row)) {
                        if (normalizeHeader(key) === normTarget)
                          return value === undefined ? "" : value;
                      }
                      return "";
                    };

                    const rawId = getField("Student ID#");
                    if (!rawId) return;

                    const safeId = String(rawId)
                      .replace(/[\/\\]/g, "-")
                      .trim();
                    if (!safeId) return;

                    const traineeRef = doc(
                      db,
                      "artifacts",
                      appId,
                      "public",
                      "data",
                      "trainees",
                      safeId,
                    );

                    const cleanRow = {};
                    for (const [key, value] of Object.entries(row)) {
                      let cleanKey = key
                        ? key
                            .replace(/[\.\/\\~\[\]\*]/g, "")
                            .replace(/[\r\n]+/g, " ")
                            .replace(/\s+/g, " ")
                            .trim()
                        : "";
                      if (!cleanKey) cleanKey = "Unknown_Column";
                      cleanRow[cleanKey] = value === undefined ? "" : value;
                    }

                    const existing = existingMap.get(safeId);
                    let placementHistory = existing?.placementHistory || [];
                    let statusHistory = existing?.statusHistory || []; // NEW HISTORICAL TRACKING

                    const newCompany = String(getField("Company Name")).trim();
                    const oldCompany = (existing?.company || "").trim();

                    // Keep original placement history logic intact
                    if (
                      oldCompany &&
                      newCompany &&
                      oldCompany.toLowerCase() !== newCompany.toLowerCase()
                    ) {
                      placementHistory.push({
                        company: oldCompany,
                        iptDateStart:
                          existing?.iptDateStart ||
                          existing?.["IPT Date Start"] ||
                          "",
                        iptDateEnd:
                          existing?.iptDateEnd ||
                          existing?.["IPT Date End"] ||
                          "",
                        assignedIC:
                          existing?.assignedIC ||
                          existing?.["Assigned IC"] ||
                          "",
                        archivedAt: new Date().toISOString(),
                      });
                      addLog(
                        `Company change detected for ID: ${safeId}. Preserved old placement to history.`,
                        "info",
                      );
                    }

                    // --- NEW: STRATEGY 3 STATUS/IC/COMPANY HISTORY TRACKING ---
                    const newStatus = String(
                      getField("Status") || "Active",
                    ).trim();
                    const oldStatus = (
                      existing?.status ||
                      existing?.Status ||
                      "Active"
                    ).trim();
                    const newIC = String(getField("Assigned IC")).trim();
                    const oldIC = (
                      existing?.assignedIC ||
                      existing?.["Assigned IC"] ||
                      ""
                    ).trim();

                    if (existing) {
                      if (
                        oldStatus !== newStatus ||
                        oldCompany !== newCompany ||
                        oldIC !== newIC
                      ) {
                        let changeNotes = [];
                        if (oldStatus !== newStatus)
                          changeNotes.push(
                            `Status: ${oldStatus} -> ${newStatus}`,
                          );
                        if (oldCompany !== newCompany)
                          changeNotes.push(
                            `Company: ${oldCompany || "None"} -> ${newCompany || "None"}`,
                          );
                        if (oldIC !== newIC)
                          changeNotes.push(
                            `IC: ${oldIC || "None"} -> ${newIC || "None"}`,
                          );

                        statusHistory.push({
                          date: new Date().toLocaleDateString(),
                          timestamp: Date.now(),
                          updatedBy: "System Admin (GSheets Sync)",
                          status: newStatus,
                          company: newCompany,
                          assignedIC: newIC,
                          remarks: changeNotes.join(" | "),
                        });
                        addLog(
                          `Updating [${safeId}] - Changes tracked: ${changeNotes.join(", ")}`,
                          "warning",
                        );
                      }
                    } else {
                      // Brand new trainee
                      statusHistory.push({
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now(),
                        updatedBy: "System Admin (GSheets Sync)",
                        status: newStatus,
                        company: newCompany,
                        assignedIC: newIC,
                        remarks: "Initial Sync Upload",
                      });
                      addLog(`Adding new student [${safeId}]`, "success");
                    }

                    // --- EXTENSIVE MAPPING TO NEW STANDARDIZED FIELDS ---
                    batch.set(
                      traineeRef,
                      {
                        ...cleanRow,

                        // Identity & Basic Info
                        studentId: String(rawId),
                        lastName: String(getField("Family")),
                        firstName: String(getField("Given")),
                        middleName: String(getField("Middle")),
                        suffix: String(getField("Suffix")),
                        dateEnrolled: String(getField("Date Enrolled")),

                        // Address & Demographics
                        addressStreet: String(
                          getField("House Number, Street, Phase, Sitio"),
                        ),
                        addressBrgy: String(getField("Brgy.")),
                        addressTown: String(getField("Town")),
                        addressProvince: String(getField("Province")),
                        contactNo: String(getField("Contact No.")),
                        birthday: String(getField("Birthday")),
                        placeOfBirth: String(getField("Place of Birth")),
                        age: String(getField("Age")),
                        height: String(getField("Height")),
                        weight: String(getField("Weight")),
                        religion: String(getField("Religion")),
                        civilStatus: String(getField("CivilStatus")),
                        emailAddress: String(getField("EmailAddress")),

                        // Family Background
                        fatherName: String(getField("Father's Name")),
                        fatherEmployment: String(
                          getField("Father's Employment"),
                        ),
                        fatherContactNo: String(
                          getField("Father's Contact No"),
                        ),
                        fatherEdu: String(
                          getField("Father's Educational Background"),
                        ),

                        yearGraduate: String(getField("Year Graduate")),
                        referral: String(getField("Referral")),
                        level: String(getField("Level")),
                        section: String(getField("Section")),

                        // OJT / Dualtech Details
                        status: String(getField("Status") || "Active"),
                        immersionDateStart: String(

                        ),
                        immersionDateEnd: String(
                          getField("immersion Date End"),
                        ),
                        bstpActivationDate: String(
                          getField("BSTP Activation Date"),
                        ),
                        bstpDateEnd: String(getField("BSTP Date End")),
                        iptDateStart: String(getField("IPT Date Start")),
                        iptDateEnd: String(getField("IPT Date End")),
                        astpActivationDate: String(
                          getField("ASTP Activation Date"),
                        ),

                        company: newCompany,
                        assignedIC: String(getField("Assigned IC")),

                        // Contacts
                        contactPerson: String(
                          getField("Contact Person") ||
                            getField("Guardian Name"),
                        ),
                        contactPersonNo: String(
                          getField("Contact Person No") ||
                            getField("Guardian ContactNo"),

                        guardianRelationship: String(

                          mfMsp: String(getField("MF-MSP")),
                          xfBasic: String(getField("XF-Basic")),
                          xfPower: String(getField("XF-Power")),
                          xfDigital: String(getField("XF-Digital")),
                          efEwp: String(getField("EF-EWP")),
                          efMm: String(getField("EF-MM")),
                          efMc: String(getField("EF-MC")),
                          tfMeasuring: String(getField("TF-Measuring")),
                          tfTd: String(getField("TF-TD")),
                          bcd: String(getField("BCD")),
                          pdc: String(getField("PDC")),
                        },

                        // Merits & Requirements
                        bstpMerit: String(getField("BSTP Merit")),
                        astpMerit: String(getField("ASTP Merit")),
                        requirements: {
                          cardForm137Tor: String(getField("Card/Form137/TOR")),
                          diploma: String(getField("Diploma")),

                        sponsor: String(getField("Sponsor")),
                        placementHistory: placementHistory,
                        statusHistory: statusHistory, // Injecting the new tracking array!
                        lastUpdated: new Date().toISOString(),
                      },
                      { merge: true },
                    );
                  });

                  await Promise.race([
                    batch.commit(),
                    new Promise((_, reject) =>
                      setTimeout(
                        () =>
                          reject(
                            new Error(
                              "Network timeout: Firebase connection blocked. If this persists, please turn off AdBlockers/VPNs.",
                            ),
                          ),
                        60000,
                      ),
                    ),
                  ]);
                  processed += chunk.length;
                  setProgress({ total, current: processed });
                  await new Promise((resolve) => setTimeout(resolve, 200));
                }

                addLog(
                  `Synchronization completed! All ${total} records are up to date.`,
                  "success",
                );
                showMessage("All records synced successfully!");
                setSheetUrl("");
                
                try {

        return (

                >

                    <RefreshCw className="animate-spin" size={18} />

                    <Activity size={18} />

                  {validationError}
                </div>
              )}

            <div className="bg-slate-900 rounded-2xl overflow-hidden shadow-inner border border-slate-800 w-full">

                    {Math.round((progress.current / progress.total) * 100)}%

                    }}

              <div className="p-4 h-[300px] md:h-[400px] overflow-y-auto sync-terminal font-mono text-[10px] md:text-sm leading-relaxed break-words w-full">
                {syncLogs.length === 0 ? (

                                            ${log.type === "error" ? "text-red-400 font-bold" : ""}
                                            ${log.type === "success" ? "text-green-400" : ""}

                                            ${log.type === "info" ? "text-slate-300" : ""}
                                        `}
                      >
                        {log.message}
                      </span>
                    </div>
                  ))
                )}
                <div ref={terminalEndRef} />
              </div>

              {progress.current > 0 &&
                progress.current === progress.total &&
                !uploading && (

      // --- COMPANY ATTENDANCE SETTINGS TAB ---
      function CompanyAttendanceSettingsTab({ showMessage }) {

            appId,
            "public",
            "data",
            "trainees",

          const settingsRef = collection(
            db,
            "artifacts",
            appId,
            "public",
            "data",
            "company_settings",

          const globalHolidaysRef = doc(
            db,
            "artifacts",
            appId,
            "public",
            "data",
            "settings",
            "globalHolidays",

          const unsubTrainees = onSnapshot(traineesRef, (snap) => {

              ...new Set(
                snap.docs.map((doc) => doc.data().company).filter(Boolean),
              ),
            ].sort();
            setCompanies(uniqueCompanies);
          });

          const unsubSettings = onSnapshot(settingsRef, (snap) => {
            const currentSettings = {};
            snap.docs.forEach((doc) => {
              currentSettings[doc.id] = doc.data();
            });
            setSettings(currentSettings);
            setLoading(false);
          });

          const unsubHolidays = onSnapshot(globalHolidaysRef, (docSnap) => {
            if (docSnap.exists()) {
              setGlobalHolidays(docSnap.data().holidays || []);
              setHolidayLastUpdated(docSnap.data().updatedAt || "");

              // If they synced before, auto-fill the URL box so they don't have to paste it again
              if (docSnap.data().sheetUrl) {
                setSheetUrl(docSnap.data().sheetUrl);
              }
            }
          });

          return () => {
            unsubTrainees();
            unsubSettings();
            unsubHolidays();
          };

        const handleUpdateSetting = async (companyName, field, value) => {
          try {
            const docRef = doc(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "company_settings",
              companyName,
            );
            await setDoc(
              docRef,
              { [field]: value, updatedAt: new Date().toISOString() },
              { merge: true },
            );
            showMessage(`Updated ${companyName} settings.`);
          } catch (err) {
            showMessage("Error updating setting: " + err.message, "error");
          }
        };

        // NEW: Extract ID from pasted URL and sync
        const handleSyncHolidays = () => {
          if (!sheetUrl.trim()) {
            return showMessage(
              "Please paste a Google Sheet URL first.",
              "error",
            );
          }

          // Extract the Sheet ID from standard Google Sheet URLs
          const match = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
          const extractedSheetId = match ? match[1] : null;

          if (!extractedSheetId) {
            return showMessage(
              "Invalid link. Make sure it is a full Google Sheets URL.",
              "error",
            );
          }

          setIsSyncing(true);

          // Point directly to the CalendarHolidays tab
          const csvUrl = `https://docs.google.com/spreadsheets/d/${extractedSheetId}/gviz/tq?tqx=out:csv&sheet=CalendarHolidays`;

          Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: async (results) => {
              try {
                const validHolidays = results.data
                  .filter((row) => row.Date && row.Holiday) // Skip empty rows
                  .map((row) => ({
                    year: row.Year || "",
                    date: row.Date || "",
                    day: row.Day || "",
                    name: row.Holiday || "",
                    type: row.Type || "",
                  }));

                const globalHolidaysRef = doc(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "settings",
                  "globalHolidays",
                );

                // Save the holidays AND the URL so the admin doesn't lose it
                await setDoc(
                  globalHolidaysRef,
                  {
                    holidays: validHolidays,
                    sheetUrl: sheetUrl,
                    updatedAt: new Date().toISOString(),
                  },
                  { merge: true },
                );

                showMessage(
                  `Successfully synced ${validHolidays.length} global holidays!`,
                );
              } catch (error) {
                showMessage(
                  "Error saving holidays to Firebase: " + error.message,
                  "error",
                );
              }
              setIsSyncing(false);
            },
            error: (err) => {
              showMessage(
                "Failed to fetch. Make sure the Google Sheet's access is set to 'Anyone with the link can view'.",
                "error",
              );
              setIsSyncing(false);

          if (!customDateInput || !customHolidayName) return;

          const existingCustom = currentCompSettings.customHolidays || [];

          const newCustom = [
            ...existingCustom,
            { date: customDateInput, name: customHolidayName },

          await handleUpdateSetting(
            selectedCompany,
            "customHolidays",
            newCustom,

                        <RefreshCw size={18} />

                            </td>

                      {companies.length === 0 && (
                        <tr>
                          <td

                            className="p-8 text-center text-slate-400 dark:text-slate-500"

      // --- ADD ADMIN TAB (UPGRADED WITH SHOW, EDIT, DELETE) ---
      function AddAdminTab({ showMessage }) {
        // Form State for creating a new admin
        const [adminData, setAdminData] = useState({
          name: "",
          email: "",
          password: "",
          allowedPortals: ["mentoring_portal"], // Default portal selected
        });
        const [isSubmitting, setIsSubmitting] = useState(false);

        // State for loading and listing existing admins
        const [adminsList, setAdminsList] = useState([]);
        const [loadingAdmins, setLoadingAdmins] = useState(true);

        // Inline Editing State
        const [editingId, setEditingId] = useState(null);
        const [editName, setEditName] = useState("");
        const [editPortals, setEditPortals] = useState([]);

        // Listen to the administrators collection in real-time
        useEffect(() => {
          let unsubscribe = () => {};
          try {
            const adminsCollectionRef = collection(db, "admins");
            unsubscribe = onSnapshot(
              adminsCollectionRef,
              (snapshot) => {
                const admins = [];
                snapshot.forEach((doc) => {
                  admins.push({ id: doc.id, ...doc.data() });
                });
                // Sort by name or creation date
                admins.sort((a, b) => a.name.localeCompare(b.name));
                setAdminsList(admins);
                setLoadingAdmins(false);
              },
              (err) => {
                console.error("Error fetching admins:", err);
                showMessage("❌ Error loading administrators list.", "error");
                setLoadingAdmins(false);
              },
            );
          } catch (e) {
            console.error("Firestore setup error:", e);
            setLoadingAdmins(false);
          }
          return () => unsubscribe();
        }, []);

        // Toggle portal choices for the creation form
        const handlePortalToggle = (portalKey) => {
          setAdminData((prev) => {
            const current = prev.allowedPortals || [];
            const updated = current.includes(portalKey)
              ? current.filter((p) => p !== portalKey)
              : [...current, portalKey];
            return { ...prev, allowedPortals: updated };
          });
        };

        // Toggle portal choices for the inline editor
        const handleEditPortalToggle = (portalKey) => {
          setEditPortals((prev) =>
            prev.includes(portalKey)
              ? prev.filter((p) => p !== portalKey)
              : [...prev, portalKey],
          );
        };

        // Register/Nominate a brand new administrator
        const handleNominateAdmin = async (e) => {
          e.preventDefault();
          if ((adminData.allowedPortals || []).length === 0) {
            showMessage(
              "❌ Please select at least one portal for access.",
              "error",
            );
            return;
          }

          setIsSubmitting(true);
          let secondaryApp = null;
          try {
            // Initialize secondary app to create user account without dropping current admin session
            secondaryApp = initializeApp(
              firebaseConfig,
              "SecondaryAdminApp",
            );
            const secondaryAppCheck = initializeAppCheck(secondaryApp, {
              provider: new CustomProvider({
                getToken: async () => {
                  try {
                    const tokenResult = await getToken(appCheck, false);
                    return {
                      token: tokenResult.token,
                      expireTimeMillis: Date.now() + 3600000
                    };
                  } catch (e) {
                    console.warn("Failed to get AppCheck token for secondary app", e);
                    return { token: "", expireTimeMillis: 0 };
                  }
                }
              }),
              isTokenAutoRefreshEnabled: false,
            });
            const secondaryAuth = getAuth(secondaryApp);

            let newUid;
            try {
              const userCredential = await createUserWithEmailAndPassword(
                secondaryAuth,
                adminData.email,
                adminData.password,
              );
              newUid = userCredential.user.uid;
            } catch (createErr) {
              if (createErr.code === "auth/email-already-in-use") {
                try {
                  const signinCredential = await signInWithEmailAndPassword(
                    secondaryAuth,
                    adminData.email,
                    adminData.password,
                  );
                  newUid = signinCredential.user.uid;
                } catch (signErr) {
                  throw new Error(
                    "Email is already registered. To add this existing user as an admin, please provide their correct current password.",
                  );
                }
              } else {
                throw createErr;
              }
            }

            await signOut(secondaryAuth);

            // Write user record into unified admins database collection
            await setDoc(doc(db, "admins", newUid), {
              name: adminData.name,
              email: adminData.email,
              role: "nominated_admin",
              allowedPortals: adminData.allowedPortals,
              createdAt: serverTimestamp
                ? serverTimestamp()
                : new Date().toISOString(),
            });

            showMessage(
              "✅ Admin successfully nominated with assigned portal rights!",
            );
            setAdminData({
              name: "",
              email: "",
              password: "",
              allowedPortals: ["mentoring_portal"],
            });
          } catch (err) {
            console.error(err);
            showMessage("Error nominating admin: " + err.message, "error");
          } finally {
            if (secondaryApp) {
              try {
                await deleteApp(secondaryApp);
              } catch(e) {
                console.error("Error cleaning up secondary app", e);
              }
            }
            setIsSubmitting(false);
          }
        };

        // Initialize inline editor data
        const startEditing = (admin) => {
          setEditingId(admin.id);
          setEditName(admin.name || "");
          setEditPortals(admin.allowedPortals || []);
        };

        // Save modified admin metadata back to Firestore
        const handleSaveEdit = async (id) => {
          if (!editName.trim()) {
            showMessage("❌ Name cannot be empty.", "error");
            return;
          }
          if (editPortals.length === 0) {
            showMessage(
              "❌ Admin must have access to at least one portal.",
              "error",
            );
            return;
          }

          try {
            const adminDocRef = doc(db, "admins", id);
            await updateDoc(adminDocRef, {
              name: editName.trim(),
              allowedPortals: editPortals,
            });
            showMessage("✅ Administrator updated successfully!");
            setEditingId(null);
          } catch (err) {
            console.error(err);
            showMessage(
              "❌ Error updating administrator: " + err.message,
              "error",
            );
          }
        };

        // Revoke access rights and delete document
        const handleDeleteAdmin = async (admin) => {
          const currentAdminUid = auth.currentUser?.uid;
          if (admin.id === currentAdminUid) {
            showMessage(
              "❌ Action Denied: You cannot delete your own active session account!",
              "error",
            );
            return;
          }

          if (
            !confirm(
              `Are you completely sure you want to revoke administrator privileges for ${admin.name}? This will instantly lock them out of all portals.`,
            )
          ) {
            return;
          }

          try {
            await deleteDoc(doc(db, "admins", admin.id));
            showMessage(
              "✅ Administrator access privileges successfully revoked.",
            );
          } catch (err) {
            console.error(err);
            showMessage(
              "❌ Error deleting administrator: " + err.message,
              "error",
            );
          }
        };

                    onChange={(e) =>
                      setAdminData({ ...adminData, name: e.target.value })

                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                    Email Address
                  </label>
                  <input

                    value={adminData.email}
                    onChange={(e) =>
                      setAdminData({ ...adminData, email: e.target.value })
                    }
                    className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition-all text-sm"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                    Secure Password
                  </label>
                  <input
                    required
                    type="password"
                    placeholder="••••••••"
                    minLength="6"
                    value={adminData.password}
                    onChange={(e) =>
                      setAdminData({ ...adminData, password: e.target.value })
                    }
                    className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition-all text-sm"
                  />
                  <p className="text-[10px] text-slate-500 mt-1">
                    For existing users, enter their current password.
                  </p>
                </div>

                <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mt-2">
                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider mb-2">

                  <div className="space-y-2">

        useEffect(() => {

        const filteredTrainees = useMemo(() => {
          return trainees.filter((t) => {

            const studentId = String(
              t?.["Student ID#"] || t?.studentId || "",

            ).toLowerCase();

            const matchesSearch =
              name.includes(search) ||
              studentId.includes(search) ||
              company.includes(search) ||
              program.includes(search);

            const comp = t?.company || t?.["Company Name"] || "Unassigned";
            const stat = t?.status || t?.Status || "Active";
            const matchesCompany =
              filterCompany === "All" || comp === filterCompany;
            const matchesStatus =

          try {
            const batch = [];
            for (const id of selectedIds) {
              batch.push(
                deleteDoc(
                  doc(db, "artifacts", appId, "public", "data", "trainees", id),
                ),
              );
            }
            await Promise.all(batch);
            showMessage(
              `Successfully deleted ${selectedIds.length} student record(s).`,

            showMessage("Failed to delete records: " + err.message);

        const handleExportCSV = () => {

              t.contactPersonNo || t["Guardian ContactNo"] || "",

              t.guardianRelationship || t["Guardian RelationShip"] || "",

              t.requirements?.cardForm137Tor || t["Card/Form137/TOR"] || "",

        // --- NEW: CSV UPLOAD LOGIC WITH HISTORICAL TRACKING ---
        const handleFileUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;

          Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: async (results) => {
              setUploading(true);
              try {
                const data = results.data.filter((row) =>
                  Object.keys(row).some((key) => row[key]),
                );

                const traineesRef = collection(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "trainees",
                );
                const snapshot = await getDocs(traineesRef);

                // Store full existing data object for comparison
                const existingTrainees = {};
                snapshot.forEach((doc) => {
                  const d = doc.data();
                  const id = d["Student ID#"] || d.studentId;
                  if (id) existingTrainees[id] = { id: doc.id, ...d };
                });

                const promises = data.map(async (row) => {
                  const studentId = row["Student ID#"] || row.studentId;
                  if (!studentId) return;

                  const existing = existingTrainees[studentId];

                  const newStatus = (
                    row["Status"] ||
                    row.status ||
                    "Active"
                  ).trim();
                  const newCompany = (
                    row["Company Name"] ||
                    row.company ||
                    ""
                  ).trim();
                  const newIC = (
                    row["Assigned IC"] ||
                    row.assignedIC ||
                    ""
                  ).trim();

                  if (existing) {
                    // CHECK FOR CHANGES IN EXISTING TRAINEE
                    let newHistory = existing.statusHistory || [];
                    const oldStatus = (
                      existing["Status"] ||
                      existing.status ||
                      "Active"
                    ).trim();
                    const oldCompany = (
                      existing["Company Name"] ||
                      existing.company ||
                      ""
                    ).trim();
                    const oldIC = (
                      existing["Assigned IC"] ||
                      existing.assignedIC ||
                      ""
                    ).trim();

                    if (
                      oldStatus !== newStatus ||
                      oldCompany !== newCompany ||
                      oldIC !== newIC
                    ) {
                      let changeNotes = [];
                      if (oldStatus !== newStatus)
                        changeNotes.push(
                          `Status: ${oldStatus} -> ${newStatus}`,
                        );
                      if (oldCompany !== newCompany)
                        changeNotes.push(
                          `Company: ${oldCompany || "None"} -> ${newCompany || "None"}`,
                        );
                      if (oldIC !== newIC)
                        changeNotes.push(
                          `IC: ${oldIC || "None"} -> ${newIC || "None"}`,
                        );

                      newHistory.push({
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now(),
                        updatedBy: "System Admin (CSV Bulk)",
                        status: newStatus,
                        company: newCompany,
                        assignedIC: newIC,
                        remarks: changeNotes.join(" | "),
                      });
                    }

                    const docRef = doc(
                      db,
                      "artifacts",
                      appId,
                      "public",
                      "data",
                      "trainees",
                      existing.id,
                    );
                    return updateDoc(docRef, {
                      ...row,
                      statusHistory: newHistory,
                    });
                  } else {
                    // NEW TRAINEE
                    let newHistory = [
                      {
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now(),
                        updatedBy: "System Admin (CSV Bulk)",
                        status: newStatus,
                        company: newCompany,
                        assignedIC: newIC,
                        remarks: "Initial Upload",
                      },
                    ];

                    const newRef = doc(
                      collection(
                        db,
                        "artifacts",
                        appId,
                        "public",
                        "data",
                        "trainees",
                      ),
                    );
                    return setDoc(newRef, {
                      ...row,
                      statusHistory: newHistory,
                    });
                  }
                });

                await Promise.all(promises);
                showMessage(
                  `Successfully processed ${data.length} student records.`,
                );
              } catch (error) {
                console.error("Error processing CSV:", error);
                showMessage("Error uploading Masterlist data.");
              }
              setUploading(false);
              event.target.value = null; // reset input
            },
            error: (error) => {
              console.error("CSV Parse Error:", error);
              showMessage("Error parsing CSV file.");
            },
          });
        };

        // --- NEW: EDIT RECORD WITH HISTORICAL TRACKING ---
        const handleSaveEdit = async () => {
          try {
            const original = trainees.find((s) => s.id === editingStudent.id);
            let updatedHistory = original.statusHistory || [];

            const oldStatus = (
              original["Status"] ||
              original.status ||
              "Active"
            ).trim();
            const newStatus = (
              editingStudent["Status"] ||
              editingStudent.status ||
              "Active"
            ).trim();

            const oldCompany = (
              original["Company Name"] ||
              original.company ||
              ""
            ).trim();
            const newCompany = (
              editingStudent["Company Name"] ||
              editingStudent.company ||
              ""
            ).trim();

            const oldIC = (
              original["Assigned IC"] ||
              original.assignedIC ||
              ""
            ).trim();
            const newIC = (
              editingStudent["Assigned IC"] ||
              editingStudent.assignedIC ||
              ""
            ).trim();

            if (
              oldStatus !== newStatus ||
              oldCompany !== newCompany ||
              oldIC !== newIC
            ) {
              let changeNotes = [];
              if (oldStatus !== newStatus)
                changeNotes.push(`Status: ${oldStatus} -> ${newStatus}`);
              if (oldCompany !== newCompany)
                changeNotes.push(
                  `Company: ${oldCompany || "None"} -> ${newCompany || "None"}`,
                );
              if (oldIC !== newIC)
                changeNotes.push(
                  `IC: ${oldIC || "None"} -> ${newIC || "None"}`,
                );

              updatedHistory.push({
                date: new Date().toLocaleDateString(),
                timestamp: Date.now(),
                updatedBy: "System Admin (Manual Edit)",
                status: newStatus,
                company: newCompany,
                assignedIC: newIC,
                remarks: changeNotes.join(" | "),
              });
            }

            const docRef = doc(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "trainees",
              editingStudent.id,
            );
            await updateDoc(docRef, {
              ...editingStudent,
              statusHistory: updatedHistory,
            });

            showMessage("Student updated successfully.");
            setEditingStudent(null);
          } catch (error) {
            console.error("Error updating student:", error);
            showMessage("Error updating student.");

                  <MapPin size={18} /> Geofence Settings
                </button>
                <button
                  onClick={() => {
                    setActiveTab("trainees");
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${activeTab === "trainees" ? "bg-blue-600 text-white shadow-lg shadow-blue-900/20" : "hover:bg-slate-800 hover:text-white text-slate-300"}`}
                >
                  <Users size={18} /> Sync Masterlist
                </button>
                <button
                  onClick={() => {
                    setActiveTab("attendance-settings");
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${activeTab === "attendance-settings" ? "bg-blue-600 text-white shadow-lg shadow-blue-900/20" : "hover:bg-slate-800 hover:text-white text-slate-300"}`}
                >
                  <Users size={18} /> Attendance Settings
                </button>
                <button
                  onClick={() => {
                    setActiveTab("manage-students");
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${activeTab === "manage-students" ? "bg-blue-600 text-white shadow-lg shadow-blue-900/20" : "hover:bg-slate-800 hover:text-white text-slate-300"}`}
                >
                  <Users size={18} /> Manage Students
                </button>
                <button
                  onClick={() => {
                    setActiveTab("add-admin");
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${activeTab === "add-admin" ? "bg-slate-800 text-white shadow-lg" : "text-slate-400 hover:bg-slate-800/50 hover:text-white"}`}
                >
                  <UserPlus size={20} /> Add Admin
                </button>
                <button
                  onClick={() => {
                    setActiveTab("system-logs");
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${activeTab === "system-logs" ? "bg-slate-800 text-white shadow-lg" : "text-slate-400 hover:bg-slate-800/50 hover:text-white"}`}
                >
                  <History size={20} /> System Logs
                </button>
              </nav>

              <div className="p-4 border-t border-slate-800 shrink-0">
                <div className="px-4 pb-4 text-xs font-mono text-slate-400 dark:text-slate-500 break-words">
                  Admin Session:
                  <br />
                  <span className="text-slate-300 font-bold">{user.email}</span>
                </div>
                <button
                  onClick={handleLogout}
                  className="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500 hover:text-white transition-colors bg-slate-800/50 border border-transparent hover:border-red-500/50"
                >
                  <LogOut size={18} /> Sign Out
                </button>
              </div>
            </div>

            {/* Main Content Area */}
            <div className="flex-1 overflow-y-auto p-4 md:p-8 relative w-full h-full bg-slate-100 dark:bg-slate-900/50 dark:bg-slate-900">
              {toastMsg && (
                <div className="fixed bottom-6 right-1/2 translate-x-1/2 md:top-6 md:translate-x-0 md:bottom-auto md:right-6 bg-slate-800 dark:bg-slate-700 text-white px-6 py-4 rounded-xl shadow-2xl z-[70] font-bold border border-slate-700 dark:border-slate-600 w-[90%] md:w-auto max-w-sm text-center md:text-left">
                  {toastMsg}
                </div>
              )}

              <div className="max-w-6xl mx-auto pb-20 md:pb-0">
                {activeTab === "manage-accounts" && (
                  <ManageAccountsTab showMessage={showMessage} />
                )}
                {activeTab === "disputes" && (
                  <DisputesTab showMessage={showMessage} />
                )}
                {activeTab === "coordinators" && (
                  <CoordinatorsTab showMessage={showMessage} />
                )}
                {activeTab === "merit-points" && (
                  <ManageMeritPointsTab showMessage={showMessage} />
                )}
                {activeTab === "school-location" && (
                  <ManageSchoolLocationTab showMessage={showMessage} />
                )}
                {activeTab === "geofence" && (
                  <GeofenceSettingsTab showMessage={showMessage} />
                )}
                {activeTab === "trainees" && (
                  <TraineesTab showMessage={showMessage} />
                )}
                {activeTab === "attendance-settings" && (
                  <CompanyAttendanceSettingsTab showMessage={showMessage} />
                )}
                {activeTab === "manage-students" && (
                  <ManageStudentsTab showMessage={showMessage} />
                )}
                {activeTab === "system-logs" && (
                  <SystemLogsTab showMessage={showMessage} />
                )}
                {activeTab === "add-admin" && (
                  <AddAdminTab showMessage={showMessage} />
                )}
              </div>
            </div>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
