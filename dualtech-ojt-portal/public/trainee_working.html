                // Helper function separated so it can run with or without GPS
                const processAttendanceRecord = async (lat, lon) => {
                    const timestamp = serverTimestamp();
                    const dateString = getLocalYYYYMMDD(new Date());
                    let status = 'Normal';

                    if (overrideStatus === 'Normal') {
                        if (profile?.companyLat && profile?.companyLon) {
                            let allowedRadius = 500; 
                            try {
                                if (navigator.onLine) {
                                    const sysRef = doc(db, 'artifacts', appId, 'public', 'system_settings');
                                    const sysSnap = await Promise.race([
                                        getDoc(sysRef),
                                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000))
                                    ]).catch(() => null); 
                                    
                                    if (sysSnap && sysSnap.exists() && sysSnap.data().geofenceRadius) {
                                        allowedRadius = Number(sysSnap.data().geofenceRadius);
                                    }
                                }
                            } catch (err) {
                                console.error("Error fetching system geofence radius.", err);
                            }

                            // FIX: Changed calculateDistance to getDistanceFromLatLonInM
                            const distance = getDistanceFromLatLonInM(lat, lon, profile.companyLat, profile.companyLon);
                            if (distance > allowedRadius) {
                                setPendingAction(type);
                                setDisputeType('Location'); // FIX: Ensure dispute type is set
                                setDisputeReason('');
                                setDisputedLoc({ lat, lon }); // FIX: Save coordinates for the override
                                setShowDisputeModal(true); 
                                setLoadingLoc(false);
                                return; 
                            }
                        }
                        
                        status = await verifyLocationAndDevice(lat, lon);
                        
                        if (status.toLowerCase().includes("blocked") || status.toLowerCase().includes("geofence")) {
                            setPendingAction(type);
                            setDisputeType('Location');
                            setDisputeReason('');
                            setDisputedLoc({ lat, lon }); // FIX: Save coordinates for the override
                            setShowDisputeModal(true); 
                            setLoadingLoc(false);
                            return; 
                        }

                        if (status === "UnrecognizedDevice") {
                            setPendingAction(type); 
                            setLoadingLoc(false);
                            if (profile.totpSecret) { setRequireTotp(true); } else { setIsDisputed(true); }
                            return;
                        }
                    } else {
                        status = 'Disputed';
                    }

                    let extraNotes = "Routine Log";
                    if (overrideStatus === 'Disputed' && overrideReason) {
                        extraNotes = `Acknowledged - To be acknowledged by the HR/IC. Reason: ${overrideReason}`;
                    }

                    const finalStatusRemark = overrideStatus === 'Disputed' ? extraNotes : status;
                    const logPayload = { location: { lat, lon }, deviceUsed: navigator.userAgent, statusRemark: finalStatusRemark, type: type === 'in' ? 'IN' : 'OUT' };

                    try {
                        let activeLogForOutCheck = null;
                        const logsCollectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'attendanceLogs');

                        if (type === 'in') {
                            // FIX 1: Generate ID instantly and save in background to prevent poor-connection hanging
                            const newLogRef = doc(logsCollectionRef);
                            setDoc(newLogRef, {
                                dateString, timestamp: Date.now(), timeIn: timestamp, clockInDetails: logPayload, type: 'IN' 
                            }); // Notice: No 'await'
                            
                            setClockState({ isClockedIn: true, activeDocId: newLogRef.id });
                            
                        } else if (type === 'out' && clockState.activeDocId) {
                            activeLogForOutCheck = allLogs.find(l => l.id === clockState.activeDocId);
                            const logRef = doc(db, 'artifacts', appId, 'users', user.uid, 'attendanceLogs', clockState.activeDocId);
                            
                            // FIX 2: Save updates in background
                            setDoc(logRef, { timeOut: timestamp, clockOutDetails: logPayload }, { merge: true }); // No 'await'
                            
                            const outLogRef = doc(logsCollectionRef);
                            setDoc(outLogRef, {
                                dateString, timestamp: Date.now(), timeOut: timestamp, clockOutDetails: logPayload, type: 'OUT'
                            }); // No 'await'

                        if (overrideStatus === 'Disputed') {

                                assignedIC: profile.assignedIC || 'Unassigned',
                                description: `Trainee logged ${type.toUpperCase()} with system override. Reason: "${overrideReason}"`,
                                status: 'Pending',
                                date: new Date().toLocaleDateString('en-us'),
                                createdAt: Date.now()
                            }); // No 'await'

                            const currentDayStr = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
                            const dayType = (profile.schoolingDay?.toLowerCase() === currentDayStr) ? 'Schooling Day' : 'Rest Day';
                            
                            addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ic_reports'), {
                                date: new Date().toLocaleDateString('en-us'),
                                timestamp: Date.now(),
                                category: 'Attendance Issue',
                                details: `Trainee triggered a system override during ${type.toUpperCase()}.\n\nReason provided by trainee: "${overrideReason}"`,
                                reportedBy: 'System (Auto-Dispute)',
                                company: profile.company || profile.companyName || 'Unknown',
                                traineeId: user.uid,
                                traineeName: `${profile.given || profile.firstName || ''} ${profile.family || profile.lastName || ''}`.trim(),
                                assignedIC: profile.assignedIC || 'Unassigned',
                                status: 'Unread'
                            }); // No 'await'
                        }

                        // ... (Keep the rest of the try block, such as hoursElapsed checking and fetchLogs(), exactly the same)

                        if (type === 'out' && activeLogForOutCheck) {
                            let timeInMs;
                            if (activeLogForOutCheck.timestamp && activeLogForOutCheck.timestamp.toDate) {
                                timeInMs = activeLogForOutCheck.timestamp.toDate().getTime();
                            } else if (activeLogForOutCheck.timestamp) {
                                timeInMs = new Date(activeLogForOutCheck.timestamp).getTime();
                            }
                            if (timeInMs) {
                                const timeOutMs = Date.now();
                                const hoursElapsed = (timeOutMs - timeInMs) / (1000 * 60 * 60);

                                    extraNotes += ` | [WARNING: Exceeded 15 hours (${hoursElapsed.toFixed(1)} hrs)]`;

                        setShowDisputeModal(false);

                        setPendingAction(null);
                        
                        // Check if offline, blocked by spotty network, OR if there's data waiting in the offline queue to be synced
                        const pendingQueue = JSON.parse(localStorage.getItem('offlineSheetQueue') || '[]');
                        const isOfflineOrPoor = !navigator.onLine || status.includes('unavailable') || status.includes('Offline') || pendingQueue.length > 0;

                            alert(`⚠️ TEMPORARY SAVE SUCCESSFUL\n\nYou clocked ${type.toUpperCase()}, but your internet connection is poor or offline.\n\nYour attendance has been temporarily saved to this phone. You MUST connect to a stable internet connection later and open this app to officially record your attendance to the system. Please do not log out of your account.`);
                        } else {

                    finally { setLoadingLoc(false); }
                };

                // --- NEW: Use Pre-Fetched Coordinates from Map Preview ---
                if (preLat !== null && preLon !== null) {

                }

                // --- UPDATED GPS BYPASS LOGIC ---
                // For ALL dispute submissions, skip trying to fetch GPS again to prevent the "Locating..." freeze on poor networks.
                if (overrideStatus === 'Disputed') {

                }

                // Trigger modal if GPS is outright not supported, UNLESS they are online
                if (!navigator.geolocation) {

            // --- PASTE THIS NEW FUNCTION BELOW handleClock ---

            // -------------------------------------------------

                baseStartDate.setHours(0,0,0,0);

                let present = 0; let absent = 0;
                
                const [year, month] = selectedMonth.split('-');
                const monthStartDate = new Date(year, month - 1, 1);
                let monthEndDate = new Date(year, month, 0);
                
                const today = new Date();
                if (monthEndDate > today) monthEndDate = today;

                const baseStartDate = getBaseStartDate();
                
                if (monthEndDate < baseStartDate) {
                    return { present: 0, absent: 0, missingDates: [] };
                }

                let tempDate = new Date(Math.max(monthStartDate, baseStartDate));
                tempDate.setHours(0,0,0,0);
                
                const uniqueDates = [...new Set(allLogs.map(l => l.dateString))];
                const missingDates = [];
                const todayStr = getLocalYYYYMMDD(today);

                while (tempDate <= monthEndDate) {
                    const dStr = getLocalYYYYMMDD(tempDate);
                    const day = tempDate.getDay();
                    if (day !== 0 && day !== 6) { 
                        if (uniqueDates.includes(dStr)) present++;
                        else {
                            absent++;
                            if (dStr !== todayStr) {
                                missingDates.push(dStr);
                            }
                        }
                    }
                    tempDate.setDate(tempDate.getDate() + 1);
                }
                return { present, absent, missingDates: missingDates.reverse() };
            }, [allLogs, profile, selectedMonth]);

            const totalAbsences = useMemo(() => {
                let absent = 0;
                
                // 1. Set the baseline to their Portal Registration Date instead of IPT Start Date
                const regDate = profile?.registeredAt?.toDate

                    : (profile?.registeredAt ? new Date(profile.registeredAt) : new Date());
                
                let tempDate = new Date(regDate);
                
                const today = new Date();
                const todayStr = getLocalYYYYMMDD(today);
                
                const uniqueDates = [...new Set(allLogs.map(l => l.dateString))];

                // 2. Loop through every day from Registration Date until Today
                while (getLocalYYYYMMDD(tempDate) !== todayStr && tempDate < today) { 
                    const dStr = getLocalYYYYMMDD(tempDate);
                    const day = tempDate.getDay();
                    
                    // 3. If it's a weekday (not Sunday/Saturday) AND there is no log, add an absence
                    if (day !== 0 && day !== 6 && !uniqueDates.includes(dStr)) {
                        absent++;
                    }
                    
                    tempDate.setDate(tempDate.getDate() + 1);
                }
                
                return absent;

                let statuses = [];
                
                related.forEach(m => {
                    statuses.push(m.status);
                    if (m.status === 'Approved') {
                        const logsForDate = allLogs.filter(l => l.dateString === m.makeUpDate);
                        let earliestIn = null; let latestOut = null;
                        logsForDate.forEach(l => {

                            }
                            if (l.type === 'OUT' && l.timestamp) {
                                if (!latestOut || l.timestamp > latestOut) latestOut = l.timestamp;
                            }

                        if (earliestIn && latestOut) {
                            const hrs = (latestOut - earliestIn) / (1000 * 60 * 60);
                            if (hrs > 8) totalExcessHours += (hrs - 8);
                        }

                                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                                        <ShieldCheck className="text-emerald-500"/> Biometric Authentication
                                    </h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">Set up fingerprint or face recognition for quick, 1-tap clock-ins on this device.</p>
                                    
                                    {profile.biometricCredentialId ? (
                                        <div className="bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 p-4 rounded-xl font-bold flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 cursor-not-allowed">
                                            <CheckCircle2 size={20} className="text-emerald-500" /> Biometric Already Configured
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={handleBiometricSetup} 
                                            disabled={isSettingUpBio}
                                            className="w-full bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 shadow-md transition-colors disabled:opacity-50 flex justify-center items-center gap-2"
                                        >
                                            {isSettingUpBio ? 'Setting up...' : 'Register Biometric Now'}
                                        </button>
                                    )}
                                </div>

                                {/* GOOGLE AUTHENTICATOR SETUP */}
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 mt-6">
                                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2"><ShieldCheck className="text-emerald-500"/> Google Authenticator (2FA)</h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">Link Google Authenticator so you can verify yourself when clocking in from a new phone, bypassing the need for HR approval.</p>
                                    
                                    {profile.totpSecret ? (
                                        <div className="bg-emerald-50 text-emerald-700 p-4 rounded-xl font-bold flex items-center gap-2">
                                            <CheckCircle2 size={20} /> Google Authenticator is Active!
                                        </div>
                                    ) : !totpSetupUri ? (
                                        <button onClick={handleSetupGoogleAuth} className="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-900 transition-colors">
                                            Setup Google Authenticator
                                        </button>
                                    ) : (
                                        <div className="p-6 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-800 flex flex-col items-center text-center">
                                            <p className="font-bold text-slate-800 dark:text-slate-100 mb-2">1. Scan this QR code in the Google Authenticator App</p>
                                            
                                            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm mb-4 border border-slate-100 dark:border-slate-800">
                                                <QRCodeSVG value={totpSetupUri} size={200} />
                                            </div>

                                            {/* MANUAL ENTRY FALLBACK */}
                                            <div className="mb-6 w-full max-w-sm">
                                                <div className="relative flex items-center py-2">
                                                    <div className="flex-grow border-t border-slate-300"></div>
                                                    <span className="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold uppercase">Or enter manually</span>
                                                    <div className="flex-grow border-t border-slate-300"></div>
                                                </div>
                                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-3 mt-2 flex flex-col items-center">
                                                    <span className="text-xs text-slate-500 dark:text-slate-400 mb-1">Account: Dualtech ({profile.email})</span>
                                                    <span className="font-mono font-bold text-emerald-600 tracking-wider break-all text-center select-all cursor-pointer">
                                                        {tempSecret}
                                                    </span>
                                                    <span className="text-[10px] text-slate-400 mt-1 mt-2">Select "Enter a setup key" in your app</span>
                                                </div>
                                            </div>

                                            <p className="font-bold text-slate-800 dark:text-slate-100 mb-2">2. Enter the 6-digit code to verify</p>
                                            <input 
                                                type="text" 
                                                maxLength="6"
                                                placeholder="000000"
                                                className="w-40 px-4 py-3 text-center text-2xl tracking-widest border border-slate-300 rounded-xl outline-none focus:border-emerald-500 mb-4 font-mono shadow-inner bg-white dark:bg-slate-900"
                                                id="totpVerifyInput"
                                            />
                                            <button onClick={() => confirmSetupGoogleAuth(document.getElementById('totpVerifyInput').value)} className="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 shadow-md transition-colors">
                                                Verify & Link App
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <button onClick={() => signOut(auth)} className="md:hidden w-full bg-red-50 text-red-600 font-bold py-4 rounded-2xl hover:bg-red-100 transition-colors flex justify-center items-center gap-2"><LogOut size={20}/> Sign Out</button>
                            </div>
                        )}

                        {/* --- NEW: DATA PRIVACY RIGHTS SECTION --- */}
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 mt-6">
                            <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                                <ShieldCheck className="text-blue-600" size={20} /> Data Privacy Rights
                            </h3>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">
                                Under the Data Privacy Act of 2012, you have the right to access, correct, or request the deletion of your personal data stored in our system.
                            </p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <button 
                                    onClick={() => {
                                        window.location.href = `mailto:dpo@dualtech.edu.ph?subject=Data Update Request - ${profile.studentId}&body=Hi DPO,%0D%0A%0D%0AI would like to request an update/correction to my personal records.`;
                                    }}
                                    className="flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold py-3 px-4 rounded-xl transition-colors text-sm"
                                >
                                    <Edit3 size={16} /> Request Data Update
                                </button>
                                
                                <button 
                                    onClick={() => {
                                        if(window.confirm("Are you sure you want to request account deletion? HR will review this request within 30 days.")) {
                                            window.location.href = `mailto:dpo@dualtech.edu.ph?subject=Data Deletion Request - ${profile.studentId}&body=Hi DPO,%0D%0A%0D%0AI am requesting the complete deletion of my personal data from the Trainee Portal.`;
                                        }
                                    }}
                                    className="flex items-center justify-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-3 px-4 rounded-xl transition-colors text-sm"
                                >
                                    <Trash2 size={16} /> Request Data Deletion
                                </button>
                            </div>
                        </div>

                    </div>

                    {/* MAP PREVIEW MODAL */}
                    {previewLoc && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-200 flex flex-col">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-100 dark:border-slate-800 pb-4">
                                    <h3 className="font-black text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                        <MapPin className="text-emerald-500"/> Confirm Location
                                    </h3>
                                    <button onClick={() => setPreviewLoc(null)} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
                                </div>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mb-4 text-center">
                                    Please verify your location on the map before officially clocking <strong>{previewLoc.action.toUpperCase()}</strong>.
                                </p>
                                
                                <div className="w-full h-64 bg-slate-100 dark:bg-slate-800 rounded-2xl overflow-hidden mb-6 border-2 border-emerald-100 dark:border-emerald-900 relative shadow-inner pointer-events-none">
                                    <iframe
                                        width="100%"
                                        height="100%"
                                        frameBorder="0"
                                        scrolling="no"
                                        marginHeight="0"
                                        marginWidth="0"
                                        src={`https://www.openstreetmap.org/export/embed.html?bbox=${previewLoc.lon - 0.003},${previewLoc.lat - 0.003},${previewLoc.lon + 0.003},${previewLoc.lat + 0.003}&layer=mapnik&marker=${previewLoc.lat},${previewLoc.lon}`}
                                    ></iframe>
                                </div>

                                <div className="flex gap-3 mt-auto">
                                    <button onClick={() => setPreviewLoc(null)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const { action, lat, lon } = previewLoc;
                                            setPreviewLoc(null);
                                            // Trigger final save using the confirmed coordinates
                                            handleTimeAction(action, lat, lon);
                                        }} 
                                        className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md shadow-emerald-200 transition-all active:scale-95 flex justify-center items-center gap-2"
                                    >
                                        <CheckCircle2 size={18}/> Confirm
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* --- UNIFIED DISPUTE MODAL (Handles both Location and Schedule) --- */}
                    {showDisputeModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200 flex flex-col max-h-[90vh]">
                                <div className="p-5 border-b border-amber-100 bg-amber-50 flex justify-between items-center shrink-0">
                                    <h3 className="font-black text-amber-900 flex items-center gap-2">
                                        <AlertCircle size={20}/> 
                                        {disputeType === 'Location' ? 'Out of Bounds Warning' : disputeType === 'Location Disabled' ? 'GPS Disabled Warning' : 'Action Restricted'}
                                    </h3>
                                    <button onClick={() => setShowDisputeModal(false)} className="p-1.5 text-amber-400 hover:bg-amber-200 rounded-lg"><X size={20}/></button>
                                </div>

                                <div className="p-6 overflow-y-auto">
                                    {/* NEW: Map Preview for Location Dispute */}
                                    {disputeType === 'Location' && disputedLoc && (
                                        <div className="w-full h-48 bg-slate-100 dark:bg-slate-800 rounded-2xl overflow-hidden mb-4 border-2 border-amber-100 dark:border-amber-900 relative shadow-inner pointer-events-none">
                                            <iframe
                                                width="100%"
                                                height="100%"
                                                frameBorder="0"
                                                scrolling="no"
                                                marginHeight="0"
                                                marginWidth="0"
                                                src={`https://www.openstreetmap.org/export/embed.html?bbox=${disputedLoc.lon - 0.003},${disputedLoc.lat - 0.003},${disputedLoc.lon + 0.003},${disputedLoc.lat + 0.003}&layer=mapnik&marker=${disputedLoc.lat},${disputedLoc.lon}`}
                                            ></iframe>
                                        </div>
                                    )}

                                    <p className="text-sm text-slate-600 mb-4">
                                        {disputeType === 'Location' ? (
                                            <>
                                                You are currently outside your assigned company location geofence. 
                                                <br/><br/>
                                                If you are authorized to work offsite today, you may still clock {pendingAction?.toLowerCase()}, but you must provide a valid reason. 
                                            </>
                                        ) : disputeType === 'Location Disabled' ? (
                                            <>
                                                We could not access your device's location (GPS is turned off or permission was denied).
                                                <br/><br/>
                                                You may still proceed to clock {pendingAction?.toLowerCase()}, but you must provide an explanation for your missing location data.
                                            </>
                                        ) : (
                                            <>
                                                You are attempting to clock <strong>{pendingAction?.toUpperCase()}</strong> on your scheduled 
                                                <strong> {new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase() === (profile.schoolingDay || 'saturday').toLowerCase() ? ' Schooling Day' : ' Rest Day'}</strong>.
                                                <br/><br/>
                                                If you have authorized make-up duty or overtime, you may proceed, but you must state your reason.
                                            </>
                                        )}
                                        <strong> This will be marked as "Acknowledged" and will automatically send a dispute ticket to HR and your Industry Coordinator.</strong>
                                    </p>

                                    <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">
                                        Reason for {disputeType === 'Location' ? `remote clock ${pendingAction?.toLowerCase()}` : disputeType === 'Location Disabled' ? `missing GPS data` : `clocking ${pendingAction?.toLowerCase()} today`}
                                    </label>
                                    <textarea 
                                        value={disputeReason} 
                                        onChange={e => setDisputeReason(e.target.value)} 
                                        placeholder={disputeType === 'Location' ? "e.g., Assigned to field work, client meeting..." : disputeType === 'Location Disabled' ? "e.g., Phone GPS is broken, poor signal..." : "e.g., Approved overtime, Make-up duty..."} 
                                        className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 outline-none focus:border-amber-500 text-sm bg-white dark:bg-slate-900 min-h-[100px] resize-none mb-4"
                                    ></textarea>

                                    <div className="flex gap-3">
                                        <button onClick={() => setShowDisputeModal(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:bg-slate-700">Cancel</button>
                                        <button 
                                            onClick={() => {
                                                if (!disputeReason.trim()) return showToast("You must provide a dispute reason.", "error");
                                                
                                                handleClock(
                                                    pendingAction, 
                                                    'Disputed', 
                                                    `[${disputeType} Override] ${disputeReason}`, 
                                                    disputedLoc?.lat, 
                                                    disputedLoc?.lon
                                                );
                                                
                                                setShowDisputeModal(false);
                                                setDisputedLoc(null); 
                                            }} 
                                            className="flex-1 py-3 rounded-xl font-bold text-white bg-amber-600 hover:bg-amber-700 shadow-md"
                                        >
                                            Submit & Clock {pendingAction?.toUpperCase()}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FLOATING FEEDBACK BUTTON */}
                    <button 
                        onClick={() => setShowFeedbackModal(true)}
                        className="fixed bottom-24 right-6 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-xl transition-transform hover:scale-105 z-40 flex items-center justify-center"
                    >
                        <MessageSquare size={24} />
                    </button>

                    {/* FEEDBACK MODAL */}
                    {showFeedbackModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800">
                                    <h3 className="font-black text-lg text-slate-800 dark:text-slate-100">Submit a Feedback</h3>
                                    <button onClick={() => setShowFeedbackModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <X size={20} />
                                    </button>
                                </div>
                                
                                <form onSubmit={submitFeedback} className="p-5 space-y-4">
                                    {/* Category Selection */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Category of Concern</label>
                                        <select 
                                            required
                                            value={feedbackForm.category}
                                            onChange={(e) => setFeedbackForm({...feedbackForm, category: e.target.value})}
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            <option value="" disabled>Select a category...</option>
                                            <option value="Attendance Recording (Clock In / Clock Out)">Attendance Recording (Clock In / Clock Out)</option>
                                            <option value="Request for Absence">Request for Absence</option>
                                            <option value="Schooling">Schooling</option>
                                            <option value="Others">Others</option>
                                        </select>
                                    </div>

                                    {/* Conditional "Others" Textbox */}
                                    {feedbackForm.category === 'Others' && (
                                        <div className="animate-in fade-in slide-in-from-top-2">
                                            <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Specify Type of Concern</label>
                                            <input 
                                                type="text" required
                                                value={feedbackForm.otherCategory}
                                                onChange={(e) => setFeedbackForm({...feedbackForm, otherCategory: e.target.value})}
                                                placeholder="Please specify..."
                                                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    )}

                                    {/* Details Textbox */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Explain your concern</label>
                                        <textarea 
                                            required rows="4"
                                            value={feedbackForm.details}
                                            onChange={(e) => setFeedbackForm({...feedbackForm, details: e.target.value})}
                                            placeholder="Please provide details about your issue or request..."
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                                        />
                                    </div>

                                    {/* File Upload */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Attach a Picture (Optional)</label>
                                        <div className="flex items-center gap-3">
                                            <label className="flex-1 cursor-pointer bg-slate-50 dark:bg-slate-800 border-2 border-dashed border-slate-300 rounded-xl px-4 py-4 text-center hover:bg-slate-100 dark:bg-slate-700 transition-colors">
                                                <UploadCloud className="mx-auto text-slate-400 mb-2" size={24} />
                                                <span className="text-xs font-semibold text-slate-600">
                                                    {feedbackForm.fileName ? feedbackForm.fileName : "Click to upload an image"}
                                                </span>
                                                <input type="file" accept="image/*" onChange={handleFeedbackFileChange} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    {/* Submit Button */}
                                    <button 
                                        type="submit" 
                                        disabled={isSubmittingFeedback}
                                        className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 disabled:opacity-70 flex justify-center items-center gap-2 mt-4"
                                    >
                                        {isSubmittingFeedback ? (
                                            <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"/> Submitting...</>
                                        ) : (
                                            "Submit Feedback"
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                
                    </div>
            );
        }

        // --- MAIN APP WRAPPER ---
        function App() {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3500);
            };

            

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        // --- FIX: STRICT EMAIL VERIFICATION CHECK ---
                        if (!u.emailVerified) {
                            // If they are in the middle of registering, let the registration function handle it safely
                            if (window.isRegistering) return; 

                            await signOut(auth);
                            setUser(null);
                            setProfile(null);
                            setLoading(false);
                            showToast("Access Denied: Please verify your email address first. Check your inbox for the verification link.", "error");
                            return; 
                        }
                        // --------------------------------------------

                        setLoading(true);
                        try {
                            const profileRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'main');
                            const profileSnap = await getDoc(profileRef);

                            if (profileSnap.exists()) {
                                const userData = profileSnap.data();
                                const traineeData = profileSnap.data(); // Grab the HR schedule data
                            setProfile({ 
                                id: profileSnap.id, 
                                ...userData, 
                                ...traineeData 
                            });
                            setUser(u);
                            } else {
                                console.error("❌ No profile record found for this UID.");
                                showToast("Account profile not found. If you just registered, please contact your coordinator.", "error");
                                await signOut(auth);
                                setUser(null);
                            }
                        } catch (error) {
                            console.error("🔥 Error fetching profile:", error);
                            showToast("Database error: Could not read profile. Check the developer console.", "error");
                            await signOut(auth);
                            setUser(null);
                        }
                    } else {
                        setUser(null);
                        setProfile(null);
                    }
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center h-screen font-bold text-slate-400 animate-pulse">Loading Portal...</div>;

            return ( <> {user && profile ? (<Dashboard user={user} profile={profile} showToast={showToast} /> 
                    ) : (
                        <AuthScreen showToast={showToast} />
                    )}

                    {/* 👇 NEW: The Toast UI 👇 */}
                    {toast.show && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[100] animate-in slide-in-from-bottom-5 fade-in duration-300">
                            <div className={`flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border ${
                                toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' :
                                toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' :
                                'bg-slate-800 border-slate-700 text-white'
                            }`}>
                                {toast.type === 'error' && <AlertTriangle size={18} />}
                                {toast.type === 'success' && <CheckCircle2 size={18} />}
                                {toast.type === 'info' && <Info size={18} />}
                                <span className="font-bold text-sm tracking-wide">{toast.message}</span>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
