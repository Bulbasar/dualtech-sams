    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';

        // Helper to format dates correctly in LOCAL time to avoid UTC-offset weekend bugs
        function getLocalYYYYMMDD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- HELPER FUNCTION: COMPRESS IMAGES BEFORE UPLOAD ---
            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            // Resize image to max 1000px width
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1000;
                            let scaleSize = 1;
                            
                            if (img.width > MAX_WIDTH) {
                                scaleSize = MAX_WIDTH / img.width;
                            }
                            
                            canvas.width = img.width * scaleSize;
                            canvas.height = img.height * scaleSize;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            // Convert back to file, compressing quality to 70%
                            canvas.toBlob((blob) => {
                                const compressedFile = new File([blob], file.name, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                resolve(compressedFile);
                            }, 'image/jpeg', 0.7);
                        };
                    };
                });
            };

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // Grabs just the base64 string without the data URL prefix
                reader.onerror = error => reject(error);
            });

        
        // --- COMPONENT: Login & Registration ---
        function AuthScreen({ setSessionUser }) {

            // Add these near your other state declarations
            const [otpStep, setOtpStep] = useState(false);
            const [expectedOtp, setExpectedOtp] = useState('');
            const [enteredOtp, setEnteredOtp] = useState('');

            const [isRegistering, setIsRegistering] = useState(false);
            
            // NEW: State for Registration Instructions Landing Page
            const [showInstructions, setShowInstructions] = useState(false);

            // Add this near your other state declarations inside AuthScreen
            const [regStatus, setRegStatus] = useState('');

            // NEW: Diagnostic Check States
            const [diagnosticChecking, setDiagnosticChecking] = useState(false);
            const [diagnosticError, setDiagnosticError] = useState('');
            const [diagnosticSuccess, setDiagnosticSuccess] = useState(false);

            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            // NEW: State for Password Visibility
            const [showPassword, setShowPassword] = useState(false);
            
            // State for the fallback PIN
            const [pin, setPin] = useState(''); 

            const [studentIdSearch, setStudentIdSearch] = useState('');
            const [matchedStudent, setMatchedStudent] = useState(null);
            const [searchError, setSearchError] = useState('');
            
            // Registration Details
            const [mobileNo, setMobileNo] = useState(''); 
            const [contactPerson, setContactPerson] = useState('');
            const [contactPersonNo, setContactPersonNo] = useState('');
            const [regLoading, setRegLoading] = useState(false);

            // State for Privacy Consent
            const [privacyConsent, setPrivacyConsent] = useState(false);
            const [showPrivacyModal, setShowPrivacyModal] = useState(false);

            // NEW: Diagnostic Check Function
            const runDiagnostic = () => {
                setDiagnosticChecking(true);
                setDiagnosticError('');
                
                if (!navigator.geolocation) {
                    setDiagnosticError("Geolocation is not supported by your browser. Please use a modern mobile browser.");
                    setDiagnosticChecking(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        // Success! Device GPS is ON and Permissions Granted
                        setDiagnosticSuccess(true);
                        setDiagnosticChecking(false);
                        
                        // Automatically proceed to the registration form after a brief delay
                        setTimeout(() => {
                            setShowInstructions(false);
                            setDiagnosticSuccess(false); // Reset for future visits
                        }, 1500);
                    },
                    (err) => {
                        console.error("Diagnostic error:", err);
                        let errMsg = "Failed to get location. Please enable GPS/Location Services.";
                        
                        // Handle specific browser permission errors
                        if (err.code === 1) {
                            errMsg = "Location access denied. Please allow location permissions in your browser settings.";
                        } else if (err.code === 2) {
                            errMsg = "Location unavailable. Please make sure your device GPS is turned on.";
                        } else if (err.code === 3) {
                            errMsg = "Location request timed out. Please check your signal and GPS.";
                        }
                        
                        setDiagnosticError(errMsg);
                        setDiagnosticChecking(false);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            // Password Reset Function
            const handleForgotPassword = async () => {
                if (!email) {
                    alert("Please enter your email address in the Email field first, then click 'Forgot Password?'.");
                    return;
                }
                try {
                    await sendPasswordResetEmail(auth, email);
                    alert(`Password reset link sent to ${email}! Please check your inbox and spam folder.`);
                } catch (error) {
                    alert("Failed to send reset email: " + error.message);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault(); //
                try { 
                    // 1. Authenticate with Firebase using the password
                    const userCredential = await signInWithEmailAndPassword(auth, email, password); //
                    

                    // 2. Save password for future biometric logins
                    localStorage.setItem(`pwd_${email.toLowerCase()}`, password); //

                    // 👇 --- NEW BIOMETRIC RE-LINKING LOGIC --- 👇
                    const storedBioIdBase64 = localStorage.getItem(`bio_${email.toLowerCase()}`); //
                    
                    // If device supports biometrics BUT they aren't saved in this browser yet
                    if (window.PublicKeyCredential && !storedBioIdBase64) { //
                        const wantBiometrics = window.confirm("Biometrics are not set up on this device/browser. Would you like to link your fingerprint or FaceID now for faster logins?");
                        
                        if (wantBiometrics) {
                            try {
                                // Trigger the device to create a new biometric credential
                                const biometricPromise = navigator.credentials.create({ //
                                    publicKey: { //
                                        challenge: window.crypto.getRandomValues(new Uint8Array(32)), //
                                        rp: { name: "Dualtech Portal" }, //
                                        user: { //
                                            id: window.crypto.getRandomValues(new Uint8Array(16)), //
                                            name: email.toLowerCase(), //
                                            displayName: "Trainee" //
                                        },
                                        pubKeyCredParams: [{ type: "public-key", alg: -7 }], //
                                        authenticatorSelection: { //
                                            authenticatorAttachment: "platform",  //
                                            userVerification: "required" //
                                        },
                                        timeout: 60000 //
                                    }
                                });

                                // Set a timeout so it doesn't hang forever
                                const timeoutPromise = new Promise((_, reject) => 
                                    setTimeout(() => reject(new Error("Biometric prompt timed out")), 15000) //
                                );

                                const cred = await Promise.race([biometricPromise, timeoutPromise]); //
                                
                                // Convert raw ID to base64 and save to localStorage
                                const bioId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId))); //
                                localStorage.setItem(`bio_${email.toLowerCase()}`, bioId); //
                                
                                // Optional: Update Firebase profile with the new credential ID
                                const profileRef = doc(db, 'artifacts', appId, 'users', userCredential.user.uid, 'profile', 'main'); //
                                await updateDoc(profileRef, { 
                                    biometricCredentialId: bioId, 
                                    deviceUsedToRegister: navigator.userAgent //
                                });

                                alert("Biometrics successfully linked to this device!");
                            } catch (bioErr) {
                                console.warn("Biometric setup failed or skipped.", bioErr); //
                                alert("Biometric setup was cancelled. You can try again next time you log in.");
                            }
                        }
                    }
                    // 👆 --- END NEW LOGIC --- 👆

                } catch (error) { 
                    alert("Login failed: " + error.message); //
                }
            };

            const searchStudent = async () => {
                setSearchError(''); setMatchedStudent(null);
                if(!studentIdSearch) return;
                const cleanSearchId = studentIdSearch.trim();
                
                try {
                    const registryRef = collection(db, 'artifacts', appId, 'public', 'data', 'trainees');
                    const q = query(registryRef, where('studentId', '==', cleanSearchId));
                    const snap = await getDocs(q);
                    
                    if (snap.empty) {
                        setSearchError(`Student ID "${cleanSearchId}" not found in masterlist.`);
                    } else {
                        const data = snap.docs[0].data();
                        
                        const traineeStatus = String(data.status || data.Status || '').trim();
                        const normalizedStatus = traineeStatus.toLowerCase();

                        // Added 'post-bstp' to the allowed statuses
                        if (normalizedStatus !== 'active' && normalizedStatus !== 'completed ipt' && normalizedStatus !== 'post-bstp') {
                            setSearchError(`Registration Blocked: Your current training status is marked as "${traineeStatus || 'Inactive'}". Please contact your Industrial Coordinator.`);
                            return;
                        }

                        if (data.isRegistered === true) {
                            setSearchError(`An account has already been registered for Student ID "${cleanSearchId}". Please go back and log in.`);
                            return; 
                        }

                        setMatchedStudent({ id: snap.docs[0].id, ...data });
                        
                        setMobileNo('');
                        setContactPerson('');
                        setContactPersonNo('');
                    }
                } catch (err) { setSearchError('Error searching database: ' + err.message); }
            };

            // Add this function inside AuthScreen
            const handleBiometricLogin = async (e) => {
                e.preventDefault(); //
                
                // Require email to identify which local credential to fetch
                if (!email) {
                    alert("Please enter your email address first so we know who is logging in."); //
                    return; //
                }

                try {
                    // 1. Fetch the saved Biometric ID for this specific user
                    const storedBioIdBase64 = localStorage.getItem(`bio_${email.toLowerCase()}`); //
                    if (!storedBioIdBase64) {
                        alert("Biometrics are not set up for this email on this device. Please log in using your password."); //
                        return; //
                    }
                    
                    const credentialIdArray = Uint8Array.from(atob(storedBioIdBase64), c => c.charCodeAt(0)); //
                    
                    // 2. Trigger the biometric prompt on the device
                    const assertion = await navigator.credentials.get({
                        publicKey: {
                            challenge: window.crypto.getRandomValues(new Uint8Array(32)), //
                            allowCredentials: [{
                                id: credentialIdArray, //
                                type: 'public-key' //
                            }],
                            userVerification: "required", //
                            timeout: 60000 //
                        }
                    });

                    if (assertion) {
                        // 3. BIOMETRICS VERIFIED! Log into Firebase silently.
                        const savedPassword = localStorage.getItem(`pwd_${email.toLowerCase()}`); //
                        
                        if (savedPassword) {
                            // Actually log the user into Firebase
                            await signInWithEmailAndPassword(auth, email, savedPassword); //
                        } else {
                            alert("We couldn't find your secure login token. Please log in with your password once to re-link your biometrics."); //
                        }
                    }
                } catch (error) {
                    console.error(error); //
                    alert("Biometric verification failed or was cancelled."); //
                }
            };

            const handleSendOTP = async (e) => {
                e.preventDefault();
                if (!privacyConsent) {
                    return alert("You must agree to the Data Privacy Notice.");
                }
                
                setRegLoading(true);
                setRegStatus('Sending SMS OTP...');

                try {
                    // 1. Generate a random 6-digit OTP
                    const newOtp = Math.floor(100000 + Math.random() * 900000).toString();
                    setExpectedOtp(newOtp);

                    // 2. Trigger your Google Apps Script Webhook
                    const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyP1dyFmg1nwNUzRmWRIW5nw16JGk6VntInUFrz4obTPzapJSopwwa4IAgtKwXDbU3B/exec";
                    await fetch(GAS_WEBHOOK_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({
                            action: "relayOTP", // <--- THIS IS THE MISSING PIECE
                            phone: mobileNo,    // or contactNo, depending on your state variable
                            message: `${mobileNo},Your Dualtech registration OTP is ${newOtp}`
                        })
                    });

                    // 3. Move to the OTP verification screen
                    setOtpStep(true);
                } catch (error) {
                    alert("Failed to send OTP: " + error.message);
                } finally {
                    setRegLoading(false);
                    setRegStatus('');
                }
            };

            const handleVerifyAndRegister = async (e) => {
                e.preventDefault();
                
                if (enteredOtp !== expectedOtp) {
                    return alert("Invalid OTP. Please check your text messages and try again.");
                }

                setRegLoading(true);
                window.isRegistering = true;
                setRegStatus('Creating your secure account...');

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    const deviceUsed = navigator.userAgent;

                    let bioId = null;
                    if (window.PublicKeyCredential) {
                        try {
                            // <-- Update status right before the prompt
                            setRegStatus('Prompting for Biometrics... Please check your screen.'); 
                            
                            const biometricPromise = navigator.credentials.create({
                                publicKey: {
                                    challenge: window.crypto.getRandomValues(new Uint8Array(32)),
                                    rp: { name: "Dualtech Portal" },
                                    user: {
                                        id: window.crypto.getRandomValues(new Uint8Array(16)),
                                        name: email.toLowerCase(),
                                        displayName: matchedStudent['Given'] || "Trainee"
                                    },
                                    pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                                    authenticatorSelection: {
                                        authenticatorAttachment: "platform", 
                                        userVerification: "required"
                                    },
                                    timeout: 60000
                                }
                            });

                            const timeoutPromise = new Promise((_, reject) => 
                                setTimeout(() => reject(new Error("Mobile biometric prompt timed out or blocked")), 8000)
                            );

                            const cred = await Promise.race([biometricPromise, timeoutPromise]);
                            
                            bioId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));

                            localStorage.setItem(`bio_${email.toLowerCase()}`, bioId);
                        } catch (bioErr) {
                            console.warn("User skipped or failed biometric setup.", bioErr);
                        }
                    }

                    setRegStatus('Finalizing registration details...'); // <-- Update status

                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                    await setDoc(profileRef, {
                        uid: user.uid, email: email.toLowerCase(),
                        studentId: matchedStudent['Student ID#'] || matchedStudent['studentId'] || "",
                        family: matchedStudent['Family'] || "", given: matchedStudent['Given'] || "",
                        middle: matchedStudent['Middle'] || "", suffix: matchedStudent['Suffix'] || "",
                        companyName: matchedStudent['Company Name'] || matchedStudent['companyName'] || "",
                        assignedIC: matchedStudent['Assigned IC'] || matchedStudent['assignedIC'] || "",
                        iptDateStart: matchedStudent['IPT Date Start'] || matchedStudent['iptDateStart'] || "",
                        iptDateEnd: matchedStudent['IPT Date End'] || matchedStudent['iptDateEnd'] || "",
                        contactNo: mobileNo || "", 
                        contactPerson: contactPerson || "", contactPersonNo: contactPersonNo || "",
                        deviceUsedToRegister: deviceUsed,
                        trustedDevices: [deviceUsed], 
                        biometricCredentialId: bioId,
                        fallbackPin: pin,
                        registeredAt: serverTimestamp(), role: 'trainee'
                    });

                    // ... (Keep the rest of your webhook and email verification logic exactly the same) ...

                    alert("Registration complete! Your mobile number has been verified. You can now log in.");
        
                    // Reset states
                    setIsRegistering(false);
                    setOtpStep(false);
                    setMatchedStudent(null);
                    setPin('');
                    setMobileNo('');
                    setContactPerson('');
                    setContactPersonNo('');

                                        Please follow the prompt on your device screen to scan your fingerprint or face.
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Emerald Accent Bar */}
                        <div className="absolute top-0 left-0 w-full h-2 bg-emerald-600"></div>
                        
                        <div className="text-center mb-8">
                            <div className="bg-emerald-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-600">

                            </div>
                            <h1 className="text-3xl font-black text-slate-800 dark:text-slate-100 mb-2 tracking-tight">Trainee Portal</h1>
                            <p className="text-slate-500 dark:text-slate-400 font-medium text-sm">{isRegistering ? (showInstructions ? "Registration Guidelines" : "Register your account") : "Sign in to your account"}</p>
                        </div>

                        {!isRegistering ? (
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>

                const R = 6371e3; 
                const p1 = lat1 * Math.PI/180;
                const p2 = lat2 * Math.PI/180;
                const dp = (lat2-lat1) * Math.PI/180;
                const dl = (lon2-lon1) * Math.PI/180;
                const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            };

                if (!currentStudentId) return;

                const q = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'), 
                    where('studentId', '==', currentStudentId)
                );
                
                const unsub = onSnapshot(q, snap => {
                    const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    data.sort((a, b) => {
                        let timeA = 0; let timeB = 0;
                        if (a.timestamp) timeA = a.timestamp?.toMillis ? a.timestamp.toMillis() : a.timestamp;
                        if (b.timestamp) timeB = b.timestamp?.toMillis ? b.timestamp.toMillis() : b.timestamp;
                        if (!timeA && a.date) timeA = new Date(a.date).getTime();
                        if (!timeB && b.date) timeB = new Date(b.date).getTime();
                        if (!timeA && a.importedAt) timeA = new Date(a.importedAt).getTime();
                        if (!timeB && b.importedAt) timeB = new Date(b.importedAt).getTime();
                        if (timeA === timeB) {
                            const tieA = a.importedAt ? new Date(a.importedAt).getTime() : 0;
                            const tieB = b.importedAt ? new Date(b.importedAt).getTime() : 0;
                            return tieB - tieA;
                        }
                        return timeB - timeA; 
                    });
                    
                    setHistory(data);
                });
                return () => unsub();
            }, [profile.studentId, profile["Student ID#"]]);

            // --- 4. Determine Current Pending Schedule ---
            const completedScheduleIds = history
                .filter(h => h.activityType === 'Online Schooling')
                .map(h => h.scheduleId)
                .filter(Boolean);
            
            const pendingSchedules = activeSchedules.filter(sch => !completedScheduleIds.includes(sch.id));
            const currentSchedule = pendingSchedules.length > 0 ? pendingSchedules[0] : null;

            useEffect(() => {
                if (currentSchedule) {
                    setOnlineForm(prev => ({
                        ...prev,
                        vflTopic: currentSchedule.vflTopic || '',
                        lsceTopic: currentSchedule.lsceTopic || ''
                    }));
                }
            }, [currentSchedule]);


            // Initialize Camera Scanner (Only if not online)[cite: 3, 4]
            const isOnlineAssigned = traineeRecord?.assignedVenueName === 'Online' || traineeRecord?.assignedVenue === 'Online';

            useEffect(() => {
                if (scannedData || isOnlineAssigned) return;
                const timer = setTimeout(() => {
                    if (!document.getElementById("trainee-qr-reader")) return;
                    try {
                        const scanner = new window.Html5QrcodeScanner("trainee-qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
                        scannerRef.current = scanner;
                        scanner.render((decodedText) => {
                            try {
                                const data = JSON.parse(decodedText);
                                if (!data.mentorUid) throw new Error("Invalid QR.");
                                handleScan(data);
                            } catch(e) {
                                setScanError("Invalid QR code format.");
                            }
                        }, () => {});
                    } catch (error) {
                        console.error("Scanner error:", error);
                    }
                }, 200);

                return () => {
                    clearTimeout(timer);
                    if (scannerRef.current) {
                        scannerRef.current.clear().catch(e => console.error(e));
                    }
                };
            }, [scannedData, isOnlineAssigned]);

            const handleScan = (data) => {
                if (scannerRef.current) scannerRef.current.clear();
                setLoadingLoc(true);
                setScanError("");
                
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const dist = getDistanceFromLatLonInM(pos.coords.latitude, pos.coords.longitude, data.lat, data.lng);
                        if (dist > 100) {
                            setScanError(`You are too far from the mentor (${Math.round(dist)} meters away). You must be within 100m.`);
                            setLoadingLoc(false);
                            return;
                        }

                        const currentDate = getLocalYYYYMMDD(new Date());
                        const currentHour = new Date().getHours();
                        if (data.date !== currentDate || data.qrHour !== currentHour) {
                            setScanError("This QR code has expired or is invalid for the current time.");
                            setLoadingLoc(false);
                            return;
                        }

                        setScannedData(data);
                        setLoadingLoc(false);
                    },
                    (err) => {
                        setScanError("Failed to get location. Please enable GPS/Location Services.");
                        setLoadingLoc(false);
                    },
                    { enableHighAccuracy: true }
                );
            };

            const handleSubmitAttendance = async () => {
                setSubmitting(true);
                const verified = await window.verifyBiometricsRef(user.uid);
                if (!verified) {
                    showToast("Biometric verification failed. Cannot submit attendance.", "error");
                    setSubmitting(false);
                    return;
                }

                try {
                    const payload = {
                        traineeUid: user.uid,
                        studentId: profile.studentId || profile["Student ID#"] || "",
                        traineeName: `${profile.given} ${profile.family}`,
                        company: profile.companyName || "",
                        mentorUid: scannedData.mentorUid,
                        mentorName: scannedData.mentorName,
                        date: scannedData.date,
                        time: scannedData.time,
                        activityType: scannedData.type,
                        topic: scannedData.topic,
                        hub: scannedData.venue, 
                        status: 'Pending Attendance',
                        timestamp: new Date().getTime()
                    };
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'), payload);
                    alert("Attendance submitted! Please ask your mentor to verify it on their screen.");
                    setScannedData(null);
                } catch (e) {
                    alert("Database Error: " + e.message);
                }
                setSubmitting(false);
            };

            // Generate QR with Location & Time[cite: 3, 4]
            const handleGenerateTraineeQR = () => {
                setGeneratingQR(true);
                setQrGenError("");

                if (!navigator.geolocation) {
                    setQrGenError("Geolocation is not supported by your browser.");
                    setGeneratingQR(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const now = new Date();
                        const dateString = now.toLocaleDateString('en-US');
                        const timeString = now.toLocaleTimeString('en-US', {
                            hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
                        });

                        const payload = {
                            studentId: profile.studentId || profile["Student ID#"] || "",
                            traineeName: `${profile.given} ${profile.family}`,
                            companyName: profile.companyName || "",
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            date: dateString,
                            time: timeString
                        };

                        setTraineeQRData(payload);
                        setShowTraineeQR(true);
                        setGeneratingQR(false);
                    },
                    (err) => {
                        setQrGenError("Failed to get location. Please enable GPS/Location Services.");
                        setGeneratingQR(false);
                    },
                    { enableHighAccuracy: true }
                );
            };

            const fileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const handleOnlineSubmit = async (e) => {
                e.preventDefault();
                if (!vflFile || !lsceFile || !drEntryFile) return alert("Please upload photos for VFL, LSCE, and DR Entry.");
                if (!currentSchedule) return alert("No active schedule found to submit against.");
                
                setSubmittingOnline(true);
                try {
                    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtohUYD5UCg1UNt0WoHJUbNlz1ySnssxbktJIc7Qi-9YCdD78RJ-eLSs7YLKIeq20MUQ/exec"; 

                    const [compressedVfl, compressedLsce, compressedDr] = await Promise.all([
                        compressImage(vflFile),
                        compressImage(lsceFile),
                        compressImage(drEntryFile)
                    ]);
                    
                    const [vflBase64, lsceBase64, drBase64] = await Promise.all([
                        fileToBase64(compressedVfl),
                        fileToBase64(compressedLsce),
                        fileToBase64(compressedDr)
                    ]);
                    
                    const response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            studentId: profile.studentId || profile["Student ID#"] || "",
                            traineeName: `${profile.given} ${profile.family}`,
                            company: profile.companyName || "",
                            vflTopic: onlineForm.vflTopic,
                            lsceTopic: onlineForm.lsceTopic,
                            notes: onlineForm.notes,
                            vflFile: {
                                fileName: `${user.uid}_${Date.now()}_VFL_${vflFile.name}`,
                                fileBase64: vflBase64,
                                mimeType: "image/jpeg"
                            },
                            lsceFile: {
                                fileName: `${user.uid}_${Date.now()}_LSCE_${lsceFile.name}`,
                                fileBase64: lsceBase64,
                                mimeType: "image/jpeg"
                            },
                            drEntryFile: {
                                fileName: `${user.uid}_${Date.now()}_DR_${drEntryFile.name}`,
                                fileBase64: drBase64,
                                mimeType: "image/jpeg"
                            }
                        })
                    });
                    
                    const result = await response.json();
                    if (!result.success) throw new Error(result.error);

                    const payload = {
                        scheduleId: currentSchedule.id,
                        traineeUid: user.uid,
                        studentId: profile.studentId || profile["Student ID#"] || "",
                        traineeName: `${profile.given} ${profile.family}`,
                        company: profile.companyName || "",
                        venue: 'Online',
                        date: getLocalYYYYMMDD(new Date()),
                        time: new Date().toLocaleTimeString(),
                        activityType: 'Online Schooling',
                        vflTopic: onlineForm.vflTopic,
                        lsceTopic: onlineForm.lsceTopic,
                        notes: onlineForm.notes,
                        vflDriveUrl: result.vflDriveUrl || "",
                        lsceDriveUrl: result.lsceDriveUrl || "",
                        drEntryDriveUrl: result.drEntryDriveUrl || "",
                        status: 'Pending Verification',
                        timestamp: new Date().getTime()
                    };
                    
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'), payload);
                    
                    alert("Online Schooling submitted successfully via Google Apps Script!");
                    setVflFile(null);
                    setLsceFile(null);
                    setDrEntryFile(null);
                    setOnlineForm({ vflTopic: '', lsceTopic: '', notes: '' });
                    
                } catch (error) {
                    console.error("Upload Error:", error);
                    alert("Submission failed: " + error.message);
                }
                setSubmittingOnline(false);
            };

            // --- FILTER & WEIGHT LOGIC ---[cite: 3, 4]
            const getMeetingCredits = (record) => {
                const locationText = `${record.hub || ''} ${record.venue || ''} ${record.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                const combinedText = `${record.activityType || ''} ${record.type || ''} ${record.topic || ''} ${record.rawSheetData?.['Topic'] || ''} ${locationText}`.toUpperCase();
                
                if (combinedText.includes('RETREAT')) return 4;
                if (combinedText.includes('PDS9') || combinedText.includes('PDS 9') || 
                    combinedText.includes('PDS18') || combinedText.includes('PDS 18')) return 2;
                
                return 1;
            };

            const schoolingRecords = history.filter(h => {
                const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                
                const isSchooling = combinedText.includes('SCHOOLING') || 
                                    combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || 
                                    combinedText.includes('PDS') || 
                                    combinedText.includes('RETREAT');
                
                if (!isSchooling) return false;
                return ['Present', 'Late', 'Verified', 'Pending Verification', 'Pending Attendance'].includes(h.status);
            });

            const attendedCount = schoolingRecords.reduce((total, h) => {
                if (['Present', 'Late', 'Verified'].includes(h.status)) {
                    return total + getMeetingCredits(h);
                }
                return total;
            }, 0);

            return (
                <div className="space-y-6 pb-20">
                    <div>
                        <h2 className="text-2xl font-black text-slate-800 dark:text-slate-100 flex items-center gap-2"><BookOpen className="text-emerald-600"/> Schooling & PDS</h2>
                        <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">
                            {isOnlineAssigned 
                                ? "Complete your online schooling activities and submit your output here." 
                                : "Scan your mentor's QR code to log attendance or generate your own for them to scan."}
                        </p>
                    </div>

                    {isOnlineAssigned ? (
                        /* ================= ONLINE SCHOOLING VIEW ================= */
                        <div className="space-y-6 animate-fade-in">
                            {!currentSchedule ? (
                                <div className="bg-emerald-50 border border-emerald-200 p-8 rounded-3xl text-center shadow-sm">
                                    <CheckCircle2 className="w-16 h-16 text-emerald-500 mx-auto mb-4" />
                                    <h2 className="text-xl font-bold text-emerald-800 mb-2">All Caught Up!</h2>
                                    <p className="text-emerald-600 text-sm max-w-sm mx-auto">
                                        {activeSchedules.length > 0 
                                            ? "You have successfully submitted your outputs for all currently active online activities. Your mentor will verify your submissions."
                                            : "There are currently no active online schooling assignments scheduled for you."}
                                    </p>
                                </div>
                            ) : (
                                <>
                                    {/* Assignment Details Display */}
                                    <div className="bg-blue-50 border border-blue-200 p-6 rounded-3xl shadow-sm">
                                        <h3 className="font-black text-blue-900 mb-2 flex items-center gap-2">
                                            <BookOpen size={20} className="text-blue-600" /> Current Assignment
                                        </h3>
                                        <div className="space-y-3 mt-4">
                                            <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-blue-100 shadow-sm">
                                                <div className="mb-3 border-b border-slate-100 dark:border-slate-800 pb-3">
                                                    <p className="text-xs font-bold text-emerald-600 uppercase">VFL: {currentSchedule.vflTopic}</p>
                                                    {currentSchedule.vflVideoLink && (
                                                        <a href={currentSchedule.vflVideoLink} target="_blank" rel="noreferrer" className="text-sm text-blue-600 underline font-medium mt-1 block">
                                                            Watch VFL Video
                                                        </a>
                                                    )}
                                                </div>
                                                <div>
                                                    <p className="text-xs font-bold text-blue-600 uppercase">LSCE: {currentSchedule.lsceTopic}</p>
                                                    {currentSchedule.lsceVideoLink && (
                                                        <a href={currentSchedule.lsceVideoLink} target="_blank" rel="noreferrer" className="text-sm text-blue-600 underline font-medium mt-1 block">
                                                            Watch LSCE Video
                                                        </a>
                                                    )}
                                                </div>
                                                <p className="text-[10px] text-slate-400 mt-4 font-bold uppercase tracking-wider text-right">
                                                    Due by: {new Date(currentSchedule.viewableUntil).toLocaleDateString('en-US')}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Submission Form */}
                                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                                        <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-4">
                                            <FileText size={20} className="text-emerald-500" /> Submit Output
                                        </h3>
                                        <form onSubmit={handleOnlineSubmit} className="space-y-5">
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-emerald-600 uppercase mb-1">VFL Title for the Week</label>
                                                    <input 
                                                        type="text" 
                                                        value={onlineForm.vflTopic} 
                                                        onChange={e => setOnlineForm({...onlineForm, vflTopic: e.target.value})} 
                                                        className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm" 
                                                        required 
                                                        placeholder="Enter VFL Title" 
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-blue-600 uppercase mb-1">LSCE Title for the Week</label>
                                                    <input 
                                                        type="text" 
                                                        value={onlineForm.lsceTopic} 
                                                        onChange={e => setOnlineForm({...onlineForm, lsceTopic: e.target.value})} 
                                                        className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm" 
                                                        required 
                                                        placeholder="Enter LSCE Title" 
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Additional Notes / Insights (Optional)</label>
                                                <textarea value={onlineForm.notes} onChange={e=>setOnlineForm({...onlineForm, notes: e.target.value})} className="w-full p-4 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-emerald-500 text-sm resize-none" rows="3" placeholder="Any additional insights or notes (optional)"></textarea>
                                            </div>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-5 border-slate-100 dark:border-slate-800">
                                                {/* VFL PHOTO UPLOAD */}
                                                <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-slate-800">
                                                    <label className="block text-xs font-bold text-emerald-600 uppercase mb-1">Upload VFL Output</label>
                                                    <p className="text-[10px] text-slate-500 dark:text-slate-400 mb-3">Attach a photo of your Value Formation activity.</p>
                                                    <input type="file" required accept="image/*" onChange={(e) => setVflFile(e.target.files[0])}
                                                        className="w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                                                </div>

                                                {/* LSCE PHOTO UPLOAD */}
                                                <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-slate-800">
                                                    <label className="block text-xs font-bold text-blue-600 uppercase mb-1">Upload LSCE Output</label>
                                                    <p className="text-[10px] text-slate-500 dark:text-slate-400 mb-3">Attach a photo of your Life Skills / Tech activity.</p>
                                                    <input type="file" required accept="image/*" onChange={(e) => setLsceFile(e.target.files[0])}
                                                        className="w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                                                </div>

                                                {/* DR ENTRY PHOTO UPLOAD */}
                                                <div className="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-slate-800">
                                                    <label className="block text-xs font-bold text-purple-600 uppercase mb-1">Upload DR Entry</label>
                                                    <p className="text-[10px] text-slate-500 dark:text-slate-400 mb-3">Attach a photo of your DR Entry.</p>
                                                    <input type="file" required accept="image/*" onChange={(e) => setDrEntryFile(e.target.files[0])}
                                                        className="w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100" />
                                                </div>
                                            </div>

                                            <button disabled={submittingOnline} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-md disabled:opacity-50 transition-colors flex justify-center items-center gap-2 mt-4">
                                                {submittingOnline ? <><Loader2 size={18} className="animate-spin" /> Submitting Activities...</> : 'Submit Online Schooling'}
                                            </button>
                                        </form>
                                    </div>
                                </>
                            )}
                        </div>
                    ) : (
                        /* ================= OFFLINE/ONSITE QR VIEW ================= */
                        <>
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 text-center transition-all">
                                <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4 flex justify-center items-center gap-2">
                                    <QrCode size={20} className="text-emerald-500" /> My Attendance QR
                                </h3>
                                
                                {!showTraineeQR ? (
                                    <div className="flex flex-col items-center">
                                        {qrGenError && <p className="text-red-500 text-xs font-bold mb-3 bg-red-50 p-2 rounded-lg border border-red-100">{qrGenError}</p>}
                                        <button 
                                            onClick={handleGenerateTraineeQR}
                                            disabled={generatingQR}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition-colors w-full max-w-sm mx-auto disabled:opacity-50 flex items-center justify-center gap-2"
                                        >
                                            {generatingQR ? <><Loader2 className="animate-spin" size={18}/> Getting Location...</> : 'Generate My QR Code'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center animate-fade-in">
                                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4">
                                            <QRCodeSVG value={JSON.stringify(traineeQRData)} size={200} level="H" />
                                        </div>
                                        <p className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">
                                            Present this to your Mentor
                                        </p>
                                        <p className="text-[10px] text-slate-400 mb-4">
                                            Generated on: {traineeQRData.date} at {traineeQRData.time}
                                        </p>
                                        <button 
                                            onClick={() => {
                                                setShowTraineeQR(false);
                                                setTraineeQRData(null);
                                            }}
                                            className="text-slate-400 hover:text-slate-600 font-bold text-sm transition-colors"
                                        >
                                            Close QR Code
                                        </button>
                                    </div>
                                )}
                            </div>
                            
                            {!scannedData ? (
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                                    <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-4 text-center">Scan Mentor's QR Code</h3>
                                    {scanError && <div className="bg-red-50 text-red-600 p-4 rounded-xl mb-4 text-sm font-bold text-center border border-red-100">{scanError}</div>}
                                    {loadingLoc ? (
                                        <div className="flex flex-col items-center justify-center p-10 text-emerald-600"><Loader2 className="animate-spin mb-3" size={40}/> <span className="font-bold">Verifying Location...</span></div>
                                    ) : (
                                        <div id="trainee-qr-reader" className="w-full max-w-sm mx-auto overflow-hidden rounded-2xl border-2 border-slate-100 dark:border-slate-800"></div>
                                    )}
                                </div>
                            ) : (
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 max-w-sm mx-auto text-center border-t-4 border-t-emerald-500 animate-fade-in">
                                    <div className="bg-emerald-100 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><MapPin size={32}/></div>
                                    <p className="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-1">Location Verified</p>
                                    <h3 className="font-black text-slate-800 dark:text-slate-100 text-2xl mb-1">{scannedData.topic}</h3>
                                    <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm">{scannedData.type} • {scannedData.venue}</p>
                                    <button onClick={handleSubmitAttendance} disabled={submitting} className="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-bold py-4 rounded-2xl shadow-md disabled:opacity-50 flex items-center justify-center gap-2">
                                        {submitting ? <><Loader2 className="animate-spin" size={18}/> Verifying Identity...</> : 'Submit Attendance'}
                                    </button>
                                    <button onClick={() => setScannedData(null)} disabled={submitting} className="mt-4 text-slate-400 hover:text-slate-600 text-sm font-bold">Cancel</button>
                                </div>
                            )}
                        </>
                    )}
                    
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">

        const verifyBiometrics = async (uid) => {
            if (!window.PublicKeyCredential) {
                console.warn("Biometrics not supported on this browser.");
                return true; 
            }

            try {
                // Notice it now uses 'uid' instead of 'user.uid'
                const profileRef = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'main');
                const profileSnap = await getDoc(profileRef);
                
                if (!profileSnap.exists() || !profileSnap.data().biometricCredentialId) {
                    console.warn("No biometric credential found on this profile.");
                    showToast("No biometric data found for this account. Proceeding with standard clock-in.", "error");
                    return true; 
                }

                const profileData = profileSnap.data();

                const binaryString = window.atob(profileData.biometricCredentialId);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                await navigator.credentials.get({
                    publicKey: {
                        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
                        allowCredentials: [{
                            type: 'public-key',
                            id: bytes.buffer
                        }],
                        userVerification: "required",
                        timeout: 60000
                    }
                });
                
                return true; 
            } catch (error) {
                console.error("Biometric error:", error);
                return false; 
            }
        };

        // --- DILIGENCE REPORT TAB ---
        function DiligenceReportTab({ profile }) {
            const [traineeData, setTraineeData] = useState(null);
            const [meetingLogs, setMeetingLogs] = useState([]);
            const [vouchers, setVouchers] = useState([]);

            useEffect(() => {
                if (!profile?.studentId) return;

                // 1. Fetch Trainee Master Data (for Merit Points, IC Notes, & IPT Dates)
                const unsubscribeTrainee = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'trainees'), (snap) => {
                    const match = snap.docs.find(doc => {
                        const d = doc.data();
                        return (d.studentId === profile.studentId) || (d['Student ID#'] === profile.studentId);
                    });

                        setTraineeData({ id: match.id, ...match.data() });
                    }
                    setLoadingTrainee(false);

                // 2. Fetch Official Coaching Meetings
                const qMeetings = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'meetings'), 
                    where('studentId', '==', profile.studentId)
                );

                    setLoadingMeetings(false);

                // 3. Fetch Performance Vouchers
                const qVouchers = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'performanceVouchers'),
                    where('studentId', '==', profile.studentId)
                );

                const unsubscribeVouchers = onSnapshot(qVouchers, (snap) => {
                    const vData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setVouchers(vData);
                    setLoadingVouchers(false);
                });

                return () => {
                    unsubscribeTrainee();
                    unsubscribeMeetings();
                    unsubscribeVouchers();
                };
            }, [profile]);

            // Helper function to generate weeks from Portal Registration to IPT End
            const getGeneratedWeeks = () => {
                // UPDATED: Shift baseline from IPT Start Date to when the trainee actually registered in the portal
                if (!profile?.registeredAt) return [];
                
                // Safely convert Firestore Timestamp or standard ISO strings to a JS Date Object
                const start = profile.registeredAt.toDate ? profile.registeredAt.toDate() : new Date(profile.registeredAt);
                const endStr = traineeData?.iptDateEnd || traineeData?.IptDateEnd;
                
                // If end date isn't set yet, default to today's date + 1 week so they can still log tasks
                const end = endStr ? new Date(endStr) : new Date(new Date().setDate(new Date().getDate() + 7)); 
                
                const weeks = [];
                let current = new Date(start.getFullYear(), start.getMonth(), start.getDate()); // Normalize to midnight local time
                let weekNo = 1;

                while (current <= end) {
                    let weekStart = new Date(current);
                    let weekEnd = new Date(current);
                    weekEnd.setDate(weekEnd.getDate() + 6); // 7-day tracking window

                    // Cap the final week's endpoint to the exact official IPT End Date
                    if (endStr && weekEnd > new Date(endStr)) {
                        weekEnd = new Date(endStr);
                    }

                    weeks.push({
                        weekNo,
                        periodCovered: `${weekStart.toLocaleDateString()} - ${weekEnd.toLocaleDateString()}`
                    });

                    current.setDate(current.getDate() + 7);
                    weekNo++;
                }
                return weeks;
            };

                                                {voucher && (

                            console.error("Auto-clock out failed:", err);

                    } else {
                        // The session is open and under 15 hours old. Keep them clocked in!
                        isCurrentlyClockedIn = true;
                        currentActiveDocId = activeLog.id;
                    }
                }

                // Update UI state based on the check above
                setClockState({ isClockedIn: isCurrentlyClockedIn, activeDocId: currentActiveDocId });
                setAllLogs(logs);
                // -----------------------------------------

                // Fetch Absences and Disputes from the Central Requests Collection
                const requestsRef = collection(db, 'artifacts', appId, 'public', 'data', 'requests');
                const reqQ = query(requestsRef, where('uid', '==', user.uid));
                const reqSnap = await getDocs(reqQ);
                
                const allReqs = reqSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                allReqs.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                // UPDATED: Filter absence records to only count those logged ON or AFTER portal registration
                const regDate = profile?.registeredAt?.toDate ? profile.registeredAt.toDate() : (profile?.registeredAt ? new Date(profile.registeredAt) : null);
                
                const absReqs = allReqs.filter(r => {
                    const isAbsenceType = r.type === 'Scheduled Absence' || r.type === 'Emergency Absence';
                    if (!isAbsenceType) return false;
                    if (!regDate) return true; // Fallback if registration timestamp isn't loaded yet
                    
                    const logDate = new Date(r.absenceDate || r.date || r.createdAt);
                    // Standardize to midnight timestamps for clean comparative logic
                    const normalizedRegTime = new Date(regDate.getFullYear(), regDate.getMonth(), regDate.getDate()).getTime();
                    const normalizedLogTime = new Date(logDate.getFullYear(), logDate.getMonth(), logDate.getDate()).getTime();
                    
                    return normalizedLogTime >= normalizedRegTime;
                });
                
                setAbsenceLogs(absReqs);
                
                // Fetch Make-ups (Keeping Makeups private for now, assuming HR manages it elsewhere)
                const makeupsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'makeups');
                const mSnap = await getDocs(query(makeupsRef, orderBy('timestamp', 'desc')));
                setMakeupLogs(mSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            };


            const verifyLocationAndDevice = async (lat, lon) => {
                const currentDevice = navigator.userAgent;
                const trustedList = profile.trustedDevices || [];
                
                if (profile.deviceUsedToRegister && !trustedList.includes(profile.deviceUsedToRegister)) {
                    trustedList.push(profile.deviceUsedToRegister); 
                }

                // --- FIX 3: HARDWARE SIGNATURE CHECK ---
                // Ignores minor browser updates so they don't get blocked constantly
                const getHardwareSignature = (ua) => {
                    if (/iPhone|iPad|iPod/i.test(ua)) return "Apple Mobile Device";
                    const androidMatch = ua.match(/Android[^;]*;([^)]+)/);
                    if (androidMatch) return androidMatch[1].replace(/wv/ig, '').trim(); 
                    return ua.split(' ')[0]; 
                };

                const currentHardware = getHardwareSignature(currentDevice);
                const isSameDevice = trustedList.some(trusted => getHardwareSignature(trusted) === currentHardware);

                // Auto-trust if it's the same physical phone but slightly updated browser
                if (isSameDevice && !trustedList.includes(currentDevice)) {
                    try {
                        const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                        updateDoc(profileRef, { trustedDevices: [...trustedList, currentDevice] });
                        profile.trustedDevices.push(currentDevice); 
                    } catch (e) { console.warn("Failed auto-trust"); }
                }

                let locStatus = "Acknowledged";
                let locWarning = "";

                try {
                    // FIX: Check if online before fetching geofences to prevent infinite hanging
                    if (!navigator.onLine) {
                        locStatus = "Acknowledged (Offline Log - Geofence validation skipped)";
                        } else {
                            const geofencesRef = collection(db, 'artifacts', appId, 'public', 'data', 'geofences');
                            const q = query(geofencesRef, where('company', '==', profile.companyName));
                            
                            // FIX: Add a 5-second timeout for the company geofence check
                            const snap = await Promise.race([
                                getDocs(q),
                                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
                            ]);

                            if (!snap.empty) {
                                let isWithinAnyBranch = false;
                                let minDistance = Infinity;
                                let matchedBranch = "";

                                snap.docs.forEach(doc => {
                                    const fence = doc.data();
                                    const dist = getDistanceFromLatLonInM(lat, lon, fence.latitude, fence.longitude);
                                    if (dist < minDistance) minDistance = dist; 
                                    if (dist <= fence.radius) {
                                        isWithinAnyBranch = true;
                                        matchedBranch = fence.label || fence.branch || "Company Area";
                                    }
                                });

                                if (isWithinAnyBranch) {
                                    locStatus = `Verified at ${matchedBranch}`;
                                } else {
                                    locWarning = `Outside Geofence by ${Math.round(minDistance)}m. `;
                                }
                            } else {
                                locStatus = "Acknowledged (Company location not yet specified)";
                            }
                        }
                } catch (error) {
                    locStatus = "Acknowledged (Location checking unavailable)";
                }

                let finalWarning = locWarning;
                if (!isSameDevice) finalWarning += "Unrecognized Device used. ";

                if (finalWarning !== "") {
                    setLocationMsg(`BLOCKED: ${finalWarning}`);
                    if (!isSameDevice) return "UnrecognizedDevice"; 
                    return "Blocked";
                } else {
                    setLocationMsg(`Status: ${locStatus} (Device Verified)`);
                    return locStatus;
                }

            // Generates the QR Code for Google Authenticator Setup
            const handleSetupGoogleAuth = () => {

                    issuer: profile.companyName || profile.company || "Dualtech",

            // Verifies the first code to finalize setup AND trusts the device

                    secret: window.OTPAuth.Secret.fromBase32(tempSecret)
                });
                
                if (totp.validate({ token: enteredCode, window: 1 }) !== null) {
                    const currentDevice = navigator.userAgent;

                    showToast("Google Authenticator linked! This device is now permanently recognized.", "success");
                    setTotpSetupUri('');
                    
                    // Optional: You can automatically trigger handleClock here if you want them to clock in/out immediately!
                } else {

                }
            };

            // Verifies code during clock-in on an Unrecognized Device
            const verifyTotpAndClock = async () => {

                });

                if (totp.validate({ token: totpInput, window: 1 }) !== null) {

                    // Update the database
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'main'), {
                        trustedDevices: [...(profile.trustedDevices || []), newDevice]
                    });
                    
                    // --- FIX 2: INSTANTLY TRUST DEVICE LOCALLY ---
                    // Stops the system from reading stale data a millisecond later!
                    if (!profile.trustedDevices) profile.trustedDevices = [];
                    if (!profile.trustedDevices.includes(newDevice)) {
                        profile.trustedDevices.push(newDevice);
                    }
                    
                    setRequireTotp(false);

                    showToast("Device verified! Proceeding with clock out...", "success");

            const initiateClockFlow = async (actionType) => {

            // --- ATTENDANCE DISPUTE LOGIC ---
            const handleTimeAction = async (actionType, preLat = null, preLon = null) => {
                const action = actionType.toLowerCase();

                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'trainees'), where('userId', '==', user.uid));

                    }
                } catch (err) {
                    console.error("Direct fetch failed:", err);
                }

                // Check if today matches the fetched schedule (or defaults)
                const isSchooling = (foundSchooling === currentDay);
                const isRest = (foundRest === currentDay);
                
                if (isSchooling || isRest) {
                    setPendingAction(action);
                    setDisputeType('Schedule');
                    setShowDisputeModal(true);
                } else {
                    // Pass the coordinates down to handleClock
                    handleClock(action, 'Normal', '', preLat, preLon);
                }
            };


            // Notice we made this function 'async'
            const handleClock = async (rawType, overrideStatus = 'Normal', overrideReason = '', preLat = null, preLon = null) => {
                const type = rawType.toLowerCase(); 

                if (!isActive) return showToast("Your account is not Active. Clocking functions are disabled.", "error");

                if (overrideStatus === 'Normal') {

                            isVerified = true;

                            showToast("Error: Incorrect PIN. Clock-in cancelled.", "error");
                            return;
                        }
                    }
                }

                setLocationMsg(''); 
                setLoadingLoc(true);
