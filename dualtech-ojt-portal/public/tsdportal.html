        };

        const ConcernsView = () => {
            const [concerns, setConcerns] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedConcern, setSelectedConcern] = useState(null);

            const [selectedIds, setSelectedIds] = useState([]); // Add this

            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    setSelectedIds(filteredConcerns.map(c => c.id));
                } else {
                    setSelectedIds([]);
                }
            };

            const handleSelect = (id) => {
                setSelectedIds(prev => 
                    prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
                );
            };

            const handleDeleteSelected = async () => {
                if (!window.confirm(`Delete ${selectedIds.length} concern(s)?`)) return;
                
                const APP_ID = "dualtech-ojt-portal";
                const batch = db.batch();
                
                selectedIds.forEach(id => {
                    const ref = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('concerns').doc(id);
                    batch.delete(ref);
                });
                
                await batch.commit();
                setSelectedIds([]); // Reset selection
            };
            
            const [statusUpdate, setStatusUpdate] = useState('');
            const [adminNote, setAdminNote] = useState('');
            const [updating, setUpdating] = useState(false);

            const [senderFilter, setSenderFilter] = useState('All');

            useEffect(() => {
                const APP_ID = "dualtech-ojt-portal";
                const unsubscribe = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('concerns')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = [];
                        snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                        setConcerns(data);
                        setLoading(false);
                    }, error => {
                        // Add this error callback to see if Firebase is blocking the read!
                        console.error("Firebase Snapshot Error:", error);
                        alert("Error loading concerns: " + error.message);
                    });
                return () => unsubscribe();
            }, []);

            // NEW: Calculate if concern is older than 3 working days
            const checkIsOverdue = (dateInput, status) => {
                if (status === 'Resolved' || status === 'Closed') return false;
                
                // Safely handle Firebase Timestamp objects coming from the IC Portal
                let startDate;
                if (dateInput && typeof dateInput.toDate === 'function') {
                    startDate = dateInput.toDate();
                } else {
                    startDate = new Date(dateInput);
                }
                
                if (isNaN(startDate.getTime())) return false;
                
                const today = new Date();
                let workingDaysCount = 0;
                let currentDate = new Date(startDate);
                currentDate.setDate(currentDate.getDate() + 1);

                while (currentDate <= today) {
                    const dayOfWeek = currentDate.getDay();
                    // 0 is Sunday, 6 is Saturday
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) { 
                        workingDaysCount++;
                    }
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                return workingDaysCount >= 3;
            };

            const filteredConcerns = concerns.filter(concern => {
                if (senderFilter === 'IC') return concern.source === 'IC Portal' || concern.icName;
                if (senderFilter === 'Trainees') return concern.source !== 'IC Portal' && !concern.icName;
                return true;
            });

            const handleOpenModal = (concern) => {
                setSelectedConcern(concern);
                setStatusUpdate(concern.status || 'Pending');
                setAdminNote(concern.adminNote || '');
            };

            const handleUpdateConcern = async (e) => {
                e.preventDefault();
                if (!selectedConcern) return;
                
                setUpdating(true);
                try {
                    const APP_ID = "dualtech-ojt-portal";
                    const currentUser = firebase.auth().currentUser;
                    
                    // 1. Update the global concerns database (TSD View)
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('concerns').doc(selectedConcern.id).update({
                        status: statusUpdate,
                        adminNote: adminNote,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedBy: currentUser.email
                    });
                    await logSystemEvent('UPDATE', 'concerns', { id: selectedConcern.id, status: statusUpdate });

                    // 2. CRITICAL FIX: Sync the TSD reply back to the IC Portal's Company Profiles array
                    if (selectedConcern.source === 'IC Portal' && selectedConcern.company) {
                        const profilesRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('company_profiles');
                        const q = await profilesRef.where('companyName', '==', selectedConcern.company).get();
                        
                        if (!q.empty) {
                            const profileDoc = q.docs[0];
                            const profileData = profileDoc.data();
                            
                            // Map over the IC's concerns array and inject the TSD reply
                            const updatedConcerns = (profileData.concerns || []).map(c => {
                                if (c.text === selectedConcern.details) {
                                    return {
                                        ...c,
                                        // Map TSD 'Closed' to IC 'Resolved' to match their UI filters
                                        status: statusUpdate === 'Closed' ? 'Resolved' : statusUpdate, 
                                        updates: [
                                            ...(c.updates || []),
                                            {
                                                date: new Date().toLocaleDateString(),
                                                timestamp: Date.now(),
                                                text: `TSD Admin Reply: ${adminNote}`,
                                                addedBy: "TSD Admin"
                                            }
                                        ]
                                    };
                                }
                                return c;
                            });

                            await profilesRef.doc(profileDoc.id).update({ concerns: updatedConcerns });
                            await logSystemEvent('UPDATE', 'company_profiles_concerns', { company: selectedConcern.company, status: statusUpdate });
                        }
                    }
                    
                    setSelectedConcern(null);
                } catch (error) {
                    console.error("Error updating concern:", error);
                    alert("Failed to update concern status.");
                }
                setUpdating(false);
            };

            if (loading) return <div className="p-10 text-center text-slate-500 font-bold">Loading concerns...</div>;

            return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="flex justify-between items-center mb-8">

                        {selectedIds.length > 0 && (

                    {selectedConcern && (

                                <div className="overflow-y-auto flex-1 pr-2 space-y-4">

                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Category</p>

                                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                        <p className="text-[10px] text-blue-400 font-bold uppercase tracking-wider mb-1">Message Details</p>
                                        <p className="text-sm text-blue-900 whitespace-pre-wrap">{selectedConcern.details}</p>
                                    </div>

                                    {/* --- ADD THIS IMAGE BLOCK --- */}
                                    {(selectedConcern.driveUrl || selectedConcern.fileUrl || selectedConcern.proofUrl) && (
                                        <div className="mt-4">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Attached Image Preview</p>
                                            <img 
                                                src={selectedConcern.driveUrl || selectedConcern.fileUrl || selectedConcern.proofUrl} 
                                                alt="Concern Attachment" 
                                                className="max-w-full h-auto rounded-xl border border-slate-200 shadow-sm max-h-[400px] object-contain bg-slate-50"
                                            />

                                    )}
                                    {/* ---------------------------- */}

                                    {/* Image Preview for TSD Portal */}
                                    {(selectedConcern.driveUrl || selectedConcern.fileUrl || selectedConcern.proofUrl) && (
                                        <div className="mt-4 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Attached Image Preview</p>
                                            <img 
                                                src={selectedConcern.driveUrl || selectedConcern.fileUrl || selectedConcern.proofUrl} 
                                                alt="Concern Attachment" 
                                                className="max-w-full h-auto rounded-xl border border-slate-200 shadow-sm max-h-[400px] object-contain bg-white"
                                                onError={(e) => {
                                                    console.error("Failed URL:", e.target.src);
                                                    e.target.style.display = 'none'; // Hide the broken image if URL is invalid
                                                    console.error("Image failed to load");
                                                }}
                                            />

                                    <form onSubmit={handleUpdateConcern} className="border-t border-slate-200 pt-4 mt-4 space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Update Status</label>
                                            <select 
                                                value={statusUpdate} 
                                                onChange={e => setStatusUpdate(e.target.value)}
                                                className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 font-bold"
                                            >
                                                <option value="Pending">Pending</option>
                                                <option value="In Progress">In Progress</option>
                                                <option value="Resolved">Resolved</option>
                                                <option value="Closed">Closed</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Reply / Admin Notes</label>
                                            <textarea 
                                                value={adminNote} 
                                                onChange={e => setAdminNote(e.target.value)}
                                                placeholder="Add resolution notes or reply directly to the sender..."
                                                rows="3"
                                                className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 resize-none"
                                            />
                                            <p className="text-xs text-slate-400 mt-1 italic">Updates here will be visible to the IC / Trainee in their portal.</p>
                                        </div>

                                        <button type="submit" disabled={updating} className="w-full bg-primary-600 text-white font-bold py-3.5 rounded-xl hover:bg-primary-700 transition shadow-md disabled:opacity-70 flex justify-center items-center gap-2">
                                            {updating ? 'Saving Update...' : 'Save & Reply'}
                                        </button>

                                </div>

                        </div>
                    )}
                    

                    <div className="flex gap-2 mb-4">
                        {['All', 'Trainees', 'IC'].map(filter => (
                            <button 
                                key={filter}
                                onClick={() => setSenderFilter(filter)}
                                className={`px-4 py-2 rounded-xl text-sm font-bold transition-colors ${
                                    senderFilter === filter 
                                        ? 'bg-primary-600 text-white shadow-md' 
                                        : 'bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'
                                }`}
                            >
                                {filter === 'All' ? 'All Sources' : filter === 'IC' ? 'Industrial Coordinators' : 'Trainees'}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                    <tr>
                                        <th className="p-4 w-10">
                                            <input type="checkbox" onChange={handleSelectAll} checked={selectedIds.length === filteredConcerns.length && filteredConcerns.length > 0} />
                                        </th>
                                        <th className="p-4">Date</th>
                                        <th className="p-4">Sender</th>
                                        <th className="p-4">Category</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredConcerns.map(concern => {
                                        const isOverdue = checkIsOverdue(concern.createdAt, concern.status);
                                        
                                        // Also update how the date is displayed to handle Firebase Timestamps properly
                                        const displayDate = concern.createdAt?.toDate 
                                            ? concern.createdAt.toDate().toLocaleDateString() 
                                            : new Date(concern.createdAt).toLocaleDateString();
                                        
                                        return (
                                        <tr key={concern.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-4">
                                                <input type="checkbox" checked={selectedIds.includes(concern.id)} onChange={() => handleSelect(concern.id)} />
                                            </td>
                                            <td className="p-4 text-slate-600">
                                                {displayDate}
                                            </td>
                                            <td className="p-4">
                                                <div className="font-bold text-slate-800">{concern.traineeName || concern.icName}</div>
                                                <div className="text-xs text-slate-500">{concern.company}</div>
                                            </td>
                                            <td className="p-4 font-medium text-slate-700">{concern.typeOfConcern || 'General'}</td>
                                            <td className="p-4">
                                                <div className="flex flex-col gap-1 items-start">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${
                                                        concern.status === 'Resolved' ? 'bg-emerald-100 text-emerald-700' : 
                                                        concern.status === 'In Progress' ? 'bg-blue-100 text-blue-700' : 
                                                        concern.status === 'Closed' ? 'bg-slate-100 text-slate-600' :
                                                        'bg-amber-100 text-amber-700'
                                                    }`}>
                                                        {concern.status || 'Pending'}
                                                    </span>
                                                    {isOverdue && (
                                                        <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200 flex items-center gap-1">
                                                            <Icon name="alert-circle" size={10} /> Overdue (3+ Days)
                                                        </span>
                                                    )}
                                                </div>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => handleOpenModal(concern)} className="text-primary-600 hover:text-white bg-primary-50 hover:bg-primary-600 px-3 py-2 rounded-lg transition-colors border border-primary-200 hover:border-primary-600 font-bold text-xs inline-flex items-center gap-1">
                                                    <Icon name="edit-3" size={14} /> View / Reply
                                                </button>
                                            </td>
                                        </tr>
                                    )})}
                                    {concerns.length === 0 && (
                                        <tr>
                                            <td colSpan="5" className="p-8 text-center text-slate-400 italic">No concerns or feedback submitted yet.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AstpSchoolingDashboard = () => {
            const [groupedTrainees, setGroupedTrainees] = useState({});
            const [loading, setLoading] = useState(true);
            const [selectedMonth, setSelectedMonth] = useState(null);
            
            // Sub-graph state
            const [subGroupedTrainees, setSubGroupedTrainees] = useState(null);
            const [loadingSubGraph, setLoadingSubGraph] = useState(false);
            
            // Table state
            const [selectedSubGroup, setSelectedSubGroup] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: 'studentId', direction: 'asc' });
            
            // Profile modal state
            const [selectedTraineeProfile, setSelectedTraineeProfile] = useState(null);

            useEffect(() => {
                const fetchTrainees = async () => {
                    setLoading(true);
                    try {
                        const APP_ID = "dualtech-ojt-portal";
                        const traineesRef = firebase.firestore().collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees');
                        const traineesSnapshot = await traineesRef.get();
                        
                        let groups = {};
                        const currentDate = new Date();
                        
                        traineesSnapshot.forEach(doc => {
                            const data = doc.data();
                            const status = data.status || data.Status || '';
                            if (status !== 'Active' && status !== 'Completed') return;
                            
                            const iptStart = data['IPT Date Start'] || data.iptDateStart || data.startDate || '';
                            if (!iptStart) return;
                            
                            const startDate = new Date(iptStart);
                            if (isNaN(startDate)) return;
                            
                            // Weeks since IPT Date Start
                            const diffTime = currentDate - startDate;
                            const diffDays = diffTime / (1000 * 60 * 60 * 24);
                            const totalWeeks = Math.max(0, Math.floor(diffDays / 7));
                            const monthsDiff = Math.floor(diffDays / 30.44) + 1; // Approx months
                            
                            let category = '';
                            if (monthsDiff <= 3) {
                                category = 'Months 1 to 3';
                            } else if (monthsDiff <= 6) {
                                category = 'Months 4 to 6';
                            } else if (monthsDiff <= 9) {
                                category = 'Months 7 to 9';
                            } else if (monthsDiff <= 12) {
                                category = 'Months 10 to 12';
                            } else if (monthsDiff <= 15) {
                                category = 'Months 13 to 15';
                            } else if (monthsDiff <= 18) {
                                category = 'Months 16 to 18';
                            } else {
                                category = 'Completed IPT (More than 18 months)';
                            }
                            
                            if (!groups[category]) groups[category] = [];
                            groups[category].push({ 
                                id: doc.id, 
                                ...data, 
                                monthsDiff, 
                                totalWeeks 
                            });
                        });
                        
                        setGroupedTrainees(groups);
                    } catch (error) {
                        console.error("Error fetching trainees:", error);
                    }
                    setLoading(false);
                };
                fetchTrainees();
            }, []);

            const handleMainBarClick = async (monthCategory) => {
                if (selectedMonth === monthCategory) {
                    setSelectedMonth(null);
                    setSubGroupedTrainees(null);
                    setSelectedSubGroup(null);
                    return;
                }
                setSelectedMonth(monthCategory);
                setSelectedSubGroup(null);
                setLoadingSubGraph(true);
                
                const traineesInMonth = groupedTrainees[monthCategory] || [];
                const APP_ID = "dualtech-ojt-portal";
                const db = firebase.firestore();
                
                try {
                    // Extract unique identifiers for the selected trainees
                    const studentIds = [...new Set(traineesInMonth.map(t => String(t.studentId || t['Student ID#'] || '').trim()).filter(Boolean))];
                    const uids = [...new Set(traineesInMonth.map(t => String(t.uid || t.id || '').trim()).filter(Boolean))];
                    
                    const chunkArray = (arr, size) => {
                        const chunks = [];
                        for (let i = 0; i < arr.length; i += size) {
                            chunks.push(arr.slice(i, i + size));
                        }
                        return chunks;
                    };

                    const mentoringRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('mentoring_attendance');
                    const creditRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('schooling_credit_applications');
                    
                    const attendancePromises = [];
                    const creditAppsPromises = [];

                    // Chunk studentIds and build queries
                    if (studentIds.length > 0) {
                        chunkArray(studentIds, 10).forEach(chunk => {
                            if (chunk.length > 0) {
                                attendancePromises.push(mentoringRef.where('studentId', 'in', chunk).get());
                                attendancePromises.push(mentoringRef.where('Student ID#', 'in', chunk).get());
                                creditAppsPromises.push(creditRef.where('studentId', 'in', chunk).get());
                            }
                        });
                    }
                    
                    // Chunk uids and build queries
                    if (uids.length > 0) {
                        chunkArray(uids, 10).forEach(chunk => {
                            if (chunk.length > 0) {
                                attendancePromises.push(mentoringRef.where('uid', 'in', chunk).get());
                                attendancePromises.push(mentoringRef.where('traineeUid', 'in', chunk).get());
                            }
                        });
                    }

                    // Fetch all needed records concurrently
                    const [attendanceSnaps, creditAppsSnaps] = await Promise.all([
                        Promise.all(attendancePromises),
                        Promise.all(creditAppsPromises)
                    ]);

                    const attendanceByStudent = {};
                    attendanceSnaps.forEach(snap => {
                        snap.forEach(doc => {
                            const l = doc.data();
                            l.id = doc.id;
                            const id1 = String(l['Student ID#'] || l.studentId || '').trim();
                            const id2 = String(l.uid || l.traineeUid || '').trim();
                            if (id1) { if (!attendanceByStudent[id1]) attendanceByStudent[id1] = []; attendanceByStudent[id1].push(l); }
                            if (id2) { if (!attendanceByStudent[id2]) attendanceByStudent[id2] = []; attendanceByStudent[id2].push(l); }
                        });
                    });

                    const approvedCreditApps = [];
                    creditAppsSnaps.forEach(snap => {
                        snap.forEach(doc => {
                            const d = doc.data();
                            if (d.status === 'Approved') {
                                approvedCreditApps.push(d);
                            }
                        });
                    });

                    // Helper to get meeting credits
                    const getMeetingCredits = (h) => {
                        const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                        const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${h.rawSheetData?.['Topic'] || ''} ${locationText}`.toUpperCase();
                        if (combinedText.includes('RETREAT')) return 4;
                        if (combinedText.includes('PDS9') || combinedText.includes('PDS 9') || 
                            combinedText.includes('PDS18') || combinedText.includes('PDS 18')) return 2;
                        return 1; 
                    };

                    let enrichedTrainees = [];
                    
                    traineesInMonth.forEach(t => {
                        const sId = String(t.studentId || t['Student ID#'] || '').trim();
                        const uid = String(t.uid || t.id || '').trim();
                        
                        const studentLogsRaw = [];
                        if (sId && attendanceByStudent[sId]) studentLogsRaw.push(...attendanceByStudent[sId]);
                        if (uid && attendanceByStudent[uid]) studentLogsRaw.push(...attendanceByStudent[uid]);
                        
                        // deduplicate studentLogs by log.id
                        const studentLogs = Array.from(new Map(studentLogsRaw.map(l => [l.id, l])).values());
                        
                        const validSchoolingRecords = studentLogs.filter(h => {
                            const locationText = `${h.hub || ''} ${h.venue || ''} ${h.rawSheetData?.['Schooling / Mentoring Hub'] || ''}`;
                            const combinedText = `${h.activityType || ''} ${h.type || ''} ${h.topic || ''} ${locationText}`.toUpperCase();
                            const isSchooling = combinedText.includes('SCHOOLING') || combinedText.includes('MENTORING') || combinedText.includes('PERSONAL DEVELOPMENT SEMINAR') || combinedText.includes('PDS') || combinedText.includes('RETREAT');
                            if (!isSchooling) return false;
                            return ['Present', 'Late', 'Verified', 'Pending Verification', 'Pending Attendance'].includes(String(h.status).trim());
                        });

                        const totalActivitiesCredits = validSchoolingRecords.reduce((total, h) => {
                            if (['Present', 'Late', 'Verified'].includes(String(h.status).trim())) {
                                return total + getMeetingCredits(h);
                            }
                            return total;
                        }, 0);

                        const traineeApprovedCredits = approvedCreditApps
                            .filter(app => String(app.studentId || '').trim() === sId)
                            .reduce((sum, app) => sum + (app.creditsRequested || 0), 0);
                        const totalWithBonusCredits = totalActivitiesCredits + traineeApprovedCredits;

                        // Compute Weeks Lacking
                        const lacking = Math.max(0, t.totalWeeks - totalWithBonusCredits);
                        
                        enrichedTrainees.push({
                            ...t,
                            validSchoolingCount: totalWithBonusCredits,
                            lacking
                        });
                    });
                    
                    setSubGroupedTrainees({ [monthCategory]: enrichedTrainees });
                    setSelectedSubGroup(monthCategory);
                    
                } catch (error) {
                    console.error("Error fetching sub graph data:", error);
                }
                
                setLoadingSubGraph(false);
            };

            const handleSubBarClick = (subCategory) => {
                if (selectedSubGroup === subCategory) {
                    setSelectedSubGroup(null);
                    return;
                }
                setSelectedSubGroup(subCategory);
            };
            
            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const getSortedTrainees = () => {
                if (!selectedSubGroup || !subGroupedTrainees[selectedSubGroup]) return [];
                let list = [...subGroupedTrainees[selectedSubGroup]];
                
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    list = list.filter(t => {
                        const name = (t.name || t.Name || `${t.firstName || t.Given || t.given || ''} ${t.lastName || t.Family || t.family || ''}`).toLowerCase();
                        const company = (t.company || t.companyName || t['Company Name'] || '').toLowerCase();
                        const ic = (t.assignedIC || t.icName || t.Coordinator || '').toLowerCase();
                        return name.includes(query) || company.includes(query) || ic.includes(query);
                    });
                }

                list.sort((a, b) => {
                    let aVal = a[sortConfig.key] || a[Object.keys(a).find(k => k.toLowerCase() === sortConfig.key.toLowerCase())] || '';
                    let bVal = b[sortConfig.key] || b[Object.keys(b).find(k => k.toLowerCase() === sortConfig.key.toLowerCase())] || '';
                    
                    if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                    if (typeof bVal === 'string') bVal = bVal.toLowerCase();
                    
                    if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return list;
            };

            const mainCategories = ['Months 1 to 3', 'Months 4 to 6', 'Months 7 to 9', 'Months 10 to 12', 'Months 13 to 15', 'Months 16 to 18', 'Completed IPT (More than 18 months)'];
            const maxMainValue = Math.max(...mainCategories.map(cat => (groupedTrainees[cat] || []).length), 1);

            const [searchQuery, setSearchQuery] = useState('');
            const [hiddenColumns, setHiddenColumns] = useState({});
            const toggleColumn = (header) => {
                setHiddenColumns(prev => ({ ...prev, [header]: !prev[header] }));
            };

            const exportToXLS = () => {
                const trainees = getSortedTrainees();
                if (trainees.length === 0) return alert("No data to export.");

                const headers = ['Student ID#', 'Name', 'Company', 'Assigned IC', 'IPT Date Start', 'IPT Date End', 'Schooling Venue', 'Weeks Since IPT Started', 'Valid Weeks', 'Weeks Lacking', 'Portal Registration'].filter(h => !hiddenColumns[h]);

                let htmlTable = `<tr>${headers.map(h => `<th style="background-color: #4f46e5; color: white; font-weight: bold; border: 1px solid #ccc;">${h}</th>`).join('')}</tr>`;

                trainees.forEach((t, i) => {
                    const rowData = {
                        'Student ID#': t.studentId || t['Student ID#'] || 'N/A',
                        'Name': t.name || t.Name || `${t.firstName || t.Given || t.given || ''} ${t.lastName || t.Family || t.family || ''}`.trim() || 'N/A',
                        'Company': t.company || t.companyName || t['Company Name'] || 'N/A',
                        'Assigned IC': t.assignedIC || t.icName || t.Coordinator || 'N/A',
                        'IPT Date Start': t.iptDateStart || t['IPT Date Start'] || t.startDate || 'N/A',
                        'IPT Date End': t.iptDateEnd || t['IPT Date End'] || t.endDate || 'N/A',
                        'Schooling Venue': t.schoolingHub || t.hub || t.venue || t.schoolingVenue || 'N/A',
                        'Weeks Since IPT Started': t.totalWeeks,
                        'Valid Weeks': t.validSchoolingCount,
                        'Weeks Lacking': t.lacking,
                        'Portal Registration': t.registeredAt || t.isRegistered || t.uid ? 'Registered' : 'No'
                    };

                    const rowArr = headers.map(h => rowData[h] !== undefined && rowData[h] !== null ? rowData[h] : '');
                    const bg = i % 2 === 0 ? '#ffffff' : '#f8fafc';
                    htmlTable += `<tr style="background-color: ${bg};">${rowArr.map(cell => `<td style="border: 1px solid #ccc; mso-number-format:'\\@';">${cell}</td>`).join('')}</tr>`;
                });

                const template = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><table>${htmlTable}</table></body></html>`;
                const blob = new Blob([template], { type: 'application/vnd.ms-excel;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `ASTP_Schooling_${selectedSubGroup}_${new Date().getTime()}.xls`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="mb-8">
                        <h2 className="text-2xl font-black text-slate-800 dark:text-white">ASTP Schooling Dashboard</h2>
                        <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Active & Completed IPT Trainees categorized by months since IPT start.</p>
                    </div>

                    {loading ? (
                        <div className="text-center p-10 font-bold text-slate-500 dark:text-slate-400">Loading Dashboard...</div>
                    ) : (
                        <div className="space-y-8">
                            {/* MAIN GRAPH */}
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                <h3 className="text-lg font-bold text-slate-700 dark:text-slate-300 mb-6 uppercase tracking-wider text-xs">Distribution by Months Since IPT Start</h3>
                                <div className="space-y-3">
                                    {mainCategories.map(cat => {

        const AnnouncementsView = () => {
            const [announcements, setAnnouncements] = useState([]);
            const [companies, setCompanies] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Form States
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [targetGroup, setTargetGroup] = useState('All'); // 'All', 'Trainees', 'Coordinators'
            const [targetCompanies, setTargetCompanies] = useState(['All']);
            const [companySearchTerm, setCompanySearchTerm] = useState('');
            const [expirationDate, setExpirationDate] = useState('');

            useEffect(() => {
                const APP_ID = "dualtech-ojt-portal";
                
                // 1. Fetch Announcements from Firestore
                const unsubscribe = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('announcements')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const annData = [];
                        snapshot.forEach(doc => annData.push({ id: doc.id, ...doc.data() }));
                        setAnnouncements(annData);
                        setLoading(false);
                    }, error => {
                        console.error("Error loading announcements:", error);
                        setLoading(false);
                    });

                // 2. Fetch Companies List for Filtering Trainees
                db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees').get()
                    .then(snap => {
                        let activeCompanySet = new Set();
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.status === 'Active' && (data.company || data.companyName)) {
                                activeCompanySet.add(data.company || data.companyName);
                            }
                        });
                        setCompanies(Array.from(activeCompanySet).sort());
                    });

                return () => unsubscribe();
            }, []);

            const openForm = (ann = null) => {
                setCompanySearchTerm('');
                if (ann) {
                    setEditingId(ann.id);
                    setTitle(ann.title || '');
                    setContent(ann.content || '');
                    setTargetGroup(ann.targetGroup || 'All');
                    setTargetCompanies(ann.targetCompanies || ['All']);
                    setExpirationDate(ann.expirationDate || '');
                } else {
                    setEditingId(null);
                    setTitle('');
                    setContent('');
                    setTargetGroup('All');
                    setTargetCompanies(['All']);
                    setExpirationDate('');
                }
                setIsFormOpen(true);
            };

            const handleCompanyToggle = (company) => {
                if (company === 'All') {
                    setTargetCompanies(['All']);
                    return;
                }

                let newTargets = targetCompanies.filter(t => t !== 'All');
                if (newTargets.includes(company)) {
                    newTargets = newTargets.filter(t => t !== company);
                } else {
                    newTargets.push(company);
                }

                if (newTargets.length === 0) newTargets = ['All']; 
                setTargetCompanies(newTargets);
            };

            const handleSaveAnnouncement = async () => {
                if (!title.trim() || !content.trim()) {
                    return alert("Announcement must have a title and content.");
                }
                
                try {
                    const APP_ID = "dualtech-ojt-portal";
                    const annRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('announcements');
                    
                    const payload = {
                        title,
                        content,
                        targetGroup,
                        targetCompanies: targetGroup === 'Trainees' ? targetCompanies : ['All'],
                        expirationDate: expirationDate || null,
                        status: 'Active',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    if (editingId) {
                        await annRef.doc(editingId).update(payload);
                        await logSystemEvent('UPDATE', 'announcements', { id: editingId, title });
                    } else {
                        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        const docRef = await annRef.add(payload);
                        await logSystemEvent('CREATE', 'announcements', { id: docRef.id, title });
                    }
                    
                    setIsFormOpen(false);
                } catch (error) {
                    console.error("Error saving announcement:", error);
                    alert("Failed to save announcement.");
                }
            };

            const handleDelete = async (id) => {
                if (window.confirm("Are you sure you want to permanently delete this announcement?")) {
                    const APP_ID = "dualtech-ojt-portal";
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('announcements').doc(id).delete();
                    await logSystemEvent('DELETE', 'announcements', { id });
                }
            };

            const toggleStatus = async (id, currentStatus) => {
                const APP_ID = "dualtech-ojt-portal";
                const newStatus = currentStatus === 'Active' ? 'Inactive' : 'Active';
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('announcements').doc(id).update({
                    status: newStatus
                });
                await logSystemEvent('UPDATE', 'announcements', { id, status: newStatus });
            };

            if (loading) return <div className="p-10 text-center text-slate-500 font-bold">Loading announcements...</div>;

            return (
