        const OjtAttendanceView = () => {
            const [companySettings, setCompanySettings] = useState({});
            const [globalHolidays, setGlobalHolidays] = useState([]);

            const [trainees, setTrainees] = useState([]);
            const [companies, setCompanies] = useState([]);
            
            // Filter & Sort States
            const [selectedCompany, setSelectedCompany] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            
            const [viewMode, setViewMode] = useState('Daily'); 
            const [perfectType, setPerfectType] = useState('Weekly'); 

            // Date States
            const getLocalYYYYMMDD = (dateObj) => {
                const y = dateObj.getFullYear();
                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                const d = String(dateObj.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };
            const [dailyDate, setDailyDate] = useState(getLocalYYYYMMDD(new Date()));
            
            const getLocWeekStr = () => {
                const d = new Date();
                d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
                return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
            };
            
            const [weeklyDate, setWeeklyDate] = useState(getLocWeekStr()); 
            const [monthlyDate, setMonthlyDate] = useState(getLocalYYYYMMDD(new Date()).substring(0,7)); 

            const [logsData, setLogsData] = useState({});
            const [loading, setLoading] = useState(true);
            const [fetchingLogs, setFetchingLogs] = useState(false);

            const [perfectAttendanceData, setPerfectAttendanceData] = useState({ title: '', data: {} });
            const [loadingPerfect, setLoadingPerfect] = useState(false);
            const [leaveRequests, setLeaveRequests] = useState([]);

            // --- Data Fetching (Settings & Global Trainees) ---
            useEffect(() => {
                const settingsRef = collection(firestore, 'artifacts', appId, 'public', 'data', 'company_settings');
                const holidaysRef = doc(firestore, 'artifacts', appId, 'public', 'data', 'settings', 'globalHolidays');
                
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                    const settingsMap = {};
                    snap.docs.forEach(doc => { settingsMap[doc.id] = doc.data(); });
                    setCompanySettings(settingsMap);
                });

                const unsubHolidays = onSnapshot(holidaysRef, (docSnap) => {
                    setGlobalHolidays(docSnap.exists() && docSnap.data().holidays ? docSnap.data().holidays : []);
                });

                return () => { unsubSettings(); unsubHolidays(); };
            }, []);

            useEffect(() => {
                const traineesRef = collection(firestore, 'artifacts', appId, 'public', 'data', 'trainees');
                const unsub = onSnapshot(traineesRef, (snap) => {
                    let data = snap.docs.map(d => d.data()).filter(t => (t.status || 'Active').trim().toLowerCase() === 'active');
                    const comps = [...new Set(data.map(t => t.company || 'Unassigned'))].sort();
                    setTrainees(data);
                    setCompanies(comps);
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            // --- Helpers ---
            const isHoliday = (dateStr, companyName) => {
                const compSettings = companySettings[companyName] || {};
                const normalizeDate = (val) => {
                    if (!val) return null;
                    const d = new Date(String(val).replace(/-/g, '/'));
                    if (isNaN(d.getTime())) return String(val).trim(); 
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                };

                const targetYMD = normalizeDate(dateStr);
                if (!targetYMD) return { isHoliday: false };

                const targetD = new Date(String(dateStr).replace(/-/g, '/'));
                if (!isNaN(targetD.getTime())) {
                    const dayOfWeek = targetD.getDay();
                    if (dayOfWeek === 0 || dayOfWeek === 6) return { isHoliday: true, name: 'Weekend' };
                }

                if (compSettings.customHolidays?.find(h => normalizeDate(h.date) === targetYMD)) return { isHoliday: true };
                if (!compSettings.ignoreGlobalHolidays && globalHolidays.find(h => normalizeDate(h.date) === targetYMD)) return { isHoliday: true };

                return { isHoliday: false };
            };

            const getDateRange = () => {
                let start = '', end = '', periodName = '';
                if (viewMode === 'Daily') {
                    start = dailyDate; end = dailyDate; periodName = dailyDate;
                } else if (viewMode === 'Monthly' || (viewMode === 'Perfect Attendance' && perfectType === 'Monthly')) {
                    const mDate = monthlyDate || getLocalYYYYMMDD(new Date()).substring(0,7);
                    start = `${mDate}-01`;
                    const dateObj = new Date(start.replace(/-/g, '/'));
                    dateObj.setMonth(dateObj.getMonth() + 1);
                    dateObj.setDate(0);
                    end = getLocalYYYYMMDD(dateObj);
                    const mNameDate = new Date(start.replace(/-/g, '/'));
                    periodName = mNameDate.toLocaleString('default', { month: 'long', year: 'numeric' });
                } else if (viewMode === 'Weekly' || (viewMode === 'Perfect Attendance' && perfectType === 'Weekly')) {
                    const wDate = weeklyDate || getLocWeekStr();
                    const [year, week] = wDate.split('-W');
                    const d = new Date(year, 0, 1 + (week - 1) * 7);
                    const day = d.getDay();
                    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    const startObj = new Date(d.setDate(diff));
                    start = getLocalYYYYMMDD(startObj);
                    const endObj = new Date(startObj);
                    endObj.setDate(endObj.getDate() + 6); 
                    end = getLocalYYYYMMDD(endObj);
                    periodName = `Week of ${start}`;
                }
                return { start, end, periodName };
            };

            const calculateTotalHours = (timeIn, timeOut, companyName) => {
                if (!timeIn || !timeOut) return 0;
                const inMs = timeIn.toMillis ? timeIn.toMillis() : new Date(timeIn).getTime();
                const outMs = timeOut.toMillis ? timeOut.toMillis() : new Date(timeOut).getTime();
                let diffHours = (outMs - inMs) / (1000 * 60 * 60);
                
                const compSetting = companySettings[companyName];
                if (compSetting && compSetting.applyBreak && diffHours > 4) {
                    diffHours -= (compSetting.breakMinutes / 60);
                }
                return Math.max(0, diffHours);
            };

            // --- Perfect Attendance Global Fetching ---
            useEffect(() => {
                if (viewMode !== 'Perfect Attendance') return;
                
                const fetchPerfectAttendance = async () => {
                    setLoadingPerfect(true);
                    try {
                        const targetTrainees = selectedCompany === 'All' ? trainees : trainees.filter(t => (t.company || 'Unassigned') === selectedCompany);

                        const idToUid = {};
                        const profilesSnap = await getDocs(collectionGroup(firestore, 'profile'));
                        profilesSnap.docs.forEach(doc => { idToUid[String(doc.data().studentId).trim()] = doc.data().uid || doc.ref.parent.parent.id; });

                        const today = new Date();
                        const allLogs = {};
                        
                        await Promise.all(targetTrainees.map(async (t) => {
                            let cleanSimsId = String(t.studentId).trim();
                            let uid = idToUid[cleanSimsId] || t.userId || t.accountId || t.userUid;
                            
                            if (uid) {
                                const q = query(collection(firestore, 'artifacts', appId, 'users', uid, 'attendanceLogs'));
                                const snap = await getDocs(q);
                                allLogs[t.studentId] = snap.docs.map(d => d.data());
                            } else {
                                allLogs[t.studentId] = [];
                            }
                        }));

                        const isPerfect = (studentLogs, startDate, endDate, companyName) => {
                            let startD = new Date(startDate.replace(/-/g, '/'));
                            let endD = new Date(endDate.replace(/-/g, '/'));
                            if (endD > today) endD = today; 
                            if (startD > endD) return false;

                            let expected = 0;
                            let tempD = new Date(startD);
                            
                            while(tempD <= endD) {
                                const tempYMD = `${tempD.getFullYear()}-${String(tempD.getMonth()+1).padStart(2,'0')}-${String(tempD.getDate()).padStart(2,'0')}`;
                                if (!isHoliday(tempYMD, companyName).isHoliday) expected++;
                                tempD.setDate(tempD.getDate() + 1);
                            }

                            if (expected === 0) return false;

                            const logsByDate = {};
                            studentLogs.forEach(l => {
                                const rawDate = l.dateString;
                                if (!rawDate) return;
                                
                                const parts = rawDate.split('-');
                                const normDate = parts.length === 3 ? `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}` : rawDate;

                                if (normDate >= startDate && normDate <= endDate) {
                                    if (!logsByDate[normDate]) logsByDate[normDate] = { in: null, out: null };
                                    if (l.type === 'IN') logsByDate[normDate].in = l.timeIn || l.timestamp;
                                    if (l.type === 'OUT') logsByDate[normDate].out = l.timeOut || l.timestamp;
                                    if (l.timeIn && l.timeOut) {
                                        logsByDate[normDate].in = l.timeIn;
                                        logsByDate[normDate].out = l.timeOut;
                                    }
                                }
                            });

                            let present = 0;
                            let hasIssue = false; 
                            
                            Object.values(logsByDate).forEach(day => {
                                if (day.in && day.out) {
                                    present++;
                                    const inDate = day.in.toDate ? day.in.toDate() : new Date(day.in);
                                    if (inDate.getHours() > 8 || (inDate.getHours() === 8 && inDate.getMinutes() > 0)) hasIssue = true;
                                    const hrs = calculateTotalHours(day.in, day.out, companyName);
                                    if (hrs < 8) hasIssue = true;
                                }
                            });

                            if (present < expected) return false; 
                            if (hasIssue) return false; 
                            return true;
                        };

                        const parseDateSafe = (dateStr) => {
                            if (!dateStr) return null;
                            if (typeof dateStr === 'number') {
                                if (dateStr < 100000) return new Date(Math.round((dateStr - 25569) * 86400 * 1000));
                                return new Date(dateStr); 
                            }
                            let d = new Date(dateStr);
                            if (!isNaN(d.getTime())) return d;
                            const parts = String(dateStr).split(/[-/]/);
                            if (parts.length === 3) {
                                let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parseInt(parts[2]);
                                if (p3 < 100) p3 += 2000;
                                if (p1 > 12) return new Date(p3, p2 - 1, p1); 
                                return new Date(p3, p1 - 1, p2); 
                            }
                            return null;
                        };

                        const achievers = [];
                        let sectionTitle = '';
                        const range = getDateRange();

                        targetTrainees.forEach(t => {
                            const logs = allLogs[t.studentId] || [];
                            const company = t.company || 'Unassigned';
                            
                            if (perfectType === 'Weekly') {
                                sectionTitle = `Weekly Perfect Attendance (${range.periodName})`;
                                if (isPerfect(logs, range.start, range.end, company)) achievers.push(t);
                            } 
                            else if (perfectType === 'Monthly') {
                                sectionTitle = `Monthly Perfect Attendance (${range.periodName})`;
                                if (isPerfect(logs, range.start, range.end, company)) achievers.push(t);
                            } 
                            else if (perfectType === '6-Months') {
                                sectionTitle = `Every 6-Months Perfect Attendance (Rolling Evaluation)`;
                                const iptStart = parseDateSafe(t.iptDateStart || t.IptDateStart);
                                
                                if (iptStart) {
                                    let periodStart = new Date(iptStart);
                                    let periodEnd = new Date(iptStart);
                                    periodEnd.setMonth(periodEnd.getMonth() + 6);
                                    periodEnd.setDate(periodEnd.getDate() - 1);
                                    
                                    let milestoneCount = 1;
                                    let achievedMilestones = [];

                                    let checkDate = new Date(periodEnd);
                                    checkDate.setHours(23,59,59,999);
                                    
                                    while (today >= checkDate) {
                                        const startStr = getLocalYYYYMMDD(periodStart);
                                        const endStr = getLocalYYYYMMDD(periodEnd);
                                        
                                        if (isPerfect(logs, startStr, endStr, company)) {
                                            achievedMilestones.push(`${milestoneCount * 6} Mos`);
                                        }
                                        
                                        periodStart = new Date(periodEnd);
                                        periodStart.setDate(periodStart.getDate() + 1);
                                        
                                        periodEnd = new Date(periodStart);
                                        periodEnd.setMonth(periodEnd.getMonth() + 6);
                                        periodEnd.setDate(periodEnd.getDate() - 1);
                                        
                                        checkDate = new Date(periodEnd);
                                        checkDate.setHours(23,59,59,999);
                                        milestoneCount++;
                                    }
                                    
                                    if (achievedMilestones.length > 0) {
                                        achievers.push({ ...t, milestoneLabel: achievedMilestones.join(', ') });
                                    }
                                }
                            }
                        });

                        const grouped = achievers.reduce((acc, t) => {
                            const comp = t.company || 'Unassigned';
                            if (!acc[comp]) acc[comp] = [];
                            acc[comp].push(t);
                            return acc;
                        }, {});
                        
                        Object.keys(grouped).forEach(comp => {
                            grouped[comp].sort((a, b) => {
                                const nameA = ((a.firstName||'') + ' ' + (a.lastName||'')).toLowerCase();
                                const nameB = ((b.firstName||'') + ' ' + (b.lastName||'')).toLowerCase();
                                return nameA.localeCompare(nameB);
                            });
                        });

                        setPerfectAttendanceData({ title: sectionTitle, data: grouped });
                    } catch (err) { console.error("Error fetching perfect attendance:", err); }
                    setLoadingPerfect(false);
                };
                
                fetchPerfectAttendance();
            }, [viewMode, perfectType, weeklyDate, monthlyDate, trainees, companySettings, selectedCompany]);


            // --- Standard Logs Fetching ---
            useEffect(() => {
                const fetchLogs = async () => {
                    if (viewMode === 'Perfect Attendance') return; 
                    const { start, end } = getDateRange();
                    if (!start || !end) return;

                    setFetchingLogs(true);
                    try {
                        const idToUid = {};
                        const profilesSnap = await getDocs(collectionGroup(firestore, 'profile'));
                        profilesSnap.docs.forEach(doc => { idToUid[String(doc.data().studentId).trim()] = doc.data().uid || doc.ref.parent.parent.id; });

                        const logsLookup = {};
                        await Promise.all(trainees.map(async (t) => {
                            const cleanSimsId = String(t.studentId).trim();
                            const uid = idToUid[cleanSimsId] || t.userId || t.accountId || t.userUid;
                            
                            logsLookup[t.studentId] = [];
                            if (uid) {
                                const q = query(collection(firestore, 'artifacts', appId, 'users', uid, 'attendanceLogs'), 
                                    where('dateString', '>=', start), where('dateString', '<=', end));
                                const snap = await getDocs(q);
                                logsLookup[t.studentId] = snap.docs.map(doc => doc.data());
                            }
                        }));
                        setLogsData(logsLookup);

                        const reqSnap = await getDocs(collection(firestore, 'artifacts', appId, 'public', 'data', 'requests'));
                        setLeaveRequests(reqSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status !== 'Rejected'));
                    } catch (error) { console.error("Error fetching logs:", error); }
                    setFetchingLogs(false);
                };
                fetchLogs();
            }, [viewMode, dailyDate, weeklyDate, monthlyDate, trainees]);

            // --- Data Processing for Unified Table ---
            const getLoc = (details) => {
                if (!details) return null;
                if (details.location?.lat) return `${details.location.lat},${details.location.lon}`;
                if (details.lat) return `${details.lat},${details.lon}`;
                return null;
            };

            const checkVerified = (details, fallback) => {
                if (details?.statusRemark?.toLowerCase().includes('verified')) return true;
                if (fallback === true || fallback === 'Verified') return true;
                return false;
            };

            const formatTime = (ts) => ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';

            const processedData = useMemo(() => {
                if (viewMode === 'Perfect Attendance') return [];
                const { start, end, periodName } = getDateRange();

                return trainees.map(t => {
                    const icName = t.assignedIC || t.icName || t.Coordinator || t.ic || t.industrialCoordinator || 'Unassigned';
                    const company = t.company || t.companyName || 'Unassigned';
                    const name = `${t.lastName}, ${t.firstName}`;
                    const logs = logsData[t.studentId] || [];

                    if (viewMode === 'Daily') {
                        const todayLogs = logs.filter(l => l.dateString === dailyDate);
                        const inLog = todayLogs.find(l => l.type === 'IN');
                        const outLog = todayLogs.find(l => l.type === 'OUT');
                        
                        const timeIn = inLog?.timestamp;
                        const timeOut = outLog?.timestamp;
                        const hours = calculateTotalHours(timeIn, timeOut, company);

                        const inCoords = getLoc(inLog?.clockInDetails) || getLoc(inLog);
                        const outCoords = getLoc(outLog?.clockOutDetails) || getLoc(outLog);

                        let remarks = '';
                        if (inLog && outLog) {
                            const isLate = new Date(timeIn).getHours() > 8 || (new Date(timeIn).getHours() === 8 && new Date(timeIn).getMinutes() > 0);
                            if (isLate && hours < 8) remarks = 'Late & Undertime';
                            else if (isLate) remarks = 'Late';
                            else if (hours < 8) remarks = 'Undertime';
                            else remarks = 'Completed 8 hours';
                        } else if (inLog && !outLog) {
                            remarks = 'Currently Clocked In (Missing Out)';
                        } else {
                            const filedLeave = leaveRequests.find(r => 
                                (r.studentId === t.studentId || r.userId === t.studentId) &&
                                (r.date === dailyDate || r.targetDate === dailyDate || r.leaveDate === dailyDate)
                            );
                            remarks = filedLeave ? `Absent w/ Notification (${filedLeave.type || 'Leave'})` : 'AWOL (No Record)';
                        }

                        return {
                            id: t.studentId, name, company, ic: icName,
                            clockIn: formatTime(timeIn), clockOut: formatTime(timeOut),
                            locInText: inCoords ? (checkVerified(inLog?.clockInDetails, inLog?.inGeofence) ? 'Verified' : 'Outside') : 'N/A',
                            locInCoords: inCoords,
                            locOutText: outCoords ? (checkVerified(outLog?.clockOutDetails, outLog?.inGeofence) ? 'Verified' : 'Outside') : 'N/A',
                            locOutCoords: outCoords,
                            hours: hours.toFixed(2), remarks, rawHours: hours
                        };
                    } else {
                        let totalHours = 0, daysPresent = 0, expectedDays = 0;
                        let tempD = new Date(start);
                        let endD = new Date(end);
                        if (endD > new Date()) endD = new Date();

                        while(tempD <= endD) {
                            const tempYMD = `${tempD.getFullYear()}-${String(tempD.getMonth()+1).padStart(2,'0')}-${String(tempD.getDate()).padStart(2,'0')}`;
                            if (!isHoliday(tempYMD, company).isHoliday) expectedDays++;
                            tempD.setDate(tempD.getDate() + 1);
                        }

                        const logsByDate = {};
                        logs.forEach(l => {
                            if (!logsByDate[l.dateString]) logsByDate[l.dateString] = { in: null, out: null };
                            if (l.type === 'IN') logsByDate[l.dateString].in = l.timestamp;
                            if (l.type === 'OUT') logsByDate[l.dateString].out = l.timestamp;
                        });

                        let lates = 0, undertimes = 0;
                        Object.values(logsByDate).forEach(day => {
                            if (day.in) {
                                daysPresent++;
                                if (new Date(day.in).getHours() > 8 || (new Date(day.in).getHours() === 8 && new Date(day.in).getMinutes() > 0)) lates++;
                                if (day.out) {
                                    const hrs = calculateTotalHours(day.in, day.out, company);
                                    totalHours += hrs;
                                    if (hrs < 8) undertimes++;
                                }
                            }
                        });

                        const daysAbsent = Math.max(0, expectedDays - daysPresent);
                        let remarks = [];
                        if (daysAbsent > 0) remarks.push(`${daysAbsent} Absences`);
                        if (lates > 0) remarks.push(`${lates} Lates`);
                        if (undertimes > 0) remarks.push(`${undertimes} Undertimes`);

                        return {
                            id: t.studentId, name, company, ic: icName, period: periodName,
                            daysPresent, daysAbsent, hours: totalHours.toFixed(2),
                            remarks: remarks.length > 0 ? remarks.join(', ') : 'Perfect Record',
                            rawHours: totalHours
                        };
                    }
                });
            }, [trainees, logsData, viewMode, dailyDate, weeklyDate, monthlyDate, leaveRequests]);

            // --- Search & Sorting ---
            const handleSort = (key) => {
                setSortConfig(prev => ({
                    key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                }));
            };

            const displayData = useMemo(() => {
                let filtered = processedData.filter(item => {
                    if (selectedCompany !== 'All' && item.company !== selectedCompany) return false;
                    const searchLower = searchTerm.toLowerCase();
                    return (item.name.toLowerCase().includes(searchLower) || 
                            item.company.toLowerCase().includes(searchLower) || 
                            item.ic.toLowerCase().includes(searchLower));
                });

                filtered.sort((a, b) => {
                    const valA = a[sortConfig.key];
                    const valB = b[sortConfig.key];
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return filtered;
            }, [processedData, selectedCompany, searchTerm, sortConfig]);

            // --- Simplified Export to XLS ---
            const exportToXLS = () => {
                if (displayData.length === 0) return alert("No data to export.");

                const isDaily = viewMode === 'Daily';
                const headers = isDaily 
                    ? ['Student ID', 'Trainee Name', 'Assigned Company', 'Assigned IC', 'Clock In', 'Loc In', 'Clock Out', 'Loc Out', 'Hours Rendered', 'Remarks']
                    : ['Student ID', 'Trainee Name', 'Assigned Company', 'Assigned IC', 'Period', 'Days Present', 'Days Absent', 'Total Hours', 'Remarks'];

                let htmlTable = `<tr>${headers.map(h => `<th style="background-color: #10b981; color: white; font-weight: bold; border: 1px solid #ccc;">${h}</th>`).join('')}</tr>`;

                displayData.forEach((row, i) => {
                    const rowArr = isDaily 
                        ? [row.id, row.name, row.company, row.ic, row.clockIn, row.locInText, row.clockOut, row.locOutText, row.hours, row.remarks]
                        : [row.id, row.name, row.company, row.ic, row.period, row.daysPresent, row.daysAbsent, row.hours, row.remarks];
                    
                    const bg = i % 2 === 0 ? '#ffffff' : '#f8fafc';
                    htmlTable += `<tr style="background-color: ${bg};">${rowArr.map(cell => `<td style="border: 1px solid #ccc; mso-number-format:'\\@';">${cell}</td>`).join('')}</tr>`;
                });

                const template = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><table>${htmlTable}</table></body></html>`;
                const blob = new Blob([template], { type: 'application/vnd.ms-excel;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `OJT_Attendance_${viewMode}_${new Date().getTime()}.xls`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // UI Components
            const PerfectAttendanceSection = ({ title, data }) => {
                const comps = Object.keys(data).sort();
                return (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8">
                        <div className="bg-amber-50/50 border-b border-slate-100 p-4 flex items-center gap-2">
                            <CalendarCheck className="text-amber-500" size={20}/>
                            <h3 className="font-bold text-slate-800 text-sm">{title}</h3>
                            <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-black ml-auto">
                                {comps.reduce((sum, c) => sum + data[c].length, 0)} Achievers
                            </span>
                        </div>
                        <div className="p-6 space-y-6 max-h-[500px] overflow-y-auto">
                            {comps.length === 0 ? (
                                <p className="text-slate-500 italic text-sm text-center">No trainees achieved perfect attendance for this milestone.</p>
                            ) : (
                                comps.map(comp => (
                                    <div key={comp} className="space-y-3">
                                        <h4 className="font-black text-slate-700 text-sm border-b border-slate-100 pb-2 flex items-center gap-2">
                                            <Building size={16} className="text-slate-400"/> {comp}
                                        </h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {data[comp].map(t => (
                                                <div key={t.studentId} className="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100 transition-colors border border-slate-200 rounded-xl relative overflow-hidden">
                                                    <div className="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-sm shrink-0 shadow-inner border border-amber-200 uppercase">
                                                        {(t.firstName?.[0] || '')}{(t.lastName?.[0] || '')}
                                                    </div>
                                                    <div className="overflow-hidden flex-1">
                                                        <div className="font-bold text-sm text-slate-800 truncate" title={`${t.firstName} ${t.lastName}`}>{t.firstName} {t.lastName}</div>
                                                        <div className="text-[10px] font-mono text-slate-500 mt-0.5">
                                                            {t.studentId} 
                                                            {t.milestoneLabel && (
                                                                <span className="ml-1.5 bg-amber-200/50 text-amber-700 px-1.5 py-0.5 rounded font-bold tracking-tight">
                                                                    [{t.milestoneLabel}]
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                );
            };

            if (loading) return <div className="flex flex-col items-center justify-center h-64 text-slate-400"><Activity className="animate-spin mb-4" size={32} /> Preparing Global Attendance...</div>;

            const SortIcon = ({ colKey }) => (
                <span className="ml-1 text-[10px] text-slate-400">
                    {sortConfig.key === colKey ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                </span>
            );

            return (
                <div className="space-y-6 pb-20 animate-in fade-in duration-300">
                    {/* Header & View Modes */}
                    <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-4">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2"><CalendarDays className="text-blue-600" /> Unified Attendance Tracker</h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Dynamic table viewing, searching, and simplified export.</p>
                        </div>
                        <div className="flex bg-slate-200/50 p-1 rounded-xl overflow-x-auto hide-scrollbar w-full md:w-auto">
                            {['Daily', 'Weekly', 'Monthly', 'Perfect Attendance'].map(mode => (
                                <button 
                                    key={mode} onClick={() => setViewMode(mode)} 
                                    className={`px-5 py-1.5 text-sm font-bold rounded-lg transition-colors whitespace-nowrap ${viewMode === mode ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    {mode}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Filters & Export Bar */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 items-center">
                        <div className="flex-1 w-full relative">
                            <Building className="absolute left-3.5 top-3.5 text-slate-400" size={18} />
                            <select value={selectedCompany} onChange={(e) => setSelectedCompany(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 text-slate-700 font-bold appearance-none">
                                <option value="All">All Companies (Global)</option>
                                {companies.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>

                        {viewMode === 'Perfect Attendance' && (
                            <div className="flex bg-amber-100/50 p-1 rounded-xl">
                                {['Weekly', 'Monthly', '6-Months'].map(type => (
                                    <button 
                                        key={type} onClick={() => setPerfectType(type)} 
                                        className={`px-4 py-2 text-sm font-bold rounded-lg transition-colors whitespace-nowrap ${perfectType === type ? 'bg-amber-500 text-white shadow-sm' : 'text-amber-700 hover:bg-amber-100'}`}
                                    >
                                        {type}
                                    </button>
                                ))}
                            </div>
                        )}

                        {viewMode === 'Daily' && (
                            <input type="date" value={dailyDate} onChange={e => setDailyDate(e.target.value)} className="flex-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none" />
                        )}

                        {(viewMode === 'Weekly' || (viewMode === 'Perfect Attendance' && perfectType === 'Weekly')) && (
                            <input type="week" value={weeklyDate} onChange={e => setWeeklyDate(e.target.value)} className="flex-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none" />
                        )}

                        {(viewMode === 'Monthly' || (viewMode === 'Perfect Attendance' && perfectType === 'Monthly')) && (
                            <input type="month" value={monthlyDate} onChange={e => setMonthlyDate(e.target.value)} className="flex-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none" />
                        )}

                        {(viewMode === 'Perfect Attendance' && perfectType === '6-Months') && (
                            <div className="flex-1 w-full text-slate-500 text-sm font-medium flex items-center gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <AlertCircle className="text-slate-400 shrink-0" size={18} />
                                Auto-calculating all completed 6-month intervals from each trainee's IPT Start Date.
                            </div>
                        )}

                        {viewMode !== 'Perfect Attendance' && (
                            <>
                                <div className="flex-1 w-full relative">
                                    <Search className="absolute left-3.5 top-3.5 text-slate-400" size={18} />
                                    <input type="text" placeholder="Search Trainee, Company, or IC..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 text-sm" />
                                </div>

                                <button onClick={exportToXLS} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-md w-full md:w-auto shrink-0">
                                    <Download size={18} /> Export Current View
                                </button>
                            </>
                        )}
                    </div>

                    {/* Content Area */}
                    {fetchingLogs || loadingPerfect ? (
                        <div className="bg-white rounded-3xl p-10 text-center border border-slate-200 shadow-sm flex flex-col items-center justify-center">
                            <Activity className={`animate-spin mb-4 ${loadingPerfect ? 'text-amber-500' : 'text-blue-500'}`} size={32} />
                            <h3 className="text-lg font-bold text-slate-700">{loadingPerfect ? 'Analyzing Attendance' : 'Fetching Records...'}</h3>
                        </div>
                    ) : viewMode === 'Perfect Attendance' ? (
                        <PerfectAttendanceSection title={perfectAttendanceData.title} data={perfectAttendanceData.data} />
                    ) : (
                        <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col max-h-[700px] transition-colors">
                            <div className="p-4 bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 flex justify-between items-center transition-colors">
                                <h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm flex items-center gap-2"><FileText size={18} className="text-slate-500 dark:text-slate-400" /> Attendance Records</h3>
                                <span className="bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-black px-2 py-1 rounded-md shadow-sm">{displayData.length} Results</span>
                            </div>
                            
                            <div className="overflow-auto flex-1 relative">
                                <table className="w-full text-left whitespace-nowrap">
                                    <thead className="bg-white dark:bg-slate-900 sticky top-0 z-10 shadow-sm">
                                        <tr className="select-none">
                                            <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50" onClick={() => handleSort('name')}>Trainee Name <SortIcon colKey="name"/></th>
                                            <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50" onClick={() => handleSort('company')}>Company <SortIcon colKey="company"/></th>
                                            <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50" onClick={() => handleSort('ic')}>Assigned IC <SortIcon colKey="ic"/></th>
                                            
                                            {viewMode === 'Daily' ? (
                                                <>
                                                    <th className="table-header font-bold text-blue-600 dark:text-blue-400">Time In</th>
                                                    <th className="table-header font-bold text-blue-600 dark:text-blue-400">Loc In</th>
                                                    <th className="table-header font-bold text-orange-600 dark:text-orange-400">Time Out</th>
                                                    <th className="table-header font-bold text-orange-600 dark:text-orange-400">Loc Out</th>
                                                </>
                                            ) : (
                                                <>
                                                    <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50" onClick={() => handleSort('period')}>Period <SortIcon colKey="period"/></th>
                                                    <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 text-center" onClick={() => handleSort('daysPresent')}>Present <SortIcon colKey="daysPresent"/></th>
                                                    <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 text-center" onClick={() => handleSort('daysAbsent')}>Absent <SortIcon colKey="daysAbsent"/></th>
                                                </>
                                            )}
                                            
                                            <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50 text-center font-black text-emerald-700 dark:text-emerald-400" onClick={() => handleSort('rawHours')}>Total Hrs <SortIcon colKey="rawHours"/></th>
                                            <th className="table-header cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/50" onClick={() => handleSort('remarks')}>Remarks <SortIcon colKey="remarks"/></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {displayData.map((row, i) => (
                                            <tr key={i} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/30 transition-colors group">
                                                <td className="table-cell font-bold text-slate-800 dark:text-slate-100">{row.name} <span className="block text-[10px] text-slate-500 dark:text-slate-400 font-mono mt-0.5">{row.id}</span></td>
                                                <td className="table-cell text-slate-700 dark:text-slate-300 text-xs font-bold">{row.company}</td>
                                                <td className="table-cell text-slate-500 dark:text-slate-400 text-xs italic">{row.ic}</td>
                                                
                                                {viewMode === 'Daily' ? (
                                                    <>
                                                        <td className="table-cell font-mono text-xs text-slate-700 dark:text-slate-300">{row.clockIn}</td>
                                                        <td className="table-cell text-[10px] font-bold uppercase">
                                                            {row.locInCoords ? (
                                                                <a href={`https://maps.google.com/?q=${row.locInCoords}`} target="_blank" rel="noreferrer" className={`underline flex items-center gap-1 ${row.locInText === 'Verified' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`}>
                                                                    <MapPin size={10}/> {row.locInText}
                                                                </a>
                                                            ) : (
                                                                <span className="text-slate-400 dark:text-slate-500">{row.locInText}</span>
                                                            )}
                                                        </td>
                                                        <td className="table-cell font-mono text-xs text-slate-700 dark:text-slate-300">{row.clockOut}</td>
                                                        <td className="table-cell text-[10px] font-bold uppercase">
                                                            {row.locOutCoords ? (
                                                                <a href={`https://maps.google.com/?q=${row.locOutCoords}`} target="_blank" rel="noreferrer" className={`underline flex items-center gap-1 ${row.locOutText === 'Verified' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`}>
                                                                    <MapPin size={10}/> {row.locOutText}
                                                                </a>
                                                            ) : (
                                                                <span className="text-slate-400 dark:text-slate-500">{row.locOutText}</span>
                                                            )}
                                                        </td>
                                                    </>
                                                ) : (
                                                    <>
                                                        <td className="table-cell text-xs font-bold text-slate-500 dark:text-slate-400">{row.period}</td>
                                                        <td className="table-cell text-center font-black text-slate-700 dark:text-slate-200">{row.daysPresent}</td>
                                                        <td className="table-cell text-center font-black text-rose-500 dark:text-rose-400">{row.daysAbsent > 0 ? row.daysAbsent : '-'}</td>
                                                    </>
                                                )}
                                                
                                                <td className="table-cell text-center font-black text-emerald-600 dark:text-emerald-400">{row.hours}</td>
                                                <td className="table-cell">
                                                    <span className={`px-2.5 py-1 text-[10px] font-black uppercase rounded-md tracking-wide ${
                                                        row.remarks.includes('AWOL') ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400' :
                                                        row.remarks.includes('Notification') ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' :
                                                        row.remarks.includes('Late') || row.remarks.includes('Undertime') || row.remarks.includes('Missing') ? 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400' :
                                                        row.remarks.includes('Absences') ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400' :
                                                        'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'
                                                    }`}>
                                                        {row.remarks}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                        {displayData.length === 0 && (
                                            <tr>
                                                <td colSpan={viewMode === 'Daily' ? 10 : 9} className="table-cell p-10 text-center text-slate-400 dark:text-slate-500 italic bg-slate-50/50 dark:bg-slate-800/30">
                                                    No records matched your filters.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        
        const ExportAstpAttendanceView = () => {
            const [trainees, setTrainees] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const [selectedStatus, setSelectedStatus] = useState('Active');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [visibleColumns, setVisibleColumns] = useState({
                studentId: true, name: true, company: true, iptStart: true, iptEnd: true, 
                monthSinceIpt: true, isRegistered: true, dateRegistered: true, 
                totalWorkingDays: true, totalPresent: true, noClockRecords: true
            });
            
            useEffect(() => {
                const fetchData = async () => {
                    setLoading(true);
                    try {
                        const APP_ID = "dualtech-ojt-portal";
                        const db = firestore;
                        
                        const settingsSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'company_settings'));
                        const companySettings = {};
                        settingsSnap.docs.forEach(doc => { companySettings[doc.id] = doc.data(); });
                        
                        const holidaysDoc = await getDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'globalHolidays'));
                        const globalHolidays = holidaysDoc.exists() && holidaysDoc.data().holidays ? holidaysDoc.data().holidays : [];
                        
                        const profilesSnap = await getDocs(collectionGroup(db, 'profile'));
                        const idToProfile = {};
                        profilesSnap.docs.forEach(d => {
                            const data = d.data();
                            if (data.studentId) {
                                idToProfile[String(data.studentId).trim()] = { uid: data.uid || d.ref.parent.parent.id, ...data };
                            }
                        });
                        
                        const scheduleSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'schedule_requests'));
                        const scheduleRequests = scheduleSnap.docs.map(d => ({id: d.id, ...d.data()}));
                        
                        const getScheduleForTrainee = (studentId, profile) => {
                            const reqs = scheduleRequests.filter(r => String(r.traineeId).trim() === studentId && r.status === 'Approved');
                            if (reqs.length > 0) {
                                reqs.sort((a,b) => {
                                    const ta = a.reviewedAt?.toDate ? a.reviewedAt.toDate().getTime() : 0;
                                    const tb = b.reviewedAt?.toDate ? b.reviewedAt.toDate().getTime() : 0;
                                    return tb - ta;
                                });
                                return { schoolingDay: reqs[0].requestedSchoolingDay, restDay: reqs[0].requestedRestDay };
                            }
                            return { schoolingDay: profile?.schoolingDay || 'Saturday', restDay: profile?.restDay || 'Sunday' };
                        };
                        
                        const traineesSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'trainees'));
                        let allTrainees = [];
                        traineesSnap.docs.forEach(d => {
                            const data = d.data();
                            const level = String(data.level || data.Level || data.course || data.Course || '').toUpperCase();
                            if (level.includes('ASTP')) {
                                allTrainees.push({ id: d.id, ...data });
                            }
                        });
                        
                        const processed = await Promise.all(allTrainees.map(async (t) => {
                            const studentId = String(t.studentId || t['Student ID#'] || '').trim();
                            const profile = idToProfile[studentId];
                            const isRegistered = !!profile;
                            
                            const name = `${t.lastName || t.family || ''}, ${t.firstName || t.given || ''}`.trim() || t.name || 'Unknown';
                            const company = t.company || t.companyName || 'Unassigned';
                            const iptStart = t['IPT Date Start'] || t.iptDateStart || t.startDate || '';
                            const iptEnd = t['IPT Date End'] || t.iptDateEnd || t.endDate || '';
                            
                            let monthSinceIpt = 0;
                            const today = new Date();
                            const parseDateStr = (dateStr) => {
                                if (!dateStr) return null;
                                const d = new Date(String(dateStr).replace(/-/g, '/'));
                                if (!isNaN(d.getTime())) return d;
                                
                                const parts = String(dateStr).split(/[-/]/);
                                if (parts.length === 3) {
                                    let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parseInt(parts[2]);
                                    if (p3 < 100) p3 += 2000;
                                    if (p1 > 12) return new Date(p3, p2 - 1, p1); 
                                    return new Date(p3, p1 - 1, p2); 
                                }
                                return null;
                            };
                            
                            const iptStartDate = parseDateStr(iptStart);
                            if (iptStartDate) {
                                const months = (today.getFullYear() - iptStartDate.getFullYear()) * 12 + (today.getMonth() - iptStartDate.getMonth());
                                monthSinceIpt = Math.max(0, months);
                            }
                            
                            let dateRegisteredStr = 'N/A';
                            let dateRegObj = null;
                            if (isRegistered) {
                                const regDate = profile.registeredAt || t.dateRegistered || t.createdAt || profile.dateRegistered || profile.createdAt;
                                dateRegObj = regDate?.toDate ? regDate.toDate() : (regDate ? new Date(regDate) : null);
                            }
                            if (dateRegObj) {
                                dateRegisteredStr = `${dateRegObj.getFullYear()}-${String(dateRegObj.getMonth()+1).padStart(2,'0')}-${String(dateRegObj.getDate()).padStart(2,'0')}`;
                            }
                            
                            let totalWorkingDays = 0;
                            let totalPresent = 0;
                            let noClockRecords = 0;
                            
                            if (isRegistered && profile.uid && dateRegObj) {
                                const schedule = getScheduleForTrainee(studentId, profile);
                                
                                const isHoliday = (dateStr, companyName) => {
                                    const compSettings = companySettings[companyName] || {};
                                    const normalizeDate = (val) => {
                                        if (!val) return null;
                                        const d = new Date(String(val).replace(/-/g, '/'));
                                        if (isNaN(d.getTime())) return String(val).trim(); 
                                        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                                    };
                                    const targetYMD = normalizeDate(dateStr);
                                    if (!targetYMD) return false;
                                    
                                    if (compSettings.customHolidays?.find(h => normalizeDate(h.date) === targetYMD)) return true;
                                    if (!compSettings.ignoreGlobalHolidays && globalHolidays.find(h => normalizeDate(h.date) === targetYMD)) return true;
                                    return false;
                                };
                                
                                const dayNameToIndex = { 'sunday': 0, 'monday': 1, 'tuesday': 2, 'wednesday': 3, 'thursday': 4, 'friday': 5, 'saturday': 6 };
                                const schoolingDayIdx = dayNameToIndex[String(schedule.schoolingDay).toLowerCase()] ?? 6;
                                const restDayIdx = dayNameToIndex[String(schedule.restDay).toLowerCase()] ?? 0;
                                
                                let tempD = new Date(dateRegObj);
                                tempD.setHours(0,0,0,0);
                                const endD = new Date(today);
                                endD.setHours(23,59,59,999);
                                
                                const workingDates = new Set();
                                
                                while(tempD <= endD) {
                                    const dayOfWeek = tempD.getDay();
                                    const ymd = `${tempD.getFullYear()}-${String(tempD.getMonth()+1).padStart(2,'0')}-${String(tempD.getDate()).padStart(2,'0')}`;
                                    
                                    if (dayOfWeek !== schoolingDayIdx && dayOfWeek !== restDayIdx) {
                                        if (!isHoliday(ymd, company)) {
                                            workingDates.add(ymd);
                                            totalWorkingDays++;
                                        }
                                    }
                                    tempD.setDate(tempD.getDate() + 1);
                                }
                                
                                const q = query(collection(db, 'artifacts', APP_ID, 'users', profile.uid, 'attendanceLogs'));
                                const logSnap = await getDocs(q);
                                const logsByDate = {};
                                logSnap.docs.forEach(doc => {
                                    const l = doc.data();
                                    const rawDate = l.dateString;
                                    if (!rawDate) return;
                                    const parts = rawDate.split('-');
                                    const normDate = parts.length === 3 ? `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}` : rawDate;
                                    
                                    if (workingDates.has(normDate)) {
                                        if (!logsByDate[normDate]) logsByDate[normDate] = { in: null, out: null };
                                        if (l.type === 'IN') logsByDate[normDate].in = true;
                                        if (l.type === 'OUT') logsByDate[normDate].out = true;
                                        if (l.timeIn && l.timeOut) {
                                            logsByDate[normDate].in = true;
                                            logsByDate[normDate].out = true;
                                        }
                                    }
                                });
                                
                                Object.values(logsByDate).forEach(day => {
                                    if (day.in && day.out) {
                                        totalPresent++;
                                    }
                                });
                                
                                noClockRecords = totalWorkingDays - totalPresent;
                            }
                            
                            return {
                                id: t.id,
                                studentId: studentId || 'N/A',
                                name,
                                company,
                                iptStart: iptStart || 'N/A',
                                iptEnd: iptEnd || 'N/A',
                                monthSinceIpt,
                                isRegistered,
                                dateRegistered: dateRegisteredStr,
                                totalWorkingDays,
                                totalPresent,
                                noClockRecords,
                                status: t.status || t.Status || 'Unknown'
                            };
                        }));
                        
                        setTrainees(processed);
                    } catch (err) {
                        console.error("Error fetching Export ASTP Attendance data:", err);
                    }
                    setLoading(false);
                };
                fetchData();
            }, []);
            
            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };
            
            const filteredTrainees = trainees.filter(t => selectedStatus === 'All' || t.status === selectedStatus);
            
            const sortedTrainees = [...filteredTrainees].sort((a, b) => {
                let valA = a[sortConfig.key];
                let valB = b[sortConfig.key];
                
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();
                
                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });
            
            const exportToExcel = () => {
                const headers = [];
                if (visibleColumns.studentId) headers.push('Student ID#');
                if (visibleColumns.name) headers.push('Trainee Name');
                if (visibleColumns.company) headers.push('Company');
                if (visibleColumns.iptStart) headers.push('IPT Date Start');
                if (visibleColumns.iptEnd) headers.push('IPT Date End');
                if (visibleColumns.monthSinceIpt) headers.push('Month (Since IPT)');
                if (visibleColumns.isRegistered) headers.push('Registered?');
                if (visibleColumns.dateRegistered) headers.push('Date Registered');
                if (visibleColumns.totalWorkingDays) headers.push('Total Working Days (Since Reg)');
                if (visibleColumns.totalPresent) headers.push('Total Present Shifts');
                if (visibleColumns.noClockRecords) headers.push('Days No Clock Records');
                
                const csvRows = [headers.join(',')];
                
                sortedTrainees.forEach(t => {
                    const row = [];
                    if (visibleColumns.studentId) row.push(`"${t.studentId}"`);
                    if (visibleColumns.name) row.push(`"${t.name.replace(/"/g, '""')}"`);
                    if (visibleColumns.company) row.push(`"${t.company.replace(/"/g, '""')}"`);
                    if (visibleColumns.iptStart) row.push(`"${t.iptStart}"`);
                    if (visibleColumns.iptEnd) row.push(`"${t.iptEnd}"`);
                    if (visibleColumns.monthSinceIpt) row.push(`"${t.monthSinceIpt}"`);
                    if (visibleColumns.isRegistered) row.push(`"${t.isRegistered ? 'Yes' : 'No'}"`);
                    if (visibleColumns.dateRegistered) row.push(`"${t.dateRegistered}"`);
                    if (visibleColumns.totalWorkingDays) row.push(`"${t.totalWorkingDays}"`);
                    if (visibleColumns.totalPresent) row.push(`"${t.totalPresent}"`);
                    if (visibleColumns.noClockRecords) row.push(`"${t.noClockRecords}"`);
                    csvRows.push(row.join(','));
                });
                
                const csvString = '\ufeff' + csvRows.join('\n');
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'ASTP_Attendance_Export.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const SortIndicator = ({ colKey }) => (
                <span className={`inline-block w-3 ml-1 text-[10px] ${sortConfig.key === colKey ? 'text-slate-600 dark:text-slate-300' : 'text-slate-300 dark:text-slate-600'}`}>
                    {sortConfig.key === colKey ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                </span>
            );
            
            const ColumnToggle = ({ colKey, label }) => (
                <label className="flex items-center gap-2 p-2 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer rounded-lg">
                    <input type="checkbox" checked={visibleColumns[colKey]} onChange={() => setVisibleColumns(prev => ({...prev, [colKey]: !prev[colKey]}))} className="rounded border-slate-300" />
                    <span className="text-sm text-slate-700 dark:text-slate-300">{label}</span>
                </label>
            );

            const [showColToggle, setShowColToggle] = useState(false);

            return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 dark:text-white">Export ASTP Attendance</h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Detailed attendance metrics excluding holidays, rest days, and schooling days.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-3 relative">
                            <select value={selectedStatus} onChange={e => setSelectedStatus(e.target.value)} className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-300 shadow-sm outline-none">
                                <option value="All">All Statuses</option>
                                <option value="Active">Active</option>
                                <option value="Dropped">Dropped</option>
                                <option value="LOA">LOA</option>
                                <option value="Completed">Completed</option>
                            </select>
                            
                            <div className="relative">
                                <button onClick={() => setShowColToggle(!showColToggle)} className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-300 shadow-sm hover:bg-slate-50 flex items-center gap-2">
                                    <Icon name="columns" size={16} /> Columns
                                </button>
                                {showColToggle && (
                                    <div className="absolute right-0 mt-2 w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-50 p-2">
                                        <div className="text-xs font-black uppercase text-slate-400 mb-2 px-2">Toggle Columns</div>
                                        <ColumnToggle colKey="studentId" label="Student ID#" />
                                        <ColumnToggle colKey="name" label="Trainee Name" />
                                        <ColumnToggle colKey="company" label="Company" />
                                        <ColumnToggle colKey="iptStart" label="IPT Date Start" />
                                        <ColumnToggle colKey="iptEnd" label="IPT Date End" />
                                        <ColumnToggle colKey="monthSinceIpt" label="Month (Since IPT)" />
                                        <ColumnToggle colKey="isRegistered" label="Registered?" />
                                        <ColumnToggle colKey="dateRegistered" label="Date Registered" />
                                        <ColumnToggle colKey="totalWorkingDays" label="Total Working Days" />
                                        <ColumnToggle colKey="totalPresent" label="Total Present Shifts" />
                                        <ColumnToggle colKey="noClockRecords" label="Days No Clock Records" />
                                    </div>
                                )}
                            </div>
                            
                            <button onClick={exportToExcel} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-emerald-500 transition-all flex items-center gap-2">
                                <Icon name="download" size={16} /> Export XLS
                            </button>
                        </div>
                    </div>
                    
                    {loading ? (
                        <div className="flex flex-col items-center justify-center p-20 text-slate-400">
                            <Icon name="loader-2" size={28} className="animate-spin mb-4 text-slate-600" />
                            <p className="font-medium text-sm">Aggregating attendance metrics for ASTP trainees. This may take a moment...</p>
                        </div>
                    ) : (
                        <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                            <div className="overflow-x-auto custom-scrollbar">
                                <table className="w-full text-left whitespace-nowrap">
                                    <thead className="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                                        <tr>
                                            {visibleColumns.studentId && <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('studentId')}>Student ID# <SortIndicator colKey="studentId"/></th>}
                                            {visibleColumns.name && <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('name')}>Trainee Name <SortIndicator colKey="name"/></th>}
                                            {visibleColumns.company && <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('company')}>Company <SortIndicator colKey="company"/></th>}
                                            {visibleColumns.iptStart && <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('iptStart')}>IPT Start <SortIndicator colKey="iptStart"/></th>}
                                            {visibleColumns.iptEnd && <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800" onClick={() => handleSort('iptEnd')}>IPT End <SortIndicator colKey="iptEnd"/></th>}

                    // Listen to the projects collection in Firebase
