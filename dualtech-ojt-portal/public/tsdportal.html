<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from "react";
        import { createRoot } from "react-dom/client";
        import { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, PieChart, Pie, Cell } from "recharts";
        import { 
            Search, Filter, Download, User, Calendar, CalendarDays, Info, MapPin, CheckCircle2, Mail, AlertCircle,
            XCircle, Clock, AlertTriangle, FileText, ChevronDown, RefreshCw, Briefcase,
            LayoutDashboard, Users, LogOut, ChevronRight, Check, X, Shield, PlusCircle, Save,
            History, Send, Settings, CheckSquare, MessageSquare, Building2, Activity, UserCircle2,
            Phone, Plus, Trash2, Crosshair, Navigation, Building, CalendarCheck, Loader2, TrendingUp, Menu, FileUp, ArrowLeft, Presentation, Video, BarChart2, Edit3, ClipboardList
        } from "lucide-react";
        
        import { initializeApp } from "firebase/app";
        import { initializeAppCheck, CustomProvider } from "firebase/app-check";
        import { 
            getFirestore, 
            collection, 
            collectionGroup, 
            query, 
            where, 
            orderBy, 
            onSnapshot, 
            doc, 
            getDoc, 
            getDocs 
        } from "firebase/firestore";
        
        

        const blockSourceAccess = () => {
            const blockEvent = (e) => {
                if (e.type === 'contextmenu') {
                    e.preventDefault();
                    return;
                }

                // ADDED: Check if e.key exists before proceeding
                if (e.type === 'keydown' && e.key) {
                    const key = e.key.toUpperCase();
                    const blockedKeyCombos = [
                        'F12', 'U', 'I', 'J', 'C', 'K'
                    ];

                    if (e.key === 'F12') {
                        e.preventDefault();
                        e.stopPropagation();
                        return;
                    }

                    if (e.ctrlKey && blockedKeyCombos.includes(key)) {
                        if (key === 'U' || (e.shiftKey && ['I', 'J', 'C', 'K'].includes(key))) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    }
                }
            };

            document.addEventListener('contextmenu', blockEvent);
            document.addEventListener('keydown', blockEvent);
        };

        blockSourceAccess();
        
        const firebaseConfig = {
            apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U",
            authDomain: "dualtech-ojt-portal.firebaseapp.com",
            projectId: "dualtech-ojt-portal",
            storageBucket: "dualtech-ojt-portal.firebasestorage.app",
            messagingSenderId: "255242185978",
            appId: "1:255242185978:web:2f07c554fad2e3a78ead43"
        };
        // 1. Initialize Compat SDK (used by older parts of your code for auth/db)
        const firebaseApp = firebase.initializeApp(firebaseConfig);
        const appCheckCompat = firebase.appCheck();
        appCheckCompat.activate(
            new firebase.appCheck.ReCaptchaEnterpriseProvider('6LeGUowtAAAAALQKvlwQ1T7UtdbAqcL47wPVBxff'),
            true
        );
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. Initialize Modular SDK (used by OjtAttendanceView for collections)
        const modularApp = initializeApp(firebaseConfig); 
        const appCheckModular = initializeAppCheck(modularApp, {
            provider: new CustomProvider({
                getToken: async () => {
                    const t = await appCheckCompat.getToken(false);
                    return {
                        token: t.token,
                        expireTimeMillis: Date.now() + 3600000
                    };
                }
            }),
            isTokenAutoRefreshEnabled: false
        });
        const firestore = getFirestore(modularApp);
        const appId = firebaseConfig.projectId;

        const logSystemEvent = async (action, target, details) => {
            try {
                const userEmail = auth.currentUser ? auth.currentUser.email : 'Unknown User';
                await db.collection('system_logs').add({
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    user: userEmail,
                    action: action,
                    target: target,
                    details: details || {}
                });
            } catch (err) {
                console.error("Failed to log system event:", err);
            }
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const spanRef = React.useRef(null);
            
            React.useEffect(() => {
                if (spanRef.current && window.lucide) {
                    // Manually inject the tag so React's Virtual DOM ignores the replacement
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px;"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, size, className]);

            // React only manages this empty span container
            return <span ref={spanRef} className="inline-flex items-center justify-center"></span>;
        };

        const LoginScreen = ({ onLogin, error }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                await onLogin(email, password);
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-300">
                    {/* Animated Background Elements */}
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
                        <div className="absolute -top-40 -left-40 w-96 h-96 bg-primary-500/20 dark:bg-primary-500/10 rounded-full blur-3xl animate-pulse"></div>
                        <div className="absolute top-1/2 -right-40 w-96 h-96 bg-primary-400/20 dark:bg-primary-400/10 rounded-full blur-3xl animate-pulse" style={{ animationDelay: '1s' }}></div>
                    </div>

                    <div className="relative z-10 bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white/40 dark:border-slate-700/50 transition-colors duration-300">
                        <div className="flex justify-center mb-6">
                            <div className="bg-primary-100 dark:bg-primary-900/50 text-primary-600 dark:text-primary-400 rounded-2xl p-4 shadow-inner">
                                <Icon name="shield-check" size={34} />
                            </div>
                        </div>
                        <h1 className="text-3xl font-black text-slate-800 dark:text-slate-100 text-center mb-2 tracking-tight">TSD Portal Sign In</h1>
                        <p className="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">Use an account created from the Admin System portal.</p>

                        {error && (
                            <div className="mb-6 p-4 rounded-2xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/50 text-sm text-red-700 dark:text-red-400 flex items-center gap-3">
                                <Icon name="alert-circle" size={18} />
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Email</label>
                                <div className="relative group">
                                    <Icon name="mail" size={18} className="absolute left-4 top-3.5 text-slate-400 dark:text-slate-500 group-focus-within:text-primary-500 transition-colors" />
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="name@dualtech.edu.ph"
                                        required
                                        className="w-full pl-12 pr-4 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/20 dark:focus:ring-primary-500/10 outline-none transition-all"
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Password</label>
                                <div className="relative group">
                                    <Icon name="lock" size={18} className="absolute left-4 top-3.5 text-slate-400 dark:text-slate-500 group-focus-within:text-primary-500 transition-colors" />
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        required
                                        className="w-full pl-12 pr-4 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/20 dark:focus:ring-primary-500/10 outline-none transition-all"
                                    />
                                </div>
                            </div>
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full rounded-2xl bg-primary-600 hover:bg-primary-500 text-white font-bold py-3.5 shadow-lg shadow-primary-500/30 hover:shadow-primary-500/50 hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-70 disabled:hover:translate-y-0"
                            >
                                {loading ? 'Signing in...' : 'Sign in to TSD Portal'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const SamsPerformanceView = () => {
            const [allTrainees, setAllTrainees] = useState([]);
            const [astpData, setAstpData] = useState({ list: [], count: 0 });
            const [bstpData, setBstpData] = useState({ list: [], count: 0 });
            const [loading, setLoading] = useState(true);
            const [activeModal, setActiveModal] = useState(null); 
            const [sortConfig, setSortConfig] = useState({ key: 'computedName', direction: 'asc' });

            useEffect(() => {
                const fetchPerformanceData = async () => {
                    try {
                        const APP_ID = "dualtech-ojt-portal"; 
                        const traineesRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees');
                        const traineesSnapshot = await traineesRef.get();
                        
                        const profilesQuery = query(collectionGroup(firestore, 'profile'), where('role', '==', 'trainee'));
                        const profilesSnap = await getDocs(profilesQuery);
                        const registeredStudentIds = new Set();
                        profilesSnap.forEach(pDoc => {
                            const pData = pDoc.data();
                            if (pData.studentId) {
                                registeredStudentIds.add(String(pData.studentId).trim());
                            }
                        });

                        let astpList = [];
                        let bstpList = [];
                        let astpCount = 0;
                        let bstpCount = 0;

                        traineesSnapshot.forEach(doc => {
                            const data = doc.data();
                            const sId = String(data.studentId || data['Student ID#'] || '').trim();
                            const isRegistered = data.isRegistered === true || (sId !== '' && registeredStudentIds.has(sId));
                            const status = data.status || data.Status || 'Unknown';
                            const level = String(data.level || data.Level || data.course || data.Course || '').toUpperCase();
                            
                            const processedTrainee = { id: doc.id, ...data, isRegistered, computedStatus: status };

                            if (level.includes('BSTP')) {
                                bstpList.push(processedTrainee);
                                if ((status === 'Active' || status === 'Pre-BSTP' || status === 'Post-BSTP') && isRegistered) {
                                    bstpCount++;
                                }
                            } else {
                                astpList.push(processedTrainee);
                                if (status === 'Active' && isRegistered) {
                                    astpCount++;
                                }
                            }
                        });

                        setAstpData({ list: astpList, count: astpCount });
                        setBstpData({ list: bstpList, count: bstpCount });
                        setAllTrainees([...astpList, ...bstpList]);
                        setLoading(false);

                    } catch (error) {
                        console.error("Error fetching SAMS data:", error);
                        setLoading(false);
                    }
                };

                fetchPerformanceData();
            }, []);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const closeModal = () => {
                setActiveModal(null);
                setSortConfig({ key: 'computedName', direction: 'asc' });
            };

            const renderModalContent = () => {
                if (!activeModal) return null;
                
                const isAstp = activeModal === 'astp';
                const sourceList = isAstp ? astpData.list : bstpData.list;

                let processed = sourceList.map(t => {
                    return {
                        ...t,
                        computedStudentId: t.studentId || t['Student ID#'] || 'No ID',
                        computedName: `${t.firstName || t.given || t.Given || ''} ${t.lastName || t.family || t.Family || ''}`.trim() || t.name || 'Unknown',
                        computedCompany: t.company || t.companyName || 'Unassigned',
                        computedIC: t.assignedIC || t.icName || t.Coordinator || t.ic || t.industrialCoordinator || t.supervisorName || 'Unassigned',
                        computedAdviser: t.adviser || t.Adviser || 'Unassigned',
                        computedRegStatus: t.isRegistered ? 'Yes' : 'No',
                    };
                });

                processed.sort((a, b) => {
                    let valA = a[sortConfig.key];
                    let valB = b[sortConfig.key];
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                const SortIndicator = ({ colKey }) => (
                    <span className={`inline-block w-3 ml-1 text-[10px] ${sortConfig.key === colKey ? 'text-slate-600 dark:text-slate-300' : 'text-slate-300 dark:text-slate-600'}`}>
                        {sortConfig.key === colKey ? (sortConfig.direction === 'asc' ? '▲' : '▼') : '↕'}
                    </span>
                );

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-in fade-in duration-200">
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col border border-slate-200 dark:border-slate-700">
                            <div className="flex justify-between items-center p-6 border-b border-slate-200 dark:border-slate-700">
                                <h3 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                    {isAstp ? <Briefcase className="text-blue-500" /> : <Presentation className="text-emerald-500" />}
                                    {isAstp ? 'ASTP Trainees Details' : 'BSTP Trainees Details'}
                                    <span className="ml-3 text-sm font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 py-1 px-3 rounded-full">
                                        Total: {processed.length}
                                    </span>
                                </h3>
                                <button onClick={closeModal} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-full transition-colors">
                                    <X size={20} />
                                </button>
                            </div>
                            <div className="p-6 overflow-auto custom-scrollbar flex-1">
                                <table className="w-full text-left whitespace-nowrap">
                                    <thead className="select-none sticky top-0 bg-white dark:bg-slate-800 shadow-sm z-10">
                                        <tr>
                                            <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedStudentId')}>
                                                Student ID <SortIndicator colKey="computedStudentId" />
                                            </th>
                                            <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedName')}>
                                                Name <SortIndicator colKey="computedName" />
                                            </th>
                                            {isAstp && (
                                                <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedCompany')}>
                                                    Company <SortIndicator colKey="computedCompany" />
                                                </th>
                                            )}
                                            <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedStatus')}>
                                                Status <SortIndicator colKey="computedStatus" />
                                            </th>
                                            {isAstp ? (
                                                <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedIC')}>
                                                    Assigned IC <SortIndicator colKey="computedIC" />
                                                </th>
                                            ) : (
                                                <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700" onClick={() => handleSort('computedAdviser')}>
                                                    Adviser <SortIndicator colKey="computedAdviser" />
                                                </th>
                                            )}
                                            <th className="table-header cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors py-3 px-4 border-b border-slate-200 dark:border-slate-700 text-center" onClick={() => handleSort('computedRegStatus')}>
                                                Registered <SortIndicator colKey="computedRegStatus" />
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processed.map(t => (
                                            <tr key={t.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-700/50">
                                                <td className="py-3 px-4 font-mono text-sm text-slate-600 dark:text-slate-300">{t.computedStudentId}</td>
                                                <td className="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">{t.computedName}</td>
                                                {isAstp && <td className="py-3 px-4 text-sm text-slate-600 dark:text-slate-300">{t.computedCompany}</td>}
                                                <td className="py-3 px-4">
                                                    <span className={`text-xs font-bold px-2 py-1 rounded-md ${t.computedStatus === 'Active' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}`}>
                                                        {t.computedStatus}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 text-sm text-slate-600 dark:text-slate-300">{isAstp ? t.computedIC : t.computedAdviser}</td>
                                                <td className="py-3 px-4 text-center">
                                                    {t.isRegistered ? (
                                                        <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 px-2.5 py-1 rounded-md border border-emerald-200 dark:border-emerald-800/50">Yes</span>
                                                    ) : (
                                                        <span className="text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md border border-slate-200 dark:border-slate-700">No</span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center p-20 text-slate-400">
                        <Loader2 className="animate-spin mb-4 text-slate-600" size={28} />
                        <p className="font-medium text-sm">Aggregating SAMS Performance Data...</p>
                    </div>
                );
            }

            return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="mb-8">
                        <h2 className="text-2xl font-black text-slate-800 dark:text-white">SAMS Performance</h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Global overview of ASTP and BSTP trainees.</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {/* ASTP Bar */}
                        <div 
                            onClick={() => setActiveModal('astp')}
                            className="bg-gradient-to-br from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 dark:from-blue-600 dark:to-blue-800 p-6 rounded-2xl shadow-lg cursor-pointer transform hover:-translate-y-1 transition-all duration-300 relative overflow-hidden group"
                        >
                            <div className="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-30 transition-opacity">
                                <Users size={80} />
                            </div>
                            <div className="relative z-10">
                                <h3 className="text-blue-100 font-bold uppercase tracking-wider text-sm mb-2 flex items-center gap-2">
                                    <Briefcase size={16} />
                                    ASTP Level
                                </h3>
                                <div className="text-4xl font-black text-white mb-2">{astpData.count}</div>
                                <p className="text-blue-100 text-sm">Active & Registered Trainees</p>
                            </div>
                        </div>

                        {/* BSTP Bar */}
                        <div 
                            onClick={() => setActiveModal('bstp')}
                            className="bg-gradient-to-br from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 dark:from-emerald-600 dark:to-emerald-800 p-6 rounded-2xl shadow-lg cursor-pointer transform hover:-translate-y-1 transition-all duration-300 relative overflow-hidden group"
                        >
                            <div className="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-30 transition-opacity">
                                <Users size={80} />
                            </div>
                            <div className="relative z-10">
                                <h3 className="text-emerald-100 font-bold uppercase tracking-wider text-sm mb-2 flex items-center gap-2">
                                    <Presentation size={16} />
                                    BSTP Level
                                </h3>
                                <div className="text-4xl font-black text-white mb-2">{bstpData.count}</div>
                                <p className="text-emerald-100 text-sm">Active, Pre/Post-BSTP & Registered</p>
                            </div>
                        </div>
                    </div>

                    {renderModalContent()}
                </div>
            );
        };

        const CompanyEngagementView = () => {
            // --- DATA FETCHING STATE (Explicitly using React. hook syntax for CDN compatibility) ---
            const [allVisits, setAllVisits] = React.useState([]);
            const [allTrainees, setAllTrainees] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            // --- UI FILTER STATE ---
            const [selectedYear, setSelectedYear] = React.useState(() => new Date().getFullYear().toString());
            const [selectedMonth, setSelectedMonth] = React.useState(() => new Date().toLocaleString('en-US', { month: 'short' })); 
            const [selectedIC, setSelectedIC] = React.useState(null);
            const [sortConfig, setSortConfig] = React.useState({ key: 'activeTrainees', direction: 'desc' });
            
            // Static list of months
            const monthsList = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            // --- FETCH DATA FROM FIREBASE ---
            React.useEffect(() => {
                const fetchEngagementData = async () => {
                    try {
                        const APP_ID = "dualtech-ojt-portal"; 
                        const dataRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data');

                        // 1. Fetch Trainees
                        const traineesSnapshot = await dataRef.collection('trainees').get();
                        let fetchedTrainees = [];
                        traineesSnapshot.forEach(doc => {
                            fetchedTrainees.push({ id: doc.id, ...doc.data() });
                        });

                        // 2. Fetch Visits 
                        const visitsSnapshot = await dataRef.collection('visits').get();
                        let fetchedVisits = [];
                        visitsSnapshot.forEach(doc => {
                            fetchedVisits.push({ id: doc.id, ...doc.data() });
                        });

                        setAllTrainees(fetchedTrainees);
                        setAllVisits(fetchedVisits);
                        setLoading(false);

                    } catch (error) {
                        console.error("Error fetching engagement data:", error);
                        setLoading(false);
                    }
                };

                fetchEngagementData();
            }, []); // Empty dependency array means this runs once when component mounts

            // --- HELPER FUNCTIONS ---
            const parseDate = (dateInput) => {
                if (!dateInput) return new Date(NaN);
                
                if (typeof dateInput === 'object') {
                    if (typeof dateInput.toDate === 'function') return dateInput.toDate();
                    if (dateInput.seconds !== undefined) return new Date(dateInput.seconds * 1000);
                }
                
                if (typeof dateInput === 'string') {
                    const trimmed = dateInput.trim();

                    // Handle YYYY-MM-DD exactly to prevent timezone offset bugs
                    const ymdRegex = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/;
                    const ymdMatch = trimmed.match(ymdRegex);
                    if (ymdMatch) {
                        const year = parseInt(ymdMatch[1], 10);
                        const month = parseInt(ymdMatch[2], 10);
                        const day = parseInt(ymdMatch[3], 10);
                        return new Date(year, month - 1, day);
                    }

                    let nativeDate = new Date(trimmed.replace(/-/g, '/'));
                    if (!isNaN(nativeDate.getTime())) return nativeDate;
                    
                    const dmyRegex = /^(\d{1,2})[-./](\d{1,2})[-./](\d{4})$/;
                    const match = trimmed.match(dmyRegex);
                    if (match) {
                        const day = parseInt(match[1], 10);
                        const month = parseInt(match[2], 10);
                        const year = parseInt(match[3], 10);
                        if (month >= 1 && month <= 12) {
                            return new Date(year, month - 1, day);
                        }
                    }
                }
                return new Date(dateInput);
            };

            const getYear = (dateStr) => {
                const d = parseDate(dateStr);
                return isNaN(d.getTime()) ? null : d.getFullYear().toString();
            };

            const getMonthName = (dateStr) => {
                const d = parseDate(dateStr);
                if (isNaN(d.getTime())) return 'Unknown';
                const monthsList = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return monthsList[d.getMonth()];
            };

            // --- 1. EXTRACT AVAILABLE YEARS ---
            const availableYears = React.useMemo(() => {
                const years = new Set();
                (allVisits || []).forEach(v => {
                    const y = getYear(v.visitDate || v.createdAt || v.date || v.visit_date);
                    if (y) years.add(y);
                });
                (allTrainees || []).forEach(t => {
                    const yStart = getYear(t['IPT Date Start'] || t.iptDateStart || t.startDate || t.start_date);
                    if (yStart) years.add(yStart);
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [allVisits, allTrainees]);

            // --- 2. FILTER VISITS BY YEAR AND MONTH ---
            const filteredVisits = React.useMemo(() => {
                let filtered = allVisits || [];
                if (selectedYear !== 'All') {
                    filtered = filtered.filter(v => getYear(v.visitDate || v.createdAt || v.date || v.visit_date) === selectedYear);
                }
                if (selectedMonth !== 'All') {
                    filtered = filtered.filter(v => getMonthName(v.visitDate || v.createdAt || v.date || v.visit_date) === selectedMonth);
                }
                return filtered;
            }, [allVisits, selectedYear, selectedMonth]);

            // --- 3. CORE METRICS AGGREGATION ---
            const { monthlyData, icData, companyData, summaryMetrics } = React.useMemo(() => {
                const monthsMap = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11 };
                
                const mData = Object.keys(monthsMap).reduce((acc, month) => {
                    acc[month] = { month, 'Face-to-Face': 0, 'Online': 0, total: 0 };
                    return acc;
                }, {});

                const iData = {};
                const cData = {};
                const metrics = { total: 0, f2f: 0, online: 0 };

                filteredVisits.forEach(v => {
                    const rawType = (v.visitType || v.type || v.visit_type || '').toLowerCase();
                    const type = (rawType.includes('online') || rawType.includes('virtual') || rawType.includes('zoom') || rawType.includes('teams')) ? 'Online' : 'Face-to-Face';
                    const ic = v.assignedIC || v.icName || v.Coordinator || v.ic || v.industrialCoordinator || v.supervisorName || 'Unassigned';
                    const comp = v.company || v.companyName || v.company_name || 'Unknown Company';
                    const month = getMonthName(v.visitDate || v.createdAt || v.date || v.visit_date);

                    metrics.total++;
                    if (type === 'Face-to-Face') metrics.f2f++;
                    else metrics.online++;

                    if (mData[month]) {
                        mData[month][type]++;
                        mData[month].total++;
                    }

                    if (!iData[ic]) iData[ic] = { ic, 'Face-to-Face': 0, 'Online': 0, total: 0 };
                    iData[ic][type]++;
                    iData[ic].total++;

                    if (!cData[comp]) cData[comp] = { company: comp, total: 0, f2f: 0, online: 0, lastVisit: v.visitDate || v.createdAt || v.date || v.visit_date };
                    cData[comp].total++;
                    if (type === 'Face-to-Face') cData[comp].f2f++;
                    else cData[comp].online++;
                    
                    const currentDate = parseDate(v.visitDate || v.createdAt || v.date || v.visit_date);
                    if (!isNaN(currentDate.getTime()) && currentDate > parseDate(cData[comp].lastVisit)) {
                        cData[comp].lastVisit = v.visitDate || v.createdAt || v.date || v.visit_date;
                    }
                });

                return {
                    monthlyData: Object.values(mData),
                    icData: Object.values(iData).sort((a, b) => b.total - a.total),
                    companyData: Object.values(cData).sort((a, b) => b.total - a.total),
                    summaryMetrics: metrics
                };
            }, [filteredVisits]);

            // --- 4. CALCULATE COVERAGE STATUS FOR TARGET TIME WINDOW ---
            const targetMonthName = selectedMonth !== 'All' ? selectedMonth : 'All Months';

            const { unvisitedCompanies, totalActiveCompanies, pieChartData } = React.useMemo(() => {
                const companyVisitsMap = {};
                const visitedInPeriodCompanies = new Set();
                
                allVisits.forEach(v => {
                    const d = parseDate(v.visitDate || v.createdAt || v.date || v.visit_date);
                    if (!isNaN(d.getTime())) {
                        const visitY = d.getFullYear().toString();
                        const visitM = monthsList[d.getMonth()];

                        const matchYear = selectedYear === 'All' || visitY === selectedYear;
                        const matchMonth = selectedMonth === 'All' || visitM === selectedMonth;

                        if (matchYear && matchMonth) {
                            const compName = v.company || v.companyName || v.company_name || 'Unknown Company';
                            if (!companyVisitsMap[compName]) {
                                companyVisitsMap[compName] = [];
                            }
                            companyVisitsMap[compName].push((v.visitType || v.type || v.visit_type || '').toLowerCase());
                            visitedInPeriodCompanies.add(compName);
                        }
                    }
                });

                const activeComps = {};

                let dynamicPeriodStart, dynamicPeriodEnd;
                if (selectedYear === 'All') {
                    dynamicPeriodStart = new Date(1970, 0, 1);
                    dynamicPeriodEnd = new Date(2099, 11, 31);
                } else {
                    const yearInt = parseInt(selectedYear);
                    if (selectedMonth === 'All') {
                        dynamicPeriodStart = new Date(yearInt, 0, 1);
                        dynamicPeriodEnd = new Date(yearInt, 11, 31);
                    } else {
                        const monthIdx = monthsList.indexOf(selectedMonth);
                        dynamicPeriodStart = new Date(yearInt, monthIdx, 1);
                        dynamicPeriodEnd = new Date(yearInt, monthIdx + 1, 0);
                    }
                }

                (allTrainees || []).forEach(t => {
                    const comp = t.company || t.companyName || t.company_name;
                    if (!comp) return;

                    const rawStatus = t.status || t.Status || t.traineeStatus || t.trainee_status || '';
                    const stat = rawStatus.toLowerCase().trim();

                    if (
                        stat === 'loa' || 
                        stat.includes('floater') || 
                        stat.includes('drop') || 
                        stat.includes('recall') ||
                        stat.includes('returnee')
                    ) {
                        return;
                    }

                    const startDate = parseDate(t['IPT Date Start'] || t.iptDateStart || t.startDate || t.start_date || t.ipt_start_date);
                    if (isNaN(startDate.getTime())) return;

                    let endDate = parseDate(t['IPT Date End'] || t.iptDateEnd || t.endDate || t.end_date || t.ipt_end_date);
                    if (stat.includes('complete') || stat.includes('graduat')) {
                        if (isNaN(endDate.getTime())) {
                            const rotsDate = parseDate(t['ROTS Approved Date'] || t.rotsDate || t.dateApproved || t.rots_approved_date || t.date_approved);
                            if (!isNaN(rotsDate.getTime())) {
                                endDate = rotsDate;
                            } else {
                                return;
                            }
                        }
                    } else {
                        if (isNaN(endDate.getTime())) {
                            endDate = new Date(2099, 0, 1);
                        }
                    }

                    if (startDate <= dynamicPeriodEnd && endDate >= dynamicPeriodStart) {
                        if (!activeComps[comp]) {
                            activeComps[comp] = { count: 0, activeIcs: new Set(), hasActiveTrainees: true };
                        }
                        activeComps[comp].count++;
                        
                        const icName = t.assignedIC || t.icName || t.Coordinator || t.ic || t.industrialCoordinator || t.supervisorName || 'Unassigned';
                        if (icName && icName !== 'Unassigned') {
                            activeComps[comp].activeIcs.add(icName);
                        }
                    }
                });

                visitedInPeriodCompanies.forEach(comp => {
                    if (!activeComps[comp]) {
                        activeComps[comp] = { count: 0, activeIcs: new Set(), hasActiveTrainees: false };
                    }
                });

                let f2fCount = 0;
                let onlineCount = 0;
                let notVisitedCount = 0;
                const unvisited = [];

                Object.keys(activeComps).forEach(comp => {
                    const logs = companyVisitsMap[comp] || [];
                    
                    const hasFaceToFace = logs.some(m => m.includes('face') || m.includes('f2f') || m.includes('physical') || m.includes('presentation') || m.includes('site'));
                    const hasOnline = logs.some(m => m.includes('online') || m.includes('virtual') || m.includes('zoom') || m.includes('teams'));

                    if (hasFaceToFace) {
                        f2fCount++;
                    } else if (hasOnline) {
                        onlineCount++;
                    } else {
                        if (activeComps[comp].hasActiveTrainees) {
                            notVisitedCount++;
                            const activeIcList = Array.from(activeComps[comp].activeIcs).sort().join(', ') || 'Unassigned';
                            unvisited.push({
                                company: comp,
                                activeTrainees: activeComps[comp].count,
                                icName: activeIcList
                            });
                        }
                    }
                });

                return {
                    unvisitedCompanies: unvisited.sort((a, b) => b.activeTrainees - a.activeTrainees),
                    totalActiveCompanies: Object.keys(activeComps).length,
                    pieChartData: [
                        { name: 'Face-to-Face', value: f2fCount, fill: '#10b981' },
                        { name: 'Online', value: onlineCount, fill: '#3b82f6' },
                        { name: 'Not Visited', value: notVisitedCount, fill: '#f43f5e' }
                    ]
                };
            }, [allVisits, allTrainees, selectedYear, selectedMonth]);

            // --- 5. SORTING ALGORITHM FOR UNVISITED COMPANIES ---
            const sortedUnvisited = React.useMemo(() => {
                let sortable = [...unvisitedCompanies];
                sortable.sort((a, b) => {
                    if (a[sortConfig.key] < b[sortConfig.key]) {
                        return sortConfig.direction === 'asc' ? -1 : 1;
                    }
                    if (a[sortConfig.key] > b[sortConfig.key]) {
                        return sortConfig.direction === 'asc' ? 1 : -1;
                    }
                    return 0;
                });
                return sortable;
            }, [unvisitedCompanies, sortConfig]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            // --- LOADING STATE ---
            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center p-20 text-slate-500">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-4"></div>
                        <p>Loading Company Engagement Data...</p>
                    </div>
                );
            }

            // --- DETAILED VIEW ---
            if (selectedIC) {
                const icVisits = filteredVisits.filter(v => (v.assignedIC || v.icName || v.Coordinator || v.ic || v.industrialCoordinator || v.supervisorName || 'Unassigned') === selectedIC);
                return (
                    <div className="space-y-6 animate-in slide-in-from-right-4 duration-300">
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex justify-between items-center transition-colors">
                            <div>
                                <h3 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                    <Users className="text-indigo-600 dark:text-indigo-400" />
                                    Meeting Report: {selectedIC}
                                </h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Detailed log of all company visits and meetings.</p>
                            </div>
                            <button 
                                onClick={() => setSelectedIC(null)}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl flex items-center gap-2 transition-colors"
                            >
                                <ArrowLeft size={16} /> Back to Dashboard
                            </button>
                        </div>

                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden transition-colors">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                        <tr>
                                            <th className="p-4">Date</th>
                                            <th className="p-4">Company Visited</th>
                                            <th className="p-4">Visit Type</th>
                                            <th className="p-4 w-1/2">Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {icVisits.map((v, idx) => {
                                            const rawVisitType = v.visitType || v.type || v.visit_type || 'Face-to-Face';
                                            const isOnline = rawVisitType.toLowerCase().includes('online') || rawVisitType.toLowerCase().includes('virtual') || rawVisitType.toLowerCase().includes('zoom');
                                            return (
                                                <tr key={v.id || idx} className="hover:bg-indigo-50/50 transition-colors">
                                                    <td className="p-4 font-medium text-slate-700">
                                                        {v.visitDate ? new Date(v.visitDate).toLocaleDateString() : (v.createdAt ? new Date(v.createdAt).toLocaleDateString() : (v.date ? new Date(v.date).toLocaleDateString() : 'N/A'))}
                                                    </td>
                                                    <td className="p-4 font-bold text-indigo-700">{v.company || v.companyName || v.company_name || 'Unknown'}</td>
                                                    <td className="p-4">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 w-max ${isOnline ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                            {isOnline ? <Video size={12}/> : <Presentation size={12}/>}
                                                            {rawVisitType}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-600 whitespace-normal min-w-[300px]">
                                                        {v.notes || v.remarks || v.comments || <span className="italic text-slate-400">No notes provided.</span>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- MAIN DASHBOARD VIEW ---
            return (
                <div className="space-y-6 animate-in fade-in duration-300">
                    {/* TOP BAR & FILTERS */}
                    <div className="bg-slate-900 p-6 rounded-3xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-xl font-extrabold text-white flex items-center gap-3 tracking-tight">
                                <Building2 className="text-indigo-400" />
                                Company Meetings Dashboard
                            </h2>
                            <p className="text-slate-400 text-[13px] mt-1">Track IC engagement and visit distributions.</p>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                            <div className="flex items-center gap-2">
                                <Filter size={16} className="text-slate-400" />
                                <span className="text-sm font-bold text-slate-300 uppercase tracking-wider">Year:</span>
                                <select 
                                    value={selectedYear} 
                                    onChange={e => setSelectedYear(e.target.value)} 
                                    className="bg-transparent text-white font-bold text-sm outline-none cursor-pointer"
                                >
                                    <option value="All" className="bg-slate-800">All Time</option>
                                    {availableYears.map(y => <option key={y} value={y} className="bg-slate-800">{y}</option>)}
                                </select>
                            </div>

                            <div className="w-px h-6 bg-slate-700 hidden md:block"></div>

                            <div className="flex items-center gap-2">
                                <span className="text-sm font-bold text-slate-300 uppercase tracking-wider">Month:</span>
                                <select 
                                    value={selectedMonth} 
                                    onChange={e => setSelectedMonth(e.target.value)} 
                                    className="bg-transparent text-white font-bold text-sm outline-none cursor-pointer"
                                >
                                    <option value="All" className="bg-slate-800">All Months</option>
                                    {monthsList.map(m => <option key={m} value={m} className="bg-slate-800">{m}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* SUMMARY METRICS CARDS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm hover:shadow-md border border-slate-200 dark:border-slate-800 flex items-center gap-5 transition-all duration-300 relative overflow-hidden group">
                            <div className="absolute -left-4 -bottom-4 w-20 h-20 bg-indigo-500/10 dark:bg-indigo-400/10 rounded-full blur-xl group-hover:bg-indigo-500/20 dark:group-hover:bg-indigo-400/20 transition-colors"></div>
                            <div className="bg-indigo-100 dark:bg-indigo-900/30 p-4 rounded-2xl text-indigo-600 dark:text-indigo-400 relative z-10"><Calendar size={28}/></div>
                            <div className="relative z-10">
                                <p className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Total Meetings</p>
                                <h4 className="text-3xl font-black text-slate-800 dark:text-white">{summaryMetrics.total}</h4>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm hover:shadow-md border border-slate-200 dark:border-slate-800 flex items-center gap-5 transition-all duration-300 relative overflow-hidden group">
                            <div className="absolute -left-4 -bottom-4 w-20 h-20 bg-emerald-500/10 dark:bg-emerald-400/10 rounded-full blur-xl group-hover:bg-emerald-500/20 dark:group-hover:bg-emerald-400/20 transition-colors"></div>
                            <div className="bg-emerald-100 dark:bg-emerald-900/30 p-4 rounded-2xl text-emerald-600 dark:text-emerald-400 relative z-10"><Presentation size={28}/></div>
                            <div className="relative z-10">
                                <p className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Face-to-Face</p>
                                <h4 className="text-3xl font-black text-slate-800 dark:text-white">{summaryMetrics.f2f}</h4>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl shadow-sm hover:shadow-md border border-slate-200 dark:border-slate-800 flex items-center gap-5 transition-all duration-300 relative overflow-hidden group">
                            <div className="absolute -left-4 -bottom-4 w-20 h-20 bg-blue-500/10 dark:bg-blue-400/10 rounded-full blur-xl group-hover:bg-blue-500/20 dark:group-hover:bg-blue-400/20 transition-colors"></div>
                            <div className="bg-blue-100 dark:bg-blue-900/30 p-4 rounded-2xl text-blue-600 dark:text-blue-400 relative z-10"><Video size={28}/></div>
                            <div className="relative z-10">
                                <p className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Online Meetings</p>
                                <h4 className="text-3xl font-black text-slate-800 dark:text-white">{summaryMetrics.online}</h4>
                            </div>
                        </div>
                    </div>

                    {/* CHARTS SECTION */}

        const AttendanceTab = () => {
            const [allTrainees, setAllTrainees] = useState([]);
            const [companies, setCompanies] = useState([]);
            const [selectedCompany, setSelectedCompany] = useState('');
            const [dateFilter, setDateFilter] = useState(new Date().toISOString().split('T')[0]);
            
            const [attendanceRecords, setAttendanceRecords] = useState([]);
            const [loadingInitial, setLoadingInitial] = useState(true);
            const [loadingLogs, setLoadingLogs] = useState(false);

            // 1. Initial Load: Fetch ONLY Trainee Data to build the dropdowns
            useEffect(() => {
                const fetchTraineesList = async () => {
                    try {
                        const APP_ID = "dualtech-ojt-portal"; 
                        const traineesRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees');
                        const traineesSnapshot = await traineesRef.get();
                        
                        let fetchedTrainees = [];
                        let activeCompanySet = new Set();
                        
                        traineesSnapshot.forEach(doc => {
                            const data = doc.data();
                            fetchedTrainees.push({ id: doc.id, ...data });
                            
                            // Populating companies WITH ACTIVE TRAINEES ONLY
                            if (data.status === 'Active' && (data.company || data.companyName)) {
                                activeCompanySet.add(data.company || data.companyName);
                            }
                        });

                        setAllTrainees(fetchedTrainees);
                        setCompanies(Array.from(activeCompanySet).sort());
                        setLoadingInitial(false);

                    } catch (error) {
                        console.error("Error fetching trainees:", error);
                        setLoadingInitial(false);
                    }
                };
                fetchTraineesList();
            }, []);

            // 2. LAZY FETCH: Only download attendance logs when a specific company is selected
            useEffect(() => {
                const fetchCompanyAttendance = async () => {
                    if (!selectedCompany) {
                        setAttendanceRecords([]);
                        return;
                    }

                    setLoadingLogs(true);
                    try {
                        const APP_ID = "dualtech-ojt-portal"; 
                        const traineesRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees');
                        
                        // Find trainees belonging to the selected company
                        const companyTrainees = allTrainees.filter(t => 
                            (t.company === selectedCompany || t.companyName === selectedCompany)
                        );

                        // Fetch subcollections ONLY for these specific trainees
                        const attendancePromises = companyTrainees.map(async (trainee) => {
                            const attSnapshot = await traineesRef.doc(trainee.id).collection('attendance').get();
                            return attSnapshot.docs.map(doc => ({
                                id: doc.id,
                                traineeId: trainee.id,
                                traineeName: `${trainee.firstName || ''} ${trainee.lastName || ''}`.trim() || trainee.name || 'Unknown',
                                status: trainee.status || 'Unknown',
                                company: trainee.company || trainee.companyName || 'Unassigned',
                                ic: trainee.ic || trainee.coordinator || 'Unassigned',
                                ...doc.data()
                            }));
                        });

                        const allAttendanceArrays = await Promise.all(attendancePromises);
                        let fetchedAttendance = allAttendanceArrays.flat();
                        
                        fetchedAttendance.sort((a, b) => new Date(b.date) - new Date(a.date));
                        setAttendanceRecords(fetchedAttendance);
                        setLoadingLogs(false);

                    } catch (error) {
                        console.error("Error fetching company attendance:", error);
                        setLoadingLogs(false);
                    }
                };

                fetchCompanyAttendance();
            }, [selectedCompany, allTrainees]);

            // 3. Apply Date Filter
            const filteredRecords = attendanceRecords.filter(record => !dateFilter || record.date === dateFilter);

            if (loadingInitial) {
                return (
                    <div className="flex flex-col items-center justify-center p-20 text-slate-500">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600 mb-4"></div>
                        <p>Preparing Global Database...</p>
                    </div>
                );

            return (

                    <h2 className="text-2xl font-black text-slate-800 dark:text-white">Global Attendance Logs</h2>

                        <div className="flex-1">
                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Filter by Date</label>
                            <input 
                                type="date" 
                                value={dateFilter} 
                                onChange={e => setDateFilter(e.target.value)}
                                className="w-full border border-slate-200 rounded-xl p-3 bg-slate-50 text-slate-700 font-medium focus:ring-2 focus:ring-emerald-500 text-base"
                            />
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-500 text-xs md:text-sm border-b border-slate-200">
                                        <th className="p-3 md:p-4 font-bold">Trainee Name</th>
                                        <th className="p-3 md:p-4 font-bold">Status</th>
                                        <th className="p-3 md:p-4 font-bold">Date</th>
                                        <th className="p-3 md:p-4 font-bold">Time In</th>
                                        <th className="p-3 md:p-4 font-bold">Time Out</th>
                                        <th className="p-3 md:p-4 font-bold text-center">Log Status</th>
                                        <th className="p-3 md:p-4 font-bold">Assigned IC</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loadingLogs ? (
                                        <tr><td colSpan="7" className="p-8 text-center text-emerald-600 font-bold">Fetching logs for {selectedCompany}...</td></tr>
                                    ) : !selectedCompany ? (
                                        <tr><td colSpan="7" className="p-8 text-center text-slate-400">Please select a company to view attendance records.</td></tr>
                                    ) : filteredRecords.length > 0 ? (
                                        filteredRecords.map(record => (
                                            <tr key={record.id} className="border-b border-slate-50 hover:bg-slate-50/50">
                                                <td className="p-3 md:p-4 font-semibold text-slate-800 text-sm">{record.traineeName}</td>

                                                <td className="p-3 md:p-4 text-xs md:text-sm font-mono text-slate-600">{record.timeIn || '--:--'}</td>
                                                <td className="p-3 md:p-4 text-xs md:text-sm font-mono text-slate-600">{record.timeOut || '--:--'}</td>

                                                        record.status === 'Late' ? 'bg-amber-100 text-amber-700' :
                                                        record.status === 'Absent' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'
                                                    }`}>{record.status || 'No Status'}</span>

        const SurveysView = () => {
            const [surveys, setSurveys] = useState([]);
            const [companies, setCompanies] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Form States
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [questions, setQuestions] = useState([]);
            const [viewableFrom, setViewableFrom] = useState('');
            const [viewableUntil, setViewableUntil] = useState('');
            const [targetCompanies, setTargetCompanies] = useState(['All']);
            const [companySearchTerm, setCompanySearchTerm] = useState('');

            // --- NEW: Submissions State ---
            const [viewingSubmissions, setViewingSubmissions] = useState(null);
            const [submissions, setSubmissions] = useState([]);
            const [loadingSubmissions, setLoadingSubmissions] = useState(false);

            useEffect(() => {
                const APP_ID = "dualtech-ojt-portal";
                
                // 1. Fetch Surveys
                const unsubscribe = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('surveys')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const surveyData = [];
                        snapshot.forEach(doc => surveyData.push({ id: doc.id, ...doc.data() }));
                        setSurveys(surveyData);
                        setLoading(false);
                    });

                // 2. Fetch Companies for Dropdown
                db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('trainees').get()
                    .then(snap => {
                        let activeCompanySet = new Set();
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.status === 'Active' && (data.company || data.companyName)) {
                                activeCompanySet.add(data.company || data.companyName);
                            }
                        });
                        setCompanies(Array.from(activeCompanySet).sort());
                    });

                return () => unsubscribe();
            }, []);

            // --- NEW: Fetch & Delete Submissions Logic ---
            const openSubmissions = async (survey) => {
                setViewingSubmissions(survey);
                setLoadingSubmissions(true);
                try {
                    const APP_ID = "dualtech-ojt-portal";
                    const snap = await db.collection('artifacts').doc(APP_ID).collection('public').doc('data')
                        .collection('surveys').doc(survey.id).collection('submissions')
                        .orderBy('submittedAt', 'desc').get();
                    
                    const subs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSubmissions(subs);
                } catch (error) {
                    console.error("Error fetching submissions:", error);
                }
                setLoadingSubmissions(false);
            };

            const handleDeleteSubmission = async (submissionId) => {
                if (!window.confirm("Are you sure you want to delete this trainee's submission?")) return;
                try {
                    const APP_ID = "dualtech-ojt-portal";
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data')
                        .collection('surveys').doc(viewingSubmissions.id).collection('submissions').doc(submissionId).delete();
                    await logSystemEvent('DELETE', 'survey_submissions', { surveyId: viewingSubmissions.id, submissionId });
                    
                    // Remove from local state
                    setSubmissions(submissions.filter(s => s.id !== submissionId));
                } catch (error) {
                    console.error("Error deleting submission:", error);
                    alert("Failed to delete submission.");
                }
            };

            const openForm = (survey = null) => {
                setCompanySearchTerm(''); // Clear search box on open
                if (survey) {
                    setEditingId(survey.id);
                    setTitle(survey.title || '');
                    setDescription(survey.description || '');
                    setQuestions(survey.questions || []);
                    setViewableFrom(survey.viewableFrom || '');
                    setViewableUntil(survey.viewableUntil || '');
                    
                    if (Array.isArray(survey.targetCompanies)) {
                        setTargetCompanies(survey.targetCompanies);
                    } else if (survey.targetCompany) {
                        setTargetCompanies([survey.targetCompany]);
                    } else {
                        setTargetCompanies(['All']);
                    }
                } else {
                    setEditingId(null);
                    setTitle('');
                    setDescription('');

                                    {editingId ? 'Save Changes' : 'Publish Survey'}

                    ) : (

                                } else if (survey.targetCompany && survey.targetCompany !== 'All') {
                                    targetText = survey.targetCompany;

                                return (

                                        <div className="flex justify-between items-start mb-3">
                                            <div className="pr-2">
                                                <h3 className="font-black text-lg text-slate-800 leading-tight">{survey.title}</h3>
                                                <p className="text-xs font-bold text-primary-600 mt-1 uppercase tracking-wider line-clamp-1" title={targetText}>

                                        <div className="flex items-center justify-between border-t border-slate-100 pt-4">

                                            </span>

                                                <button onClick={() => openSubmissions(survey)} className="text-primary-600 hover:text-white bg-primary-50 hover:bg-primary-600 px-3 py-2 rounded-lg transition-colors border border-primary-200 hover:border-primary-600 font-bold text-xs flex items-center gap-1">
                                                    <Icon name="users" size={14} /> Submissions
                                                </button>
