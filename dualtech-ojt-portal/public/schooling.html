        let firebaseConfig = { apiKey: "AIzaSyAPpy4VcR2uTIPmH01aJ3GvegSDzNNpM9U", authDomain: "dualtech-ojt-portal.firebaseapp.com", projectId: "dualtech-ojt-portal", appId: "1:255242185978:web:2f07c554fad2e3a78ead43" };

        // --- Haversine Distance Calculator ---
        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return -1;
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
                Math.cos(p1) * Math.cos(p2) *
                Math.sin(dl / 2) * Math.sin(dl / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // --- GAMIFIED MENTOR LOGIN COMPONENT ---
        function LoginScreen({ onLoginSuccess }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            const [rememberMe, setRememberMe] = useState(() => localStorage.getItem('schooling_remember') === 'true');

            // Auto-fill email if remembered
            useEffect(() => {
                const savedEmail = localStorage.getItem('schooling_email');
                if (savedEmail) setEmail(savedEmail);
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    // Set persistence based on "Remember Me"
                    await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);

                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const authUser = userCredential.user;

                    // Save/clear remember me preference
                    if (rememberMe) {
                        localStorage.setItem('schooling_remember', 'true');
                        localStorage.setItem('schooling_email', email);
                    } else {
                        localStorage.removeItem('schooling_remember');
                        localStorage.removeItem('schooling_email');
                    }

                    let mentorData = { uid: authUser.uid, email: authUser.email, name: "Admin/Mentor", assignedVenues: [] };
                    try {
                        const mentorsRef = collection(db, 'artifacts', appId, 'public', 'data', 'mentors');
                        const snap = await getDocs(mentorsRef);
                        const specificSettings = snap.docs.find(d => d.data().email === email);
                        if (specificSettings) {
                            mentorData = { ...mentorData, ...specificSettings.data(), uid: authUser.uid };
                        }
                    } catch (dbError) {
                        console.warn("Could not fetch extra mentor settings, proceeding with basic auth.");
                    }
                    onLoginSuccess(mentorData);
                } catch (error) {
                    console.error(error);
                    alert("Invalid credentials. Please contact your Administrator.");
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #0c4a6e 0%, #0369a1 30%, #0ea5e9 60%, #38bdf8 100%)' }}>
                    {/* Animated floating particles */}
                    <div className="absolute inset-0 pointer-events-none overflow-hidden">
                        <div className="login-float absolute top-[10%] left-[8%] w-20 h-20 rounded-full bg-white/10 blur-sm"></div>
                        <div className="login-float-reverse absolute top-[25%] right-[12%] w-32 h-32 rounded-full bg-sky-300/10 blur-md" style={{ animationDelay: '1s' }}></div>
                        <div className="login-float-slow absolute bottom-[15%] left-[15%] w-24 h-24 rounded-full bg-cyan-200/10 blur-sm" style={{ animationDelay: '2s' }}></div>
                        <div className="login-float absolute top-[60%] right-[8%] w-16 h-16 rounded-full bg-white/10 blur-sm" style={{ animationDelay: '0.5s' }}></div>
                        <div className="login-float-reverse absolute bottom-[30%] right-[30%] w-12 h-12 rounded-full bg-sky-400/15" style={{ animationDelay: '3s' }}></div>
                        <div className="login-float-slow absolute top-[5%] right-[40%] w-10 h-10 rounded-full bg-white/10" style={{ animationDelay: '1.5s' }}></div>
                        <div className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                    </div>

                    <div className="relative z-10 w-full max-w-sm">
                        <div className="login-slide-up text-center mb-6">
                            <div className="relative inline-flex">
                                <div className="login-pulse-ring absolute inset-0 rounded-full bg-white/20" style={{ margin: '-12px' }}></div>
                                <div className="relative w-20 h-20 rounded-full bg-gradient-to-br from-white/30 to-white/10 backdrop-blur-md border-2 border-white/30 flex items-center justify-center shadow-lg shadow-sky-900/30">
                                    <CheckCircle size={36} className="text-white drop-shadow-md" />
                                </div>
                            </div>
                        </div>

                        <div className="login-slide-up-delay bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl shadow-sky-900/30 border border-white/20 text-center relative overflow-hidden">
                            <div className="login-shimmer absolute inset-0 rounded-3xl pointer-events-none"></div>

                            <p className="text-sky-200/80 text-sm mb-1 font-medium relative z-10">ASTP Schooling Dashboard</p>
                            <div className="flex items-center justify-center gap-2 mb-6 relative z-10">
                                <div className="h-px flex-1 bg-gradient-to-r from-transparent to-white/20"></div>
                                <span className="text-[10px] text-white/50 font-bold uppercase tracking-widest">Secure Access</span>
                                <div className="h-px flex-1 bg-gradient-to-l from-transparent to-white/20"></div>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40 group-focus-within:text-white/70 transition-colors">

                                    <input required type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)}

                                </div>
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40 group-focus-within:text-white/70 transition-colors">
                                        <Check size={16} />
                                    </div>
                                    <input required type={showPassword ? "text" : "password"} placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
                                        className="w-full pl-11 pr-11 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/15 transition-all text-sm font-medium" />
                                    <button type="button" onClick={() => setShowPassword(!showPassword)}
                                        className="absolute inset-y-0 right-0 pr-4 flex items-center text-white/40 hover:text-white/70 transition-colors">
                                        {showPassword ? <EyeOff size={16} /> : <Eye size={16} />}
                                    </button>
                                </div>

                                <label className="flex items-center gap-2 cursor-pointer justify-start">
                                    <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)}

        }

        // --- NEW: VALIDATE TAB (For Mentor to verify manual submissions) ---
        function ValidateTab({ user }) {
            const [pendingRecords, setPendingRecords] = useState([]);
            const [clockStatus, setClockStatus] = useState(null);

            const [selectedIds, setSelectedIds] = useState(new Set());
            const todayStr = new Date().toISOString().split('T')[0];

            // --- For manual add ---
            const [trainees, setTrainees] = useState([]);
            const [showManualModal, setShowManualModal] = useState(false);
            const [manualSearch, setManualSearch] = useState('');
            const [manualSelectedIds, setManualSelectedIds] = useState(new Set());

            useEffect(() => {
                const fetchTrainees = async () => {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'trainees'));
                    setTrainees(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                };
                fetchTrainees();
            }, []);

            const filteredManualTrainees = manualSearch.trim() === '' ? [] : trainees.filter(t => {
                const searchStr = manualSearch.toLowerCase();
                const nameStr = (t.name || t.traineeName || (t.firstName ? t.firstName + ' ' + t.lastName : '') || '').toLowerCase();
                const idStr = (t.studentId || t['Student ID#'] || '').toLowerCase();
                return nameStr.includes(searchStr) || idStr.includes(searchStr);
            }).slice(0, 10);

            const handleManualSelectAll = (e, list) => {
                if (e.target.checked) setManualSelectedIds(new Set(list.map(r => r.id)));
                else setManualSelectedIds(new Set());
            };
            const handleManualSelect = (id, checked) => {
                const next = new Set(manualSelectedIds);
                if (checked) next.add(id);
                else next.delete(id);
                setManualSelectedIds(next);
            };

            const handleManualAdd = async (status) => {
                if (manualSelectedIds.size === 0) return alert("Select at least one trainee.");
                if (!confirm(`Are you sure you want to mark ${manualSelectedIds.size} trainee(s) as ${status}?`)) return;

                try {
                    const batch = writeBatch(db);
                    const now = new Date();
                    for (const traineeDocId of manualSelectedIds) {
                        const trainee = trainees.find(t => t.id === traineeDocId);
                        
                        const attRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'));
                        const payload = {
                            studentId: trainee.studentId || trainee['Student ID#'] || 'Unknown',
                            studentName: trainee.name || trainee.traineeName || (trainee.firstName ? trainee.firstName + ' ' + trainee.lastName : 'Unknown'),
                            company: trainee.company || '',
                            venueId: clockStatus.venueId,
                            venueName: clockStatus.venueName,
                            roomName: clockStatus.roomName,
                            date: todayStr,
                            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            activityType: 'Schooling Log',
                            status: status,
                            activityScore: status === 'Denied' ? 0 : 1,
                            verifiedByMentor: user.name,
                            timestamp: serverTimestamp()
                        };
                        batch.set(attRef, payload);

                        if (status === 'Present - Late') {
                            const trRef = doc(db, 'artifacts', appId, 'public', 'data', 'trainees', trainee.id);
                            const newTotal = (trainee.meritPoints || 0) - 0.5;
                            const newHistory = [...(trainee.meritHistory || []), {
                                date: now.toISOString(),
                                change: "-0.5",
                                points: -0.5,
                                remark: "Late for Schooling",
                                reason: "Late for Schooling",
                                updatedBy: user.name,
                                recordedBy: user.name
                            }];
                            batch.update(trRef, { meritPoints: newTotal, meritHistory: newHistory });
                        }
                    }
                    await batch.commit();
                    setManualSelectedIds(new Set());
                    setShowManualModal(false);
                    setManualSearch('');
                    alert(`Successfully added ${manualSelectedIds.size} trainee(s) as ${status}!`);
                } catch (e) {
                    console.error(e);
                    alert("Error adding manual attendance.");
                }
            };
            // --------------------------

            // 1. Fetch current clock status
            useEffect(() => {
                if (!user) return;
                const q = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'mentor_clock_records'),
                    where('mentorUid', '==', user.uid),
                    where('date', '==', todayStr)
                );
                const unsub = onSnapshot(q, (snap) => {
                    const recs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    recs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    const lastRec = recs.length > 0 ? recs[recs.length - 1] : null;
                    if (lastRec && lastRec.type === 'IN') {
                        setClockStatus({ venueId: lastRec.venueId, roomName: lastRec.roomName, venueName: lastRec.venueName });
                    } else {
                        setClockStatus(null);
                    }
                });
                return () => unsub();
            }, [user, todayStr]);

            // 2. Fetch pending records for the clocked-in room
            useEffect(() => {
                if (!user || !clockStatus) {
                    setPendingRecords([]);
                    setSelectedIds(new Set());
                    return;
                }

                const q = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'),
                    where('venueId', '==', clockStatus.venueId)
                );

                const unsub = onSnapshot(q, (snapshot) => {
                    let data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Filter by roomName and status locally to avoid composite index requirement
                    data = data.filter(d => d.roomName === clockStatus.roomName && d.status === 'Pending Validation');
                    data.sort((a, b) => b.timestamp - a.timestamp);

                    // Mark late records
                    data = data.map(rec => {
                        let isLate = false;
                        if (rec.time) {
                            const match = rec.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
                            if (match) {
                                let [_, h, m, ampm] = match;
                                h = parseInt(h); m = parseInt(m);
                                if (ampm.toUpperCase() === 'PM' && h < 12) h += 12;
                                if (ampm.toUpperCase() === 'AM' && h === 12) h = 0;
                                const totalMinutes = h * 60 + m;
                                const am8 = 8 * 60; // 480
                                const pm1 = 13 * 60; // 780
                                isLate = totalMinutes < am8 || totalMinutes > pm1;
                            }
                        }
                        return { ...rec, isLate };
                    });

                    setPendingRecords(data);
                });

                return () => unsub();
            }, [user, clockStatus]);

            const handleSelectAll = (e) => {
                if (e.target.checked) setSelectedIds(new Set(pendingRecords.map(r => r.id)));
                else setSelectedIds(new Set());
            };

            const handleSelect = (id, checked) => {
                const next = new Set(selectedIds);
                if (checked) next.add(id);
                else next.delete(id);
                setSelectedIds(next);
            };

            const handleBulkAction = async (actionType, statusOverride = 'Verified') => {
                if (selectedIds.size === 0) return alert("Select at least one record.");
                if (!confirm(`Are you sure you want to ${actionType} ${selectedIds.size} record(s)?`)) return;

                try {
                    const batch = writeBatch(db);
                    for (const id of selectedIds) {
                        const rec = pendingRecords.find(r => r.id === id);
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance', id);

                        if (actionType === 'Deny') {
                            batch.update(docRef, { status: 'Denied', activityScore: 0 });
                        } else {
                            let score = 1;
                            if (rec.activityType === 'Personal Development Seminar' || rec.activityType === 'PDS') score = 2;
                            if (rec.activityType === 'Retreat') score = 4;
                            batch.update(docRef, { status: statusOverride, activityScore: score, verifiedByMentor: user.name });
                        }
                    }
                    await batch.commit();
                    setSelectedIds(new Set());
                    alert(`Selected records successfully processed!`);
                } catch (e) { alert("Error updating records."); }
            };

            if (!clockStatus) {
                return (

        // --- ONLINE SUBMISSIONS TAB ---
        function OnlineSubmissionsTab({ user }) {
            const [submissions, setSubmissions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedSub, setSelectedSub] = useState(null);
            const [feedback, setFeedback] = useState('');
            const [isUpdating, setIsUpdating] = useState(false);

            const [trainees, setTrainees] = useState([]);
            const [venues, setVenues] = useState([]);

            useEffect(() => {
                Promise.all([
                    getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'trainees')),
                    getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'venues'))
                ]).then(([tSnap, vSnap]) => {
                    const tData = tSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const vData = vSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setTrainees(tData);
                    setVenues(vData);
                });
            }, []);

            // Pagination & Selection
            const [queryLimit, setQueryLimit] = useState(50);
            const [selectedRows, setSelectedRows] = useState(new Set());

            // Filters & Search
            const [filterStatus, setFilterStatus] = useState('Pending Verification');
            const [searchQuery, setSearchQuery] = useState('');

            const fetchSubmissions = async () => {
                if (!user.assignedVenues || user.assignedVenues.length === 0 || trainees.length === 0 || venues.length === 0) {
                    setLoading(false);
                    return;
                }
                setLoading(true);
                try {
                    const q = query(
                        collection(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance'),
                        where('activityType', '==', 'Online Schooling'),
                        orderBy('timestamp', 'desc')
                    );
                    const snap = await getDocs(q);
                    let allSubs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                    // Filter submissions by matching trainee's venue with user's assigned venues
                    let filtered = [];
                    allSubs.forEach(sub => {
                        const trainee = trainees.find(t => (t.studentId === sub.studentId || t['Student ID#'] === sub.studentId));
                        if (trainee && trainee.assignedVenue && user.assignedVenues.includes(trainee.assignedVenue)) {
                            filtered.push(sub);
                        }
                    });

                    setSubmissions(filtered);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            // Call fetchSubmissions manually on mount or when limit/dependencies change
            useEffect(() => {
                if (trainees.length > 0 && venues.length > 0) {
                    fetchSubmissions();
                }
            }, [queryLimit, trainees, venues, user]);

            // Apply filters and dynamic search
            const filteredSubmissions = submissions.filter(sub => {
                const matchesStatus = filterStatus === 'All' ? true : sub.status === filterStatus;
                const queryStr = searchQuery.toLowerCase();
                const matchesSearch = queryStr === '' ||
                    (sub.traineeName || '').toLowerCase().includes(queryStr) ||
                    (sub.studentId || '').toLowerCase().includes(queryStr) ||
                    (sub.company || '').toLowerCase().includes(queryStr);

                return matchesStatus && matchesSearch;
            });




            const groupedSubmissions = useMemo(() => {
                const groups = {};
                filteredSubmissions.forEach(sub => {
                    const trainee = trainees.find(t => (t.studentId === sub.studentId || t['Student ID#'] === sub.studentId));
                    let venueId = trainee?.assignedVenue || 'Unassigned';

                    if (!groups[venueId]) {
                        const vObj = venues.find(v => v.id === venueId);
                        groups[venueId] = {
                            venueId,
                            venueName: vObj ? vObj.name : (venueId === 'online' ? 'Online' : venueId),
                            subs: []
                        };
                    }
                    groups[venueId].subs.push(sub);
                });
                return Object.values(groups).sort((a, b) => a.venueName.localeCompare(b.venueName));
            }, [filteredSubmissions, trainees, venues]);

            const [deadlineDays, setDeadlineDays] = useState('');

            const handleValidate = async (statusToSet) => {
                if (!selectedSub) return;
                if (statusToSet === 'Rejected' && !feedback.trim()) {
                    return alert("Please provide a reason for rejecting this submission.");
                }

                setIsUpdating(true);
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance', selectedSub.id);
                    await updateDoc(docRef, {
                        status: statusToSet,
                        feedback: feedback,
                        verifiedByMentor: user.name || auth.currentUser?.email || 'Admin',
                        updatedAt: new Date().getTime()
                    });

                    if (statusToSet === 'Rejected') {
                        // Look up the trainee to send a notification message
                        const qTrainee = query(collection(db, 'artifacts', appId, 'public', 'data', 'trainees'), where('studentId', '==', selectedSub.studentId));
                        const traineeSnap = await getDocs(qTrainee);

                        let traineeUid = selectedSub.studentId; // fallback
                        if (!traineeSnap.empty) {
                            const tData = traineeSnap.docs[0].data();
                            traineeUid = tData.userId || traineeSnap.docs[0].id;
                        }

                        let deadlineText = "";
                        if (deadlineDays) {
                            deadlineText = ` You must resubmit within ${deadlineDays} days.`;
                        }

                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                            senderId: 'Schooling Admin',
                            senderName: user.name || 'Schooling Admin',
                            senderRole: 'admin',
                            receiverId: traineeUid,
                            receiverName: selectedSub.traineeName,
                            receiverRole: 'trainee',
                            text: `[SYSTEM] Your Online Schooling submission has been Rejected.\n\nReason: ${feedback}.${deadlineText}`,
                            timestamp: serverTimestamp(),
                            createdAtMs: Date.now(),
                            viewed: false
                        });
                    }

                    alert(`Submission successfully marked as ${statusToSet}!`);
                    setSelectedSub(null);
                    setFeedback('');
                    setDeadlineDays('');

                    fetchSubmissions(); // refresh the view
                } catch (err) {
                    alert('Error updating status: ' + err.message);
                }
                setIsUpdating(false);
            };

            const handleBulkValidate = async () => {
                if (selectedRows.size === 0) return;
                if (!window.confirm(`Are you sure you want to validate ${selectedRows.size} submissions?`)) return;

                setIsUpdating(true);
                try {
                    const batch = writeBatch(db);
                    selectedRows.forEach(id => {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance', id);
                        batch.update(docRef, {
                            status: 'Verified',
                            verifiedByMentor: user.name || auth.currentUser?.email || 'Admin',
                            updatedAt: new Date().getTime()
                        });
                    });
                    await batch.commit();
                    setSelectedRows(new Set());

                    fetchSubmissions(); // refresh the view
                } catch (err) {
                    alert('Error bulk updating: ' + err.message);
                }
                setIsUpdating(false);
            };

            const toggleRow = (id) => {
                const newSet = new Set(selectedRows);
                if (newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedRows(newSet);
            };

            const toggleAll = () => {
                const pendingIds = filteredSubmissions.filter(s => s.status === 'Pending Verification').map(s => s.id);
                if (selectedRows.size === pendingIds.length && pendingIds.length > 0) {
                    setSelectedRows(new Set());
                } else {
                    setSelectedRows(new Set(pendingIds));
                }
            };

            const handleDelete = async (id) => {
                if (window.confirm('Are you sure you want to permanently delete this submission record?')) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mentoring_attendance', id));
                        fetchSubmissions(); // refresh
                    } catch (err) {
                        alert('Error deleting record: ' + err.message);
                    }
                }
            };

            const openModal = (sub) => {
                setSelectedSub(sub);
                setFeedback(sub.feedback || '');
            };

            const getDriveThumb = (url) => {
                if (!url) return null;
                let match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w64` : null;
            };

            const pendingIds = filteredSubmissions.filter(s => s.status === 'Pending Verification').map(s => s.id);
            const allSelected = pendingIds.length > 0 && selectedRows.size === pendingIds.length;

            return (

                <div className="space-y-6 animate-in fade-in duration-300 flex flex-col h-full">
                    <div className="border-b border-slate-200 dark:border-slate-700 pb-4 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                                <CheckSquare className="text-emerald-600 dark:text-emerald-500" /> Online Submissions
                            </h2>
                            <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Review and validate outputs from trainees assigned to Online Schooling.</p>
                        </div>

                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full xl:w-auto">
                            {selectedRows.size > 0 && (
                                <button
                                    onClick={handleBulkValidate}
                                    disabled={isUpdating}

        function ClockInTab({ user }) {
            const [clockStatus, setClockStatus] = useState(null);

            const [gpsStatus, setGpsStatus] = useState('');
            const [scannedData, setScannedData] = useState(null);
            const [previewLoc, setPreviewLoc] = useState(null);
            const [showClockOutModal, setShowClockOutModal] = useState(false);
            const [clockOutReason, setClockOutReason] = useState('');

            const [myVenues, setMyVenues] = useState([]);
            const [todayRecords, setTodayRecords] = useState([]);

            const scannerRef = useRef(null);
            const myVenuesRef = useRef([]);
            const todayStr = new Date().toISOString().split('T')[0];

            // Fetch assigned venues (one-time)
            useEffect(() => {
                const fetchVenues = async () => {
                    const mentorsQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'mentors'), where('email', '==', user.email));
                    const mentorSnap = await getDocs(mentorsQuery);
                    if (!mentorSnap.empty) {
                        const assignedVenueIds = mentorSnap.docs[0].data().assignedVenues || [];
                        const venuesSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'venues'));
                        const allVenues = venuesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const allowed = allVenues.filter(v => assignedVenueIds.includes(v.id));
                        setMyVenues(allowed);
                    }
                };
                fetchVenues();
            }, [user.email]);

            // Keep myVenuesRef updated for the scanner closure
            useEffect(() => {
                myVenuesRef.current = myVenues;
            }, [myVenues]);

            // Initialize Scanner when not clocked in and no active scan
            useEffect(() => {
                if (clockStatus || scannedData) return;
                const timer = setTimeout(() => {
                    if (!document.getElementById("mentor-qr-reader")) return;
                    try {
                        const scanner = new window.Html5QrcodeScanner("mentor-qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
                        scannerRef.current = scanner;
                        scanner.render((decodedText) => {
                            try {
                                const data = JSON.parse(decodedText);
                                handleScan(data);
                            } catch (e) {
                                setGpsStatus("⚠️ QR Error: " + e.message);
                            }
                        }, () => { });
                    } catch (e) { console.error(e); }
                }, 200);

                return () => {
                    clearTimeout(timer);
                    if (scannerRef.current) scannerRef.current.clear().catch(e => console.error(e));
                };
            }, [clockStatus, scannedData]);

            const handleScan = (data) => {
                setGpsStatus("");
                setPreviewLoc(null);

                if (data.type !== 'SchoolingVenue') {
                    setGpsStatus("⚠️ Invalid QR Code. Please scan a valid Schooling Venue QR.");
                    return;
                }

                // Verify mentor is assigned to this venue using ref to avoid stale closure
                if (!myVenuesRef.current.find(v => v.id === data.venueId)) {
                    setGpsStatus(`⚠️ You are not assigned to this venue (${data.venueName}).`);
                    return;
                }

                if (data.lat === 0 && data.lng === 0) {
                    setGpsStatus(`⚠️ Venue location not configured. Please ask admin to set the venue location and generate a new QR code.`);
                    return;
                };

                setLoading(true);
                setGpsStatus("Fetching your location...");
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const dist = getDistance(pos.coords.latitude, pos.coords.longitude, data.lat, data.lng);
                        setPreviewLoc({ lat: pos.coords.latitude, lon: pos.coords.longitude });

                        if (dist > (data.radius || 200)) {
                            setGpsStatus(`⚠️ Cannot proceed due to difference in location. You are ${Math.round(dist)}m away from the venue.`);
                            setLoading(false);
                            return;
                        }

                        setScannedData(data);
                        setGpsStatus("✅ Location Matched! You may now Clock In.");
                        setLoading(false);
                    },
                    (err) => {
                        setGpsStatus("⚠️ Failed to get location. Please enable GPS.");
                        setLoading(false);
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            };

            // Listen to today's clock records for this mentor
            useEffect(() => {
                const q = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'mentor_clock_records'),
                    where('mentorUid', '==', user.uid),
                    where('date', '==', todayStr)
                );
                const unsub = onSnapshot(q, (snap) => {
                    const recs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    recs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    setTodayRecords(recs);

                    // Determine current clock status
                    const lastRec = recs.length > 0 ? recs[recs.length - 1] : null;
                    if (lastRec && lastRec.type === 'IN') {
                        setClockStatus({ timestamp: lastRec.timestamp, venueName: lastRec.venueName, venueId: lastRec.venueId, roomName: lastRec.roomName, time: lastRec.time, lat: lastRec.lat, lng: lastRec.lng });
                    } else {
                        setClockStatus(null);
                        setScannedData(null);
                        setPreviewLoc(null);
                    }
                });
                return () => unsub();
            }, [user.uid, todayStr]);

            const handleClock = async (type, forcedReason = '') => {
                let venueData = null;
                if (type === 'IN') {
                    if (!scannedData) return;
                    venueData = scannedData;
                } else if (type === 'OUT') {
                    if (!clockStatus) return;
                    // Find the venue from myVenues or use the active clockStatus
                    const assignedVenue = myVenues.find(v => v.id === clockStatus.venueId);
                    venueData = assignedVenue ? {
                        venueId: assignedVenue.id, venueName: assignedVenue.name, roomName: clockStatus.roomName,
                        lat: assignedVenue.lat, lng: assignedVenue.lng, radius: assignedVenue.allowedRadius
                    } : {
                        venueId: clockStatus.venueId, venueName: clockStatus.venueName, roomName: clockStatus.roomName,
                        lat: clockStatus.lat, lng: clockStatus.lng, radius: 200
                    };
                }

                setLoading(true);
                setGpsStatus('Fetching your location...');

                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const myLat = pos.coords.latitude;
                        const myLng = pos.coords.longitude;
                        const distance = getDistance(myLat, myLng, parseFloat(venueData.lat), parseFloat(venueData.lng));
                        const allowedRadius = parseFloat(venueData.radius) || 200;
                        const inGeofence = distance <= allowedRadius;

                        // For Clock Out, require reason if out of bounds and reason not yet provided
                        if (type === 'OUT' && !inGeofence && !forcedReason) {
                            setLoading(false);
                            setPreviewLoc({ lat: myLat, lon: myLng });
                            setShowClockOutModal(true);
                            setGpsStatus(`⚠️ Out of location (${Math.round(distance)}m away). Please provide a reason to clock out.`);
                            return;
                        }

                        const now = new Date();
                        const record = {
                            mentorUid: user.uid,
                            mentorName: user.name || user.email,
                            mentorEmail: user.email,
                            venueName: venueData.venueName,
                            venueId: venueData.venueId,
                            roomName: venueData.roomName || '',
                            type: type,
                            timestamp: now.getTime(),
                            date: now.toISOString().split('T')[0],
                            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            lat: myLat,
                            lng: myLng,
                            inGeofence: inGeofence,
                            distanceMeters: Math.round(distance)
                        };

                        if (forcedReason) record.clockOutReason = forcedReason;

                        try {
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mentor_clock_records'), record);
                            setGpsStatus(inGeofence
                                ? `✅ ${type === 'IN' ? 'Clocked In' : 'Clocked Out'} — ${Math.round(distance)}m from venue`
                                : `⚠️ ${type === 'IN' ? 'Clocked In' : 'Clocked Out'} — Out of Location (${Math.round(distance)}m away, limit: ${allowedRadius}m)`);

                            if (type === 'OUT') {
                                setShowClockOutModal(false);
                                setClockOutReason('');
                            }
                        } catch (err) {
                            alert('Error saving record: ' + err.message);
                            setGpsStatus('');
                        }
                        setLoading(false);
                    },
                    (err) => {
                        alert('Location access is required to clock in/out. Please enable GPS.');
                        setGpsStatus('');
                        setLoading(false);
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            };

            return (
                <div className="max-w-lg mx-auto space-y-6">
                    {/* Status Card */}
                    <div className={`p-6 rounded-2xl shadow-sm border-2 text-center ${clockStatus
                            ? 'bg-emerald-50 border-emerald-200'
                            : 'bg-white border-slate-200'
                        }`}>
                        <div className={`inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 ${clockStatus ? 'bg-emerald-100' : 'bg-slate-100'
                            }`}>
                            <Clock size={32} className={clockStatus ? 'text-emerald-600' : 'text-slate-400'} />
                        </div>
                        {clockStatus ? (
                            <div>
                                <h2 className="text-xl font-black text-emerald-800">Currently Clocked In</h2>
                                <p className="text-sm text-emerald-600 mt-1 font-semibold">Since {clockStatus.time} at {clockStatus.venueName}</p>
                            </div>
                        ) : (
                            <div>
                                <h2 className="text-xl font-black text-slate-700 dark:text-slate-300">Not Clocked In</h2>
                                <p className="text-sm text-slate-500 mt-1">Select your venue and clock in to start.</p>
                            </div>
                        )}
                    </div>

                    {/* Venue Selection & Action */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 dark:bg-slate-800 dark:border-slate-700">
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 dark:text-slate-200"><MapPin size={18} className="text-primary-600" /> Clock Action</h3>

                        {!clockStatus ? (
                            <>
                                {!scannedData && (
                                    <div className="mb-4">
                                        <div id="mentor-qr-reader" className="w-full"></div>
                                        <p className="text-sm text-slate-500 text-center mt-2">Scan Schooling Venue QR to Clock In</p>
                                    </div>
                                )}

                                {previewLoc && (
                                    <div className="mb-4">
                                        <iframe
                                            width="100%"
                                            height="200"
                                            frameBorder="0"
                                            scrolling="no"
                                            marginHeight="0"
                                            marginWidth="0"
                                            src={`https://www.openstreetmap.org/export/embed.html?bbox=${previewLoc.lon - 0.005},${previewLoc.lat - 0.005},${previewLoc.lon + 0.005},${previewLoc.lat + 0.005}&layer=mapnik&marker=${previewLoc.lat},${previewLoc.lon}`}
                                            className="rounded-lg border border-slate-200 shadow-sm dark:border-slate-700"
                                        ></iframe>
                                    </div>
                                )}

                                {scannedData && (
                                    <div className="flex gap-3">
                                        <button
                                            onClick={() => handleClock('IN')}
                                            disabled={loading}
                                            className="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm"
                                        >
                                            {loading ? <Loader2 size={18} className="animate-spin" /> : <Clock size={18} />}
                                            Clock In
                                        </button>
                                        <button
                                            onClick={() => { setScannedData(null); setPreviewLoc(null); setGpsStatus(''); }}
                                            disabled={loading}
                                            className="px-4 bg-slate-200 hover:bg-slate-300 disabled:opacity-40 text-slate-800 font-bold rounded-xl transition-colors shadow-sm dark:text-slate-200"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                )}
                            </>
                        ) : (
                            <>
                                {previewLoc && showClockOutModal && (
                                    <div className="mb-4">
                                        <iframe
                                            width="100%"
                                            height="200"
                                            frameBorder="0"
                                            scrolling="no"
                                            marginHeight="0"
                                            marginWidth="0"
                                            src={`https://www.openstreetmap.org/export/embed.html?bbox=${previewLoc.lon - 0.005},${previewLoc.lat - 0.005},${previewLoc.lon + 0.005},${previewLoc.lat + 0.005}&layer=mapnik&marker=${previewLoc.lat},${previewLoc.lon}`}
                                            className="rounded-lg border border-slate-200 shadow-sm dark:border-slate-700"
                                        ></iframe>
                                    </div>
                                )}

                                {showClockOutModal ? (
                                    <div className="mt-4 p-4 border border-rose-200 bg-rose-50 rounded-xl">
                                        <h4 className="font-bold text-rose-800 mb-2">Out of Venue Range</h4>
                                        <p className="text-sm text-rose-600 mb-3">You are attempting to clock out while outside the venue's geofence. Please provide a reason.</p>
                                        <textarea
                                            value={clockOutReason}
                                            onChange={e => setClockOutReason(e.target.value)}
                                            className="w-full p-3 rounded border border-rose-300 outline-none focus:border-rose-500 mb-3 bg-white dark:bg-slate-800"
                                            placeholder="Reason for leaving early or clocking out remotely..."
                                            rows="3"
                                        ></textarea>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleClock('OUT', clockOutReason)}
                                                disabled={loading || !clockOutReason.trim()}
                                                className="flex-1 bg-rose-600 hover:bg-rose-700 disabled:opacity-40 text-white font-bold py-2 rounded-lg transition-colors"
                                            >
                                                Submit Clock Out
                                            </button>
                                            <button
                                                onClick={() => setShowClockOutModal(false)}
                                                disabled={loading}
                                                className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-lg transition-colors dark:text-slate-300"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => handleClock('OUT')}
                                        disabled={loading}
                                        className="w-full bg-red-500 hover:bg-red-600 disabled:opacity-40 text-white font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm"
                                    >
                                        {loading ? <Loader2 size={18} className="animate-spin" /> : <LogOut size={18} />}
                                        Clock Out
                                    </button>
                                )}
                            </>
                        )}

                        {gpsStatus && (
                            <div className={`mt-4 p-3 rounded-lg text-sm font-bold text-center ${gpsStatus.startsWith('✅') ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                                    : gpsStatus.startsWith('⚠') ? 'bg-amber-50 text-amber-700 border border-amber-200'
                                        : 'bg-primary-50 text-primary-700 border border-primary-200'
                                }`}>
                                {gpsStatus}
                            </div>
                        )}
                    </div>

                    {/* Today's History */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 dark:bg-slate-800 dark:border-slate-700">
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center justify-between dark:text-slate-200">
                            <span className="flex items-center gap-2"><Calendar size={18} className="text-primary-600" /> Today's Clock History</span>
                            <span className="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full text-xs">{todayRecords.length}</span>
                        </h3>

                        {todayRecords.length === 0 ? (
                            <div className="text-center py-6 border-2 border-dashed border-slate-100 rounded-xl">
                                <Clock className="text-slate-300 mx-auto mb-2" size={24} />
                                <p className="text-sm text-slate-400 font-bold">No clock records for today.</p>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {todayRecords.map(rec => (
                                    <div key={rec.id} className={`flex justify-between items-center p-3 rounded-xl border ${rec.type === 'IN'
                                            ? 'bg-emerald-50 border-emerald-100'
                                            : 'bg-red-50 border-red-100'
                                        }`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-black text-white ${rec.type === 'IN' ? 'bg-emerald-500' : 'bg-red-500'
                                                }`}>
                                                {rec.type}
                                            </div>
                                            <div>
                                                <p className="font-bold text-sm text-slate-800 dark:text-slate-200">{rec.time}</p>
                                                <p className="text-[10px] text-slate-500">{rec.venueName}</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            {rec.inGeofence ? (
                                                <span className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md text-[10px] font-black">✅ In Location</span>
                                            ) : (
                                                <span className="bg-red-100 text-red-700 px-2 py-1 rounded-md text-[10px] font-black">⚠️ {rec.distanceMeters}m away</span>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- DASHBOARD ---
        function Dashboard({ user, onLogout }) {
            const [activeTab, setActiveTab] = useState('clockin');
            const [hasOnlineAccess, setHasOnlineAccess] = useState(false);

            // Profile Modal States
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [passwordLoading, setPasswordLoading] = useState(false);
            const [passwordMessage, setPasswordMessage] = useState('');

            const handlePasswordChange = async (e) => {
                e.preventDefault();
                if (newPassword !== confirmPassword) {
                    setPasswordMessage('⚠️ Passwords do not match');
                    return;
                }
                if (newPassword.length < 6) {
                    setPasswordMessage('⚠️ Password must be at least 6 characters');
                    return;
                }
                setPasswordLoading(true);
                setPasswordMessage('');
                try {
                    await updatePassword(auth.currentUser, newPassword);
                    setPasswordMessage('✅ Password updated successfully');
                    setTimeout(() => {
                        setShowProfileModal(false);
                        setNewPassword('');
                        setConfirmPassword('');
                        setPasswordMessage('');
                    }, 2000);
                } catch (error) {
                    if (error.code === 'auth/requires-recent-login') {
                        setPasswordMessage('⚠️ Please log out and log back in to change your password.');
                    } else {
                        setPasswordMessage(`⚠️ Error: ${error.message}`);
                    }
                }
                setPasswordLoading(false);
            };

            useEffect(() => {
                // Grant online submissions tab access if user has any assigned venues
                if (user.assignedVenues && user.assignedVenues.length > 0) {
                    setHasOnlineAccess(true);
                } else {
                    setHasOnlineAccess(false);
                }
            }, [user]);

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col dark:bg-slate-900">
                    <header className="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700 p-4 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                            <div className="flex items-center justify-between w-full md:w-auto">
                                <div className="flex items-center gap-3">
                                    <div className="bg-primary-100 dark:bg-primary-900/50 p-2 rounded-xl text-primary-600 dark:text-primary-400">
                                        <CheckCircle size={24} />
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-lg text-slate-900 dark:text-white">Mentor Portal</h1>
                                        <div className="text-xs text-slate-500 dark:text-slate-400">Logged in as: <span className="font-semibold text-slate-700 dark:text-slate-300">{user.name}</span></div>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="md:hidden text-slate-400 hover:text-rose-500 transition-colors"><LogOut size={20} /></button>
                            </div>

                            <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 hide-scrollbar">
                                <button onClick={() => setActiveTab('clockin')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 ${activeTab === 'clockin' ? 'bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 shadow-sm scale-105 transform' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5'}`}>
                                    <Clock size={16} className={activeTab === 'clockin' ? 'animate-bounce' : ''} /> Clock In
                                </button>
                                <button onClick={() => setActiveTab('validate')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 ${activeTab === 'validate' ? 'bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 shadow-sm scale-105 transform' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5'}`}>
                                    <CheckCircle size={16} className={activeTab === 'validate' ? 'animate-pulse' : ''} /> Validate
                                </button>
                                {hasOnlineAccess && (
                                    <button onClick={() => setActiveTab('online')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 ${activeTab === 'online' ? 'bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 shadow-sm scale-105 transform' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5'}`}>
                                        <CheckSquare size={16} className={activeTab === 'online' ? 'animate-pulse' : ''} /> Online
                                    </button>
                                )}
                                <button onClick={() => setActiveTab('history')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 ${activeTab === 'history' ? 'bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 shadow-sm scale-105 transform' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5'}`}>
                                    <History size={16} className={activeTab === 'history' ? 'animate-[spin_2s_linear_infinite]' : ''} /> History
                                </button>
                                <button onClick={() => setActiveTab('logs')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 ${activeTab === 'logs' ? 'bg-primary-50 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400 shadow-sm scale-105 transform' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5'}`}>
                                    <ClipboardList size={16} className={activeTab === 'logs' ? 'animate-pulse' : ''} /> Logs
                                </button>
                                <button onClick={() => setShowProfileModal(true)} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:-translate-y-0.5`}>
                                    <User size={16} /> Profile
                                </button>
                                <button onClick={onLogout} className="hidden md:flex px-4 py-2 rounded-lg text-sm font-semibold transition-all active:scale-90 items-center gap-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/20 ml-2 border border-transparent hover:border-rose-200 hover:-translate-y-0.5">
                                    <LogOut size={16} /> Quit
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 p-4 w-full max-w-5xl mx-auto mt-2">
                        <div key={activeTab} className="tab-content-enter">
                            {activeTab === 'clockin' && <ClockInTab user={user} />}
                            {activeTab === 'validate' && <ValidateTab user={user} />}
                            {activeTab === 'online' && hasOnlineAccess && <OnlineSubmissionsTab user={user} />}
                            {activeTab === 'history' && <AttendanceHistoryTab user={user} />}
                            {activeTab === 'logs' && <LogsTab user={user} />}
                        </div>
                    </main>

                    {/* PROFILE MODAL */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col border border-slate-200 dark:border-slate-700">
                                <div className="p-5 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex justify-between items-center shrink-0">
                                    <div>
                                        <h3 className="font-black text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2"><User size={20} className="text-primary-600" /> My Profile</h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{user.email}</p>
                                    </div>
                                    <button onClick={() => setShowProfileModal(false)} className="p-2 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors"><X size={20} /></button>
                                </div>
                                <div className="p-6">
                                    <h4 className="font-bold text-slate-700 dark:text-slate-200 mb-4 text-sm uppercase tracking-wider">Change Password</h4>
                                    <form onSubmit={handlePasswordChange} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">New Password</label>
                                            <input required type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)}
                                                className="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500/50 transition-all" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Confirm New Password</label>
                                            <input required type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                                                className="w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-500/50 transition-all" />
                                        </div>

                                        {passwordMessage && (
                                            <div className={`p-3 rounded-lg text-xs font-bold ${passwordMessage.startsWith('✅') ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-rose-50 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400'}`}>
                                                {passwordMessage}
                                            </div>
                                        )}

                                        <button type="submit" disabled={passwordLoading} className="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center gap-2 mt-4 disabled:opacity-70">
                                            {passwordLoading ? <Loader2 size={18} className="animate-spin" /> : <><CheckCircle size={18} /> Update Password</>}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- APP ENTRY ---
        function App() {
            const [user, setUser] = useState(null);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (authUser) => {
                    if (authUser) {
                        let mentorData = {
                            uid: authUser.uid,
                            email: authUser.email,
                            name: "Admin/Mentor",
                            assignedVenues: []
                        };
                        try {
                            const mentorsRef = collection(db, 'artifacts', appId, 'public', 'data', 'mentors');
                            const q = query(mentorsRef, where('email', '==', authUser.email));
                            const snap = await getDocs(q);
                            if (!snap.empty) {
                                mentorData = { ...mentorData, ...snap.docs[0].data(), uid: authUser.uid };
                            }
                        } catch (e) {
                            console.warn("Could not fetch extra mentor settings", e);
                        }
                        setUser(mentorData);
                    } else {
                        setUser(null);
                    }
                    setIsCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogout = async () => {
                await signOut(auth);
                setUser(null);
            };

            if (isCheckingAuth) {
                return <div className="min-h-screen flex items-center justify-center"><Loader2 size={48} className="animate-spin text-primary-600" /></div>;
            }

            return user
                ? <Dashboard user={user} onLogout={handleLogout} />
                : <LoginScreen onLoginSuccess={setUser} />;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
